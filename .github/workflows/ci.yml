name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # `uv.lock` is committed, so every job here resolves the same versions a
      # contributor does — and this is what keeps it honest. Without the check the
      # lock rots silently: a dependency added to `pyproject.toml` and never locked
      # still works everywhere (uv re-resolves on the fly) right up until somebody
      # installs from the lock and gets a different set. It also gives `setup-uv`
      # something to key its cache on; before the lock existed the cache was
      # created, never invalidated, and never usefully hit.
      - run: uv lock --check
      - run: uv run --group dev ruff check src tests
      - run: uv run --group dev ruff format --check src tests
      - run: uv run --group dev pyright

  # Every platform proxdex claims to run on, on the oldest and newest Python it
  # claims to support. Windows earns its place: it is the one platform whose
  # *path* behaviour differs (a file with an open handle cannot be deleted, the
  # separator is not "/", the install roots come from the environment), and none
  # of that is exercised — or even typechecked — on a POSIX runner.
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run proxdex --version
      - run: uv run proxdex --help
      # the suite includes the UI/cardbleed fit parity check, which needs node —
      # every runner image ships one, and the test skips loudly if it doesn't
      - run: uv run --group dev pytest
      # A real library, made and driven end to end on this platform: init, a card
      # filed by `import`, a border fit, then a print PDF imposed. The unit suite
      # deliberately never touches the filesystem this hard, and *every*
      # platform-specific defect found so far lived in exactly this path — temp
      # files that could not be deleted, an fd never closed, install paths spelled
      # for one OS. It needs no network: the card folder is created first, so
      # `import --id` resolves it locally instead of looking the id up.
      #
      # The border marks are passed explicitly because **nothing measures the border
      # for you**: `border --auto` was removed along with the detector behind it, so
      # a fit needs to be told where the border is. These are the fixture's own
      # geometry — 40px sides and 48px top of a 600x825 card.
      - name: A library end to end
        shell: bash
        run: |
          set -euo pipefail
          uv run proxdex init lib
          uv run python -c "
          from PIL import Image
          from pathlib import Path
          Path('lib/cards/base1-base/base1-4_charizard').mkdir(parents=True)
          Path('lib/cards/base1-base/.game').write_text('pokemon')
          im = Image.new('RGB', (600, 825), (240, 200, 60))
          im.paste(Image.new('RGB', (520, 730), (40, 90, 170)), (40, 48))
          im.save('card.png')
          "
          uv run proxdex --root lib import card.png --id base1-4 --stage original --dry-run
          uv run proxdex --root lib import card.png --id base1-4 --stage original
          uv run proxdex --root lib border base1-4 --inner-top 0.058 --inner-right 0.067 --inner-bottom 0.057 --inner-left 0.067
          uv run proxdex --root lib skip upscale base1-4
          uv run proxdex --root lib skip grade base1-4
          # --no-open or the runner tries to launch a PDF viewer
          uv run proxdex --root lib sheet ci --no-open
          uv run proxdex --root lib batches
          uv run proxdex --root lib where
          uv run proxdex --root lib ls --json
          test -f lib/print-batches/*/fronts.pdf

  # What a *user* installs, which is not what `uv run` gives you. Everything above
  # runs in the project environment, and that environment has the dev group — so
  # `tomlkit` was reachable there while being declared only under the `[ui]` extra.
  # It is imported by `sheet` (the batch manifest) and `config set`, so a plain
  # `pip install proxdex` shipped a CLI whose `sheet` command died with
  # ModuleNotFoundError *after* writing the PDF. Green on every platform, in a
  # matrix of six, for two releases.
  #
  # So: build the wheel, install it into a bare venv with no extras and no dev
  # group, and drive the same pipeline through the installed console script.
  installed:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: A bare install, driven end to end
        shell: bash
        run: |
          set -euo pipefail
          uv build --quiet
          uv venv bare
          # the venv's own layout differs per platform; ask it where its scripts are
          if [[ -d bare/Scripts ]]; then bin=bare/Scripts; else bin=bare/bin; fi
          VIRTUAL_ENV=bare uv pip install --quiet dist/*.whl
          "$bin/proxdex" --version
          "$bin/proxdex" init lib
          "$bin/python" -c "
          from PIL import Image
          from pathlib import Path
          Path('lib/cards/base1-base/base1-4_charizard').mkdir(parents=True)
          Path('lib/cards/base1-base/.game').write_text('pokemon')
          im = Image.new('RGB', (600, 825), (240, 200, 60))
          im.paste(Image.new('RGB', (520, 730), (40, 90, 170)), (40, 48))
          im.save('card.png')
          "
          "$bin/proxdex" --root lib import card.png --id base1-4 --stage original
          "$bin/proxdex" --root lib border base1-4 --inner-top 0.058 --inner-right 0.067 --inner-bottom 0.057 --inner-left 0.067
          "$bin/proxdex" --root lib skip upscale base1-4
          "$bin/proxdex" --root lib skip grade base1-4
          "$bin/proxdex" --root lib sheet ci --no-open   # <- the command that broke
          "$bin/proxdex" --root lib config set sheet.dpi=1200  # <- also tomlkit
          "$bin/proxdex" --root lib batches
          "$bin/proxdex" --root lib ls --json
          test -f lib/print-batches/*/fronts.pdf
      # `proxdex ui` must still refuse *politely* without the extra, rather than
      # traceback — the one dependency that is genuinely optional.
      - name: Without the ui extra, the ui command explains itself
        shell: bash
        run: |
          if [[ -d bare/Scripts ]]; then bin=bare/Scripts; else bin=bare/bin; fi
          out=$("$bin/proxdex" --root lib ui 2>&1 || true)
          echo "$out"
          grep -q 'proxdex\[ui\]' <<<"$out" || {
            echo "expected an install hint, not: $out"; exit 1; }
