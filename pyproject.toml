[project]
name = "proxdex"
dynamic = ["version"]
description = "Organize and print proxy cards — a searchable library that fetches, upscales, colour-corrects and imposes print-ready PDFs (fronts/backs/duplex). Built on cardbleed + Upscayl."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erik Bävenstrand" }]
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "requests>=2.31",
    "rich-click>=1.8",
    "cardbleed>=0.4.1",
    "img2pdf>=0.5",
]
keywords = ["pokemon", "card", "proxy", "printing", "tcg", "library", "upscale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Printing",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",  # file uploads (import / back / calibration scan)
    "tomlkit>=0.12",            # comment-preserving config edits
]

[project.urls]
Repository = "https://github.com/ErikBavenstrand/proxdex"
Issues = "https://github.com/ErikBavenstrand/proxdex/issues"

[project.scripts]
proxdex = "proxdex.cli:main"

[dependency-groups]
dev = [
    # pinned: CI resolves these fresh (no committed lockfile) and lint output is
    # version-sensitive — an unpinned linter turns a green build red on a release
    # of *its* own. Bump deliberately, with the new findings fixed in the same
    # commit.
    "ruff==0.16.0",
    "pyright==1.1.407",
    # so lint/typecheck see the optional web-UI module
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "tomlkit>=0.12",
    # the test suite (small and deliberate — see CLAUDE.md), pinned for the same
    # reason the linters are: CI resolves fresh, so an unpinned tool can turn a
    # release red on its own account.
    "pytest==8.4.2",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff.lint]
# × / · / → are used deliberately in size displays and progress output
allowed-confusables = ["×", "·", "→"]
select = ["ALL"]
ignore = [
    "D",       # docstrings: documented where it matters, not every helper
    "COM812",  # trailing comma — handled by the formatter
    "ISC001",  # implicit string concat — conflicts with the formatter
    "ANN401",  # a few deliberate Any (ctx.obj, parsed JSON/TOML)
    "EM101", "EM102",  # inline f-strings in raises read fine here
    "TRY003",  # exception messages are specific and local
    "PLR0913", "PLR0917",  # click callbacks legitimately take many options
    "CPY001",  # licence lives in LICENSE, not repeated atop every file
    "PLR2004", # image/geometry literals (255, 0.5, ...) are self-explanatory
    "FBT001", "FBT002",  # click injects boolean flags as parameters
    "S603", "S607",  # subprocess: fixed argv, trusted tool names (cardbleed etc.)
    "C901", "PLR0912", "PLR0915",  # a few inherently branchy render/CLI functions
    "TD002", "TD003", "FIX002",  # TODO bookkeeping
    "PLC0415",  # intentional lazy imports of heavy/optional deps inside commands
    "TC",      # `from __future__ import annotations` makes TYPE_CHECKING moves moot
    "DTZ011", "DTZ005",  # naive local dates are intentional for batch labels
]

[tool.ruff.lint.flake8-bugbear]
# `setting()` returns a dataclasses.field, so it is a legitimate dataclass
# default — the whole point is that a field can carry its own documentation.
extend-immutable-calls = ["proxdex.config.setting"]

[tool.ruff.lint.flake8-tidy-imports]
# absolute imports everywhere: `from proxdex.x import y`, never `from .x import y`
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/proxdex/cli.py" = ["PLC0206"]  # dict iteration in the settings-panel loop
# a test asserts, imports its own fixtures module, and is not a package
"tests/**" = ["S101", "INP001", "PLR6301", "SLF001"]

[tool.pyright]
include = ["src", "tests"]
# pytest's decorators are untyped; a fixture is not a typing question
reportUntypedFunctionDecorator = false
typeCheckingMode = "strict"
pythonVersion = "3.11"
# numpy/pillow/img2pdf expressions surface as Unknown; keep strict elsewhere
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
# FastAPI/click register handlers via decorators — they aren't "called"
reportUnusedFunction = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proxdex/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proxdex"]
# ship the web-UI frontend (non-.py, so make inclusion explicit). Its vendored
# component library under src/proxdex/static/ — Bootstrap, bundled rather than
# pulled from a CDN so the local UI works offline — is picked up by `packages`
# above; force-including it too makes hatchling add every file twice.
force-include = { "src/proxdex/webui.html" = "proxdex/webui.html" }
