/* ---------- settings -----------------------------------------------------
   A real form: every setting carries its own label, explanation, unit and
   default, all of which come from the Config field itself (/api/config), with
   the raw TOML key kept visible so nothing becomes untraceable. Nothing is
   written until you say so, and the save bar only exists while something is
   actually different. */
const settingsUi = {section:null, dirty:new Map()};

async function renderSettings(){
  if(!state.cfg){
    $('#main').innerHTML = '<p class="hint">Loading…</p>';
    state.cfg = await get('/api/config');
    settingsUi.dirty.clear();
  }
  const names = Object.keys(state.cfg.sections);
  // the leading-underscore sections are proxdex's own screens (card backs, frame
  // specs), not tables in the file — they are valid too
  const known = n => n && (n.startsWith('_') || names.includes(n));
  if(!known(settingsUi.section)) settingsUi.section = names[0] || null;

  $('#main').innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">proxdex.toml</div><h5 class="mb-0">Settings</h5></div>
      <span class="mono faint ms-auto" style="font-size:.6875rem">${esc(state.cfg.root)}</span>
    </div>
    <div class="setgrid">
      <div class="secnav" id="secnav">${names.map(n => `
        <button class="${n === settingsUi.section ? 'on' : ''}" onclick="pickSection('${esc(n)}')">
          ${esc(n)}<span class="cnt">${Object.keys(state.cfg.sections[n]).length}</span></button>`).join('')}
        <hr class="rule" style="margin:.5rem 0">
        <button class="${settingsUi.section === '_backs' ? 'on' : ''}" onclick="pickSection('_backs')">card backs</button>
        <button class="${settingsUi.section === '_frames' ? 'on' : ''}" onclick="pickSection('_frames')">frame specs</button>
      </div>
      <div id="secbody"></div>
    </div>
    <div id="savebar"></div>`;
  paintSection();
}
function pickSection(name){ settingsUi.section = name; renderSettings(); }

function paintSection(){
  const host = $('#secbody'); if(!host) return;
  if(settingsUi.section === '_backs'){ host.innerHTML = backsPanel(); return; }
  if(settingsUi.section === '_frames'){ host.innerHTML = framesPanel(); return; }
  const sec = settingsUi.section, kv = state.cfg.sections[sec] || {};
  host.innerHTML = `<div class="panel p-3">
    ${Object.entries(kv).map(([k, v]) => fieldFor(sec, k, v)).join('')
      || '<p class="hint mb-0">This section is empty.</p>'}</div>`;
  paintSaveBar();
}
/* One row per setting: what it is, what it does, what it defaults to, and the
   raw key it writes — plus the control, typed from the value and from the
   options map the server derives from Config's own annotations. */
function fieldFor(sec, key, val){
  const path = `${sec}.${key}`, id = `cfg_${sec}_${key}`;
  const doc = state.cfg.docs?.[path] || {};
  const choices = state.cfg.options?.[path];
  const dirty = settingsUi.dirty.has(path) ? ' dirty' : '';
  let ctl;
  if(choices){          // a setting with a closed set of values is never free text
    ctl = `<select class="form-select form-select-sm mono" id="${id}"
      onchange="markDirty('${esc(path)}')">${choices.map(o =>
      `<option ${String(o) === String(val) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(typeof val === 'boolean'){
    ctl = `<div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="${id}" ${val ? 'checked' : ''}
             onchange="markDirty('${esc(path)}')"></div>`;
  } else if(typeof val === 'number'){
    ctl = `<input class="form-control form-control-sm mono" type="number" step="any" id="${id}"
      value="${val}" oninput="markDirty('${esc(path)}')">`;
  } else if(Array.isArray(val)){
    ctl = `<input class="form-control form-control-sm mono" id="${id}"
      value="${esc(val.join(', '))}" placeholder="comma-separated"
      oninput="markDirty('${esc(path)}')">`;
  } else {
    ctl = `<input class="form-control form-control-sm mono" id="${id}" value="${esc(val)}"
      oninput="markDirty('${esc(path)}')">`;
  }
  // a key proxdex no longer reads still sits in the file and looks like it is
  // configuring something; say plainly that it does nothing
  const known = !!doc.label;
  return `<div class="field${dirty}" data-path="${esc(path)}">
    <div>
      <div class="lbl">${esc(doc.label || key)}${known ? ''
        : ' <span class="chip warn">not a proxdex setting</span>'}</div>
      ${known ? (doc.help ? `<p class="why">${esc(doc.help)}</p>` : '')
        : '<p class="why">This key is ignored — nothing reads it. Safe to delete.</p>'}
      <div class="key">${esc(sec)}.${esc(key)}${
        doc.default ? ` · default ${esc(doc.default)}` : ''}</div>
    </div>
    <div class="ctl">${ctl}${doc.unit ? `<span class="unit">${esc(doc.unit)}</span>` : ''}</div>
  </div>`;
}
function markDirty(path){
  settingsUi.dirty.set(path, true);
  const row = $(`.field[data-path="${path}"]`);
  if(row) row.classList.add('dirty');
  paintSaveBar();
}
function paintSaveBar(){
  const host = $('#savebar'); if(!host) return;
  const n = settingsUi.dirty.size;
  document.body.classList.toggle('hasbar', n > 0);
  host.innerHTML = n ? `<div class="actionbar armed">
    <b>${n} unsaved change${n === 1 ? '' : 's'}</b>
    <span class="hint">Nothing is written to proxdex.toml until you save.</span>
    <span class="ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="revertConfig()">Revert</button>
      <button class="btn btn-sm btn-primary" onclick="saveConfig()">Save changes</button>
    </span></div>` : '';
}
function revertConfig(){ state.cfg = null; settingsUi.dirty.clear(); renderSettings(); }
/* Only the sections that actually changed are sent, so a save never rewrites a
   value the user did not touch. */
async function saveConfig(){
  const sections = {};
  for(const path of settingsUi.dirty.keys()){
    const [sec, key] = path.split('.');
    const val = state.cfg.sections[sec][key];
    const el = $(`#cfg_${sec}_${key}`); if(!el) continue;
    sections[sec] ||= {};
    if(state.cfg.options?.[path]) sections[sec][key] = el.value;
    else if(typeof val === 'boolean') sections[sec][key] = el.checked;
    else if(typeof val === 'number') sections[sec][key] = parseFloat(el.value);
    else if(Array.isArray(val)) sections[sec][key] = el.value.trim()
      ? el.value.split(',').map(s => { const n = +s.trim(); return isNaN(n) ? s.trim() : n; }) : [];
    else sections[sec][key] = el.value;
  }
  settingsUi.dirty.clear();
  await act('/api/config', {_method:'PUT', sections}, 'Settings saved');
}
function backsPanel(){
  const gopts = state.meta.games.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
  return `<div class="panel p-3">
    <div class="eyebrow mb-2">Card backs</div>
    <p class="hint">One back per game — a mixed library needs both. Magic downloads
      from Scryfall; Pokémon has no back API, so upload your own scan. A two-sided
      card ignores this and prints its own reverse.</p>
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-3">
        <label class="eyebrow d-block mb-1" for="bk_game">game</label>

/* The frame specs, and which of them this library's cards actually resolve to.
   The same two tables `proxdex frames` prints — a spec is only honest if you can
   see whether it was measured or guessed, and which of your cards ride on it. */
function framesPanel(){
  const specs = state.meta.frames || [];
  const rows = specs.map(g => `<tr>
      <td class="mono">${esc(g.id)}</td>
      <td>${esc(g.name)}</td>
      <td class="mono">${g.inset.map(v => (v * 100).toFixed(2)).join(' / ')}</td>
      <td>${g.measured ? '<span class="chip good">measured</span>'
                       : '<span class="chip warn">estimated</span>'}</td>
    </tr>`).join('');

  // one row per (set, override) — a borderless print inside a bordered set
  // resolves differently from its neighbours, and hiding that would claim a fit
  // that is not the one that runs
  const groups = new Map();
  for(const c of state.cards){
    const key = `${c.game}|${c.set}|${c.frame || ''}`;
    const g = groups.get(key) || {game:c.game, set:c.set, frame:c.frame,
                                  spec:c.frame_spec, measured:c.frame_measured, n:0};
    g.n++; groups.set(key, g);
  }
  const mine = [...groups.values()].sort((a, b) => a.set.localeCompare(b.set));
  const unmeasured = mine.filter(g => !g.measured).length;

  return `<div class="panel p-3 mb-3">
    <div class="eyebrow mb-2">Frame specs</div>
    <p class="hint">Where each era's printed border sits, as a percentage of the card
      per edge (top / right / bottom / left). The border step reshapes a card until its
      border matches — so a spec nobody has measured makes the fit a guess, and says so.</p>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Spec</th><th>Frame</th><th>T / R / B / L %</th><th>Confidence</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>
  <div class="panel p-3">
    <div class="eyebrow mb-2">Sets in this library</div>
    ${mine.length ? `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Set</th><th>Game</th><th>Cards</th><th>Resolves to</th><th>From</th><th>Confidence</th></tr></thead>
      <tbody>${mine.map(g => `<tr>
        <td class="mono">${esc(g.set)}</td>
        <td>${esc(g.game)}</td>
        <td class="mono">${g.n}</td>
        <td class="mono">${esc(g.spec || '')}</td>
        <td class="faint">${g.frame ? 'the printing' : 'its era'}</td>
        <td>${g.measured ? '<span class="chip good">measured</span>'
                         : '<span class="chip warn">estimated</span>'}</td>
      </tr>`).join('')}</tbody></table></div>`
      : '<p class="hint mb-0">No cards yet.</p>'}
    ${unmeasured ? `<p class="hint mb-0 mt-2" style="color:var(--hold)">${unmeasured} set(s)
      fall back to an estimated spec. Measure a real card and add a guide in
      <code class="mono">frames.py</code> to fix it.</p>` : ''}
  </div>`;
}
async function setBack(){
  await act('/api/back', {game: $('#bk_game').value, url: $('#bk_url').value || null}, 'Card back set');
}
async function uploadBack(inp){
  if(!inp.files[0]) return;
  const fd = new FormData();
  fd.append('file', inp.files[0]); fd.append('game', $('#bk_game').value);
  $('#busy').classList.add('on');
  const r = await fetch('/api/back/upload', {method:'POST', body:fd});
  const j = await r.json();
  $('#busy').classList.remove('on');
  toast(j.ok ? 'Card back set' : 'Failed\n' + tail(j.log || JSON.stringify(j)));
}
/* ---------- the sheet builder --------------------------------------------
   A print run is a decision with a cost in paper, so this is a screen and not a
   dialog: pick the cards and how many of each, set this run's page settings, and
   read the page plan the server works out from the *same* function that imposes
   the PDF (`sheet.plan`) before anything is written.

   Nothing here edits the library's settings. Every control is an override for
   this run, because a run is this paper on this printer today. */
const SHEET_FIELDS = [
  {key:'faces',  label:'What to print',  kind:'choice', from:'faces',
   help:'Fronts, backs, or duplex — both sides interleaved for one pass.'},
  {key:'page',   label:'Paper',          kind:'choice', from:'pages'},
  {key:'orientation', label:'Orientation', kind:'choice', from:'orientations'},
  {key:'cols',   label:'Columns',        kind:'int', lo:1, hi:12},
  {key:'rows',   label:'Rows',           kind:'int', lo:1, hi:12},
  {key:'bleed',  label:'Cut bleed',      kind:'num', lo:0, hi:20, step:0.5, unit:'mm',
   help:'Added outside the trim, so a slightly off cut still lands on artwork.'},
  {key:'dpi',    label:'Resolution',     kind:'int', lo:72, hi:4800, unit:'dpi'},
  {key:'guides', label:'Cut guides',     kind:'bool'},
];

function sheetOpts(){
  // open on the library's own defaults, served by /api/meta — the builder never
  // invents a default of its own
  state.sheet.opts ||= {...(state.meta.sheet || {})};
  return state.sheet.opts;
}
const sheetPicked = () => [...state.sheet.picks.entries()]
  .map(([id, copies]) => ({id, copies}));
const sheetTotal = () => sheetPicked().reduce((n, p) => n + p.copies, 0);

function renderSheet(){
  const o = sheetOpts();
  $('#main').innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">Impose</div><h5 class="mb-0">Print sheet</h5></div>
      <span class="hint ms-auto mb-0">Cards are scaled to trim, corrected for the
        medium, then given cut bleed outside the trim.</span>
    </div>
    <div class="sheetgrid">
      <div class="vstack gap-3">
        <div class="panel p-3">
          <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
            <div class="eyebrow">Cards</div>
            <span class="mono faint ms-auto" style="font-size:.6875rem" id="sb_count"></span>
          </div>
          <div id="sb_picks"></div>
          <hr class="rule my-3">
          <div class="d-flex gap-2 align-items-center flex-wrap mb-2">
            <input class="form-control form-control-sm" style="max-width:16rem"
                   id="sb_filter" placeholder="Filter by name, id or set"
                   value="${esc(state.sheet.filter)}" oninput="sheetFilter(this.value)">
            <button class="btn btn-sm btn-ghost" onclick="sheetAddAll()">Add every ready card</button>
            ${state.sel.size ? `<button class="btn btn-sm btn-ghost"
              onclick="sheetAddSelection()">Add the ${state.sel.size} selected</button>` : ''}
          </div>
          <div id="sb_pool"></div>
        </div>
      </div>
      <div class="vstack gap-3">
        <div class="panel p-3">
          <div class="eyebrow mb-2">This run</div>
          <div class="setting"><label for="sb_name">batch name</label>
            <input class="form-control form-control-sm" id="sb_name"
                   value="${esc(state.sheet.name)}" oninput="state.sheet.name=this.value"></div>
          <div class="setting"><label for="sb_profile">print profile</label>
            <select class="form-select form-select-sm" id="sb_profile" onchange="sheetSet('profile', this.value)">
              <option value="">${esc(state.meta.active_profile || 'none')} — the library default</option>
              ${(state.meta.profiles || []).map(n =>
                `<option ${o.profile === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}
            </select></div>
          ${SHEET_FIELDS.map(f => sheetField(f, o)).join('')}
          <div class="setting"><label for="sb_notes">notes</label>
            <input class="form-control form-control-sm" id="sb_notes" value="${esc(o.notes || '')}"
                   placeholder="Recorded in the manifest" oninput="sheetSet('notes', this.value)"></div>
        </div>
        <div class="panel p-3" id="sb_plan"></div>
        <div class="panel p-3">
          <div class="eyebrow mb-2">Batches</div>
          <div id="batches"><p class="hint mb-0">Loading…</p></div>
        </div>
      </div>
    </div>`;
  loadBatches();
  paintSheetPicks();
  planSheet();
}

function sheetField(f, o){
  const id = `sb_${f.key}`;
  const value = o[f.key];
  let ctl;
  if(f.kind === 'choice'){
    ctl = `<select class="form-select form-select-sm" id="${id}"
      onchange="sheetSet('${f.key}', this.value)">${(state.meta[f.from] || []).map(v =>
      `<option ${String(v) === String(value) ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
  } else if(f.kind === 'bool'){
    ctl = `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox"
      id="${id}" ${value ? 'checked' : ''} onchange="sheetSet('${f.key}', this.checked)"></div>`;
  } else {
    ctl = `<input class="form-control form-control-sm mono" type="number" id="${id}"
      min="${f.lo}" max="${f.hi}" step="${f.step || 1}" value="${value ?? ''}"
      oninput="sheetSet('${f.key}', this.value === '' ? null : +this.value)">`;
  }
  return `<div class="setting"><label for="${id}">${esc(f.label)}${
    f.unit ? ` <span class="faint mono">${esc(f.unit)}</span>` : ''}</label>${ctl}</div>`;
}

function sheetSet(key, value){
  sheetOpts()[key] = value;
  paintSheetPicks();   // the faces choice changes what the two-sided note says
  planSheet();
}
function sheetFilter(text){
  state.sheet.filter = text;
  paintSheetPool();
}
function sheetAddAll(){
  for(const c of state.cards) if(sheetReady(c) && !state.sheet.picks.has(c.id))
    state.sheet.picks.set(c.id, 1);
  paintSheetPicks(); planSheet();
}
function sheetAddSelection(){
  for(const id of state.sel) if(!state.sheet.picks.has(id)) state.sheet.picks.set(id, 1);
  paintSheetPicks(); planSheet();
}
function sheetAdd(id){
  state.sheet.picks.set(id, (state.sheet.picks.get(id) || 0) + 1);
  paintSheetPicks(); planSheet();
}
function sheetCopies(id, n){
  const copies = clamp(Math.round(+n || 1), 1, 99);
  state.sheet.picks.set(id, copies);
  paintSheetPicks(); planSheet();
}
function sheetBump(id, by){
  const now = state.sheet.picks.get(id) || 1;
  if(now + by < 1) return sheetDrop(id);
  return sheetCopies(id, now + by);
}
function sheetDrop(id){
  state.sheet.picks.delete(id);
  paintSheetPicks(); planSheet();
}
function sheetClear(){
  state.sheet.picks.clear();
  paintSheetPicks(); planSheet();
}

/* The pick list and the pool are repainted in place, never rebuilt around the
   thumbnails: recreating an <img> repaints an empty box even from cache. */
function paintSheetPicks(){
  const host = $('#sb_picks'); if(!host) return;
  const picks = sheetPicked();
  const count = $('#sb_count');
  if(count) count.textContent = picks.length
    ? `${sheetTotal()} card${sheetTotal() === 1 ? '' : 's'} from ${picks.length} pick${picks.length === 1 ? '' : 's'}`
    : 'every ready card';
  if(!picks.length){
    host.innerHTML = `<p class="hint mb-0">Nothing picked, so this run imposes
      <b>every card whose grade is settled</b> — the same as <code class="mono">proxdex
      sheet ${esc(state.sheet.name || 'deck')}</code> with no ids. Pick cards below to
      narrow it, or to print more than one of something.</p>`;
    paintSheetPool();
    return;
  }
  host.innerHTML = `<div class="picklist">${picks.map(p => {
      const c = state.cards.find(x => x.id === p.id);
      if(!c) return '';
      return `<div class="pickrow">
        <img alt="" src="${thumbsrc(c, c.front_face)}">
        <span class="nm">${esc(c.name)}</span>
        <span class="mono faint" style="font-size:.625rem">${esc(c.id)}</span>
        ${sheetReady(c) ? '' : '<span class="chip warn" title="Grade is not settled — it will be left out">not ready</span>'}
        ${c.oversized ? '<span class="chip">oversized</span>' : ''}
        <span class="stepn ms-auto">
          <button onclick="sheetBump('${esc(p.id)}', -1)" aria-label="One fewer">−</button>
          <input class="mono" value="${p.copies}" inputmode="numeric"
                 onchange="sheetCopies('${esc(p.id)}', this.value)" aria-label="Copies">
          <button onclick="sheetBump('${esc(p.id)}', 1)" aria-label="One more">+</button>
        </span>
        <button class="btn btn-sm btn-ghost" onclick="sheetDrop('${esc(p.id)}')">Remove</button>
      </div>`;
    }).join('')}</div>
    <div class="mt-2"><button class="btn btn-sm btn-ghost" onclick="sheetClear()">Clear picks</button></div>`;
  paintSheetPool();
}

function paintSheetPool(){
  const host = $('#sb_pool'); if(!host) return;
  const q = state.sheet.filter.trim().toLowerCase();
  const pool = state.cards.filter(c =>
    !state.sheet.picks.has(c.id) &&
    (!q || `${c.name} ${c.id} ${c.set}`.toLowerCase().includes(q)));
  if(!pool.length){
    host.innerHTML = `<p class="hint mb-0">${q ? 'No cards match.' : 'Every card is picked.'}</p>`;
    return;
  }
  host.innerHTML = `<div class="pool">${pool.slice(0, 60).map(c => `
    <button class="poolcard ${sheetReady(c) ? '' : 'notready'}" onclick="sheetAdd('${esc(c.id)}')"
            title="${sheetReady(c) ? 'Add to the run' : 'Grade is not settled yet — it would be left out'}">
      <img alt="" loading="lazy" src="${thumbsrc(c, c.front_face)}">
      <span class="nm">${esc(c.name)}</span>
      <span class="mono">${esc(c.id)}</span>
    </button>`).join('')}</div>
    ${pool.length > 60 ? `<p class="hint mb-0 mt-2">${pool.length - 60} more — filter to narrow it.</p>` : ''}`;
}

/* The plan comes from the server, from the same code that imposes the PDF, so
   the page count promised here is the page count you get. */
let _planTimer;
function planSheet(){
  clearTimeout(_planTimer);
  state.sheet.planning = true;
  paintPlan();
  _planTimer = setTimeout(async () => {
    try{
      const r = await fetch('/api/sheet/plan', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(sheetPayload()),
      });
      state.sheet.plan = r.ok ? await r.json() : null;
    } catch(e){ state.sheet.plan = null; }
    state.sheet.planning = false;
    paintPlan();
  }, 180);
}
function sheetPayload(){
  const o = sheetOpts();
  return {
    name: state.sheet.name || 'deck',
    cards: sheetPicked(),
    faces: o.faces, page: o.page, orientation: o.orientation,
    dpi: o.dpi ?? null, cols: o.cols ?? null, rows: o.rows ?? null,
    bleed: o.bleed ?? null, guides: o.guides ?? null,
    profile: o.profile || null, notes: o.notes || '',
  };
}
function paintPlan(){
  const host = $('#sb_plan'); if(!host) return;
  const plan = state.sheet.plan;
  const busy = state.sheet.planning ? '<span class="chip">working…</span>' : '';
  if(!plan || !plan.groups){
    host.innerHTML = `<div class="eyebrow mb-2">Pages ${busy}</div>
      <p class="hint mb-0">Nothing to impose yet — a card is ready once its grade is
        settled (run it, or skip it so an earlier stage stands as the master).</p>`;
    return;
  }
  const prof = plan.profile || {};
  const res = prof.residual;
  host.innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-2">
      <div class="eyebrow">Pages</div>${busy}
      <span class="ms-auto"><b class="mono" style="font-size:1.25rem">${plan.pages}</b>
        <span class="faint mono" style="font-size:.6875rem">page${plan.pages === 1 ? '' : 's'}</span></span>
    </div>
    <div class="rels mb-2">${plan.groups.map(g => `
      <div class="rel">
        <span class="chip">${esc(g.name)}</span>
        <span class="nm">${g.cards} card${g.cards === 1 ? '' : 's'}</span>
        <span class="mono faint">${g.grid[0]}×${g.grid[1]} per page → ${g.pages}</span>
      </div>`).join('')}</div>
    ${plan.groups.length > 1 ? `<p class="hint">Two card sizes, so two sets of pages —
      an oversized card is imposed at its own size rather than shrunk to fit.</p>` : ''}
    ${plan.missing.length ? `<p class="hint" style="color:var(--hold)">Leaving out
      ${plan.missing.length} card(s) whose grade is not settled:
      <span class="mono">${plan.missing.slice(0, 8).map(esc).join(' ')}</span>${
      plan.missing.length > 8 ? ' …' : ''}</p>` : ''}
    ${plan.two_sided.length && plan.faces !== 'duplex' ? `<p class="hint" style="color:var(--hold)">
      ${plan.two_sided.length} two-sided card(s): only the side each is flipped to is in
      this sheet. Duplex prints the reverse too.</p>` : ''}
    <div class="profline mb-2">
      <div class="d-flex align-items-center gap-2">
        <span class="chip ${res ? 'good' : 'warn'}">${esc(prof.name || 'none')}</span>
        <a class="ms-auto mono" style="font-size:.6875rem"
           href="/print?p=${encodeURIComponent(prof.name || '')}"
           onclick="return goLink(event, 'print', '${esc(prof.name || '')}')">calibrate →</a>
      </div>
      <p class="hint mb-0">${res
        ? `Measured over ${prof.rounds} round(s); the last print landed a mean of
           ${res.mean.toFixed(1)} RGB from the target.`
        : (prof.inherited ? 'Carrying a calibration measured before 0.5 — a fresh loop can do better.'
          : (prof.name === 'none' ? 'No medium correction: the cards print exactly as stored.'
            : 'A hand-set recipe, not a measurement. Calibrating it is a print and a scan away.'))}</p>
    </div>
    <div class="d-grid"><button class="btn btn-sm btn-primary"
      onclick="makeSheet()" ${plan.pages ? '' : 'disabled'}>Impose ${plan.cards} card${
      plan.cards === 1 ? '' : 's'} → ${plan.pages} page${plan.pages === 1 ? '' : 's'}</button></div>
    <p class="hint mb-0 mt-2">Print with colour management off, or the profile is
      corrected twice.</p>`;
}
/* Let a link inside a panel behave like a link (⌘-click, new tab) and still
   route client-side when it is an ordinary click. */
function goLink(ev, view, profile){
  if(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return true;
  ev.preventDefault();
  navigate({view, id:null, step:null, profile: profile || null});
  return false;
}
async function makeSheet(){
  const ok = await act('/api/sheet', sheetPayload(), 'Sheet written');
  if(ok) loadBatches();
}

/* ---------- the print screen: profiles and calibration -------------------
   A profile is a medium you own — paper, printer setting, whether colour
   management was off — so it has a name and notes, and it is measured by printing
   a chart and scanning it. Several rounds fit on one sheet, each in its own slot,
   and every round makes the correction truer: the numbers below are the evidence
   for that, not a claim about it. */
async function renderPrint(){
  if(!state.profileList){
    $('#main').innerHTML = '<p class="hint">Loading…</p>';
    state.profileList = await get('/api/profiles');
  }
  const list = state.profileList;
  const names = list.profiles.map(p => p.name);
  if(!state.profile || !names.includes(state.profile))
    state.profile = list.active && names.includes(list.active) ? list.active : names[0];
  $('#main').innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">Colour</div><h5 class="mb-0">Print profiles</h5></div>
      <span class="hint ms-auto mb-0">One per medium you print on. A sheet is
        corrected by the active profile — the stored cards stay neutral.</span>
    </div>
    <div class="setgrid">
      <div class="secnav" id="profnav">${list.profiles.map(p => `
        <button class="${p.name === state.profile ? 'on' : ''}" onclick="pickProfile('${esc(p.name)}')">
          ${esc(p.name)}
          <span class="cnt">${p.rounds ? `${p.rounds}r` : (p.stored ? '—' : 'preset')}</span>
        </button>`).join('')}
        <hr class="rule" style="margin:.5rem 0">
        <button onclick="newProfile()">+ new profile</button>
      </div>
      <div id="profbody"><p class="hint">Loading…</p></div>
    </div>`;
  await paintProfile();
}
function pickProfile(name){
  state.profileDetail = null; state.proofOf = null;
  navigate({view:'print', id:null, step:null, profile:name}, {replace:true});
}
const profileSlug = name => String(name).trim().toLowerCase()
  .replace(/[^a-z0-9._-]+/g, '-').replace(/^[-.]+|[-.]+$/g, '');
async function newProfile(){
  const name = await askName('Name this medium',
    '', 'Letters, digits, dashes — e.g. matte-200, foil-clear, glossy-photo.');
  if(!name) return;
  const slug = profileSlug(name);
  if(!slug) return toast('That name has nothing usable in it.');
  const ok = await act(`/api/profile/${encodeURIComponent(slug)}`, {medium:'paper'}, 'Profile created');
  if(!ok) return;
  state.profileList = null; state.profileDetail = null;
  navigate({view:'print', id:null, step:null, profile:slug}, {replace:true});
}

async function paintProfile(){
  const host = $('#profbody'); if(!host) return;
  if(!state.profile){ host.innerHTML = '<p class="hint">No profiles yet.</p>'; return; }
  if(!state.profileDetail || state.profileDetail.name !== state.profile){
    try{ state.profileDetail = await get(`/api/profile/${encodeURIComponent(state.profile)}`); }
    catch(e){ host.innerHTML = `<p class="hint">${esc(String(e))}</p>`; return; }
  }
  const p = state.profileDetail;
  const active = state.profileList.active === p.name;
  const res = p.residual;
  host.innerHTML = `
    <div class="panel p-3 mb-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <h5 class="mb-0">${esc(p.name)}</h5>
        <span class="chip">${esc(p.medium_label)}</span>
        ${active ? '<span class="chip good">active</span>' : ''}
        ${p.preset && !p.stored ? '<span class="chip">built-in preset</span>' : ''}
        <span class="ms-auto d-flex gap-2">
          ${active ? '' : `<button class="btn btn-sm btn-outline-secondary"
            onclick="useProfile('${esc(p.name)}')">Use for sheets</button>`}
          ${p.stored ? `<button class="btn btn-sm btn-ghost" onclick="renameProfile()">Rename</button>
            <button class="btn btn-sm btn-ghost" onclick="deleteProfile()">Delete</button>` : ''}
        </span>
      </div>
      ${p.stored ? '' : `<p class="hint mb-0 mt-2">A preset is a starting point, not a
        measurement — make it a profile of your own to add notes and calibrate it.
        ${p.medium === 'none' ? 'Except this one: “none” means correct nothing, so there is nothing to measure.'
          : `<button class="btn btn-sm btn-ghost" onclick="copyPreset()">Make ${esc(p.name)} a profile</button>`}</p>`}
    </div>

    ${p.stored ? `<div class="panel p-3 mb-3">
      <div class="eyebrow mb-1">Notes</div>
      <p class="hint">The paper, the printer setting, whether colour management was
        off. In six months this is the only way to reproduce the print.</p>
      <textarea class="form-control form-control-sm" id="pf_notes" rows="4"
        placeholder="Canon TS8350 · matte 200 g · plain-paper setting · colour management OFF"
        >${esc(p.notes)}</textarea>
      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-sm btn-primary" onclick="saveNotes()">Save notes</button>
      </div>
    </div>` : ''}

    <div class="panel p-3 mb-3">
      <div class="eyebrow mb-1">Starting recipe</div>
      <p class="hint">Four multipliers applied at print time. ${p.calibrated
        ? 'This profile is <b>measured</b>, and the measurement supersedes these — they are kept only as the record of where it started.'
        : 'Guesswork until you calibrate: it is the best a number typed by hand can do.'}</p>
      <div class="recipe">${(state.profileList.recipe_keys || []).map(k => `
        <div class="setting"><label for="pf_${k}">${esc(k)}</label>
          <input class="form-control form-control-sm mono" type="number" id="pf_${k}"
                 min="0" max="3" step="0.01" value="${p.recipe[k]}"
                 ${p.stored ? '' : 'disabled'}></div>`).join('')}</div>
      ${p.stored ? `<div class="mt-2"><button class="btn btn-sm btn-outline-secondary"
        onclick="saveRecipe()">Save recipe</button></div>` : ''}
    </div>

    ${p.stored ? calibrationPanel(p) : ''}`;
}

/* The calibration loop, as a screen: where the next chart goes, what every round
   measured, and how the error fell. */
function calibrationPanel(p){
  const rounds = p.rounds_detail || [];
  const worst = Math.max(1, ...rounds.map(r => r.error.mean));
  const used = new Map(rounds.map(r => [`${r.slot[0]},${r.slot[1]}`, r]));
  const [cols, rows] = p.grid;
  const cells = [];
  for(let row = 0; row < rows; row++) for(let col = 0; col < cols; col++){
    const r = used.get(`${col},${row}`);
    const next = !r && p.next_slot[0] === col && p.next_slot[1] === row;
    cells.push(`<div class="slot ${r ? 'used' : ''} ${next ? 'next' : ''}"
      title="${r ? `round ${r.n}, off by mean ${r.error.mean.toFixed(1)} RGB`
                 : (next ? 'the next chart prints here' : 'blank')}">
      <b>${r ? r.n : (next ? '→' : '')}</b>
      <span class="mono">${col + 1},${row + 1}</span></div>`);
  }
  const res = p.residual;
  return `
    <div class="panel p-3 mb-3">
      ${p.unreadable ? `<p class="hint mb-2" style="color:var(--hold)">
        ${p.unreadable} round(s) in this profile's file could not be read and are
        not in the fit — the chart has ${p.patches} patches now, and a round
        measured against a different one cannot be compared to it.</p>` : ''}
      <div class="d-flex align-items-baseline gap-2 mb-1">
        <div class="eyebrow">Calibration</div>
        ${res ? `<span class="ms-auto mono">off by mean
          <b style="color:var(--mark)">${res.mean.toFixed(1)}</b> / max ${res.max.toFixed(1)} RGB</span>` : ''}
      </div>
      <p class="hint">Print the chart on this medium, scan it with auto-correction
        off, and add it. Every round is kept and the correction is refitted over all
        of them, so feeding the <b>same sheet</b> back in and printing the next slot
        makes it truer instead of starting over.</p>

      <div class="calgrid">
        <div>
          <div class="eyebrow mb-1">The sheet</div>
          <div class="slotmap" style="grid-template-columns:repeat(${cols}, 1fr)">${cells.join('')}</div>
          <p class="hint mb-0 mt-1">${p.sheet_full
            ? 'Full — the next chart starts a fresh sheet at 1,1.'
            : `${p.free_slots.length} slot(s) left. Next: <span class="mono">${p.next_slot[0] + 1},${p.next_slot[1] + 1}</span>.`}</p>
        </div>
        <div class="vstack gap-2">
          <div class="eyebrow">Next round</div>
          <button class="btn btn-sm btn-primary" onclick="getChart()">Get chart for round ${rounds.length + 1}</button>
          <label class="eyebrow mb-0" for="pf_scan">then add the scan</label>
          <input class="form-control form-control-sm" type="file" id="pf_scan" accept="image/*">
          <div class="d-flex gap-2 align-items-center">
            <select class="form-select form-select-sm" id="pf_slot" style="max-width:11rem">
              ${allSlots(p).map(s => `<option value="${s}" ${s === expectedSlot(p) ? 'selected' : ''}>slot ${s}${
                s === expectedSlot(p) ? (p.pending ? ' — the one you printed' : ' — next') : ''}</option>`).join('')}
              <option value="">the image is one chart already</option>
            </select>
            <input class="form-control form-control-sm" id="pf_note" placeholder="note (optional)">
          </div>
          <button class="btn btn-sm btn-outline-secondary" onclick="addRound()">Add round</button>
        </div>
      </div>

      ${rounds.length ? `
        <hr class="rule my-3">
        <div class="eyebrow mb-1">How the error fell</div>
        <div class="trend">${rounds.map(r => `
          <div class="tbar" title="round ${r.n}: mean ${r.error.mean.toFixed(1)} RGB">
            <i style="height:${Math.max(4, r.error.mean / worst * 100)}%"></i>
            <span class="mono">${r.error.mean.toFixed(1)}</span>
          </div>`).join('')}</div>
        <div class="tblwrap mt-2"><table class="tbl">
          <thead><tr><th>Round</th><th>Slot</th><th>Date</th><th>Mean / max RGB</th>
            <th>Reached</th><th>Note</th><th></th></tr></thead>
          <tbody>${rounds.map(r => `<tr>
            <td class="mono">${r.n}</td>
            <td class="mono">${esc(r.slot_text)}</td>
            <td class="faint">${esc(r.date)}</td>
            <td class="mono">${r.error.mean.toFixed(1)} / ${r.error.max.toFixed(1)}</td>
            <td class="mono faint">${r.error.measured}/${r.error.measured + r.error.clipped}</td>
            <td class="faint">${esc(r.note)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-ghost" onclick="showProof(${r.n})">${
                state.proofOf === r.n ? 'Hide' : 'Proof'}</button>
              <button class="btn btn-sm btn-ghost" onclick="dropRound(${r.n})">Drop</button>
            </td></tr>`).join('')}</tbody></table></div>
        ${state.proofOf ? `
          <div class="eyebrow mt-3 mb-1">Round ${state.proofOf}: asked for, and what came back</div>
          <img class="proof" alt="Target patches above, scanned patches below"
               src="/api/calibrate/proof/${encodeURIComponent(p.name)}/${state.proofOf}">
          <p class="hint mb-0 mt-1">Top of each pair is the target, bottom is the
            scan. This is where a cast or a crushed shadow shows itself.</p>` : ''}
        ${res && res.clipped ? `<p class="hint mb-0 mt-2">${res.clipped} of
          ${res.measured + res.clipped} patches are outside what this medium can print
          at all — paper is not 255 and ink is not 0 — so the error is measured over
          the rest. That floor is the paper's, not the calibration's.</p>` : ''}`
        : '<p class="hint mb-0 mt-2">No rounds yet. The first chart prints the raw target, which measures how far off the medium is.</p>'}
    </div>`;
}
/* Which slot the scan is expected to be: the one the last chart was rendered for
   if a chart is still outstanding, else the next blank one. Chosen for you,
   because getting it wrong reads the wrong square of paper. */
function expectedSlot(p){
  const s = p.pending || p.next_slot;
  return `${s[0] + 1},${s[1] + 1}`;
}
function allSlots(p){
  const out = [];
  for(let row = 0; row < p.grid[1]; row++)
    for(let col = 0; col < p.grid[0]; col++) out.push(`${col + 1},${row + 1}`);
  return out;
}

async function useProfile(name){
  if(await act(`/api/profile/${encodeURIComponent(name)}/use`, {}, `Sheets now use ${name}`))
    reloadProfiles();
}
/* Keeping the preset's own name is what the CLI does when you calibrate a
   preset, and a stored profile shadows the built-in of the same name. */
async function copyPreset(){
  const p = state.profileDetail;
  const slug = p.name;
  if(await act(`/api/profile/${encodeURIComponent(slug)}`,
               {medium:p.medium, notes:`Started from the built-in ${p.medium_label.toLowerCase()} preset.`},
               'Profile created')){
    state.profileList = null; state.profileDetail = null;
    navigate({view:'print', id:null, step:null, profile:slug}, {replace:true});
  }
}
async function renameProfile(){
  const name = await askName('Rename this profile', state.profileDetail.name,
    'Its notes and every measured round come with it.');
  if(!name || name === state.profileDetail.name) return;
  const slug = profileSlug(name);
  if(!slug) return toast('That name has nothing usable in it.');
  if(await act(`/api/profile/${encodeURIComponent(state.profileDetail.name)}/rename`,
               {name:slug}, 'Renamed')){
    state.profileList = null; state.profileDetail = null;
    navigate({view:'print', id:null, step:null, profile:slug}, {replace:true});
  }
}
async function deleteProfile(){
  const p = state.profileDetail;
  const detail = p.rounds ? ` and its ${p.rounds} calibration round(s)` : '';
  if(!await ask(`Delete the profile “${p.name}”${detail}? This cannot be undone.`, 'Delete')) return;
  if(await act(`/api/profile/${encodeURIComponent(p.name)}`, {_method:'DELETE'}, 'Profile deleted')){
    state.profileList = null; state.profileDetail = null; state.profile = null;
    render();
  }
}
async function saveNotes(){
  if(await act(`/api/profile/${encodeURIComponent(state.profile)}`,
               {_method:'PATCH', notes: $('#pf_notes').value}, 'Notes saved'))
    reloadProfiles();
}
async function saveRecipe(){
  const body = {_method:'PATCH'};
  for(const k of state.profileList.recipe_keys){
    const el = $(`#pf_${k}`);
    if(el) body[k] = +el.value;
  }
  if(await act(`/api/profile/${encodeURIComponent(state.profile)}`, body, 'Recipe saved'))
    reloadProfiles();
}
function getChart(){
  const p = state.profileDetail;
  const slot = p.next_slot ? `${p.next_slot[0] + 1},${p.next_slot[1] + 1}` : '';
  window.open(`/api/calibrate/chart/${encodeURIComponent(p.name)}?slot=${encodeURIComponent(slot)}`, '_blank');
  // the chart records which slot it was rendered for, so the scan needs no answer
  setTimeout(reloadProfiles, 600);
}
async function addRound(){
  const inp = $('#pf_scan');
  if(!inp || !inp.files[0]) return toast('Choose the scanned page first.');
  const slot = $('#pf_slot').value;
  const fd = new FormData();
  fd.append('file', inp.files[0]);
  if(slot) fd.append('slot', slot); else fd.append('whole', 'true');
  fd.append('note', $('#pf_note').value || '');
  $('#busy').classList.add('on');
  let j = {ok:false, log:''};
  try{
    const r = await fetch(`/api/calibrate/add/${encodeURIComponent(state.profile)}`,
                          {method:'POST', body:fd});
    j = await r.json();
  } catch(e){ j = {ok:false, log:String(e)}; }
  $('#busy').classList.remove('on');
  toast(j.ok ? tail(j.log) : 'Failed\n' + tail(j.log || JSON.stringify(j)), j.ok ? 9000 : 14000);
  reloadProfiles();
}
async function dropRound(n){
  if(!await ask(`Drop round ${n} and refit without it?`, 'Drop')) return;
  if(await act(`/api/calibrate/drop/${encodeURIComponent(state.profile)}/${n}`, {},
               `Round ${n} dropped`))
    reloadProfiles();
}
function showProof(n){
  state.proofOf = state.proofOf === n ? null : n;
  paintProfile();
}
async function reloadProfiles(){
  state.profileList = await get('/api/profiles');
  state.profileDetail = null;
  if(state.view === 'print') await renderPrint();
}

/* ---------- keyboard ------------------------------------------------------
   One table, so the sheet and the handler can never drift: every binding is
   listed with where it applies, and `?` shows it from anywhere. */
const KEYS = [
  {keys:['?'],              where:'anywhere', what:'Show this sheet'},
  {keys:['G','then','L'],   where:'anywhere', what:'Go to the library'},
  {keys:['G','then','S'],   where:'anywhere', what:'Go to search'},
  {keys:['G','then','H'],   where:'anywhere', what:'Go to the sheet builder'},
  {keys:['G','then','P'],   where:'anywhere', what:'Go to print profiles'},
  {keys:['G','then',','],   where:'anywhere', what:'Go to settings'},
  {keys:['Esc'],            where:'card',     what:'Back to the library'},
  {keys:['←','→'],          where:'card',     what:'Previous / next card'},
  {keys:['↑','↓'],          where:'card',     what:'Previous / next step'},
  {keys:['F'],              where:'card',     what:'Other side of a two-sided card'},
  {keys:['C'],              where:'card',     what:'Cycle the compare tool'},
  {keys:['Enter'],          where:'card',     what:'Run the focused step'},
  {keys:['←','→','↑','↓'],  where:'a selected align mark', what:'Nudge it (Shift = coarse)'},
];
let _keys;
function showKeys(){
  $('#keysbody').innerHTML = `<div class="keys">${KEYS.map(k => `
    <div class="keyrow">
      <span class="d-flex align-items-center gap-1">${
        k.keys.map(x => x === 'then' ? '<span style="font-size:.6875rem">then</span>'
                                     : `<kbd>${esc(x)}</kbd>`).join('')}</span>
      <span class="flex-fill">${esc(k.what)}</span>
      <span class="mono faint" style="font-size:.625rem">${esc(k.where)}</span>
    </div>`).join('')}</div>`;
  (_keys ||= new bootstrap.Modal($('#keysdlg'))).show();
}

/* ---------- boot ---------- */
$$('.navlink').forEach(b => { b.onclick = () => go(b.dataset.view); b.title = `/${b.dataset.view}`; });
/* `G` then a letter jumps between screens, the way every console app does it. */
let _goto = 0;
document.addEventListener('keydown', e => {
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(document.querySelector('.modal.show')) return;
  if(e.key === '?'){ e.preventDefault(); showKeys(); return; }
  if(e.key === 'g' || e.key === 'G'){ _goto = Date.now(); return; }
  if(Date.now() - _goto < 1200){
    const dest = {l:'library', s:'search', h:'sheet', p:'print', ',':'settings'}[e.key.toLowerCase()];
    _goto = 0;
    if(dest){ e.preventDefault(); go(dest); return; }
  }
  if(state.view !== 'card') return;
  if(e.key === 'Enter'){
    const c = card();
    if(!c) return;
    e.preventDefault();
    // the first step is the source: running it means fetching it again
    if(state.step === PIPE()[0].key) refetch();
    else if(runnable(c, state.step)) runStep(state.step);
    return;
  }
  // an align mark has focus: the arrows are a nudge, not navigation
  if(align.on && align.sel && e.target.classList?.contains('al-line')){
    const fine = e.shiftKey ? 0.005 : 0.0015;
    if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); nudge(-fine); return; }
    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); nudge(fine); return; }
  }
  if(e.key === 'ArrowRight') stepCard(1);
  else if(e.key === 'ArrowLeft') stepCard(-1);
  else if(e.key === 'ArrowUp'){ e.preventDefault(); cycleFocus(-1); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); cycleFocus(1); }
  else if(e.key === 'f' || e.key === 'F') flipFace();
  else if(e.key === 'c' || e.key === 'C') cycleCompare();
  else if(e.key === 'Escape') go('library');
});
/* C cycles the compare tool — off, wipe, fade — but only where there is
   something to compare, so the key never silently does nothing. */
function cycleCompare(){
  const c = card(); if(!c) return;
  if(stStatus(c, SPEC(state.step).stage) !== 'done' || !stepInput(c, state.step)) return;
  const i = COMPARE_MODES.findIndex(m => m.key === state.compare);
  setCompare(COMPARE_MODES[(i + 1) % COMPARE_MODES.length].key);
}
function showLibPath(root){
  const parts = root.split('/').filter(Boolean);
  $('#lib').textContent = (parts.length > 2 ? '…/' : '/') + parts.slice(-2).join('/');
  $('#lib').title = root;
}

/* Start from whatever URL we were opened at (deep link, reload, bookmark). The
   route is re-read after /api/meta lands, because a step name in the path can
   only be validated against the pipeline the server declares. */
refresh().then(() => {
  Object.assign(state, routeFromUrl());
  history.replaceState(routeState(), '', currentUrl());
  render();
  showLibPath(state.meta.root);
});
setInterval(pollHealth, 60000);   // clears itself once the API recovers
</script>
</body>
</html>
