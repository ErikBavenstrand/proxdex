  const held = key === 'border' && !borderReady();
  const run = first
    ? `<button class="btn btn-sm btn-primary" onclick="refetch()">${esc(label)}</button>`
    : `<button class="btn btn-sm btn-primary" id="runbtn" onclick="runStep('${key}')"
        ${runnable(c, key) && !held ? '' : 'disabled'}
        title="${held ? 'Align the border first — nothing has measured where it sits' : ''}"
        >${esc(label)}</button>`;

  const sec = [];
  if(s.skippable){
    sec.push(st === 'skipped'
      ? `<button class="btn btn-sm btn-outline-secondary" onclick="pipe('unskip','${key}')">Unskip</button>`
      : `<button class="btn btn-sm btn-outline-secondary" onclick="pipe('skip','${key}')">Skip</button>`);
    if(done || st === 'skipped')
      sec.push(`<button class="btn btn-sm btn-outline-secondary" onclick="pipe('reset','${key}')">Reset</button>`);
  }
  if(twoSided(c) && !first)
    sec.push(`<button class="btn btn-sm btn-outline-secondary" onclick="runStep('${key}', true)"
      title="Run this step on both sides with these settings">Both sides</button>`);
  const row = sec.length ? `<div class="btn-group btn-group-sm w-100">${sec.join('')}</div>` : '';
  // no restatement of the step's state here — the pill in the header, the rail
  // and the plate above the card already say it, three times over
  return `${run}${toolNote(s)}${row}`;
}

/* A step whose external tool is not installed says so where its Run button is,
   in the server's own words, with what to do about it — a greyed-out button and
   no explanation is the version of this that wastes an afternoon. Skip is still
   right there beside it, which is the honest way past. */
function toolNote(s){
  if(s.tool_ready !== false || !s.tool) return '';
  return `<p class="hint mb-0" style="color:var(--hold)">${esc(s.tool.detail)}
    ${s.tool.hint ? `<br><span class="faint">${esc(s.tool.hint)}</span>` : ''}
    <br><span class="faint">Skipping is a real choice: the earlier stage stands
    as the master.</span></p>`;
}

/* Every mutation names the side it acts on, so the other side is untouched. */
async function runStep(cmd, bothSides){
  const c = card();
  const body = {cmd, ids:[c.id], settings:stepSettings(cmd), force:true};
  if(!bothSides && twoSided(c)) body.face = state.face + 1;
  if(cmd === 'border'){
    if(align.on && align.plan && marksOn()){  // marks are placed: fit to those
      body.inner = {top:align.blue.t, right:align.blue.r,
                    bottom:align.blue.b, left:align.blue.l};
    } else if(!noBorder()){
      // Nothing knows where this card's border is, and nothing is going to guess.
      // A borderless printing needs no marks, so it falls through to plain `border`.
      toast('Align the border first — open the marks and place them.');
      return;
    }
    // Only sent when the panel was actually opened: absent means "keep whatever this
    // card already carries", and `{}` means "back to the defaults" — two different
    // requests, and the CLI spells the second one `--no-tune`.
    if(fill.open) body.tune = fill.values;
  }
  await act('/api/step', body, `${cmd} · ${c.id}`);
  afterStep(cmd);
}
async function pipe(cmd, key){
  const c = card();
  const body = {cmd, step:key, ids:[c.id]};
  if(twoSided(c)) body.face = state.face + 1;
  await act('/api/step', body, `${cmd} ${key} · ${c.id}`);
  afterStep(cmd);
}
async function refetch(){
  const c = card();
  const body = {ids:[c.id], game:c.game};
  if(twoSided(c)) body.face = state.face + 1;
  await act('/api/fetch', body, `Fetched ${c.id}`);
  afterStep('run');
}
async function importOriginal(inp){
  if(!inp.files[0]) return;
  const c = card();
  const fd = new FormData();
  fd.append('file', inp.files[0]); fd.append('id', c.id);
  fd.append('stage', PIPE()[0].stage); fd.append('game', c.game);
  if(twoSided(c)) fd.append('face', String(state.face + 1));
  showBusy('import');
  const r = await fetch('/api/import', {method:'POST', body:fd});
  const j = await r.json();
  hideBusy();
  toast(j.ok ? 'Imported' : 'Failed\n' + tail(j.log || JSON.stringify(j)));
  await refresh(true); afterStep('run');
}
function afterStep(cmd){   // advance focus on run/skip; stay put on reset/unskip
  const c = card(); if(!c) return;
  // The marks belong to the *act* of aligning, and that act is over. Left up, they
  // survived the run: coming back to a done border step opened on draggable marks
  // over the original instead of on the master with its target outline, which is the
  // one cheap check that the fit landed. Re-opening them is one click ("Align it
  // again") and asking for them is the only thing that should turn them on.
  align.show = false;
  // the fit that was just recorded, and the pixels it was measured against, are both
  // answers this held a copy of — re-read them rather than draw the previous run's
  align.meas = null; align.facts = null;
  let step = state.step;
  if(cmd !== 'reset' && cmd !== 'unskip'){ const n = nextActionable(c); if(n) step = n; }
  // replace, not push: the focus moved as a *result* of the action, so Back
  // should leave the card, not walk back through the steps it advanced through
  navigate({step}, {replace:true});
}

async function delCard(){
  const c = card();
  if(!await ask(`Delete ${c.id} and every file in its folder?`, 'Delete')) return;
  await act('/api/card/' + encodeURIComponent(c.id), {_method:'DELETE'}, 'Deleted');
  go('library');
}

/* ---------- frame align --------------------------------------------------
   Where a card's printed border sits is a *reading*, and proxdex does not take it
   for you. It used to: `detect_inset` scanned the image and pre-placed the marks.
   That is gone, because the reading was wrong in ways nothing on screen showed —
   it over-read a black border whose frame was also dark, it read past a
   decorated frame's keylines, and it found a border on a full-bleed card that
   has none. A number no one took, presented as a measurement, is worse than no
   number: it looks finished.

   So the border step opens showing **where the border should be** — the frame
   spec's own dashed outline over the untouched original, with nothing to drag
   and nothing already decided. From there you either skip the step or open the
   marks and place them yourself. A mark can be dragged, or selected and nudged
   with the arrow keys, or typed as a percentage. */
const align = {
  on:false, meas:null, facts:null, blue:{t:.08, r:.08, b:.08, l:.08},
  plan:null, guide:'', sel:null, img:null,
  // which card+side the current marks were placed on, so switching either one
  // starts from a fresh rectangle instead of inheriting someone else's border
  owner:null,
  // the target the marks were last *seeded* from, so an untouched rectangle can be told
  // from one somebody read off the picture — see `seedMarks`
  seeded:null,
  // whether the marks are on the card and draggable. Always starts **off**: the
  // step opens on the target outline, and placing the marks is a thing you
  // choose to do. It is not a mode — the panel and Skip are there either way.
  show:false,
};
/* Inline handlers must never touch a top-level object by name. An inline
   handler's scope chain starts at the *element*, and an HTMLElement carries a
   legacy `align` property — so `align.show = …` in an attribute quietly writes
   to a discarded String wrapper instead of the align state. Every handler goes
   through a named function for that reason. */
function showMarks(on){ align.show = !!on; renderCard(); }
/* Back to where the spec says the border should be — the same place the marks
   are first placed, so Reset means "undo my dragging", not "jump to 8%". */
function resetMarks(){
  seedMarks();
  positionLines(); computeExtend(); syncRunLabel();
}
/* Put the marks on the current spec's target and remember that is where they came from.
   Dragging, nudging or typing moves `blue` and not `seeded`, so the two being equal means
   nobody has read this card yet — which is what lets a *change of spec* re-seat them
   without ever overwriting a reading. */
function seedMarks(){
  align.blue = targetMarks();
  align.seeded = {...align.blue};
}
const marksUntouched = () => !!align.seeded
  && ['t','r','b','l'].every(k => align.blue[k] === align.seeded[k]);

/* The spec's own inset, as mark positions. A borderless spec is all zeros, which
   is exactly right: the marks would sit on the image edges. */
function targetMarks(){
  const g = align.meas && activeGuide();
  return g ? {t:g.inset[0], r:g.inset[1], b:g.inset[2], l:g.inset[3]}
           : {t:.08, r:.08, b:.08, l:.08};
}
/* Nothing to align on a borderless print: there is no frame to put a mark on,
   and the fit is pure aspect correction, so `border` runs it on its own. */
const noBorder = () => !!(align.meas && activeGuide() && activeGuide().frameless);
const marksOn = () => align.show && !noBorder();
const EDGE_NAME = {t:'top', r:'right', b:'bottom', l:'left'};

/* Read this side's image size and frame resolution without turning the marks on.
   Keyed by card and side so a repaint cannot start a second request, and cleared
   by every action that could change the answer (a pin, a run). */
/* Who the viewer belongs to right now — card, side **and step**. Both readers below
   await a request and then write into `.viewer`, so each has to re-check that the
   answer is still about the thing on screen. Leaving the step out of it is what let
   the align layer land on the *upscale* proof: Run border → focus advances → the
   in-flight `/api/frame` resolves → `buildAlignLayer` grabs `$('.viewer')`, which is
   now the next step's, hides its image and draws marks over it. That read as three
   separate bugs (marks on upscayl, marks on a done border, upscayl showing the
   pre-border picture) and was one missing guard. */
const viewerOwner = c => `${c.id}/${state.face}/${state.step}`;

async function loadSpecFacts(c){
  const key = `${c.id}/${state.face}`;
  if(align.meas || align.facts === key) return;
  align.facts = key;
  const drawnFor = viewerOwner(c);
  try{
    const m = await get(`/api/frame/${encodeURIComponent(c.id)}`
      + `?stage=${PIPE()[0].stage}&face=${state.face}`);
    if(m && !m.error && align.facts === key){
      align.meas = m;
      if(viewerOwner(c) !== drawnFor) return;   // we are looking at something else now
      // the step panel first, then the align panel — see `paintBorderPanel`
      paintBorderPanel();
      if(!align.on) drawBand();   // the done view's outline, now that the spec is known
    }
  } catch { /* the panel simply says nothing about the spec */ }
}

async function startAlign(){
  const c = card(); if(!c) return;
  // whose viewer this is *now* — `align.owner` below is a different thing (the card
  // and side the mark positions belong to, which survives a step change on purpose)
  const drawnFor = viewerOwner(c);
  let meas = null;
  try {
    meas = await get(`/api/frame/${encodeURIComponent(c.id)}`
      + `?stage=${PIPE()[0].stage}&face=${state.face}`);
  } catch { meas = null; }
  // the await is the whole reason for this check: focus may have moved on
  if(viewerOwner(c) !== drawnFor) return;
  align.meas = meas;
  const m = align.meas;
  if(!m || m.error){ align.on = false; renderAlignPanel(); return; }
  align.on = true;
  const owner = `${c.id}/${state.face}`;
  const fresh = align.owner !== owner;
  if(fresh){ align.owner = owner; align.blue = {t:.08, r:.08, b:.08, l:.08}; }
  align.guide = $('#so_frame') ? $('#so_frame').value : '';
  // show the scan at its own aspect: the marks are placed on the source, undistorted
  const v = $('.viewer');
  if(v) v.style.aspectRatio = `${m.w} / ${m.h}`;
  // the loupe reads real source pixels, so it needs the image itself
  align.img = new Image();
  align.img.src = viewsrc(c.id, PIPE()[0].stage, state.face);
  // the marks start where the spec says the border should be. Not a measurement
  // of this card — the target, stated plainly, which is the honest starting point
  // and the one place a person can drag *from* rather than guess at.
  if(fresh) seedMarks();
  buildAlignLayer(c);
  renderAlignPanel();
  if(marksOn()){ positionLines(); computeExtend(); }
  else drawTarget();
}
function buildAlignLayer(c){
  endDrag();
  const v = $('.viewer'); if(!v) return;
  v.classList.add('aligning');
  $$('.stageimg, .cmp').forEach(el => { el.style.visibility = 'hidden'; });
  $('#allayer')?.remove();
  const layer = document.createElement('div');
  layer.className = 'alignlayer';
  layer.id = 'allayer';
  layer.innerHTML = `
    <img class="al-work" alt="Original scan" src="${viewsrc(c.id, PIPE()[0].stage, state.face)}">
    <div class="al-ghost" id="al_ghost"></div>
    <div class="al-band" id="al_band"><i></i></div>
    ${!marksOn() ? '' : ['top','bottom','left','right'].map(e => `
      <div class="al-line ${e}" data-e="${e[0]}" tabindex="0"
           role="slider" aria-label="${e} border edge">
        <span class="al-tag">${e[0].toUpperCase()}</span>
        <span class="al-grip" style="${e === 'top' || e === 'bottom' ? 'left:25%' : 'top:25%'}"></span>
        <span class="al-grip" style="${e === 'top' || e === 'bottom' ? 'left:75%' : 'top:75%'}"></span>
      </div>`).join('')}`;
  v.appendChild(layer);
  layer.querySelectorAll('.al-line').forEach(h => {
    h.addEventListener('pointerdown', startDrag);
    h.addEventListener('focus', () => selectEdge(h.dataset.e));
  });
}
function selectEdge(e){
  align.sel = e;
  $$('.al-line').forEach(el => el.classList.toggle('sel', el.dataset.e === e));
}
function positionLines(){
  const b = align.blue;
  const set = (sel, prop, val) => { const el = $(sel); if(el) el.style[prop] = val + '%'; };
  set('.al-line.top','top', b.t*100);   set('.al-line.bottom','top', (1-b.b)*100);
  set('.al-line.left','left', b.l*100); set('.al-line.right','left', (1-b.r)*100);
  $$('.al-line').forEach(el => {
    const v = align.blue[el.dataset.e];
    el.setAttribute('aria-valuenow', (v*100).toFixed(2));
    const tag = el.querySelector('.al-tag');
    if(tag) tag.textContent = `${el.dataset.e.toUpperCase()} ${(v*100).toFixed(2)}%`;
  });
}
function setEdge(e, v){
  const b = align.blue;
  const other = {t:'b', b:'t', l:'r', r:'l'}[e];
  align.blue[e] = clamp(v, 0, 1 - b[other] - 0.05);
  positionLines(); computeExtend();
}
/* One drag at a time, and it ends even if the pointer never reports coming up —
   a lost capture, a cancelled touch or a pointer leaving the window would
   otherwise leave the mark following the cursor forever. */
let _drag = null;
function startDrag(ev){
  ev.preventDefault(); ev.stopPropagation();
  if(_drag) endDrag();
  const line = ev.currentTarget, edge = line.dataset.e;
  const r = $('.viewer').getBoundingClientRect();
  selectEdge(edge); line.focus({preventScroll:true});
  const move = e => {
    if(edge === 't') setEdge('t', (e.clientY - r.top) / r.height);
    else if(edge === 'b') setEdge('b', (r.bottom - e.clientY) / r.height);
    else if(edge === 'l') setEdge('l', (e.clientX - r.left) / r.width);
    else setEdge('r', (r.right - e.clientX) / r.width);
    showLoupe(edge, e.clientX, e.clientY, r);
  };
  _drag = {move, line};
  for(const type of ['pointermove', 'pointerup', 'pointercancel'])
    addEventListener(type, type === 'pointermove' ? move : endDrag);
  try { line.setPointerCapture(ev.pointerId); } catch { /* synthetic pointer */ }
  move(ev);
}
function endDrag(){
  if(!_drag) return;
  const {move} = _drag;
  _drag = null;
  removeEventListener('pointermove', move);
  removeEventListener('pointerup', endDrag);
  removeEventListener('pointercancel', endDrag);
  hideLoupe();
}
/* Arrow keys nudge the selected mark. Shift is a coarse step, plain is fine —
   fine being roughly one source pixel, which is as precise as the image is. */
function nudge(dv){
  if(!align.sel) return;
  setEdge(align.sel, align.blue[align.sel] + dv);
  const r = $('.viewer')?.getBoundingClientRect();
  if(r) showLoupeAtMark(align.sel, r);
}

/* ---- the loupe ---------------------------------------------------------
   Source pixels at 6× with a crosshair on the mark, parked in whichever page
   corner is furthest from the pointer so it never hides the edge you are
   aiming at. */
const LOUPE = {zoom: 6, size: 156, w: 180, h: 204};
/* Park it in the corner of the *proof's own column* that is furthest from the
   pointer: furthest-from-the-cursor keeps it off the edge you are aiming at, and
   staying inside that column keeps it off the readout you are aiming *for*. */
function loupeCorner(x, y){
  const host = $('#stagewrap');
  const a = host ? host.getBoundingClientRect()
                 : {left: 0, right: innerWidth, top: 0, bottom: innerHeight};
  const pad = 12;
  const midX = (a.left + a.right) / 2, midY = (a.top + a.bottom) / 2;
  return {
    left: `${Math.round(x < midX ? a.right - LOUPE.w - pad : a.left + pad)}px`,
    top:  `${Math.round(clamp(y < midY ? a.bottom - LOUPE.h - pad : a.top + pad,
                              pad, innerHeight - LOUPE.h - pad))}px`,
  };
}
function showLoupe(edge, px, py, rect){
  const box = $('#loupe'), img = align.img;
  if(!box || !img || !img.naturalWidth) return;
  const b = align.blue;
  // the mark's position in the displayed rect, then in source pixels
  const fx = edge === 'l' ? b.l : edge === 'r' ? 1 - b.r : (px - rect.left) / rect.width;
  const fy = edge === 't' ? b.t : edge === 'b' ? 1 - b.b : (py - rect.top) / rect.height;
  paintLoupe(edge, fx, fy);
  Object.assign(box.style, loupeCorner(px, py));
  box.hidden = false;
}
function showLoupeAtMark(edge, rect){
  const b = align.blue;
  const fx = edge === 'l' ? b.l : edge === 'r' ? 1 - b.r : 0.5;
  const fy = edge === 't' ? b.t : edge === 'b' ? 1 - b.b : 0.5;
  paintLoupe(edge, fx, fy);
  const box = $('#loupe');
  Object.assign(box.style, loupeCorner(rect.left + rect.width * fx, rect.top + rect.height * fy));
  box.hidden = false;
  clearTimeout(showLoupeAtMark._t);
  showLoupeAtMark._t = setTimeout(hideLoupe, 1400);
}
function paintLoupe(edge, fx, fy){
  const box = $('#loupe'), img = align.img;
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
  const src = LOUPE.size / LOUPE.zoom;                 // source px shown
  const sx = fx * img.naturalWidth - src / 2, sy = fy * img.naturalHeight - src / 2;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LOUPE.size, LOUPE.size);
  ctx.drawImage(img, sx, sy, src, src, 0, 0, LOUPE.size, LOUPE.size);
  const mid = LOUPE.size / 2;
  ctx.strokeStyle = '#f2418c'; ctx.lineWidth = 1;
  ctx.beginPath();
  if(edge === 't' || edge === 'b'){ ctx.moveTo(0, mid + .5); ctx.lineTo(LOUPE.size, mid + .5); }
  else { ctx.moveTo(mid + .5, 0); ctx.lineTo(mid + .5, LOUPE.size); }
  ctx.stroke();
  $('#lp_edge').textContent = EDGE_NAME[edge];
  $('#lp_val').textContent = (align.blue[edge] * 100).toFixed(2) + '%';
}
function hideLoupe(){ const b = $('#loupe'); if(b) b.hidden = true; }

/* Live preview only — mirrors cardbleed.solve_fit (authoritative on apply).
   Reshapes to the exact card aspect with borders as close to the spec as
   possible (exactly, with stretch); an already-over-target edge may be shaved. */
function solveFit(m, b, stretch, guide){
  const g = {top:guide.inset[0], right:guide.inset[1], bottom:guide.inset[2], left:guide.inset[3]};
  const cw = m.card_w_mm, ch = m.card_h_mm, w = m.w, h = m.h;
  let cur = {top:b.t*h, right:b.r*w, bottom:b.b*h, left:b.l*w};   // current border px
  let iw = w - cur.left - cur.right, ih = h - cur.top - cur.bottom;
  if(iw <= 0 || ih <= 0) return null;
  const ca = cw/ch, expInner = ca*(1-g.left-g.right)/(1-g.top-g.bottom);
  let w2 = w, h2 = h, sx = 1, sy = 1;
  if(stretch){
    if(iw/ih > expInner) sy = (iw/ih)/expInner; else sx = expInner/(iw/ih);
    cur = {top:cur.top*sy, right:cur.right*sx, bottom:cur.bottom*sy, left:cur.left*sx};
    iw *= sx; ih *= sy; w2 = w*sx; h2 = h*sy;
  }
  const a = iw/cw, c = ih/ch, p = 1-g.left-g.right, q = 1-g.top-g.bottom;
  let u = (a*p + c*q)/(a*a + c*c);
  u = Math.min(u, 1/Math.max(iw/cw, ih/ch));                  // never shave into the art
  const k = 1/u, tw = cw*k, th = ch*k;
  const split = (budget, ta, tb, ca_, cb) => {
    const loA = -ca_, loB = -cb, surplus = budget - (ta-ca_) - (tb-cb);
    let ea = (ta-ca_) + surplus/2, eb = (tb-cb) + surplus/2;
    if(ea < loA){ ea = loA; eb = budget - loA; }
    if(eb < loB){ eb = loB; ea = budget - loB; }
    return [ea, eb];
  };
  const [eL, eR] = split(tw - w2, g.left*tw, g.right*tw, cur.left, cur.right);
  const [eT, eB] = split(th - h2, g.top*th, g.bottom*th, cur.top, cur.bottom);
  const ext = {left:eL, right:eR, top:eT, bottom:eB}, bd = {};
  for(const e of ['top','right','bottom','left'])
    bd[e] = (cur[e] + ext[e]) / ((e === 'left' || e === 'right') ? tw : th);
  return {tw:Math.round(tw), th:Math.round(th), borders:bd, ext, w2, h2, guide:g,
          cropped:['top','right','bottom','left'].filter(e => ext[e] < -0.5)};
}
const activeGuide = () =>
  (align.meas.guides || []).find(g => g.id === align.guide) || align.meas.guide;
function computeExtend(){
  if(!align.on || !align.meas) return;
  // No spec to fit against — `solveFit` reads `guide.inset` and would throw. Nothing to
  // solve is not an error state here: it is the printing nobody has measured, waiting on
  // a Frame choice, and `renderAlignPanel` has already said so.
  const guide = activeGuide();
  if(!guide){ align.plan = null; syncRunLabel(); return; }
  const stretch = $('#so_stretch') ? $('#so_stretch').checked : false;
  align.plan = solveFit(align.meas, align.blue, stretch, guide);
  drawGhost();
  renderExtReadout();
  // the Run button is held shut until there is a fit to run, and this is the
  // moment there is one — the panel is drawn before the plan is solved, so
  // stating it only there would leave the button disabled with marks up
  syncRunLabel();
}
/* Where the border should be, on **this image** — the spec's own inset taken
   against the picture in front of you, which is the only frame of reference the
   marks share. It used to be drawn on the *trim* box while the marks were up, and
   because that box is anchored at the top left, the whole difference between trim
   and image (a pixel or two) landed on the right and bottom edges: the two things
   that are the same number disagreed there and nowhere else. The trim is the
   ghost's job; the band's job is to be comparable with the marks. */
function drawBand(){
  const band = $('#al_band'); if(!band) return;
  const g = align.meas && activeGuide();
  if(!g || g.frameless){ band.hidden = true; return; }
  band.hidden = false;
  Object.assign(band.style, {left:'0%', top:'0%', width:'100%', height:'100%'});
  setBandLine(band, g.inset);
}
/* The step's opening state: the target alone. No ghost, because with no marks
   placed there is no fit to preview yet. */
function drawTarget(){
  const ghost = $('#al_ghost');
  if(ghost) ghost.hidden = true;
  drawBand();
}
/* The target line, inset from the band box by the spec's four fractions. */
function setBandLine(band, inset){
  const i = band.querySelector('i'); if(!i) return;
  const [t, r, b, l] = inset;
  i.style.inset = `${t * 100}% ${r * 100}% ${b * 100}% ${l * 100}%`;
}
function drawGhost(){
  const ghost = $('#al_ghost'), p = align.plan;
  if(!ghost) return;
  if(!p){ ghost.hidden = true; drawBand(); return; }
  ghost.hidden = false;
  const pct = (v, span) => (v / span) * 100;
  const L = -pct(p.ext.left, p.w2), T = -pct(p.ext.top, p.h2);
  const W = pct(p.tw, p.w2), H = pct(p.th, p.h2);
  Object.assign(ghost.style, {left:`${L}%`, top:`${T}%`, width:`${W}%`, height:`${H}%`});
  drawBand();
}
function renderExtReadout(){
  const p = align.plan, rd = $('#al_read'); if(!rd) return;
  if(!p){ rd.innerHTML = '<p class="hint mb-0" style="color:var(--hold)">The marks leave no inner frame.</p>'; return; }
  const row = (k, l) => `<dt>${l}</dt><dd>${(p.borders[k]*100).toFixed(2)}%</dd>`;
  rd.innerHTML = `<dl class="readout mb-1">
      ${row('top','border top')}${row('right','right')}${row('bottom','bottom')}${row('left','left')}
      <dt>output</dt><dd>${p.tw}×${p.th} px</dd></dl>
    ${p.cropped.length ? `<p class="hint mb-0" style="color:var(--hold)">
       Shaves the over-target ${p.cropped.join(', ')}.</p>` : ''}`;
}
/* Which spec is in force, what else applies, and the one control that changes it for
   good. Shown whether or not the marks are up: it is a fact about the card, not about
   the align tool. A per-run override lives in the step's own Frame setting; a pin is a
   decision about this card, so it is offered where the card is.

   **A set can hold more than one border**, and `res.alternatives` is the ones the rules
   really reach — not "any spec you like", which the Frame setting already offers. When
   there is more than one, this is a *choice*, so it renders as one: `specChooser`. With
   only one it is a label, and a one-option radio group is not a choice.

   **It reports what the fit will use, not what the rules resolved**, and those differ in
   the two cases that matter: a Frame chosen in the step's settings overrides the
   resolution for the run (so this said the resolved spec while the fit used another), and
   a printing nobody has measured resolves to *nothing at all* — where this used to render
   an empty string and say nothing, on the one card that most needed explaining. */
function whyThisSpec(){
  const res = align.meas && align.meas.resolution;
  if(!res) return '';
  const over = align.guide
    ? (align.meas.guides || []).find(g => g.id === align.guide) : null;
  // A frame chosen for the run wins over whatever resolved, exactly as `--frame` does,
  // so that is what is reported — and `Pin` turns this run's choice into the card's.
  if(over) return `
    <div class="fsone" title="${esc(over.id)}">
      <span>
        <span class="fsname">${esc(shortSpecName(over.name))}</span>
        <span class="fsnum">${esc(specWidths(over))} · chosen for this run</span>
      </span>
      ${pinButton(align.meas.pin, 'Keep')}
    </div>`;
  // Nothing measured describes this printing. It is a state, not a failure — but it is
  // the state where a person has to *do* something, so it says what and where. The
  // `border` CLI says the same sentence and offers the same escape hatch (`--frame`).
  if(!res.spec) return `
    <p class="hint mb-0 mt-2" style="color:var(--hold)">${ticks(res.note)}</p>
    <p class="hint mb-0 mt-1">Pick a <b>Frame spec</b> above to fit against it for this
      run — then align as usual. <b>Pin</b> keeps it for this card.</p>`;
  const alts = res.alternatives || [];
  const problem = res.missing || res.undecided.length
    ? `<p class="hint mb-0 mt-1" style="color:var(--hold)">${ticks(res.note)}</p>` : '';
  if(alts.length) return specChooser(res, alts) + problem;
  // One spec, so nothing to pick between — and therefore **no selection styling**: an
  // accented frame on the only row would spend the signal that says "this one, not that
  // one" where there is no other one, which is the whole thing being fixed here. A plain
  // label instead, carrying what the old bar left out: the spec's *name*. That bar showed
  // the bare id and put the names on the other specs' buttons, so the one in force was
  // the only one you could not read.
  return `
    <div class="fsone" title="${esc(res.spec.id)}">
      <span>
        <span class="fsname">${esc(shortSpecName(res.spec.name))}</span>
        <span class="fsnum">${esc(specWidths(res.spec))} · ${align.meas.pin
          ? 'pinned to this card' : `matched by ${esc(res.via_label)}`}</span>
      </span>
      ${pinButton(align.meas.pin)}
    </div>${problem}`;
}
/* `specs`' notes are one sentence shared with the CLI, and they mark a command the way a
   terminal does — ``proxdex frames set``. Printed verbatim in a browser those backticks are
   just punctuation, so they are rendered as the mono type this app already uses for every
   id and command. Escaped first: this is the same untrusted-ish text as everywhere else,
   and the only markup allowed out is the span this adds. */
function ticks(text){
  return esc(text || '').replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
}
/* Every spec in this list belongs to the same game — a spec carries a game and the
   rules only ever reach its own — so the `Pokémon · ` every name starts with is a
   shared prefix taking a third of a narrow row. Dropped for display only; the full id
   is on the row's tooltip and the frames screen shows names whole. */
function shortSpecName(name){
  const cut = (name || '').indexOf(' · ');
  return cut > 0 ? name.slice(cut + 3) : (name || '');
}
/* A spec's four border widths, which is what somebody comparing two of them is
   actually comparing. Opposite edges collapse to one number when they are equal — most
   specs are symmetric, and `2.56 / 2.56 / 2.56 / 2.56` is four numbers saying one
   thing — but never when they differ, because an asymmetric spec's *shape* is the whole
   reason there are two candidates on an e-Card set. */
function specWidths(spec){
  const mm = spec.mm || [];
  if(spec.frameless || !mm.length) return 'no printed frame';
  const [t, r, b, l] = mm.map(v => v.toFixed(2));
  const flat = t === b && r === l ? [t, r] : [t, r, b, l];
  return `${flat.join(' / ')} mm`;
}
/* Keep this spec for this card, or stop keeping it. One function, because the label is
   the only thing that differs between the two places it appears: a lone spec is `Pin`,
   while the chooser's footer reads `Pin it` — the *it* being the row above. */
function pinButton(pinned, keep = 'Pin'){
  return pinned
    ? `<button class="btn btn-sm btn-ghost" onclick="unpinCard()"
         title="Back to whatever the rules resolve">Unpin</button>`
    : `<button class="btn btn-sm btn-ghost" onclick="pinCard()"
         title="Keep this spec for this card on every later run">${esc(keep)}</button>`;
}
/* Every spec that applies, as a radio group. Picking one **pins** it, because the
   choice is about this card and has to survive the next run — and the offer is
   symmetric, so the spec you moved off is then just another row and one click back.
   The rows carry the names and the widths; the row in force carries the via chip that
   says how it got there, on the row rather than above it. */
function specChooser(res, alts){
  // **Sorted by id, not "the winner first".** `resolve` hands back the spec in force
  // plus the others, so rendering in that order moved whichever row you clicked to the
  // top the moment you clicked it — a radio group that rearranges under the pointer,
  // where the thing you just chose is no longer where you chose it. The set of rows is
  // the same either way (picking swaps which one is the winner), so a key that does not
  // depend on the choice keeps every row still. Which one is selected is said by the
  // accent and the radio, which is what a selection should be said by.
  const rows = [{id:res.spec.id, name:res.spec.name, mm:res.spec.mm,
                 frameless:res.spec.frameless, via_label:res.via_label, on:true},
                ...alts.map(a => ({...a, on:false}))]
    .sort((a, b) => a.id.localeCompare(b.id));
  // The via is **not** a chip on the row here, unlike the single-spec label: it is the
  // same value on every row that could be selected (all of these were reached), so as a
  // per-row badge it competed with the names for a narrow row and said nothing that
  // distinguished them. It states the group's footing once, below, and each row's own
  // route is on its tooltip.
  const opts = rows.map(r => `
    <label class="fsopt ${r.on ? 'is-on' : ''}"
      title="${esc(r.id)} — applies via ${esc(r.via_label)}">
      <input type="radio" name="fspick" class="form-check-input"
        data-spec="${esc(r.id)}" ${r.on ? 'checked' : ''} onchange="pickSpec(this)">
      <span>
        <span class="fsname">${esc(shortSpecName(r.name))}</span>
        <span class="fsnum">${esc(specWidths(r))}</span>
      </span>
    </label>`).join('');
  return `
    <p class="hint mb-1 mt-2">${rows.length} borders apply to this printing — pick the
      one this card has.</p>
    <div class="fspick">${opts}</div>
    <div class="fsfoot">
      <span class="hint">${align.meas.pin ? 'Pinned to your choice.'
        : `Matched by ${esc(res.via_label)}.`}</span>
      ${pinButton(align.meas.pin, 'Pin it')}
    </div>`;
}
/* A radio changed, so pin what it names. Reads the id off the element rather than
   closing over it, which is the same reason every other handler here takes `this`:
   an inline handler's scope starts at the element, so a bare name can resolve to an
   HTMLElement property instead of the variable meant. */
function pickSpec(el){
  const spec = el && el.dataset ? el.dataset.spec : '';
  const res = align.meas && align.meas.resolution;
  // Already in force and not pinned: selecting it is not a change, but *keeping* it
  // is worth recording, since the rules could resolve differently later.
  if(!spec) return;
  if(res && res.spec && res.spec.id === spec && align.meas.pin) return;
  pinSpec(spec);
}
function renderAlignPanel(){
  const p = $('#alpanel'), c = card(); if(!p || !c) return;
  if(!align.on){
    // The layer is down: either there is no source yet, the step is skipped, or it
    // is done and you are looking at the result. Which spec is in force is a fact
    // about the card either way, so it is still stated — and when the step could be
    // (re)done, the way back to the marks is here.
    const noSource = stStatus(c, PIPE()[0].stage) !== 'done';
    const st = stStatus(c, SPEC('border').stage);
    const openable = !noSource && st !== 'skipped';
    p.innerHTML = `<hr class="rule" style="margin:.875rem 0">
      <div class="eyebrow mb-1">Where the border should be</div>
      ${noSource
        ? `<p class="hint mb-0">Fetch this side's original first.</p>`
        : (st === 'skipped'
            ? `<p class="hint mb-0">Skipped — the original stands as the master.</p>`
            : whyThisSpec())}
      ${openable ? `<div class="d-grid gap-2 mt-2">
        <button class="btn btn-sm btn-outline-primary" onclick="showMarks(true)">${
          st === 'done' ? 'Align it again' : 'Align the border'}</button></div>` : ''}`;
    // read once per card and side; the panel repaints when it lands
    if(!noSource) loadSpecFacts(c);
    return;
  }
  const g = activeGuide();
  // **No spec at all**, which happens whenever nothing measured describes the printing
  // and no Frame has been chosen for the run — every Pokémon set past the e-Reader era,
  // so not a corner. This read `g.frameless` on a null `g` and *threw*, which took the
  // whole panel with it: no explanation, and no `Align the border` button either, so the
  // card looked un-alignable when the escape hatch was one dropdown away. There is
  // nothing to place a mark against until a spec is chosen, so the panel says so.
  if(!g){
    p.innerHTML = `<hr class="rule" style="margin:.875rem 0">
      <div class="eyebrow mb-1">Where the border should be</div>
      ${whyThisSpec()}`;
    align.plan = null;
    syncRunLabel();
    return;
  }
  // Nothing to place on a borderless print, so the panel says so instead of
  // offering marks that would sit on the image edges and mean nothing.
  if(g.frameless){
    p.innerHTML = `<hr class="rule" style="margin:.875rem 0">
      <div class="eyebrow mb-1">Where the border should be</div>
      <p class="hint mb-0">No printed frame to align to — this reshapes to the card
        aspect and nothing else. Run it as it is.</p>
      ${whyThisSpec()}`;
    syncRunLabel();
    return;
  }
  if(!marksOn()){
    p.innerHTML = `<hr class="rule" style="margin:.875rem 0">
      <div class="eyebrow mb-1">Where the border should be</div>
      <p class="hint mb-2">The <b style="color:var(--mark)">dashed</b> outline is where
        this card's border belongs. Where it <i>actually</i> sits is yours to place.</p>
      <div class="d-grid gap-2 mb-2">
        <button class="btn btn-sm btn-outline-primary" onclick="showMarks(true)">
          Align the border</button>
      </div>
      ${whyThisSpec()}`;
    syncRunLabel();
    return;
  }
  // The numbers used to be four editable % fields. They are gone: nobody types a
  // border inset — it is *read off the picture* by dragging, which is the whole
  // argument for the marks over a detector — and the value under the pointer is on
  // the loupe while you drag, then in the readout below. Four inputs and their
  // labels were a third of the panel restating what the marks already say.
  p.innerHTML = `
    <hr class="rule" style="margin:.875rem 0">
    <div class="eyebrow mb-1">Where the border is now</div>
    <p class="hint mb-2">Drag <b style="color:var(--mark)">T R B L</b> onto the inner
      border edge; arrow keys nudge.</p>
    <div class="d-flex gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="resetMarks()"
        title="Back to the spec's own numbers">Reset</button>
      <button class="btn btn-sm btn-ghost flex-fill" onclick="showMarks(false)"
        title="Put the marks away and look at the target again">Done</button>
    </div>
    ${whyThisSpec()}
    <div id="al_read" class="mt-2"></div>`;
  positionLines();
  renderExtReadout();
  syncRunLabel();
}

/* ---------- Step two: how the added border is filled ----------------------
   Two steps, because they are two different jobs and mixing them was confusing.

   **Step one is the reading.** Place the marks on the card's own border edge and Run.
   That uses cardbleed's default fill, which is right on almost every card, and it is
   recorded (`.marks-bordered`) so it never has to be taken again.

   **Step two is the fill**, and it only exists once step one has been done: the panel
   then offers cardbleed's thirteen settings, and changing one **re-borders the card
   there and then** — no Preview button, no separate rendering to reconcile with the
   real thing. What you are looking at *is* the output, which is why this replaced a
   preview: a preview is a picture of a fit you have not made, and it has to be
   invalidated, explained and kept in step with the marks.

   The re-run goes through the ordinary `border` verb, so it invalidates the stages after
   it exactly as any other re-run does, and the CLI re-uses the stored marks — which is
   what makes "change one number" a single call rather than a re-alignment. */
const fill = {open:false, busy:false, err:''};

function fillKnobs(){ return (align.meas && align.meas.knobs) || []; }
function fillValues(){ return (align.meas && align.meas.tune) || {}; }
function fillChanged(){ return Object.keys(fillValues()).length; }
/* Does this card's fit invent any border? Half a pixel, because a fit that needs no
   widening reports its extensions as float noise (~1e-13) rather than as zero. */
function fillAdds(){
  const e = align.plan && align.plan.ext;
  if(e) return ['top','right','bottom','left'].some(k => e[k] > 0.5);
  // no live plan (the marks are down, the step is done): fall back to the recorded
  // reading against the spec, which is the same question about the same numbers
  const m = align.meas, g = m && (m.guide || {});
  const rec = m && m.marks;
  if(!rec || !g.inset) return false;
  const px = [g.inset[0]*m.h, g.inset[1]*m.w, g.inset[2]*m.h, g.inset[3]*m.w];
  return [rec.top*m.h, rec.right*m.w, rec.bottom*m.h, rec.left*m.w]
    .some((v, i) => px[i] - v > 0.5);
}

/* Where this sits is the point of the second step. It goes directly under the step's
   own settings and **above** the align section — because on a done border step, tuning
   the fill is the job you came back for, while re-placing the marks is the step-one
   thing you rarely return to. Below the align panel and the readout it was 795px down a
   1000px viewport: you had to scroll to reach it and scroll back to see the card. */
function fillPanel(){
  const knobs = fillKnobs();
  if(!knobs.length) return '';
  const n = fillChanged(), adds = fillAdds();
  if(!fill.open){
    return `<button class="btn btn-sm btn-ghost w-100 mt-2" onclick="toggleFill()">
      Tune the added border${n ? ` · ${n} changed` : ''}</button>`;
  }
  return `
    <div class="panel p-2 mt-2" style="background:var(--ink)">
      <div class="d-flex align-items-baseline gap-2 mb-1">
        <span class="eyebrow">Fill of the added border</span>
        <button class="btn btn-sm btn-link p-0 ms-auto" style="font-size:.7rem"
          onclick="toggleFill()">hide</button>
      </div>
      ${adds
        ? `<p class="hint">Change one and the card is <b>re-bordered</b> — what you see
           is the result, not a preview. The geometry never moves; only the invented
           border does. Later stages are rebuilt from it, as with any re-run.</p>`
        : `<p class="hint" style="color:var(--hold)">Nothing is being added to this
           card's border, so none of these can change the picture — every value gives
           the same file. What reshapes it here is <b>stretch</b> above.</p>`}
      ${knobs.map(fillControl).join('')}
      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="resetFill()"
          ${n && !fill.busy ? '' : 'disabled'}>Back to defaults</button>
      </div>
      ${fill.err ? `<p class="hint mb-0 mt-2" style="color:var(--hold)">${esc(fill.err)}</p>` : ''}
    </div>`;
}

function fillControl(k){
  const cur = fillValues();
  const v = cur[k.key] !== undefined ? cur[k.key] : k.default;
  const changed = cur[k.key] !== undefined;
  const id = 'fk_' + k.key;
  const off = fill.busy ? 'disabled' : '';
  // `onchange` and not `oninput`: this re-runs the border step, so it fires when you
  // leave the field or pick from the list — not on every keystroke or drag
  const control = k.kind === 'choice'
    ? `<select class="form-select form-select-sm" id="${id}" ${off}
         onchange="setFill('${k.key}', this.value)">${
         k.choices.map(c => `<option value="${esc(c)}" ${c === String(v) ? 'selected' : ''}
           >${esc(c)}</option>`).join('')}</select>`
    : (k.kind === 'auto-int'
        ? `<input class="form-control form-control-sm" id="${id}" ${off}
             value="${esc(String(v))}" placeholder="auto"
             onchange="setFill('${k.key}', this.value)">`
        : `<input class="form-control form-control-sm" id="${id}" type="number" ${off}
             min="${k.lo}" max="${k.hi}" step="${k.step}" value="${esc(String(v))}"
             onchange="setFill('${k.key}', this.value)">`);
  return `<div class="fillrow ${changed ? 'on' : ''}" title="${esc(k.help)}">
      <label for="${id}">${esc(k.label)}</label>${control}
    </div>`;
}

/* Both halves of the border panel, in the order that works.
   `renderStepPanel` writes the whole `#steppanel`, which emits an **empty** `#alpanel`
   — so anything that restates it has to re-render the align panel afterwards or it
   blanks the marks, the readout and the target outline. That exact ordering has bitten
   this file before, from the other direction (`repaintProof` before `renderStepPanel`),
   which is why it is one function and not two calls at each site. */
function paintBorderPanel(){
  const c = card(); if(!c) return;
  renderStepPanel(c, state.step);
  renderAlignPanel();
}

function toggleFill(){ fill.open = !fill.open; paintBorderPanel(); }

/* One change → one re-border. The settings live on the card (the server hands them
   back in `/api/frame`), so this sends the whole set each time rather than a delta:
   that is also what makes "back to defaults" expressible as `{}`. */
async function setFill(key, raw){
  const k = fillKnobs().find(x => x.key === key); if(!k) return;
  const next = {...fillValues()};
  const text = String(raw).trim();
  // a value back at its default is not a setting; dropping it is what keeps the card's
  // record readable and matches what the server stores
  if(text === '' || text === String(k.default)) delete next[key];
  else next[key] = text;
  await applyFill(next);
}
async function resetFill(){ await applyFill({}); }

async function applyFill(values){
  const c = card(); if(!c || fill.busy) return;
  fill.busy = true; fill.err = ''; paintBorderPanel();
  const body = {cmd:'border', ids:[c.id], settings:stepSettings('border'),
                force:true, tune:values};
  if(twoSided(c)) body.face = state.face + 1;
  // the marks are not sent: `border` re-uses the reading it recorded, which is the whole
  // reason step two is one call rather than a re-alignment
  const ok = await act('/api/step', body, `border · ${c.id}`);
  fill.busy = false;
  if(!ok) fill.err = 'That re-border failed — the log is in the toast.';
  // the card's own record is what the panel shows, so re-read it rather than trusting
  // what was just sent
  align.meas = null; align.facts = null;
  renderCard();
}

/* Pin this card to the frame spec the panel is showing — the one thing on this
   screen that outlives the run. The selected spec is the step's own Frame setting
   when one is chosen, else whatever the rules resolved. */
async function pinCard(){
  const c = card(); if(!c || !align.meas) return;
  const spec = align.guide || (align.meas.resolution && align.meas.resolution.spec.id);
  if(spec) await pinSpec(spec);
}
/* Pick one of the specs that apply. Named rather than reached through `pinCard`'s
   "whatever is selected", because the alternatives are not selected — they are
   offered, and clicking one is the act of choosing it. */
async function pinSpec(spec){
  const c = card(); if(!c || !spec) return;
  if(!await act('/api/frames/pin', {ids:[c.id], spec}, `Pinned ${c.id} to ${spec}`)) return;
  align.meas = null; align.facts = null;
  renderCard();
}
async function unpinCard(){
  const c = card(); if(!c) return;
  if(!await act('/api/frames/pin', {ids:[c.id], spec:null}, `Unpinned ${c.id}`)) return;
  align.meas = null; align.facts = null;
  renderCard();
}

/* Border can only run once it knows where the border is, and the marks come up
   after the panel is drawn — so the button is re-stated when they do rather than
   offering a reshape that has nothing to reshape against. A borderless print is
   the exception: there is nothing to place, so it is runnable from the start. */
function borderReady(){ return noBorder() || !!(align.on && align.plan && marksOn()); }
function syncRunLabel(){
  const btn = $('#runbtn'), c = card();
  if(!btn || !c || state.step !== 'border') return;
  const s = SPEC('border'), ready = borderReady();
  btn.textContent = stStatus(c, s.stage) === 'done'
    ? `${s.run_label} again` : s.run_label;
  btn.disabled = !ready;
  // Two different reasons to be shut, and telling somebody to align a card that has no
  // spec to align *to* sends them at the wrong control — which is what it did.
  const noSpec = !!(align.meas && !activeGuide());
  btn.title = ready
    ? (noBorder() ? 'Reshapes to the card aspect — this printing has no frame'
                  : 'Fits to the frame spec using the marks you placed')
    : (noSpec
        ? 'Choose a frame spec first — nothing measured describes this printing'
        : 'Align the border first — nothing has measured where it sits');
}

/* ---------- finding cards: one query, two screens -------------------------
   **Browse and Search are the same question asked from two directions**, which is
   why they share `state.find`, one filter bar, one result grid and one pager.
   Browsing a set is a query carrying a set and no name; searching is a query
   carrying a name. That is exactly what `proxdex.browse.Query` says in Python, and
   /api/search answers both — so there is no second result row to keep in step and
   no way for the two screens to disagree about what a filter means.

   What is *not* shared is the index: `state.browse` is the set index's own state
   (which game, which group, a filter over set names), because "what sets exist"
   is a different question from "which cards match". */
const FIND = () => state.find;
const findGame = () => state.find.game || state.meta.default_game;
const browseGame = () => state.browse.game || state.meta.default_game;
/* The facet vocabulary and the set index are per game and never change while you
   look at them, so each is fetched once and held. A game with neither yet renders
   its controls empty rather than blocking the screen — same call the step panel
   makes for an absent upscaler. */
const facetsFor = g => state.facets[g] || null;
const expFor = g => state.exp[g] || null;

async function loadFacets(game){
  if(state.facets[game]) return state.facets[game];
  try{
    const r = await get('/api/facets?game=' + encodeURIComponent(game));
    state.facets[game] = r;
    return r;
  }catch(e){ return null; }
}
async function loadExpansions(game){
  if(state.exp[game]) return state.exp[game];
  /* the set index is the one read here that is genuinely slow the first time — one
     request for the lot, and the server warms 174 logos behind it — so it gets the
     same strip the result grid does. Its host renders after this call starts, which
     `paintRead` copes with by looking the host up per tick. */
  beginRead('results_top', 'read:sets:' + game);
  try{
    const r = await get('/api/expansions?game=' + encodeURIComponent(game));
    endRead(true);
    if(r && !r.error) state.exp[game] = r;
    return r;
  }catch(e){ endRead(false); throw e; }
}
/* One expansion by id, out of the index we already hold — a set view must not
   spend a request to name the set you just clicked. Null until the index has
   loaded, which is a "not yet" and not a "no such set". */
function expansionOf(game, setId){
  const idx = expFor(game); if(!idx) return null;
  for(const g of idx.groups){
    const hit = g.expansions.find(e => e.id === setId);
    if(hit) return hit;
  }
  return null;
}

/* ---------- the filter bar, rendered from /api/facets ---------------------
   The UI spells no rarity, no type and no sort of its own: the values are the
   provider's own catalogs and the sorts are the server's enum, exactly as the step
   panels are built from /api/meta. A facet the provider would not list is simply
   absent — see proxdex.browse.facets on why an empty dropdown is worse than none. */
const FACET_FIELD = {set:'set', rarity:'rarity', year:'year', type:'type',
                     supertype:'supertype', subtype:'subtype', color:'color'};
function facetControl(f){
  const cur = FIND()[FACET_FIELD[f.facet]] || '';
  if(f.multi){
    // a multi-pick facet travels as a comma list, both in `state.find` and in the
    // URL, so one string is the whole value and the chips below can remove one
    const picked = cur.split(',').filter(Boolean);
    return `<div class="col-6 col-md-auto"><select class="form-select form-select-sm"
        onchange="addFacet('${f.facet}', this.value); this.selectedIndex = 0">
        <option value="">${esc(f.label)}…</option>
        ${f.values.filter(v => !picked.includes(v)).map(v =>
          `<option value="${esc(v)}">${esc(v)}</option>`).join('')}
      </select></div>`;
  }
  return `<div class="col-6 col-md-auto"><select class="form-select form-select-sm"
      onchange="setFacet('${f.facet}', this.value)">
      <option value="">${esc(f.label)}: any</option>
      ${f.values.map(v =>
        `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('')}
    </select></div>`;
}
function filterBar({withSet = true} = {}){
  const fx = facetsFor(findGame());
  const f = FIND();
  const sorts = (fx && fx.sorts) || [];
  return `
    <div class="row g-2 align-items-center">
      ${withSet ? `<div class="col-6 col-md-auto"><input class="form-control form-control-sm"
        style="max-width:9rem" placeholder="set id" value="${esc(f.set)}"
        onchange="setFacet('set', this.value)"></div>` : ''}
      <div class="col-6 col-md-auto"><input class="form-control form-control-sm"
        style="max-width:6rem" placeholder="year" value="${esc(f.year)}"
        onchange="setFacet('year', this.value)"></div>
      ${(fx ? fx.facets : []).map(facetControl).join('')}
      <div class="col-6 col-md-auto"><select class="form-select form-select-sm"
        onchange="setSort(this.value)">
        ${sorts.map(s => `<option value="${esc(s.id)}"
          ${s.id === f.sort ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}
      </select></div>
      <div class="col-6 col-md-auto"><button class="btn btn-sm btn-outline-secondary"
        onclick="toggleDir()" title="Which way the sort runs">${dirLabel()}</button></div>
      <div class="col-auto ms-auto"><span class="hint">${esc(perPageNote())}</span></div>
    </div>
    ${activeChips()}`;
}
/* Which way the current sort runs. Unset means the sort's own useful direction —
   newest first for a date, A-Z for a name — which is the server's rule, served in
   /api/facets rather than repeated here. */
function sortDefaultDesc(){
  const fx = facetsFor(findGame());
  const s = fx && (fx.sorts || []).find(x => x.id === FIND().sort);
  return s ? !!s.newest_first : true;
}
function dirDesc(){ const d = FIND().desc; return d === null ? sortDefaultDesc() : d; }
function dirLabel(){ return dirDesc() ? '↓ desc' : '↑ asc'; }
function perPageNote(){ return `${FIND().per_page} per page`; }

function activeChips(){
  const f = FIND(), out = [];
  const add = (facet, value) => out.push(
    `<span class="qchip"><b>${esc(facet)}</b> ${esc(value)}
       <button onclick="dropFacet('${facet}', ${JSON.stringify(value)})"
         title="Remove this filter" aria-label="Remove">×</button></span>`);
  for(const facet of ['set','rarity','year','supertype','subtype']){
    if(f[facet]) add(facet, f[facet]);
  }
  for(const facet of ['type','color']){
    (f[facet] || '').split(',').filter(Boolean).forEach(v => add(facet, v));
  }
  if(!out.length) return '';
  return `<div class="qchips mt-2">${out.join('')}
    <button class="btn btn-sm btn-link p-0 ms-1" style="font-size:.6875rem"
      onclick="clearFacets()">clear all</button></div>`;
}
/* Every filter change re-runs the query from page 1: a filter applied to page 7
   would land you past the end of a smaller answer, which reads as "no results". */
function setFacet(facet, value){
  state.find[FACET_FIELD[facet]] = (value || '').trim();
  state.find.page = 1;
  runFind();
}
function addFacet(facet, value){
  if(!value) return;
  const field = FACET_FIELD[facet];
  const have = (state.find[field] || '').split(',').filter(Boolean);
  if(!have.includes(value)) have.push(value);
  state.find[field] = have.join(',');
  state.find.page = 1;
  runFind();
}
function dropFacet(facet, value){
  const field = FACET_FIELD[facet];
  const have = (state.find[field] || '').split(',').filter(Boolean);
  state.find[field] = have.length > 1 ? have.filter(v => v !== value).join(',') : '';
  state.find.page = 1;
  runFind();
}
function clearFacets(){
  Object.assign(state.find, {rarity:'', year:'', type:'', supertype:'', subtype:'',
                             color:''});
  // the set is *not* cleared here: on a set view it is the page you are on, and
  // dropping it would silently widen the query to every set at once
  if(state.view !== 'browse') state.find.set = '';
  state.find.page = 1;
  runFind();
}
function setSort(sort){ state.find.sort = sort; state.find.desc = null;
                        state.find.page = 1; runFind(); }
function toggleDir(){ state.find.desc = !dirDesc(); state.find.page = 1; runFind(); }
function goPage(n){
  const p = Math.max(1, parseInt(n, 10) || 1);
  if(p === state.find.page) return;
  state.find.page = p;
  runFind();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- the pager ----------------------------------------------------
   The server counts the *whole* answer, not this page, so the control can offer a
   last page and say where you are. A provider that will not say how many matched
   sends total = -1, and then there is no page count to print — Next is offered
   from a full page alone, which is what /api/search's `has_more` means there. */
function pager(page){
  if(!page || (!page.has_more && page.page === 1)) return '';
  const known = page.total >= 0;
  const at = known
    ? `${page.first}–${page.last} of ${page.total}`
    : `${page.first}–${page.last}`;
  const of = known && page.pages > 1 ? ` · page ${page.page} of ${page.pages}` : '';
  return `
    <div class="pager mt-3">
      <button class="btn btn-sm btn-outline-secondary" ${page.page <= 1 ? 'disabled' : ''}
        onclick="goPage(${page.page - 1})">← Prev</button>
      <span class="at mono">${esc(at)}${esc(of)}</span>
      <button class="btn btn-sm btn-outline-secondary" ${page.has_more ? '' : 'disabled'}
        onclick="goPage(${page.page + 1})">Next →</button>
      ${known && page.pages > 2 ? `
        <input class="form-control form-control-sm jump mono ms-2" type="number" min="1"
          max="${page.pages}" value="${page.page}" title="Jump to a page"
          onchange="goPage(this.value)">
        <button class="btn btn-sm btn-link p-0" style="font-size:.75rem"
          onclick="goPage(${page.pages})">last</button>` : ''}
    </div>`;
}

/* ---------- the result grid ---------------------------------------------
   Shared by Search and by a set view, because a hit is a hit. Each carries the
   library's own answer to "have I got this print?" as a corner tick, and a card
   already filed is not selectable — there is nothing to add. */
/* **Whether a card is already filed is asked of the library, not of the response.**
   The server answers `have` when it draws the page, and that answer is stale the
   moment you add something — so the grid reads `state.cards`, which every add
   refreshes. One source of truth, and the tick appears the instant the fetch lands
   rather than on the next query. */
const haveCard = id => state.cards.some(c => c.id === id);
/* **And so is how much of a set you hold.** The server counts it when it draws the
   index, which is a snapshot: add three cards and every tile still showed the old
   number until something re-fetched the whole set list. `state.cards` is refreshed by
   every mutation, so counting it here means the bar and the "n of m in library" line
   are right the moment a fetch lands — and it costs no request at all. */
const ownedIn = setId => state.cards.reduce((n, c) => n + (c.set === setId), 0);

function hitsHtml(rows){
  // whether the query is one set — the tiles then say what differs within it
  const inSet = !!FIND().set;
  return rows.map(x => {
    const kind = x.oversized ? 'oversized'
      : (x.layout && x.layout !== 'single' ? layoutOf(x.layout)?.label || x.layout : '');
    const have = haveCard(x.id), picked = state.pick.has(x.id);
    const busy = state.adding.has(x.id);
    return `
      <div class="hit ${have ? 'have' : ''} ${picked ? 'picked' : ''} ${x.oversized ? 'over' : ''}"
           data-cid="${esc(x.id)}"
           title="${esc(x.name)} · ${esc(x.id)} · ${esc(x.set)} · ${esc(x.rarity)} · ${esc(x.artist)}${
             have ? ' — already in your library' : ''}"
           onclick="pickHit('${esc(x.id)}', event)">
        <span class="hitshot">
          ${have ? '<span class="have-tick" title="Already in your library">✓</span>'
                 : (picked ? '<span class="badge-pick" title="Picked">✓</span>' : '')}
          <a class="full" target="_blank" rel="noopener" href="${esc(x.image)}"
             title="Open the full-resolution scan in a new tab"
             onclick="stopClick(event)">full ↗</a>
          <img class="skel" loading="lazy" decoding="async" alt="${esc(x.name)}"
               src="${artsrc(x.thumb || x.image, 'card')}" onload="unskel(this)"
               onerror="unskel(this);this.style.opacity=.12">
          ${kind ? `<span class="kindtag">${esc(kind)}</span>` : ''}
        </span>
        <div class="hitmeta">
          <div class="nm">${esc(x.name)}</div>
          ${/* **Inside a set, the set is not news — and it was the thing getting the
                room.** Every tile of a set view read `Commander Legends · 2020 · 7…`:
                two facts identical on all sixty tiles, spending the line, with the
                collector number — the one thing that tells this printing from the next
                — truncated off the end of it. So the line is what varies *here*: the
                number leads inside a set, and the set leads across a search. Three
                lines either way, because a tile that changed height with the query
                would ripple through a grid that is finally level. */''}
          ${inSet
            ? `<div><span class="mono">${esc(x.number)}</span> · ${esc(x.rarity)}</div>
               <div>${esc(x.artist)}</div>`
            : `<div>${setIconImg(x.set_id)}${esc(x.set)} ·
                 <span class="mono">${esc(x.number)}</span></div>
               <div>${esc(x.rarity)} · ${esc(x.artist)}</div>`}
        </div>
        ${have
          ? '<span class="addbtn done">✓ In your library</span>'
          : `<button class="addbtn" ${busy ? 'disabled' : ''}
               onclick="stopClick(event);addOne('${esc(x.id)}')"
               title="Download this card now">${busy ? 'Adding…' : '+ Add'}</button>`}
      </div>`;
  }).join('');
}

/* ---------- picking, and adding ------------------------------------------
   Two ways in, because they are two different intentions and both are asked for
   constantly: **this one, now** (the button under the card) and **these twelve,
   when I have finished looking** (click the art, then the tray's one button). The
   labels say which is which, and neither can be mistaken for the other.

   A card already in the library is neither: there is nothing to add. */
/* **The basket survives a reload, because everything else on these screens does.**
   Every other piece of state here is in the URL, and the stated property of this UI is
   that a reload lands where you were — an in-memory basket would be the one thing that
   silently didn't. `sessionStorage`, not `localStorage`: it belongs to this tab and
   this sitting, and a week-old basket you have forgotten picking is worse than none.

   Cards already filed are dropped on the way back in: you may have added them from
   another tab, and a basket offering to fetch what you already have is noise. */
/* Keyed by the library it was picked for. Point the UI at another library in the same
   tab and those picks are somebody else's shopping list — restoring them would offer to
   fetch cards you never chose here. */
const pickKey = () => 'proxdex.pick:' + ((state.meta && state.meta.root) || '');
function savePicks(){
  try{
    sessionStorage.setItem(pickKey(), JSON.stringify([...state.pick.values()]));
  }catch(e){ /* private mode, or a full quota — the basket just won't outlive the tab */ }
}
function loadPicks(){
  try{
    const rows = JSON.parse(sessionStorage.getItem(pickKey()) || '[]');
    for(const r of rows) if(r && r.id && !haveCard(r.id)) state.pick.set(r.id, r);
  }catch(e){ /* nothing to restore */ }
}

function pickHit(id, ev){
  // the whole tile is the pick target now, so a click on a control *inside* it — the
  // Add button, the `full ↗` link — must not also toggle the pick. Both stop the
  // event themselves; this is the belt to that braces.
  if(ev && ev.target.closest('button, a')) return;
  if(ev) ev.preventDefault();
  if(haveCard(id)) return;
  if(state.pick.has(id)) state.pick.delete(id);
  else {
    const row = rowOf(id);
    if(row) state.pick.set(id, row);
  }
  paintOneHit(id);
  paintPickBar();
}
/* Repaint one tile rather than the grid: picking the tenth card must not make the
   browser re-decode the other fifty-nine images, which is exactly the flicker the
   rest of this file is built to avoid. */
function paintOneHit(id){
  const el = document.querySelector(`.hit[data-cid="${cssq(id)}"]`);
  const row = (state.results && state.results.items || []).find(r => r.id === id);
  if(!el || !row) return;
  el.outerHTML = hitsHtml([row]);
}
/* An id is `<set>-<number>` and a Magic collector number can be `A-123` — safe in a
   selector, but quoted through the browser's own escaper rather than by hand. */
const cssq = id => (window.CSS && CSS.escape) ? CSS.escape(id) : id;

function pickAllOnPage(){
  for(const row of (state.results && state.results.items) || []){
    if(!haveCard(row.id)) state.pick.set(row.id, row);
  }
  paintHits(state.results);
}
function clearPicked(){
  state.pick.clear();
  if(state.results) paintHits(state.results);
  paintPickBar();
}
function unpick(id){ state.pick.delete(id); paintOneHit(id); paintPickBar(); }

/* **A card is fetched under its *own* game, never the screen's.** The basket outlives
   the screen, so it can hold a Pokémon card picked in Search and still be open while
   you browse Magic sets — and `game` from the current screen would then send Scryfall
   a pokemontcg id. Every row carries its game, so that is what travels. */
const rowOf = id => (state.results && state.results.items || []).find(r => r.id === id)
                 || state.pick.get(id) || null;
const gameOf = id => (rowOf(id) || {}).game || findGame();
/* **What we already know about a card, so `fetch` need not ask again.** The row on
   screen came from the provider a moment ago and carries the name, set, rarity and
   subtypes that a metadata lookup would return — and that lookup is the request that
   fails when pokemontcg.io is having a bad afternoon.

   **Pokémon only**, and not an oversight: a Magic card's image URL is a uuid path that
   only Scryfall's own answer carries, so an MTG card genuinely cannot be filed without
   asking. Sending nothing for those leaves them on the lookup path.

   The server treats every field as bounded, untrusted text (it becomes a folder name)
   and derives the *picture* from the id itself — so the worst a wrong row can do is
   mislabel a folder, not file the wrong card. */
function knownOf(rows){
  return rows.filter(r => r.game === 'pokemon' && r.name).map(r => ({
    id: r.id,
    name: r.name,
    set_name: r.set || '',
    rarity: r.rarity && r.rarity !== '—' ? r.rarity : '',
    subtypes: r.subtypes || '',
  }));
}

/* One card, now. The tile says `Adding…` while it runs — a fetch is a download and a
   network round trip, and a button that looks unpressed for two seconds gets pressed
   again. */
async function addOne(id){
  if(state.adding.has(id)) return;
  state.adding.add(id);
  paintOneHit(id);
  const row = rowOf(id);
  await act('/api/fetch', {ids:[id], game: gameOf(id),
                           known: knownOf(row ? [row] : []),
                           related: !!state.search_related}, `Added ${id}`);
  state.adding.delete(id);
  /* **Whether it arrived is asked of the library, not of the exit code.** A batch verb
     here reports per item and still exits 0 — every one of them does, deliberately, so
     one bad card does not abandon forty-nine — which means `ok` says "the command ran",
     not "the card is filed". `state.cards` was just refreshed, so it can be asked
     directly, and a card that did not arrive stays picked so it can be tried again. */
  if(haveCard(id)) state.pick.delete(id);
  else toast(`${id} did not arrive — it is still picked, try again`, 7000);
  if(state.results) paintHits(state.results);
  paintPickBar();
}
/* Everything picked — **grouped by game**, one call each, which is what
   `proxdex fetch --game X id id` is. One call for a mixed basket cannot work: the
   endpoint takes a single game for all its ids, and it is right to, because that is
   the CLI's shape. */
async function addPicked(){
  const rows = [...state.pick.values()];
  if(!rows.length) return;
  const byGame = new Map();
  for(const r of rows){
    if(!byGame.has(r.game)) byGame.set(r.game, []);
    byGame.get(r.game).push(r.id);
  }
  for(const r of rows) state.adding.add(r.id);
  paintPickBar();
  for(const [game, ids] of byGame){
    await act('/api/fetch',
              {ids, game, known: knownOf(rows.filter(r => r.game === game)),
               related: !!state.search_related},
              `Added ${ids.length} ${game} card${ids.length > 1 ? 's' : ''}`);
    // **only what actually landed leaves the basket** — asked of the library, since a
    // batch verb reports per card and still exits 0. What did not arrive stays picked,
    // which is both the record of what failed and the way to retry it.
    for(const id of ids) if(haveCard(id)) state.pick.delete(id);
  }
  for(const r of rows) state.adding.delete(r.id);
  const left = state.pick.size;
  if(left) toast(`${left} did not arrive — still picked, press Add to try again`, 7000);
  if(state.results) paintHits(state.results);
  paintPickBar();
}

/* **The tray is the answer to "where did my selection go".** It is fixed to the
   bottom of the window and painted from `state.pick`, so it survives turning the
   page, changing a filter, and switching between Browse and Search — the places the
   old DOM-read selection silently vanished. It shows the cards themselves, because a
   count alone does not tell you whether the eight you picked are the eight you
   meant. */
function paintPickBar(){
  savePicks();       // painted and saved together, so the two cannot disagree
  const host = $('#picktray'); if(!host) return;
  const rows = [...state.pick.values()], n = rows.length;
  document.body.classList.toggle('hasbar', n > 0);
  if(!n){ host.innerHTML = ''; return; }
  const busy = rows.some(r => state.adding.has(r.id));
  const shown = rows.slice(-9);
  return void (host.innerHTML = `<div class="actionbar armed">
    <span class="picktray">${shown.map(r => `<img src="${artsrc(r.thumb || r.image, 'card')}"
      alt="${esc(r.name)}"
      title="${esc(r.name)} · ${esc(r.id)} — click to unpick"
      onclick="unpick('${esc(r.id)}')" style="cursor:pointer">`).join('')}</span>
    <b class="mono">${n} picked</b>
    ${n > shown.length ? `<span class="hint mb-0">(showing the last ${shown.length})</span>` : ''}
    <span class="hint mb-0 d-none d-md-inline">kept while you page and filter</span>
    <span class="ms-auto d-flex gap-2 align-items-center flex-wrap">
      <button class="btn btn-sm btn-ghost" onclick="clearPicked()">Clear</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="pickAllOnPage()">
        Pick all on this page</button>
      <button class="btn btn-sm btn-primary" onclick="addPicked()" ${busy ? 'disabled' : ''}>
        ${busy ? 'Adding…' : `Add ${n} to library`}</button>
    </span></div>`);
}
/* The set's own symbol beside its name, off the index we already loaded — what makes a
   list of *mixed* prints scannable, which is the Search case. Dropped inside a set view,
   where every row carries the same symbol and the header already shows it: seven
   identical glyphs down a column are noise, not information. Absent too when the index
   has not loaded or the game serves no symbol, and nothing depends on it. */
function setIconImg(setId){
  if(FIND().set) return '';
  const exp = setId ? expansionOf(findGame(), setId) : null;
  if(!exp || !exp.symbol) return '';
  return `<img class="seticon ${exp.game === 'mtg' ? 'glyph' : ''}"
    src="${artsrc(exp.symbol, 'symbol')}" alt="" onerror="this.remove()">`;
}
function paintHits(page, boxId){
  const box = $('#' + (boxId || 'results')); if(!box) return;
  box.innerHTML = hitsHtml(page.items || []);
  // a picture the browser already holds is `complete` on insertion, so its plate
  // comes off now rather than sheening over a card that is already on screen
  unskelAll(box);
  const foot = $('#' + (boxId || 'results') + '_pager');
  if(foot) foot.innerHTML = pager(page);
  // the screen's own template ships a "Loading…" line, and painting from cache is
  // not loading — after an add, `render` re-emitted it and nothing took it down
  if((page.items || []).length) showHint('');
  paintPickBar();
}

/* ---------- the ghost grid ------------------------------------------------
   What a page of results looks like before it arrives. Cells in the grid's own
   layout, so the old cards are gone the instant you click and nothing shifts when
   the real ones land — the point being that the page keeps its height rather than
   collapsing to nothing and springing back.

   **How many is answered honestly or not at all.** Paging inside a query the server
   has already counted is a case where the number is *known* — a last page of 32 draws
   32 — and that is the case this was built for. A first search knows nothing, so it
   draws one screenful rather than a full page of 60: three hits behind sixty ghosts
   would be a shape nobody promised. `_findKey` is the query minus its page, so
   "same query, different page" is decided by the request that was actually sent
   rather than by comparing filter fields by hand. */
const GHOSTS_UNKNOWN = 12;
let _findKey = '';

function ghostCount(){
  const f = FIND(), prev = state.results;
  const same = prev && _findKey && _findKey === queryKey();
  if(!same || !prev.items || prev.total < 0) return GHOSTS_UNKNOWN;
  const per = f.per_page || 60;
  const left = prev.total - (f.page - 1) * per;
  return Math.max(1, Math.min(per, left));
}
function queryKey(){
  const p = findParams();
  p.delete('page');
  return p.toString();
}
function ghostGrid(n){
  // the real tile's own boxes, emptied — see `.hitghost`. Three meta rows because a
  // hit has three, and the button, because a tile without one is 28px shorter.
  const one = `<div class="hit hitghost">
    <span class="hitshot"><span class="hgshot skelbox"></span></span>
    <div class="hitmeta">
      <div class="hgrow nm"><i class="skelbox"></i></div>
      <div class="hgrow short"><i class="skelbox"></i></div>
      <div class="hgrow"><i class="skelbox"></i></div>
    </div>
    <span class="addbtn"></span></div>`;
  return one.repeat(Math.max(1, n));
}

/* ---------- running the query -------------------------------------------- */
function findParams(){
  const f = FIND();
  const p = new URLSearchParams({game: findGame()});
  if(f.q.trim()) p.set('q', f.q.trim());
  for(const k of ['set','rarity','year','type','supertype','subtype','color']){
    if(f[k]) p.set(k, f[k]);
  }
  if(f.sort && f.sort !== 'released') p.set('sort', f.sort);
  if(f.desc !== null && f.desc !== sortDefaultDesc()) p.set('desc', f.desc ? '1' : '0');
  if(f.page > 1) p.set('page', String(f.page));
  if(f.per_page !== 60) p.set('per_page', String(f.per_page));
  return p;
}
/* The one place a query is sent. Both screens call it, and it writes the URL as it
   goes, so every state of either screen is a link you can paste. */
async function runFind(){
  syncUrl();
  const box = $('#results');
  /* the wait goes where the cards were, not under them. `showHint('')` clears the
     bottom line the templates ship, because a hint *below* the grid was the whole
     bug: it said "Searching…" where nobody was looking while the previous page's
     cards stayed on screen looking current. */
  showHint('');
  if(box) box.innerHTML = ghostGrid(ghostCount());
  if($('#results_pager')) $('#results_pager').innerHTML = '';
  beginRead('results_top', 'read:' + (FIND().set ? 'browse' : 'search') + ':' + findGame());
  _findKey = queryKey();
  const asked = findParams().toString();
  try{
    const r = await get('/api/search?' + asked);
    if(asked !== findParams().toString()) return;   // a later query overtook this one
    endRead(true);
    if(r.error){ state.results = null; showHint(r.error); if(box) box.innerHTML = ''; return; }
    /* **A page past the end is a nearly-right link, not an empty answer.** A pasted
       URL at page 9 of a query that now has 2 pages would otherwise show a blank
       grid saying "nothing matched" over 92 cards that did. One corrective request,
       only in that case, and the guard is that the retry lands inside the range it
       was just told — so it cannot bounce. */
    if(!r.items.length && r.total > 0 && r.pages >= 1 && r.page > r.pages){
      state.find.page = r.pages;
      return runFind();
    }
    state.results = r;
    paintHits(r);
    if(r.items.length) showHint('');
    else { const h = $('#results_hint'); if(h) h.innerHTML = emptyHint(r); }
  }catch(e){
    // the ghosts have to go too, or a failed read leaves a grid of cards that will
    // never arrive sitting under the error
    endRead(false);
    state.results = null;
    if(box) box.innerHTML = '';
    showHint('Search failed: ' + e);
  }
}

/* ---------- Search ------------------------------------------------------- */
function viewSearch(){
  const f = FIND(), game = findGame();
  const gopts = state.meta.games.map(g =>
    `<option value="${esc(g.id)}" ${g.id === game ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  const example = state.meta.games.find(g => g.id === game)?.example || '';
  return `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">Find cards by name</div><h5 class="mb-0">Search</h5></div>
      <span class="hint ms-auto mb-0" style="max-width:30rem">Every word must appear in
        the name. Ids look like <code class="mono" id="q_example">${esc(example)}</code>.
        Looking for a whole set instead?
        <a href="/browse" onclick="return goLink(event,'browse')">Browse by set ↗</a></span>
    </div>
    <div class="panel p-3 mb-3">
      <div class="row g-2 align-items-center mb-2">
        <div class="col-12 col-md-3"><select class="form-select form-select-sm" id="f_game"
          onchange="onGameChange(this.value)">${gopts}</select></div>
        <div class="col-12 col-md-6"><input class="form-control form-control-sm" id="q"
          placeholder="Card name" value="${esc(f.q)}"
          onkeydown="if(event.key==='Enter')submitSearch()"></div>
        <div class="col-12 col-md-3 d-grid"><button class="btn btn-sm btn-primary"
          onclick="submitSearch()">Search</button></div>
      </div>
      ${filterBar()}
      <div class="d-flex align-items-center gap-2 mt-2">
        <span class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="f_related"
                 ${state.search_related ? 'checked' : ''}
                 onchange="setSearchRelated(this.checked)">
          <label class="form-check-label" style="font-size:.75rem" for="f_related"
            title="Meld halves, the melded card, the tokens a card makes">
            also add the cards these are printed alongside</label>
        </span>

/* ---------- import wizard -------------------------------------------------
   `proxdex import` for a whole folder: pick the files, review what each one
   would become, then send them. The review is the *server's* plan
   (/api/import/plan = `import --dry-run`), computed from filenames alone — so
   nothing is uploaded to draw it, and the table cannot promise an outcome the
   import does not produce.

   The files stay in the browser until you press Import, and then go one request
   at a time: a folder where one file fails should file the other forty-nine and
   name the one that didn't. */
const IMP = () => state.imp;
const impMeta = () => state.meta.import || {on_existing:[], dispositions:[], suffixes:[]};
/* How a disposition reads: green writes, dim keeps, amber wants a decision. The
   words are the server's own — this only chooses a colour for each. */
function dispClass(d){
  const known = impMeta().dispositions.find(x => x.id === d);
  if(!known) return 'stop';
  return known.writes ? 'write' : (known.blocked ? 'stop' : 'keep');
}

function renderImport(){
