<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>proxdex</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230c0c10'/><path d='M7 12V7h5M20 7h5v5M25 20v5h-5M12 25H7v-5' stroke='%23f2418c' stroke-width='2.4' fill='none' stroke-linecap='square'/></svg>" />
<link rel="stylesheet" href="/static/bootstrap.min.css" />
<style>
/* ============================================================================
   proxdex — a prepress console.

   The chrome is deliberately colourless: you are judging card colour on these
   screens, so nothing around the image competes with it. Two accents, and both
   are borrowed from the marks a press actually prints: registration MAGENTA
   carries every interaction and every crop mark, registration CYAN carries the
   one thing that is a measurement rather than a control — the target border the
   fit is aiming at. Numbers are always monospaced: this is a measuring tool.

   Bootstrap 5.3 supplies the components (nav, buttons, forms, modal, toast,
   accordion, grid); everything below is the theme plus the five pieces
   Bootstrap has no answer for — the contact sheet, the filmstrip stepper, the
   proof viewer with its compare tool, the frame-align overlay, and the
   loupe.
   ========================================================================= */
:root {
  /* --- ground up. Four surfaces, each one step lighter than the last, so
     elevation is read from value alone and never needs a shadow. */
  --ink:      #0c0c10;   /* page ground */
  --stock:    #14141a;   /* panel surface — "stock" as in paper stock */
  --stock-2:  #1b1b23;   /* raised control surface */
  --stock-3:  #23232d;   /* pressed / hovered control */
  --rule:     #23232e;   /* hairline rules */
  --rule-2:   #313140;   /* a rule that has to be seen */

  --type:     #eeece8;   /* paper white */
  --dim:      #8e8e9e;   /* secondary type */
  --faint:    #5f5f6e;   /* tertiary — units, raw keys */

  --mark:     #f2418c;   /* registration magenta — marks + interaction */
  --mark-dim: rgba(242,65,140,.16);
  --reg:      #22c9d6;   /* registration cyan — the measured target */
  --reg-dim:  rgba(34,201,214,.14);
  --proof:    #5bd68a;   /* a step that is done */
  --hold:     #e8b44a;   /* a step deliberately skipped */
  --bad:      #ff6b6b;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* one spacing scale, 4px-based, used for every gap in the app */
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem;
  --s5: 1.5rem; --s6: 2rem; --s7: 3rem;

  /* Bootstrap, re-skinned */
  --bs-body-bg: var(--ink);
  --bs-body-color: var(--type);
  --bs-body-font-family: var(--font-ui);
  --bs-body-font-size: .875rem;
  --bs-body-line-height: 1.5;
  --bs-emphasis-color: var(--type);
  --bs-secondary-color: var(--dim);
  --bs-border-color: var(--rule);
  --bs-border-radius: .625rem;
  --bs-border-radius-sm: .375rem;
  --bs-border-radius-lg: .875rem;
  --bs-primary: var(--mark);
  --bs-link-color: var(--mark);
  --bs-link-hover-color: #ff6ba6;
  --bs-code-color: var(--mark);
  --bs-font-monospace: var(--font-mono);
  --bs-focus-ring-color: rgba(242,65,140,.3);

  /* A real card's die-cut corner: 3 mm on a 63×88 mm card. Given as a
     percentage PAIR (3/63 horizontal, 3/88 vertical) so the two axes come out
     to the same absolute radius — a single percentage would make the corner an
     ellipse — and so it scales with the tile instead of the fixed px it was.
     3 mm is the spec both games are printed to (1/8" die) and matches what the
     providers themselves render: Scryfall's PNG corner has the area of a
     2.7 mm round, scrydex's modern Pokémon scans 3.1 mm. */
  --card-radius: 4.76% / 3.41%;
}
body { background: var(--ink); -webkit-font-smoothing: antialiased; }
/* Bootstrap's display utilities are !important, so [hidden] loses without this */
[hidden] { display: none !important; }
::selection { background: var(--mark-dim); }

/* --- type roles ----------------------------------------------------------
   Sans reads, mono measures, micro-caps label. Every id, dimension, percent
   and dpi in this app is mono — that is the whole typographic idea. */
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: .625rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim);
}
.hint { font-size: .75rem; color: var(--dim); line-height: 1.45; }
.faint { color: var(--faint); }
h1, h2, h3, h4, h5, h6 { letter-spacing: -.02em; }
h5 { font-size: 1.0625rem; }
h6 { font-size: .9375rem; }

/* --- crop marks ----------------------------------------------------------
   Four L-shaped hairline brackets, drawn with one pseudo-element — the same
   marks `proxdex sheet` prints at each card corner. Contact-sheet tiles only:
   the proof shows the card and nothing else, so nothing competes with it. */
.marks { position: relative; }
.marks::after {
  content: ""; position: absolute; inset: -7px; pointer-events: none;
  opacity: 0; transition: opacity .12s ease;
  --l: 11px; --w: 1px; --c: var(--mark);
  background:
    linear-gradient(var(--c),var(--c))    0    0 / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c))    0    0 / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) 100%    0 / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c)) 100%    0 / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c))    0 100% / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c))    0 100% / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100% / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100% / var(--w) var(--l) no-repeat;
}
.marks:hover::after, .marks.marked::after { opacity: 1; }
.marks.quiet::after { opacity: .34; }

/* --- surfaces ------------------------------------------------------------ */
.panel {
  background: var(--stock); border: 1px solid var(--rule);
  border-radius: var(--bs-border-radius);
}
.panel-2 { background: var(--stock-2); border: 1px solid var(--rule); border-radius: var(--bs-border-radius-sm); }
.rule { border: 0; border-top: 1px solid var(--rule); opacity: 1; margin: var(--s4) 0; }

.form-control, .form-select {
  background-color: var(--stock-2); border-color: var(--rule); color: var(--type);
}
.form-control::placeholder { color: var(--faint); }
.form-control:focus, .form-select:focus, .btn:focus-visible, a:focus-visible,
.form-check-input:focus, [tabindex]:focus-visible {
  border-color: var(--mark); box-shadow: 0 0 0 .18rem rgba(242,65,140,.28); outline: 0;
}
.form-check-input:checked { background-color: var(--mark); border-color: var(--mark); }
.btn { --bs-btn-font-size: .8125rem; font-weight: 500; }
.btn-primary {
  --bs-btn-bg: var(--mark); --bs-btn-border-color: var(--mark); --bs-btn-color: #16050d;
  --bs-btn-hover-bg: #ff5c9c; --bs-btn-hover-border-color: #ff5c9c; --bs-btn-hover-color: #16050d;
  --bs-btn-active-bg: #e33580; --bs-btn-active-border-color: #e33580;
  --bs-btn-disabled-bg: var(--stock-3); --bs-btn-disabled-border-color: var(--rule);
  --bs-btn-disabled-color: var(--faint); font-weight: 600;
}
.btn-outline-secondary {
  --bs-btn-color: var(--type); --bs-btn-border-color: var(--rule);
  --bs-btn-bg: transparent;
  --bs-btn-hover-bg: var(--stock-2); --bs-btn-hover-border-color: var(--rule-2);
  --bs-btn-hover-color: var(--type); --bs-btn-active-bg: var(--stock-3);
  --bs-btn-active-border-color: var(--mark); --bs-btn-active-color: var(--type);
  --bs-btn-disabled-color: var(--faint); --bs-btn-disabled-border-color: var(--rule);
}
.btn-outline-danger {
  --bs-btn-color: var(--bad); --bs-btn-border-color: rgba(255,107,107,.32);
  --bs-btn-hover-bg: rgba(255,107,107,.12); --bs-btn-hover-border-color: var(--bad);
  --bs-btn-hover-color: var(--bad);
}
.btn-ghost {
  background: none; border: 1px solid transparent; color: var(--dim);
  border-radius: var(--bs-border-radius-sm); padding: .25rem .5rem; font-size: .8125rem;
  white-space: nowrap;
}
.btn-ghost:hover { color: var(--type); background: var(--stock-2); }

/* --- header -------------------------------------------------------------- */
/* Opaque, not translucent: a sticky bar with `backdrop-filter` re-blurs the
   whole page behind it on every scroll frame, which is what made scrolling
   stutter. The bar is its own paint layer instead. */
.topbar {
  position: sticky; top: 0; z-index: 1030; background: var(--ink);
  border-bottom: 1px solid var(--rule); contain: paint;
}
.wordmark { font-weight: 700; font-size: 1rem; letter-spacing: -.04em; }
.wordmark::first-letter { color: var(--mark); }
/* Every control is hit-testable over its whole plate, never just its glyphs:
   the padding here is the click target, and the active rule sits under it. */
.navlink {
  background: none; border: 0; color: var(--dim); font-size: .8125rem; font-weight: 600;
  padding: .45rem .625rem; border-radius: .375rem .375rem 0 0;
  border-bottom: 2px solid transparent;
}
.navlink:hover { color: var(--type); background: var(--stock); }
.navlink.active { color: var(--type); border-bottom-color: var(--mark); }
.libpath { font-size: .6875rem; color: var(--faint); }

/* --- chips & pills ------------------------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: .2rem;
  font-family: var(--font-mono); font-size: .625rem; letter-spacing: .04em;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
  border: 1px solid var(--rule); border-radius: .25rem; padding: 0 .3rem; line-height: 1.5;
}
.chip.warn  { color: var(--hold);  border-color: rgba(232,180,74,.4); }
.chip.good  { color: var(--proof); border-color: rgba(91,214,138,.4); }
.chip.flip  { color: var(--mark);  border-color: rgba(242,65,140,.45); }
.pill {
  display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px;
  padding: .1rem .55rem; font-size: .6875rem; font-weight: 600; white-space: nowrap;
}
.pill.done    { background: rgba(91,214,138,.14); color: var(--proof); }
.pill.skipped { background: rgba(232,180,74,.14); color: var(--hold); }
.pill.ready   { background: var(--mark-dim); color: var(--mark); }
.pill.waiting { background: var(--stock-2); color: var(--dim); }

/* --- contact sheet (library) --------------------------------------------- */
.toolbar {
  display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
  padding: var(--s2); background: var(--stock); border: 1px solid var(--rule);
  border-radius: var(--bs-border-radius);
}
.toolbar .form-control, .toolbar .form-select { height: 2rem; font-size: .8125rem; }
.seg { display: inline-flex; background: var(--stock-2); border: 1px solid var(--rule); border-radius: .375rem; padding: 2px; }
.seg button {
  background: none; border: 0; color: var(--dim); font-size: .75rem; font-weight: 600;
  padding: .15rem .5rem; border-radius: .25rem; line-height: 1.5;
}
.seg button:hover { color: var(--type); }
.seg button.on { background: var(--stock-3); color: var(--type); }

/* a per-stage tally of the whole library — what is blocked, what can print */
.tally { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s5); align-items: flex-end; }
.tally .cell { min-width: 5.5rem; }
.tally .cell .n { font-family: var(--font-mono); font-size: 1.375rem; letter-spacing: -.03em; }
.tally .cell .of { font-size: .75rem; color: var(--faint); }
.tally .bar { height: 3px; border-radius: 2px; background: var(--rule); margin-top: .3rem; overflow: hidden; display: flex; }
.tally .bar i { display: block; height: 100%; }
.tally .bar i.d { background: var(--proof); }
.tally .bar i.s { background: var(--hold); opacity: .6; }

.sheetgrid { display: grid; gap: var(--s5) var(--s4); }
.sheetgrid.sm { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.sheetgrid.md { grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); }
.sheetgrid.lg { grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); }
/* a real <a href="/card/…"> so the tile is linkable (open in a new tab, copy
   link), intercepted for same-tab clicks by the router */
.slot {
  position: relative; cursor: pointer; background: none; border: 0; padding: 0;
  text-align: left; display: block; color: inherit; text-decoration: none;
}
.slot .shot {
  width: 100%; aspect-ratio: 63/88; object-fit: cover; display: block;
  background: var(--stock-2); border: 1px solid var(--rule);
  border-radius: var(--card-radius);
}
.slot:hover .shot { border-color: rgba(242,65,140,.5); }
.slot.picked .shot { border-color: var(--mark); box-shadow: 0 0 0 2px var(--mark-dim); }
.slot .cardname {
  font-weight: 600; font-size: .8125rem; margin-top: var(--s2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slotmeta { display: flex; align-items: center; gap: .375rem; margin-top: .125rem; min-width: 0; }
.slotmeta .id { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); }
/* the checkbox only appears on hover, or once a selection exists — the grid is
   a contact sheet first and a work queue second */
.slot .pick {
  position: absolute; top: .4rem; left: .4rem; z-index: 2; opacity: 0;
  transition: opacity .1s ease;
  background-color: rgba(12,12,16,.7); border-color: var(--type);
  box-shadow: 0 0 0 3px rgba(12,12,16,.55);
}
.slot .pick:checked { background-color: var(--mark); border-color: var(--mark); }
.slot:hover .pick, .slot.picked .pick, body.picking .slot .pick { opacity: 1; }
.sheetgrid.sm .cardname, .sheetgrid.sm .strip { display: none; }

/* stage strip: one tick per stage — the card's state at a glance */
.strip { display: flex; gap: 2px; }
.tick { width: 15px; height: 3px; border-radius: 2px; background: var(--rule); }
.tick.done { background: var(--proof); }
.tick.skipped { background: var(--hold); opacity: .55; }

.actionbar {
  position: fixed; left: 50%; bottom: var(--s4); transform: translateX(-50%);
  z-index: 1040; width: min(calc(100vw - 2rem), 64rem);
  display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
  padding: var(--s2) var(--s3); background: var(--stock-2);
  border: 1px solid var(--rule-2); border-radius: var(--bs-border-radius);
  box-shadow: 0 12px 36px rgba(0,0,0,.6);
}
.actionbar.armed { border-color: var(--mark); }
/* room for it, so it never sits on top of the last row of whatever it acts on */
body.hasbar { padding-bottom: 4.5rem; }

/* --- console (card detail) ----------------------------------------------- */
.cardgrid {
  display: grid; gap: var(--s4);
  grid-template-columns: minmax(0,1fr);
}
@media (min-width: 992px) {
  .cardgrid { grid-template-columns: 15rem minmax(0,1fr) 21rem; align-items: start; }
  .rail, .steppanel { position: sticky; top: 4.5rem; }
}
.rail { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

/* face tabs — only ever rendered when the card really has two sides */
.faces { display: flex; gap: 2px; padding: 2px; background: var(--stock-2);
  border: 1px solid var(--rule); border-radius: .375rem; }
.faces button {
  flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--dim);
  font-size: .75rem; font-weight: 600; padding: .3rem .4rem; border-radius: .25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.faces button:hover { color: var(--type); }
.faces button.on { background: var(--stock-3); color: var(--type); }
.faces button .fdot { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--rule-2); margin-right: .3rem; vertical-align: middle; }
.faces button.settled .fdot { background: var(--proof); }
.faces button.partial .fdot { background: var(--hold); }

/* filmstrip stepper: the pipeline as pictures. Each row carries the actual
   image that stage produced for the focused side, so the rail *is* the history
   of the card and clicking a frame is how you compare. */
.film { display: flex; flex-direction: column; gap: var(--s2); }
.frame {
  display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
  padding: .375rem .5rem; font: inherit; color: var(--type);
  background: var(--stock); border: 1px solid var(--rule);
  border-radius: .5rem; position: relative;
}
.frame:hover { border-color: var(--rule-2); background: var(--stock-2); }
.frame.current { border-color: var(--mark); background: var(--stock-2); }
.frame .cel {
  flex: 0 0 auto; width: 30px; height: 42px; border-radius: 3px; overflow: hidden;
  background: var(--stock-3); border: 1px solid var(--rule); position: relative;
}
.frame .cel img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* --- skeletons ------------------------------------------------------------
   An <img> that has not decoded yet is an empty box, and an empty box against
   the page reads as a flash. So an image that is still loading is a plate one
   value above its surround with a slow sheen crossing it: the layout is already
   correct (every card box carries its 63:88 aspect), so nothing moves when the
   picture arrives — it simply appears. `prefers-reduced-motion` gets the plate
   without the sheen. */
img.skel { color: transparent; background: var(--stock-3); }
img.skel::after { content: ""; }
.skel, .skelbox {
  background-image: linear-gradient(100deg,
    transparent 20%, rgba(255,255,255,.045) 40%, transparent 60%);
  background-size: 250% 100%;
  background-repeat: no-repeat;
  /* delayed on purpose: an image that arrives from cache within a frame or two
     should never show a loading state at all */
  animation: sheen 1.4s ease-in-out .2s infinite;
}
@keyframes sheen {
  from { background-position: 160% 0; }
  to   { background-position: -60% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .skel, .skelbox { animation: none; }
}
.frame .cel .no {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: .625rem; color: var(--faint);
}
.frame .who { flex: 1 1 auto; min-width: 0; }
.frame .who b { display: block; font-weight: 600; font-size: .8125rem; }
.frame .who span { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); }
.frame.skipped .who b { color: var(--dim); text-decoration: line-through; }
.frame.waiting { opacity: .5; }
.frame .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--rule-2); }
.frame.done .dot { background: var(--proof); }
.frame.skipped .dot { background: var(--hold); }
.frame.ready .dot { background: var(--mark); box-shadow: 0 0 0 3px var(--mark-dim); }

/* --- proof viewer -------------------------------------------------------- */
/* The proof is as large as the space allows: bounded by its column's width and
   by the viewport height, whichever runs out first. There is no lightbox — this
   *is* the full view. */
.stage { display: flex; flex-direction: column; align-items: center; gap: var(--s3); }
.proof {
  width: 100%;
  /* height-bounded as well as width-bounded, so the whole card is always on
     screen — there is no second, larger view to fall back on */
  max-width: min(100%, calc((100vh - 13rem) * 63 / 88));
  margin: 0 auto;
}
.viewer {
  position: relative; width: 100%; aspect-ratio: 63/88;
  background: var(--stock-2); border: 1px solid var(--rule);
  border-radius: var(--card-radius); overflow: hidden;
}
/* while aligning, the corners are image data you are measuring against and must
   not be clipped away — and the ghost trim needs to overflow the frame */
.viewer.aligning {
  border-radius: .25rem; overflow: visible;
  /* the ghost trim is drawn *outside* the frame on purpose, so the column leaves
     room for it rather than letting it cross the caption underneath */
  margin-bottom: 2rem;
}
/* an INPUT, not this step's output: the image stays at full colour and full
   brightness — you cannot judge a grade or place a border on a dimmed card —
   and the fact is stated in the chrome around it instead. */
.viewer.is-input { border-style: dashed; border-color: var(--rule-2); }
.stageimg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  display: block;
}
.viewer .empty {
  position: absolute; inset: 0; display: grid; place-items: center; gap: var(--s2);
  color: var(--dim); font-size: .8125rem; text-align: center; padding: var(--s5);
}
/* what you are looking at, above the card, never on top of it — and no wider
   than the card, so its right-aligned note stays next to the thing it is about.
   Its height is FIXED: the compare tool's blend slider appears and disappears in
   here, and the card must not move an inch when it does. */
.plate {
  display: flex; align-items: center; gap: var(--s2); flex-wrap: nowrap;
  width: 100%; height: 2.25rem;
  max-width: min(100%, calc((100vh - 13rem) * 63 / 88));
}
.plate .what {
  font-size: .75rem; color: var(--dim);
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plate .what b { color: var(--type); font-weight: 600; }

/* --- compare: a tool you turn on, not the default ------------------------
   Off, the viewer simply shows the step's output. Wipe clips the output over
   the input along a draggable split; fade cross-dissolves the two. The modes
   are mutually exclusive — one question ("how do these two differ?"), two ways
   of answering it, never both at once. */
.cmp { position: absolute; inset: 0; z-index: 3; }
.cmp .over { position: absolute; inset: 0; }
.cmp .over img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cmp .bar {
  position: absolute; top: 0; bottom: 0; width: 20px; margin-left: -10px;
  cursor: ew-resize; touch-action: none; z-index: 4;
}
.cmp .bar::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 9px; width: 2px;
  background: var(--mark);
}
.cmp .bar::after {
  content: "‹ ›"; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-family: var(--font-mono); font-size: .625rem; font-weight: 700;
  color: #16050d; background: var(--mark); border-radius: 3px;
  padding: .1rem .25rem; letter-spacing: -.05em;
}
.cmp .tag {
  position: absolute; top: .5rem; font-family: var(--font-mono); font-size: .625rem;
  text-transform: uppercase; letter-spacing: .06em; color: var(--type);
  background: rgba(12,12,16,.78); border-radius: .25rem; padding: .1rem .35rem;
}
.cmp .tag.l { left: .5rem; }
.cmp .tag.r { right: .5rem; }

/* the fade's blend slider — mono, thin, magenta, like every other control.
   Shrinkable, and zero-margin so it never adds to the plate's height. */
.blend { flex: 0 1 9rem; min-width: 3.5rem; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
  margin: 0; display: block; background: none; cursor: ew-resize;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px; background: var(--rule-2); border-radius: 1px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
  margin-top: -5px; border-radius: 2px; background: var(--mark);
  border: 1px solid #16050d;
}
input[type="range"]:focus-visible::-webkit-slider-thumb { background: #fff; }

/* --- frame-align overlay -------------------------------------------------
   Drag the four rules onto the card's real inner border edge. The marks are the
   only magenta here; the cyan ghost is the *result* — where the trim will land
   and how thick the target border is — so control and measurement never read as
   the same thing. */
.alignlayer { position: absolute; inset: 0; z-index: 5; }
.al-work { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
/* the trim the fit will produce, and the border it is aiming at */
.al-ghost { position: absolute; z-index: 6; pointer-events: none; border: 1px dashed var(--reg); }
.al-band {
  position: absolute; z-index: 6; pointer-events: none;
  border: 0 solid var(--reg-dim); background: none;
}
.al-band i { position: absolute; inset: 0; outline: 1px solid rgba(34,201,214,.5); }

/* a mark: one hairline at constant width, plus two grips placed a quarter and
   three quarters along it — clear of the corners, where the border you are
   measuring actually is. Nothing thickens on hover; the grips are the target. */
.al-line { position: absolute; z-index: 7; touch-action: none; }
.al-line::before { content: ""; position: absolute; background: var(--mark); }
.al-line.top, .al-line.bottom { left: 0; right: 0; height: 18px; margin-top: -9px; }
.al-line.left, .al-line.right { top: 0; bottom: 0; width: 18px; margin-left: -9px; }
.al-line.top::before, .al-line.bottom::before { left: 0; right: 0; top: 8.5px; height: 1px; }
.al-line.left::before, .al-line.right::before { top: 0; bottom: 0; left: 8.5px; width: 1px; }
.al-line.sel::before { background: #fff; }
.al-grip {
  position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
  background: var(--mark); border: 1px solid #16050d; border-radius: 2px;
}
.al-line.top .al-grip, .al-line.bottom .al-grip { top: 9px; cursor: ns-resize; }
.al-line.left .al-grip, .al-line.right .al-grip { left: 9px; cursor: ew-resize; }
.al-line.sel .al-grip { background: #fff; }
.al-tag {
  position: absolute; white-space: nowrap;
  font-family: var(--font-mono); font-size: .5625rem; font-weight: 700;
  color: var(--mark); background: rgba(12,12,16,.8); border-radius: 2px; padding: 0 .2rem;
}
.al-line.top .al-tag    { top: -6px;  left: 50%; transform: translateX(-50%); }
.al-line.bottom .al-tag { top: 14px;  left: 50%; transform: translateX(-50%); }
.al-line.left .al-tag   { left: 14px; top: 50%;  transform: translateY(-50%); }
.al-line.right .al-tag  { right: 14px; top: 50%; transform: translateY(-50%); }

/* the loupe: source pixels at 6×, parked in the page corner furthest from the
   pointer so it never covers the edge you are aiming at */
#loupe {
  position: fixed; z-index: 1060; width: 168px; pointer-events: none;
  background: var(--stock); border: 1px solid var(--rule-2);
  border-radius: .5rem; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
}
#loupe canvas { display: block; width: 156px; height: 156px; border-radius: .25rem; background: #000; }
#loupe .rd {
  display: flex; justify-content: space-between; gap: var(--s2);
  font-family: var(--font-mono); font-size: .6875rem; padding: .3rem .1rem 0;
}
#loupe .rd b { color: var(--mark); }

.readout { display: grid; grid-template-columns: 1fr auto; gap: .125rem .75rem; }
.readout dt { font-size: .6875rem; font-weight: 400; color: var(--dim); }
.readout dd {
  margin: 0; font-family: var(--font-mono); font-size: .75rem;
  font-variant-numeric: tabular-nums; text-align: right;
}
/* four per-edge number fields, laid out like the edges they set */
.edges { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s2); }
.edges label { font-family: var(--font-mono); font-size: .625rem; color: var(--dim); display: block; }
.edges .form-control { height: 1.75rem; font-size: .75rem; font-family: var(--font-mono); }

/* --- step settings ------------------------------------------------------- */
/* every step shows its settings from the moment you focus it — there are no
   modes to enter and nothing to click through */
.setting { display: grid; grid-template-columns: minmax(6.5rem, 38%) 1fr; gap: var(--s2); align-items: center; }
.setting > label { font-size: .75rem; color: var(--dim); }
.setting .form-select, .setting .form-control { height: 2rem; font-size: .8125rem; }
.settings { display: flex; flex-direction: column; gap: var(--s3); }
.settings .opt { display: flex; flex-direction: column; gap: .2rem; }
.settings .opt .why { font-size: .6875rem; color: var(--faint); line-height: 1.4; }

/* --- card data (what the provider says) -----------------------------------
   A reference sheet, not a form: labels are micro-caps, every value is mono
   (this app measures), and rules/flavour prose gets its own block so it reads
   as text instead of a table cell. Column count follows the width. */
/* Balanced columns of independent stacks, filled in JS: CSS multi-column
   relayouts its whole flow as the page repaints (the scroll stutter) and a
   plain auto-fill grid leaves holes where groups differ in height. */
.facts { display: grid; gap: 0 var(--s5); align-items: start; }
.factcol { min-width: 0; }
.factgroup { margin-bottom: var(--s4); }
.factgroup > .eyebrow { display: block; padding-bottom: .3rem; border-bottom: 1px solid var(--rule); }
.factrow {
  display: grid; grid-template-columns: minmax(5.5rem, 40%) 1fr; gap: var(--s2);
  padding: .22rem 0; border-bottom: 1px solid rgba(35,35,46,.6);
}
.factrow .flabel, .factblock .flabel { font-size: .6875rem; color: var(--dim); }
.factrow .fval {
  font-family: var(--font-mono); font-size: .75rem; text-align: right;
  overflow-wrap: anywhere;
}
.factblock { padding: .35rem 0; border-bottom: 1px solid rgba(35,35,46,.6); }
.factblock p { margin: .1rem 0 0; font-size: .75rem; line-height: 1.5; white-space: pre-wrap; }
.linkrow { display: flex; flex-wrap: wrap; gap: .375rem; }

/* --- related cards ------------------------------------------------------- */
.rels { display: flex; flex-direction: column; gap: 2px; }
.rel {
  display: flex; align-items: center; gap: var(--s2);
  padding: 2px 0; min-width: 0; font-size: .8125rem;
}
.rel .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
.rel .mono { font-size: .6875rem; }

/* --- small data tables (frame specs) ------------------------------------- */
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.tbl th {
  text-align: left; font-size: .625rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); font-weight: 600; padding: 0 var(--s2) 4px 0; white-space: nowrap;
}
.tbl td { padding: 4px var(--s2) 4px 0; border-top: 1px solid var(--rule); white-space: nowrap; }

/* --- the keyboard sheet --------------------------------------------------- */
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: var(--s2) var(--s5); }
.keyrow { display: flex; align-items: baseline; gap: var(--s2); font-size: .8125rem; }
.keyrow kbd {
  font: 600 .6875rem/1 ui-monospace, monospace; padding: 3px 5px; border-radius: 3px;
  background: var(--stock-3); border: 1px solid var(--rule-2); color: var(--type);
  white-space: nowrap;
}
.keyrow span { color: var(--dim); }

/* --- search results ------------------------------------------------------ */
.results { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
.hit { position: relative; display: block; cursor: pointer; }
.hit img {
  width: 100%; aspect-ratio: 63/88; object-fit: cover; background: var(--stock-2);
  border: 1px solid var(--rule); border-radius: var(--card-radius);
}
.hit input { position: absolute; top: .5rem; left: .5rem; z-index: 2; }
.hit.have img { border-color: var(--proof); }
.hit .hitmeta { font-size: .6875rem; color: var(--dim); margin-top: .375rem; line-height: 1.4; }
.hit .hitmeta b { color: var(--type); font-size: .75rem; }

/* --- settings screen ----------------------------------------------------- */
.setgrid { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 992px) { .setgrid { grid-template-columns: 13rem minmax(0,1fr); } }
.secnav { display: flex; flex-direction: column; gap: 2px; }
@media (min-width: 992px) { .secnav { position: sticky; top: 4.5rem; } }
.secnav button {
  text-align: left; background: none; border: 0; color: var(--dim);
  font-size: .8125rem; font-weight: 600; padding: .4rem .625rem;
  border-radius: .375rem; border-left: 2px solid transparent;
}
.secnav button:hover { color: var(--type); background: var(--stock); }
.secnav button.on { color: var(--type); background: var(--stock-2); border-left-color: var(--mark); }
.secnav button .cnt { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); float: right; }

/* a settings panel is prose plus a control: capped at a comfortable measure so
   the explanation and the field it belongs to stay next to each other */
#secbody > .panel { max-width: 58rem; }
.field { display: grid; gap: var(--s2) var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
@media (min-width: 768px) { .field { grid-template-columns: 1fr 15rem; align-items: start; } }
.field:last-child { border-bottom: 0; }
.field .lbl { font-size: .8125rem; font-weight: 600; }
.field .why { font-size: .75rem; color: var(--dim); margin: .15rem 0 0; line-height: 1.45; }
.field .key { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); margin-top: .2rem; }
.field .ctl { display: flex; align-items: center; gap: var(--s2); }
.field .ctl .form-control, .field .ctl .form-select { height: 2rem; font-size: .8125rem; }
.field .unit { font-family: var(--font-mono); font-size: .6875rem; color: var(--faint); }
.field.dirty { box-shadow: inset 2px 0 0 var(--mark); padding-left: var(--s3); margin-left: calc(var(--s3) * -1); }


/* --- sheet dialog: pick the side of every two-sided card ----------------- */
/* ---------- sheet builder ------------------------------------------------- */
.sheetgrid { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 1200px) { .sheetgrid { grid-template-columns: minmax(0,1fr) 23rem; }
  .sheetgrid > div:last-child { position: sticky; top: 4.5rem; align-self: start; } }
/* a copies stepper: − N + as one control, so the count reads as a quantity */
.stepn { display: inline-flex; align-items: stretch; border: 1px solid var(--rule);
  border-radius: .375rem; overflow: hidden; background: var(--stock-2); }
.stepn button { background: none; border: 0; color: var(--dim); width: 1.5rem;
  font-size: .875rem; line-height: 1; }
.stepn button:hover { color: var(--type); background: var(--stock-3); }
.stepn input { width: 2.25rem; text-align: center; background: none; border: 0;
  color: var(--type); font-size: .75rem; padding: .25rem 0; }
.stepn input:focus-visible { outline: 2px solid var(--mark); outline-offset: -2px; }
/* the card pool: small, dense, and unmistakably clickable */
.pool { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr));
  max-height: 22rem; overflow: auto; }
.poolcard { display: flex; flex-direction: column; gap: 2px; padding: var(--s1);
  background: var(--stock-2); border: 1px solid var(--rule); border-radius: .375rem;
  text-align: left; }
.poolcard:hover { border-color: var(--mark); }
.poolcard.notready { opacity: .55; }
.poolcard img { width: 100%; aspect-ratio: 63/88; object-fit: cover; border-radius: 2px;
  background: var(--stock-3); }
.poolcard .nm { font-size: .6875rem; color: var(--type); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.poolcard .mono { font-size: .5625rem; color: var(--faint); }

/* ---------- calibration -------------------------------------------------- */
.calgrid { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 768px) { .calgrid { grid-template-columns: 12rem minmax(0,1fr); } }
/* the sheet, as it really is: which slots hold a round and where the next goes */
.slotmap { display: grid; gap: 3px; max-width: 11rem; }
.slot { aspect-ratio: 1200/1350; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  border: 1px dashed var(--rule); border-radius: 3px; background: var(--stock-2); }
.slot b { font-size: .875rem; color: var(--faint); line-height: 1; }
.slot .mono { font-size: .5625rem; color: var(--faint); }
.slot.used { border-style: solid; border-color: var(--rule-2); background: var(--stock-3); }
.slot.used b { color: var(--type); }
/* cyan is measurement in this UI, and the next slot is where one will be taken */
.slot.next { border-color: var(--reg); border-style: solid; }
.slot.next b { color: var(--reg); }
/* the convergence trail — the whole point of iterating, so it is a picture */
.trend { display: flex; align-items: flex-end; gap: var(--s2); height: 4.5rem; }
.tbar { flex: 0 0 2.5rem; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; height: 100%; gap: 2px; }
.tbar i { display: block; width: 100%; background: var(--mark); border-radius: 2px 2px 0 0; }
.tbar .mono { font-size: .5625rem; color: var(--faint); }
.profline { border: 1px solid var(--rule); border-radius: .375rem; padding: var(--s2);
  display: flex; flex-direction: column; gap: var(--s1); }
.recipe { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
img.proof { width: 100%; max-width: 32rem; border: 1px solid var(--rule); border-radius: .25rem; }

.picklist { max-height: 15rem; overflow: auto; border: 1px solid var(--rule); border-radius: .375rem; }
.pickrow {
  display: flex; align-items: center; gap: var(--s2); padding: .375rem var(--s2);
  border-bottom: 1px solid var(--rule);
}
.pickrow:last-child { border-bottom: 0; }
.pickrow img { width: 24px; height: 34px; object-fit: cover; border-radius: 2px; background: var(--stock-3); }
.pickrow .nm { flex: 1 1 auto; min-width: 0; font-size: .75rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }

/* --- overlays ------------------------------------------------------------ */
.modal-content, .toast, .dropdown-menu { background: var(--stock); border-color: var(--rule); }
.toast { --bs-toast-bg: var(--stock); }
#busy {
  position: fixed; inset: 0; z-index: 1080; display: none;
  place-items: center; background: rgba(10,10,13,.6);
}
#busy.on { display: grid; }
.spinner-border { color: var(--mark); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>

<header class="topbar">
