    </div>
    <div class="vstack gap-3">
      <div class="drop" id="impdrop">
        <div class="big mb-1">Drop a folder or files here</div>
        <p class="hint mb-3">${esc(impMeta().suffixes.join(' '))} — anything else is left alone.</p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <label class="btn btn-sm btn-primary mb-0">Choose a folder
            <input type="file" hidden webkitdirectory multiple onchange="impPick(this)"></label>

/* **What the screen said before you had dropped anything: nothing.** You found out
   what a filename had to look like *after* choosing 200 files and reading a table of

   the flow and the naming rule are stated up front, and they disappear once there

function impHelp(){
  if(IMP().rows.length) return '';

            folder is the usual one. Anything that is not a card image is left alone.</li>
          <li><b>Check the table.</b> proxdex reads each file's card, stage and side

          <li><b>Fix what is marked, then Import.</b> Amber rows are the ones it will

        <div class="eyebrow mb-2">What a name tells it</div>
        <table class="hint mb-2" style="width:100%">
          <tr><td class="mono">${esc(id)}.png</td><td>the card, filed as its original</td></tr>
          <tr><td class="mono">${esc(id)}_1_original.png</td><td>proxdex's own name —
            reads back exactly</td></tr>
          <tr><td class="mono">${esc(id)}…_upscayl.png</td><td><span class="mono">upscayl</span>
            in the name means the upscaled stage</td></tr>
          <tr><td class="mono">${esc(id)}…_f2.png</td><td><span class="mono">_f2</span>
            is the second side of a two-sided card</td></tr>

/* A dropped *folder* arrives as directory entries, not files, so it has to be
   walked. Without this the whole point — "drop the Upscayl output folder" —
   silently drops nothing. */
function armDrop(){
  const zone = $('#impdrop'); if(!zone) return;
  zone.ondragover = ev => { ev.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = async ev => {
    ev.preventDefault();
    zone.classList.remove('over');
    const items = [...(ev.dataTransfer.items || [])]
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    const found = items.length ? await walkEntries(items) : [...ev.dataTransfer.files];
    impAdd(found);
  };
}
async function walkEntries(entries){
  const out = [];
  for(const e of entries){
    if(e.isFile){
      out.push(await new Promise(res => e.file(res, () => res(null))));
    } else if(e.isDirectory){
      const reader = e.createReader();
      // readEntries hands back a page at a time, so it is called until it is empty
      for(;;){
        const page = await new Promise(res => reader.readEntries(res, () => res([])));
        if(!page.length) break;
        out.push(...await walkEntries(page));
      }
    }
  }
  return out.filter(Boolean);
}
function impPick(input){
  impAdd([...input.files]);
  input.value = '';        // so choosing the same folder again re-adds it
}
/* Take on files, keeping only what proxdex would accept as a card image and
   saying how many were left behind — a folder has .DS_Store and a notes.txt in
   it, and silently ignoring them looks like losing them. */
function impAdd(files){
  const ok = impMeta().suffixes;
  const keep = files.filter(f => ok.some(s => f.name.toLowerCase().endsWith(s)));
  IMP().ignored += files.length - keep.length;
  const have = new Set(IMP().rows.map(r => r.name));
  for(const file of keep){
    if(have.has(file.name)) continue;      // the same name twice is the same file
    IMP().rows.push({file, name:file.name, url:URL.createObjectURL(file),
                     id:null, game:null, stage:null, face:null, result:null});
  }
  IMP().done = null;
  planImport();
}
/* **A set code plus the number already in the filename.** The one bulk edit that was
   missing: a scan folder is full of `4.png` and `12.png`, and typing `base1-4`,
   `base1-12` … by hand is the whole cost of importing them. It only touches rows that
   have no id yet and whose name carries a number — a row it cannot build an id for is
   left exactly as it was rather than given a wrong one, which is the same call
   `imports.plan` makes about a guessed id. */
const _NUM = /(\d+[a-z]?)(?=\.[^.]+$|_|$)/i;
function impNumbered(){
  const pre = IMP().prefix.trim();
  if(!pre) return [];
  return IMP().rows.filter(r => !r.id && _NUM.test(r.name));
}
function impPrefix(text){
  IMP().prefix = text;
  // only the button's own label and disabled state depend on this — a full repaint
  // would replace the input under the cursor and drop focus mid-word
  const btn = $('#imp_apply');
  if(!btn) return;
  const n = impNumbered().length;
  btn.textContent = `Apply to ${n}`;
  btn.disabled = !(text.trim() && n);
}
function impApplyPrefix(){
  const pre = IMP().prefix.trim().replace(/-+$/, '');
  if(!pre) return;
  let n = 0;
  for(const row of IMP().rows){
    if(row.id) continue;
    const m = _NUM.exec(row.name);
    if(!m) continue;
    row.id = `${pre}-${m[1]}`;
    n++;
  }
  toast(n ? `Set an id on ${n} row(s)` : 'No filename carried a number to use');
  planImport();
}
function impOnlyBlocked(on){ IMP().only_blocked = on; paintImport(); }

function impClear(){
  for(const r of IMP().rows) URL.revokeObjectURL(r.url);
  Object.assign(IMP(), {rows:[], plan:null, ignored:0, find:null, done:null, at:0,
                        results:undefined, only_blocked:false});
  renderImport();
}
function impDrop(i){
  const [gone] = IMP().rows.splice(i, 1);
  if(gone) URL.revokeObjectURL(gone.url);
  if(IMP().find === i) IMP().find = null;
  planImport();
}
/* Every row that landed, out of the list. Called after a run — see `runImport` for
   why. The object URLs are revoked like `impDrop` does (each one holds the file's
   bytes alive in the browser, and a folder of two hundred scans is not small), and
   `find` is cleared rather than re-indexed: it is a row *index* into the list about to
   be rewritten, so the only safe answer is to close the finder. */
function dropFiled(){
  const keep = [];
  for(const row of IMP().rows){
    if(row.result && row.result.ok) URL.revokeObjectURL(row.url);
    else keep.push(row);
  }
  if(keep.length === IMP().rows.length) return;
  IMP().rows = keep;
  IMP().find = null;
}

/* Every edit re-asks the server what the run would do. Debounced, because it is
   answered while you are still typing an id. */
let _impTimer;
function planImport(){
  clearTimeout(_impTimer);
  if(!IMP().rows.length){ IMP().plan = null; paintImport(); return; }
  IMP().planning = true;
  paintImport();
  _impTimer = setTimeout(async () => {
    try{
      const r = await fetch('/api/import/plan', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({on_existing: IMP().on_existing, items: IMP().rows.map(row => {
          const item = {name: row.name};
          // only what the user decided travels: an absent key means "whatever
          // the filename says", which is the CLI's no-flag case
          if(row.id) item.id = row.id;
          if(row.game) item.game = row.game;
          if(row.stage) item.stage = row.stage;
          if(row.face) item.face = row.face;
          return item;
        })}),
      });
      IMP().plan = r.ok ? await r.json() : null;
      if(!r.ok) toast('The plan could not be worked out\n' + tail(await r.text()), 9000);
    } catch(e){ IMP().plan = null; }
    IMP().planning = false;
    paintImport();
  }, 200);
}
function impSet(i, key, value){
  IMP().rows[i][key] = value || null;
  planImport();
}
/* Accept the id the filename suggested. That is not cosmetic: a *guessed* id can
   never create a card folder, and this is the confirmation that lets it —
   exactly what typing `--id` on the CLI means. */
function impConfirm(i){
  const at = IMP().plan && IMP().plan.items[i];
  if(at && at.id) impSet(i, 'id', at.id);
}
function impSetAll(key, value){
  if(!value) return;
  for(const r of IMP().rows) r[key] = value;
  planImport();
}
function impOnExisting(value){ IMP().on_existing = value; planImport(); }

function impRow(row, i, at, stages){
  const d = at ? at.disposition : '';
  const sent = row.result;
  const verdict = sent
    ? `<span class="disp ${sent.ok ? 'ok' : 'fail'}">${sent.ok ? 'filed' : 'failed'}</span>`
    : `<span class="disp ${dispClass(d)}">${esc(d || '…')}</span>`;
  const why = sent && !sent.ok ? tail(sent.log) : (at ? at.reason : '');
  const known = at && at.card_name ? at.card_name : '';
  return `
    <tr class="${at && at.disposition === 'skip' ? 'gone' : ''}">
      <td><img class="pv" alt="" src="${esc(row.url)}"></td>
      <td><div class="fname">${esc(row.name)}</div></td>
      <td>
        <input class="form-control form-control-sm mono" style="width:8.5rem"
               placeholder="${esc(at && at.id ? at.id : 'card id')}"
               value="${esc(row.id || '')}" oninput="impSet(${i}, 'id', this.value.trim())">
        <div class="why">${known ? esc(known)
          : (at && at.guessed_id && at.id ? 'from the filename' : '')}</div>
      </td>
      <td><select class="form-select form-select-sm" style="width:7.5rem"
                  onchange="impSet(${i}, 'stage', this.value)">
        ${stages.map(s => `<option ${(row.stage || (at && at.stage)) === s ? 'selected' : ''}
          >${esc(s)}</option>`).join('')}</select></td>
      <td><select class="form-select form-select-sm" style="width:5.5rem"
                  onchange="impSet(${i}, 'face', +this.value)">
        ${[1, 2].map(f => `<option value="${f}" ${(row.face || (at && at.face) || 1) === f
          ? 'selected' : ''}>${f === 1 ? 'front' : 'back'}</option>`).join('')}</select></td>
      <td>${verdict}<div class="why">${esc(why || '')}</div>
        ${at && at.discards.length ? `<div class="why" style="color:var(--hold)"
          >↳ discards ${esc(at.discards.join(', '))}</div>` : ''}</td>
      <td class="text-end text-nowrap">
        ${at && at.disposition === 'missing'
          ? `<button class="btn btn-sm btn-ghost mono" onclick="impConfirm(${i})"
               title="Take the id from the filename and let the import look the card up"
               >use ${esc(at.id)}</button>` : ''}
        ${at && (at.disposition === 'unmatched' || at.disposition === 'missing')
          ? `<button class="btn btn-sm btn-ghost" onclick="impFind(${i})">Find…</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="impDrop(${i})"
                title="Leave this file out">×</button>
      </td>
    </tr>`;
}

/* Finding the card a file is of. It is the same `/api/search` the Search screen
   uses; picking a hit writes its id into the row, which is what turns a guess
   into a confirmed id the import may create a folder for. */
function impFind(i){
  IMP().find = i;
  IMP().results = undefined;
  // the query lives in state, not in the input: every repaint rebuilds the
  // panel, and a value only the DOM knew would be wiped by the first one
  IMP().q = impQuery(IMP().rows[i].name);
  doImpSearch();
  const q = $('#impq');
  if(q) q.focus();
}
/* A filename, as a search: drop the extension, the stage words proxdex writes
   and the punctuation a scanner leaves behind. */
function impQuery(name){
  return name.replace(/\.[a-z0-9]+$/i, '')
    .replace(/\b(upscayl|realesrgan|original|bordered|upscaled|edited|\d+x|f2)\b/gi, ' ')
    .replace(/[_\-.()\[\]0-9]+/g, ' ').trim();
}
function impFinder(i){
  const row = IMP().rows[i];
  const hits = IMP().results;
  return `
    <div class="panel p-3 mt-3">
      <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
        <div class="eyebrow">Which card is <span class="mono">${esc(row.name)}</span>?</div>
        <button class="btn btn-sm btn-ghost ms-auto" onclick="impFindClose()">Close</button>
      </div>
      <div class="d-flex gap-2 mb-3 flex-wrap">
        <select class="form-select form-select-sm" style="width:10rem" id="impgame"
                onchange="doImpSearch()">
          ${state.meta.games.map(g => `<option value="${esc(g.id)}"
            ${g.id === (row.game || state.meta.default_game) ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
        </select>
        <input class="form-control form-control-sm" style="max-width:20rem" id="impq"
               placeholder="Card name" value="${esc(IMP().q)}"
               oninput="state.imp.q = this.value"
               onkeydown="if(event.key==='Enter')doImpSearch()">
        <button class="btn btn-sm btn-outline-secondary" onclick="doImpSearch()">Search</button>
      </div>
      ${hits === undefined ? '<p class="hint mb-0">Searching…</p>'
        : hits === null ? `<p class="hint mb-0" style="color:var(--bad)">That search did
            not come back in a shape this panel understands — the console log will say
            why. The Search screen uses the same query.</p>`
        : hits.length
        ? `<div class="results">${hits.slice(0, IMP_HITS).map(x => `
            <button class="hit" style="border:0;background:none;padding:0;text-align:left"
                    onclick="impChoose(${i}, '${esc(x.id)}', '${esc(x.game)}')">
              <img loading="lazy" decoding="async" alt="${esc(x.name)}"
                   src="${artsrc(x.thumb || x.image, 'card')}">
              <div class="hitmeta"><b>${esc(x.name)}</b><br>${esc(x.set)} ·
                <span class="mono">${esc(x.id)}</span>${x.have ? ' · in library' : ''}</div>
            </button>`).join('')}</div>`
        : '<p class="hint mb-0">No matches. Try fewer words, or the other game.</p>'}
    </div>`;
}
function impFindClose(){ IMP().find = null; IMP().results = undefined; paintImport(); }
/* Two searches can be in flight — the one the panel opened with, and the one you
   typed over it — and the first is the slower query often enough to matter. Only
   the newest may write the results, or an empty first answer lands on top of a
   good second one and the panel says "no matches" about a card it found. */
/* How many hits the finder draws — and now also how many it asks for. */
const IMP_HITS = 24;
let _impSeq = 0;
async function doImpSearch(){
  const g = $('#impgame');
  const row = IMP().rows[IMP().find];
  const game = g ? g.value : (row ? row.game : '') || '';
  const mine = ++_impSeq;
  if(!IMP().q.trim()){ IMP().results = []; paintImport(); return; }
  IMP().results = undefined;
  paintImport();
  let found;
  try{
    /* `items`, because `/api/search` answers with a **page envelope** and not a bare
       list. It used to be a list, and this read `Array.isArray(r) ? r : []` — which
       after the Browse/Search unification made the envelope the shape, was always
       false. So the finder returned nothing for *every* query, silently, for as long
       as the envelope has existed: the panel said "No matches" and there was no error
       anywhere to notice. A reader that treats an unexpected shape as "no results" is
       indistinguishable from a working one that found nothing, which is exactly why
       this hid — so the `null` below is a *third* state and the panel says so. */
    const r = await get('/api/search?' + new URLSearchParams({
      q: IMP().q.trim(), game,
      // the panel draws at most 24, so asking for the default 60 warmed the art of 36
      // cards nobody sees
      per_page: String(IMP_HITS),
    }));
    found = Array.isArray(r?.items) ? r.items : null;
  } catch(e){ found = null; }
  if(mine !== _impSeq) return;      // a newer search has already answered
  IMP().results = found;
  paintImport();
}
function impChoose(i, id, game){
  const row = IMP().rows[i];
  row.id = id; row.game = game;
  IMP().find = null; IMP().results = undefined;
  planImport();
}

/* The import itself: one request per file, in order, so progress is real and a
   failure belongs to a named file instead of the batch. */
async function runImport(){
  const plan = IMP().plan;
  if(!plan || !plan.ready) return;
  if(plan.discards && !await ask(
      `${plan.discards} later-stage image(s) were derived from what you are replacing, ` +
      `and will be removed. Import ${plan.ready} file(s)?`, 'Import')) return;
  const queue = IMP().rows
    .map((row, i) => ({row, at: plan.items[i]}))
    .filter(x => x.at && x.at.writes);
  IMP().running = true; IMP().at = 0; IMP().done = null;
  for(const r of IMP().rows) r.result = null;
  paintImport();
  let filed = 0;
  for(const {row, at} of queue){
    const fd = new FormData();
    fd.append('file', row.file);
    fd.append('id', at.id);
    fd.append('stage', at.stage);
    fd.append('face', String(at.face));
    fd.append('on_existing', IMP().on_existing);
    if(at.game) fd.append('game', at.game);
    try{
      const r = await fetch('/api/import', {method:'POST', body:fd});
      const j = await r.json();
      row.result = {ok: j.ok !== false, log: j.log || ''};
    } catch(e){ row.result = {ok:false, log:String(e)}; }
    if(row.result.ok) filed++;
    IMP().at++;
    paintImport();
  }
  IMP().running = false;
  // the cards that really got a file, not everything attempted — the panel says
  // "n card(s) touched", and a card whose only file failed was not touched
  IMP().done = {
    filed,
    failed: queue.length - filed,
    cards: [...new Set(queue.filter(q => q.row.result?.ok).map(q => q.at.id))],
  };
  /* **A filed row leaves the list**, because the list is what is still *to* import.
     Left in, it re-planned as `replace` (the destination now exists and the default
     `on_existing` is overwrite), so the button went straight back to offering the same
     count — the same files, ready to be imported over themselves. That is how a
     duplicate import happens, and after two folders there was no way to tell what had
     already gone in without reading the log.

     Only the ones that really landed go. A **failed** row stays with its error visible,
     which is the whole point of keeping it — you fix the id and run again — and so do
     blocked and skipped rows, which were never imported at all. The "Just imported"
     panel below still names every card touched, so nothing about the run is lost by
     the rows disappearing. */
  dropFiled();
  // the library changed under us: the contact sheet, the stage tallies and every
  // card's rev all move, so this is a real reload rather than a repaint
  await refresh(true);
  planImport();
  toast(`Imported ${filed} file(s)` + (IMP().done.failed ? `, ${IMP().done.failed} failed` : ''));
}
function impDone(){
  const d = IMP().done;
  if(!d) return '';
  return `
    <div class="panel p-3 mt-3">
      <div class="eyebrow mb-2">Just imported</div>
      <p class="hint mb-2"><b class="mono">${d.filed}</b> file(s) filed${
        d.failed ? `, <span style="color:var(--bad)">${d.failed} failed</span>` : ''} —
        ${d.cards.length} card(s) touched.</p>
      <div class="d-flex gap-2 flex-wrap">${d.cards.map(id => `
        <a class="btn btn-sm btn-ghost mono" href="/card/${encodeURIComponent(id)}"
           onclick="return openCard('${esc(id)}', event)">${esc(id)}</a>`).join('')}</div>
    </div>`;
}

/* ---------- settings -----------------------------------------------------
   A real form: every setting carries its own label, explanation, unit and
   default, all of which come from the Config field itself (/api/config), with
   the raw TOML key kept visible so nothing becomes untraceable. Nothing is
   written until you say so, and the save bar only exists while something is
   actually different. */
/* ---------- frame specs: /frames ----------
   `proxdex frames`, as a screen. Three things live here, and they are three
   different kinds of fact: a *spec* is four border widths, a *rule* says which
   cards take which spec, and *warnings* is everything about this library's frames
   that needs a person to decide. Reads come straight from the library; every
   mutation posts to the CLI, like everywhere else in this app.

   Warnings replaced a coverage report that graded every set that has ever printed,
   and the replacement is not a simplification — the report could not work. MTG's
   border follows the *printing's* frame generation, so a set-level row has no
   printing to read: it called 1046 sets unmeasured while every card in them
   resolves exactly. What is left is four faults, all of them a broken reference or
   a question nothing recorded can answer.

   The preview is still the point of the whole screen: a rule matching on rarity or
   frame generation is a claim about data you cannot see, so it is shown card by
   card before anybody trusts it. */
const framesUi = {tab:'specs', reg:null, game:'', preview:null, busy:false,
                  editing:null, coverage:null, covAll:false, covBusy:false};

async function renderFrames(){
  if(!framesUi.reg){
    $('#main').innerHTML = '<p class="hint">Loading frame specs…</p>';
    try{ framesUi.reg = await get('/api/frames'); }
    catch(e){ $('#main').innerHTML = `<p class="hint">Could not read frame specs: ${esc(''+e)}</p>`; return; }
  }
  const tabs = [['specs','Specs'],['rules','Rules'],['coverage','Coverage'],
                ['warnings','Warnings']];
  $('#main').innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">border widths</div><h5 class="mb-0">Frame specs</h5></div>
      <span class="hint ms-auto" style="max-width:44rem">The border step reshapes a card
        until its printed border matches a spec. One set can need more than one — a
        secret-rare tail is not the same frame as its set's ordinary cards — so rules
        pick per card, and nobody chooses a spec by hand.</span>
    </div>
    <div class="secnav tabbar mb-3">
      ${tabs.map(([k,label]) => `<button class="${framesUi.tab === k ? 'on' : ''}"
        onclick="pickFramesTab('${k}')">${label}</button>`).join('')}
    </div>
    <div id="framesbody"></div>`;
  paintFrames();
}
function pickFramesTab(tab){ framesUi.tab = tab; renderFrames(); }

function paintFrames(){
  const host = $('#framesbody'); if(!host) return;
  const reg = framesUi.reg || {specs:[], rules:[], matches:[], mine:[]};
  if(framesUi.tab === 'rules'){ host.innerHTML = rulesPanel(reg); return; }
  if(framesUi.tab === 'coverage'){ host.innerHTML = coveragePanel(); loadCoverage(); return; }
  if(framesUi.tab === 'warnings'){ host.innerHTML = warningsPanel(reg); return; }
  host.innerHTML = specsPanel(reg);
}

/* ---------- coverage ----------
   *Warnings* is about the cards you hold; this is about the ones you could — so it
   reads the providers' set lists rather than the library, and it is what says whether
   there is anything left to measure at all.

   **Each game is asked the question its own border followed** (`frames.keyed`), and
   that asymmetry is the whole design rather than an inconsistency to tidy away.
   Pokémon's yellow border ran for known runs of sets, so a row is a set and every set
   of the game is asked about. MTG's changed with the printing's *frame generation* — a
   modern set holds retro-frame cards beside modern ones — so a row is a generation, and
   there is deliberately **no per-set verdict**: inventing one is precisely what the
   deleted coverage report did, and it called 1046 sets unmeasured while every card in
   them resolved exactly. The count in the headline is therefore in the game's own unit
   (`Coverage.primary`), which is why MTG reads "5 of 5 frame generations" and not "12 of
   12" — its four set rows are exceptions *to* a generation, listed but not the unit.

   The note under each headline comes from the server, not from here: a reader who does
   not know MTG resolves per printing will read five rows as five sets and conclude the
   opposite of the truth, so the reason travels with the number and says the same
   sentence the CLI prints. */
/* a cell that must stay one line — a fixed table layout does not clip on its own, so
   two spec ids ran straight through the next column. Inline rather than a class: this
   is one stylesheet with no scoping, and a plain word like `.trunc` is exactly how the
   set index's `.setgrid` came to collide with the settings screen's. */
const CLIP = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';

async function loadCoverage(){
  if(framesUi.coverage || framesUi.covBusy) return;
  framesUi.covBusy = true;
  try{ framesUi.coverage = await get('/api/frames/coverage'); }
  catch(e){ framesUi.coverage = {error:'' + e}; }
  framesUi.covBusy = false;
  if(framesUi.tab === 'coverage') paintFrames();
}
function toggleCoverageAll(el){ framesUi.covAll = el.checked; paintFrames(); }
function reloadCoverage(){ framesUi.coverage = null; paintFrames(); }

function coveragePanel(){
  const cov = framesUi.coverage;
  const head = `<div class="panel p-3 mb-3">
    <div class="d-flex gap-2 align-items-baseline flex-wrap mb-2">
      <div class="eyebrow">What has been measured</div>
      <div class="ms-auto d-flex gap-3 align-items-center">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="cov_all"
            ${framesUi.covAll ? 'checked' : ''} onchange="toggleCoverageAll(this)">
          <label class="form-check-label" style="font-size:.8125rem" for="cov_all">
            Show what is covered too</label>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="reloadCoverage()">Refresh</button>
      </div>
    </div>
    <p class="hint mb-0">A printing with no measured spec <b>refuses to be bordered</b> —
      that is the honest answer, since the alternative is reshaping a card to numbers
      nobody took. So this is the list of what to go and measure, and
      <span class="mono">docs/measuring-frames.md</span> says how. Each game is asked the
      question its own border followed: a row is a <b>set</b> for Pokémon and a
      <b>frame generation</b> for Magic, whose border changed with the printing rather
      than the set.</p>
  </div>`;
  if(!cov) return head + '<p class="hint">Reading the set lists…</p>';
  if(cov.error) return head + `<p class="hint">Could not read the set lists: ${esc(cov.error)}</p>`;
  /* the preview lives on this tab too: it is the answer to "what would this set
     actually resolve to?", and a Preview button that painted nothing where you clicked
     it is worse than no button. One `framesUi.preview`, rendered wherever a set is
     listed, so the two tabs cannot show different answers for the same set. */
  return head + (cov.games || []).map(coverageGame).join('')
    + (framesUi.busy ? '<p class="hint">Reading that set&rsquo;s cards…</p>' : '')
    + previewPanel();
}

function coverageGame(g){
  const name = ((state.meta.games || []).find(x => x.id === g.game) || {}).name || g.game;
  if(g.error) return `<div class="panel p-3 mb-3">
    <div class="eyebrow mb-2">${esc(name)}</div>
    <p class="hint mb-0">${esc(g.error)}</p></div>`;
  const bands = (g.bands || []).map(b => coverageBand(b, g.game)).filter(Boolean).join('');
  return `<div class="panel p-3 mb-3">
    <div class="d-flex gap-2 align-items-baseline flex-wrap mb-1">
      <h6 class="mb-0">${esc(name)}</h6>
      <span class="chip ${g.complete ? 'good' : 'warn'}">${g.covered} of ${g.total}
        ${esc(g.key === 'set' ? 'sets' : 'frame generations')} covered</span>
      ${g.owned_gaps ? `<span class="chip warn">${g.owned_gaps} card(s) you hold cannot
        be bordered</span>` : ''}
    </div>
    <p class="hint">${esc(g.note)}</p>
    ${bands || '<p class="hint mb-0">Nothing outstanding — every row is covered.</p>'}
  </div>`;
}

function coverageBand(b, game){
  const rows = framesUi.covAll ? (b.rows || []) : (b.rows || []).filter(r => !r.covered);
  if(!rows.length) return '';
  /* the band's name is a heading rather than a column, because it is a sentence
     ("Sets keyed away from their generation") and as a head over short ids it wrapped
     to three lines and dragged every other column out with it */
  return `<div class="mb-3">
    <div class="d-flex gap-2 align-items-baseline mb-1">
      <div class="eyebrow">${esc(b.label)}</div>
      <span class="faint" style="font-size:.75rem">${b.covered} of ${b.total} covered</span>
    </div>
    <div class="tblwrap"><table class="tbl" style="table-layout:fixed">
      <!-- fixed widths, because a game is a dozen of these tables stacked: sized to
           their own content, every band put Set/Name/Year at a different x and the
           whole screen read as misaligned rather than as one list -->
      <colgroup><col style="width:8rem"><col><col style="width:4.5rem">
        <col style="width:4rem"><col style="width:17rem"><col style="width:13rem">
        <col style="width:6rem"></colgroup>
      <thead><tr><th>${esc(rows[0].key === 'set' ? 'Set' : 'Frame')}</th><th>Name</th>
        <th>Year</th><th>Held</th><th>Spec</th><th>From</th><th></th></tr></thead>
      <tbody>${rows.map(r => {
        const specs = r.answers.map(a => a.spec).join(', ');
        /* one via, said once. Both e-Card specs are reached the same way, so the
           per-answer list read "its era/frame, its era/frame" — a repetition that
           looks like two different facts. */
        const vias = [...new Set(r.answers.map(a =>
          a.via_label + (a.rule ? ' (' + a.rule + ')' : '')))].join(', ');
        return `<tr>
        <td class="mono">${esc(r.subject)}</td>
        <td style="${CLIP}" title="${esc(r.name)}">${esc(r.name)}</td>
        <td class="faint mono">${esc(r.released.slice(0, 4))}</td>
        <td class="mono">${r.owned || ''}</td>
        <td class="mono" style="${CLIP}" title="${esc(specs)}">${r.covered
          ? esc(specs)
          : '<span class="chip warn">no spec</span>'}</td>
        <td class="faint" style="${CLIP}" title="${esc(vias)}">${esc(vias)}</td>
        <!-- Preview only where there is something to judge. On an uncovered set every
             card resolves to nothing, which the row already says, so the button would
             spend a provider request to repeat it 150 times over. -->
        <td class="text-end">${r.covered && r.key === 'set' ? `<button
          class="btn btn-sm btn-ghost"
          onclick="previewSet('${esc(r.subject)}','${esc(game)}')">Preview</button>` : ''}</td>
      </tr>`;}).join('')}</tbody></table></div>
  </div>`;
}

/* Every spec, its numbers in millimetres (a border is a physical width — nobody
   measures a percentage with calipers), of a real card — 63.5×88.9 mm, which is what
   both games print on. There is no confidence chip and no provenance column: the
   grade that used to sit here called a border read off a publisher's scan
   trustworthy, and a scan's crop shifts every reading taken from it by the same
   unknown amount. Where a shipped number came from is written down one card per row
   in `docs/measuring-frames.md`. */
function specsPanel(reg){
  const rows = reg.specs.map(g => `<tr>
      <td class="mono">${esc(g.id)}</td>
      <td>${esc(g.name)}</td>
      <td class="faint">${esc(g.game || 'any')}</td>
      <td class="mono">${g.frameless ? '<span class="faint">none</span>'
        : g.mm.map(v => v.toFixed(2)).join(' / ')}</td>
      <td class="faint">${g.oversized ? 'oversized' : ''}</td>
      <td class="text-end">
        ${reg.reserved.includes(g.id) ? '<span class="chip faint">reserved</span>' :
          `<button class="btn btn-sm btn-ghost" onclick="editSpec('${esc(g.id)}')">Edit</button>`}
        ${g.shipped || reg.reserved.includes(g.id) ? '' :
          `<button class="btn btn-sm btn-ghost" onclick="removeSpec('${esc(g.id)}')">Remove</button>`}
      </td>
    </tr>`).join('');
  return `<div class="panel p-3 mb-3">
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Spec</th><th>Name</th><th>Game</th>
        <th>T / R / B / L mm</th><th>Card</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>
  ${specForm()}`;
}

/* Add or correct one spec — one form and one verb (`frames set`), because a spec
   is four numbers however you arrived at them. Correcting a shipped one is the
   expected case, not an override: the MTG numbers that ship are working defaults
   read off scans, and a caliper reading should replace them. */
function specForm(){
  const e = framesUi.editing || {};
  const num = (k, label) => `<div>
    <label class="eyebrow d-block mb-1" for="sp_${k}">${label} mm</label>
    <input class="form-control form-control-sm" id="sp_${k}" type="number" step="0.05"
      min="0" max="20" value="${e[k] ?? ''}"></div>`;
  return `<div class="panel p-3">
    <div class="eyebrow mb-2">${e.id ? 'Correct ' + esc(e.id) : 'Add a spec'}</div>
    <p class="hint">Four border widths off a real card — <b>63.5×88.9 mm</b>, the stock
      both games print on — measured from the cut edge to the inner edge of the printed
      border, at the middle of each edge.</p>
    <div class="row g-2 mb-2">
      <div class="col-sm-4"><label class="eyebrow d-block mb-1" for="sp_id">Id</label>
        <input class="form-control form-control-sm mono" id="sp_id" placeholder="pokemon-swsh"
          value="${esc(e.id || '')}" ${e.id ? 'readonly' : ''}></div>
      <div class="col-sm-5"><label class="eyebrow d-block mb-1" for="sp_name">Name</label>
        <input class="form-control form-control-sm" id="sp_name" placeholder="Pokémon · Sword &amp; Shield"
          value="${esc(e.name || '')}"></div>
      <div class="col-sm-3"><label class="eyebrow d-block mb-1" for="sp_game">Game</label>
        <select class="form-select form-select-sm" id="sp_game">
          <option value="">any</option>
          ${(state.meta.games || []).map(g => `<option value="${esc(g.id)}"
            ${e.game === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
        </select></div>
    </div>
    <div class="edges mb-2">${num('top','Top')}${num('right','Right')}${num('bottom','Bottom')}${num('left','Left')}</div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="sp_oversized" ${e.oversized ? 'checked' : ''}>
      <label class="form-check-label" style="font-size:.8125rem" for="sp_oversized">
        Measured on an <b>oversized</b> card (89&times;127 mm) — a plane, scheme or Vanguard</label>
      <p class="hint mb-0">The same border is a smaller <i>fraction</i> of a bigger card, so
        this changes what gets stored. Leave it off for an ordinary 63.5&times;88.9 mm card.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-primary" onclick="saveSpec()">Save spec</button>
      ${e.id ? '<button class="btn btn-sm btn-ghost" onclick="cancelSpec()">Cancel</button>' : ''}
    </div>
  </div>`;
}
function editSpec(id){
  const g = (framesUi.reg.specs || []).find(s => s.id === id);
  if(!g) return;
  framesUi.editing = {id:g.id, name:g.name, game:g.game || '', oversized:!!g.oversized,
                      top:+g.mm[0].toFixed(3), right:+g.mm[1].toFixed(3),
                      bottom:+g.mm[2].toFixed(3), left:+g.mm[3].toFixed(3)};
  framesUi.tab = 'specs';
  renderFrames();
}
function cancelSpec(){ framesUi.editing = null; renderFrames(); }

async function saveSpec(){
  const v = k => $('#sp_' + k) ? $('#sp_' + k).value : '';
  const body = {
    id: (v('id') || '').trim().toLowerCase(),
    name: v('name').trim(),
    game: v('game') || null,
    top:+v('top') || 0, right:+v('right') || 0,
    bottom:+v('bottom') || 0, left:+v('left') || 0,
    oversized: !!($('#sp_oversized') && $('#sp_oversized').checked),
  };
  if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(body.id))
    return toast('An id is lowercase letters, digits and single dashes — it becomes a filename.', 9000);
  if(!await act('/api/frames/spec', body, `Saved ${body.id}`)) return;
  framesUi.editing = null;
  await reloadFrames();
}
async function removeSpec(id){
  if(!await ask(`Remove the frame spec ${id}? Rules and pinned cards that name it must go first.`, 'Remove')) return;
  if(!await act(`/api/frames/spec/${encodeURIComponent(id)}`, {_method:'DELETE'}, `Removed ${id}`)) return;
  await reloadFrames();
}

/* The rules, in the order they are tried. First match wins, and a set's default
   is tried last — so an exception never has to be ordered by hand. */
function rulesPanel(reg){
  const rows = reg.rules.map(r => `<tr>
      <td class="mono">${esc(r.id)}</td>
      <td class="faint">${esc(r.game)}</td>
      <td class="mono">${r.global ? '<span class="faint">every set</span>' : esc(r.set)}</td>
      <td>${esc(r.describes)}</td>
      <td class="mono">${esc(r.spec)}</td>
      <td class="text-end">
        ${r.global ? '' : `<button class="btn btn-sm btn-ghost" onclick="previewSet('${esc(r.set)}','${esc(r.game)}')">Preview</button>`}
        <button class="btn btn-sm btn-ghost" onclick="removeRule('${esc(r.id)}')">Remove</button>
      </td>
    </tr>`).join('');
  const needs = (reg.matches || []).filter(m => m.needs_traits).map(m => m.id);
  return `<div class="panel p-3 mb-3">
    ${reg.rules.length ? `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Rule</th><th>Game</th><th>Set</th><th>Catches</th><th>Spec</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
      : `<p class="hint mb-0">No rules yet — every set falls back to its era, or to its
         game's generic spec. Add one below.</p>`}
  </div>
  <div class="panel p-3 mb-3">
    <div class="eyebrow mb-2">Assign a spec</div>
    <p class="hint">Point a whole set at a spec, or just part of one. Collector-number
      ranges and id lists are read off the card id, so they always work; the rest match
      on what the provider said about the printing (<span class="mono">${needs.map(esc).join(', ')}</span>),
      which a card records when it is fetched. <b>Leave the set blank</b> for a rule
      covering every set of the game — the only way to express a frame treatment, which
      is not a property of any one set. A set's own rule always beats a game-wide one.</p>
    <div class="row g-2 mb-2">
      <div class="col-sm-3"><label class="eyebrow d-block mb-1" for="ru_spec">Spec</label>
        <select class="form-select form-select-sm" id="ru_spec">
          ${reg.specs.map(g => `<option value="${esc(g.id)}">${esc(g.id)}</option>`).join('')}
        </select></div>
      <div class="col-sm-2"><label class="eyebrow d-block mb-1" for="ru_game">Game</label>
        <select class="form-select form-select-sm" id="ru_game">
          ${(state.meta.games || []).map(g => `<option value="${esc(g.id)}"
            ${g.id === state.meta.default_game ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
        </select></div>
      <div class="col-sm-2"><label class="eyebrow d-block mb-1" for="ru_set">Set</label>
        <input class="form-control form-control-sm mono" id="ru_set" placeholder="every set"></div>
      <div class="col-sm-3"><label class="eyebrow d-block mb-1" for="ru_match">Catches</label>
        <select class="form-select form-select-sm" id="ru_match" onchange="paintRuleValue()">
          ${(reg.matches || []).map(m => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('')}
        </select></div>
      <div class="col-sm-2"><label class="eyebrow d-block mb-1" for="ru_value">Value</label>
        <input class="form-control form-control-sm mono" id="ru_value" placeholder="188-216"></div>
    </div>
    <button class="btn btn-sm btn-primary" onclick="addRule()">Add rule</button>
  </div>
  ${previewPanel()}`;
}
function paintRuleValue(){
  const sel = $('#ru_match'), box = $('#ru_value');
  if(!sel || !box) return;
  const m = (framesUi.reg.matches || []).find(x => x.id === sel.value);
  box.disabled = !(m && m.takes_value);
  box.placeholder = !m ? '' : m.id === 'numbers' ? '188-216'
    : m.id === 'ids' ? 'swsh4-188,swsh4-189'
    : m.id === 'rarity' ? 'Rare Secret'
    : m.id === 'frame' ? '1997'
    : m.id === 'effect' ? 'extendedart'
    : m.id === 'border' ? 'yellow' : m.takes_value ? '' : 'not needed';
}
async function addRule(){
  const v = k => $('#ru_' + k) ? $('#ru_' + k).value.trim() : '';
  const body = {spec:v('spec'), set:v('set').toLowerCase(), match:v('match'),
                value:v('value'), game:v('game') || null};
  // a whole-set rule with no set would claim every card of the game, which is what
  // the game's default spec already is — the CLI refuses it, so say so first
  if(!body.set && body.match === 'set')
    return toast('A whole-set rule needs a set — without one it would claim every '
      + 'card of the game. Match on something narrower for a game-wide rule.', 9000);
  const where = body.set || 'every set';
  if(!await act('/api/frames/rule', body, `Assigned ${body.spec} to ${where}`)) return;
  await reloadFrames();
  if(body.set) previewSet(body.set, body.game || state.meta.default_game);
}
async function removeRule(id){
  if(!await act(`/api/frames/rule/${encodeURIComponent(id)}`, {_method:'DELETE'}, `Removed ${id}`)) return;
  await reloadFrames();
}

/* Everything about this library's frames that needs a person to decide, plus what
   the cards actually resolve to and a way to preview any set's rules.

   Four faults, no grades. Each one is a broken reference or a question nothing
   recorded can answer — never "this spec's numbers are only an estimate", which was
   true of nearly every spec and so told nobody anything. `specs.audit` produces this
   list and `proxdex frames check` prints the same one. */
function warningsPanel(reg){
  const issues = reg.issues || [];
  const mine = reg.mine || [];
  const counts = (reg.faults || []).map(f =>
    [f, issues.filter(i => i.fault === f.id).length]).filter(([, n]) => n);
  const head = `<div class="panel p-3 mb-3">
    <div class="d-flex gap-2 align-items-baseline flex-wrap mb-2">
      <div class="eyebrow">Needs a decision</div>
      <div class="d-flex gap-2 flex-wrap ms-auto">${counts.length
        ? counts.map(([f, n]) => `<span class="chip warn">${esc(f.label)} ${n}</span>`).join('')
        : '<span class="chip good">nothing outstanding</span>'}</div>
    </div>
    <p class="hint mb-0">A spec that will not parse, something pointing at a spec that is
      gone, a trait rule on a card whose traits were never recorded, or a printing whose
      frame nothing knows. Not a coverage report: MTG's border follows the printing's
      frame generation, so grading whole sets called 1046 of them unmeasured while every
      card in them resolved exactly.</p>
  </div>`;
  const table = issues.length ? `<div class="panel p-3 mb-3">
    <div class="tblwrap" style="max-height:26rem;overflow:auto"><table class="tbl">
      <thead><tr><th>What</th><th>Where</th><th>Detail</th><th>What to do</th></tr></thead>
      <tbody>${issues.map(i => `<tr>
        <td><span class="chip warn">${esc(i.label)}</span></td>
        <td class="mono">${esc(i.subject)}</td>
        <td class="faint">${esc(i.detail || '')}</td>
        <td class="hint">${esc(i.hint)}</td>
      </tr>`).join('')}</tbody></table></div>
  </div>` : '';
  return head + table + `${mine.length ? `<div class="panel p-3 mb-3">
    <div class="eyebrow mb-2">Sets in this library</div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Set</th><th>Game</th><th>Cards</th><th>Resolves to</th><th>From</th>
        <th>Pinned</th><th></th></tr></thead>
      <tbody>${mine.map(g => `<tr>
        <td class="mono">${esc(g.set)}</td><td class="faint">${esc(g.game)}</td>
        <td class="mono">${g.cards}</td><td class="mono">${esc(g.spec)}</td>
        <td class="faint">${esc(g.via_label)}${g.rule ? ' (' + esc(g.rule) + ')' : ''}</td>
        <td class="mono">${g.pinned || ''}</td>
        <td class="text-end"><button class="btn btn-sm btn-ghost"
          onclick="previewSet('${esc(g.set)}','${esc(g.game)}')">Preview</button></td>
      </tr>`).join('')}</tbody></table></div>
  </div>` : ''}
  <div class="panel p-3 mb-3">
    <div class="eyebrow mb-2">Preview any set</div>
    <p class="hint">Which spec every card of one set gets, and which rule decided it. Reads
      that set's cards from the provider, so what it shows is what a fetched card will get —
      a rule that cannot be previewed is a rule nobody should trust.</p>
    <div class="d-flex gap-2 flex-wrap align-items-end">
      <div><label class="eyebrow d-block mb-1" for="pv_set">Set code</label>
        <input class="form-control form-control-sm mono" id="pv_set" style="max-width:9rem"
          placeholder="swsh4" value="${esc(framesUi.preview ? framesUi.preview.set : '')}"></div>
      <div><label class="eyebrow d-block mb-1" for="pv_game">Game</label>
        <select class="form-select form-select-sm" id="pv_game" style="max-width:11rem">
          ${(state.meta.games || []).map(g => `<option value="${esc(g.id)}"
            ${framesUi.game === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
        </select></div>
      <button class="btn btn-sm btn-primary" onclick="previewTyped()">Preview</button>
    </div>
  </div>
  ${framesUi.busy ? '<p class="hint">Reading that set&rsquo;s cards…</p>' : ''}
  ${previewPanel()}`;
}
function previewTyped(){
  const set = ($('#pv_set') && $('#pv_set').value || '').trim();
  if(!set) return toast('Which set? Type its code — swsh4, neo, dmr.', 6000);
  previewSet(set, $('#pv_game') ? $('#pv_game').value : '');
}

/* Which spec every card of one set gets, and which rule decided it. A rule that
   cannot be previewed is a rule nobody should trust. */
function previewPanel(){
  const p = framesUi.preview;
  if(!p) return '';
  if(p.error) return `<div class="panel p-3"><div class="eyebrow mb-2">Preview
    ${esc(p.set)}</div><p class="hint mb-0" style="color:var(--hold)">${esc(p.error)}</p></div>`;
  const undecided = p.rows.filter(r => r.undecided.length);
  // a set is up to ~250 cards and the point is the *pattern*, not the roll call:
  // the tally above says how many take each spec, and the rows show which ones do
  const shown = p.rows.slice(0, 60);
  return `<div class="panel p-3">
    <div class="d-flex align-items-baseline gap-2 mb-2 flex-wrap">
      <div class="eyebrow">Preview · <span class="mono">${esc(p.set)}</span></div>
      <div class="d-flex gap-2 flex-wrap ms-auto">${Object.entries(p.tally).map(([spec, n]) =>
        `<span class="chip"><span class="mono">${esc(spec)}</span> ${n}</span>`).join('')}</div>
      <button class="btn btn-sm btn-ghost" onclick="closePreview()">Close</button>
    </div>
    <div class="tblwrap" style="max-height:26rem;overflow:auto"><table class="tbl">
      <thead><tr><th>Card</th><th>No.</th><th>Name</th><th>Rarity</th><th>Spec</th><th>From</th></tr></thead>
      <tbody>${shown.map(r => `<tr>
        <td class="mono">${esc(r.id)}</td><td class="mono">${esc(r.number)}</td>
        <td>${esc(r.name)}</td><td class="faint">${esc(r.rarity || '—')}</td>
        <td class="mono">${esc(r.spec)}</td>
        <td class="faint">${esc(r.via_label)}${r.rule ? ' (' + esc(r.rule) + ')' : ''}</td>
      </tr>`).join('')}</tbody></table></div>
    ${p.rows.length > shown.length ? `<p class="hint mb-0 mt-2">… ${p.rows.length - shown.length}
      more card(s). The tally above covers all ${p.rows.length}.</p>` : ''}
    ${undecided.length ? `<p class="hint mb-0 mt-2" style="color:var(--hold)">${undecided.length}
      card(s) could not be decided by a trait rule — the provider did not say. They take
      the set's default; pin the ones that need something else.</p>` : ''}
  </div>`;
}
async function previewSet(setId, game){
  framesUi.preview = null;
  try{
    framesUi.preview = await get(`/api/frames/preview/${encodeURIComponent(setId)}?game=${encodeURIComponent(game || '')}`);
  } catch(e){ toast('Could not read that set\n' + e, 9000); return; }
  paintFrames();
}
function closePreview(){ framesUi.preview = null; paintFrames(); }

/* A spec, a rule or a pin changes what every card resolves to — so the registry,
   the warnings and the contact sheet's chips are all re-read, not patched. The
   warnings arrive with /api/frames, so one request restates all of it. */
async function reloadFrames(){
  framesUi.reg = await get('/api/frames');
  state.meta = await get('/api/meta');
  renderFrames();
}

const settingsUi = {section:null, dirty:new Map()};

async function renderSettings(){
  if(!state.cfg){
    $('#main').innerHTML = '<p class="hint">Loading…</p>';
    state.cfg = await get('/api/config');
    settingsUi.dirty.clear();
  }
  const names = Object.keys(state.cfg.sections);
  // the leading-underscore sections are proxdex's own screens (card backs, frame
  // specs), not tables in the file — they are valid too
  const known = n => n && (n.startsWith('_') || names.includes(n));
  if(!known(settingsUi.section)) settingsUi.section = names[0] || null;

  $('#main').innerHTML = `
    <div class="d-flex align-items-baseline gap-2 mb-3 flex-wrap">
      <div><div class="eyebrow">proxdex.toml</div><h5 class="mb-0">Settings</h5></div>
      <span class="mono faint ms-auto" style="font-size:.6875rem">${esc(state.cfg.root)}</span>
    </div>
    <div class="setgrid">
      <div class="secnav" id="secnav">${names.map(n => `
        <button class="${n === settingsUi.section ? 'on' : ''}" onclick="pickSection('${esc(n)}')">
          ${esc(n)}<span class="cnt">${Object.keys(state.cfg.sections[n]).length}</span></button>`).join('')}
        <hr class="rule" style="margin:.5rem 0">
        <button class="${settingsUi.section === '_backs' ? 'on' : ''}" onclick="pickSection('_backs')">card backs</button>
        <button class="${settingsUi.section === '_frames' ? 'on' : ''}" onclick="pickSection('_frames')">frame specs</button>
        <button class="${settingsUi.section === '_doctor' ? 'on' : ''}" onclick="pickSection('_doctor')">stored images</button>
      </div>
      <div id="secbody"></div>
    </div>
    <div id="savebar"></div>`;
  paintSection();
}
function pickSection(name){ settingsUi.section = name; renderSettings(); }

function paintSection(){
  const host = $('#secbody'); if(!host) return;
  if(settingsUi.section === '_backs'){ host.innerHTML = backsPanel(); return; }
  if(settingsUi.section === '_frames'){ host.innerHTML = framesPanel(); return; }
  if(settingsUi.section === '_doctor'){
    host.innerHTML = doctorPanel();
    if(!doctorUi.asked && !doctorUi.busy) loadDoctor();
    return;
  }
  const sec = settingsUi.section, kv = state.cfg.sections[sec] || {};
  host.innerHTML = stalePanel() + `<div class="panel p-3">
    ${Object.entries(kv).map(([k, v]) => fieldFor(sec, k, v)).join('')
      || '<p class="hint mb-0">This section is empty.</p>'}</div>`;
  paintSaveBar();
}
/* Keys nothing reads any more. The screen has always *said* they were ignored and
   left it there, which is half an answer: a key left behind by a removed feature
   looks like it is configuring something, and a real library carries a handful (a
   border `thresh` from the deleted auto-detector, a grade `normalize` from the
   deleted white-balance). The server names them, so this and `config prune` cannot
   disagree about which ones go. */
function stalePanel(){
  const stale = state.cfg.stale || [];
  if(!stale.length) return '';
  return `<div class="panel p-3 mb-3">
    <div class="d-flex gap-2 align-items-start flex-wrap">
      <div>
        <div class="eyebrow mb-1">${stale.length} ignored key${stale.length === 1 ? '' : 's'}</div>
        <p class="hint mb-1">Nothing reads ${stale.length === 1 ? 'this' : 'these'} any more —
          left behind by a feature that was removed. Sitting in the file
          ${stale.length === 1 ? 'it looks' : 'they look'} like
          ${stale.length === 1 ? 'a setting' : 'settings'}, so ${stale.length === 1 ? 'it does' : 'they do'} more harm than good.</p>
        <div class="mono hint">${stale.map(esc).join(' · ')}</div>
      </div>
      <button class="btn btn-sm btn-outline-primary ms-auto flex-shrink-0"
        onclick="pruneConfig()">Remove ${stale.length === 1 ? 'it' : 'them'}</button>
    </div>
  </div>`;
}
async function pruneConfig(){
  const stale = state.cfg.stale || [];
  if(!await ask(`Delete ${stale.length} ignored key(s) from proxdex.toml?`, 'Remove')) return;
  if(!await act('/api/config/prune', {}, 'Removed the ignored keys')) return;
  state.cfg = null;                    // re-read: the file just changed
  settingsUi.dirty.clear();
  renderSettings();
}
/* One row per setting: what it is, what it does, what it defaults to, and the
   raw key it writes — plus the control, typed from the value and from the
   options map the server derives from Config's own annotations. */
function fieldFor(sec, key, val){
  const path = `${sec}.${key}`, id = `cfg_${sec}_${key}`;
  const doc = state.cfg.docs?.[path] || {};
  const choices = state.cfg.options?.[path];
  const dirty = settingsUi.dirty.has(path) ? ' dirty' : '';
  let ctl;
  if(choices){          // a setting with a closed set of values is never free text
    ctl = `<select class="form-select form-select-sm mono" id="${id}"
      onchange="markDirty('${esc(path)}')">${choices.map(o =>
      `<option ${String(o) === String(val) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(typeof val === 'boolean'){
    ctl = `<div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="${id}" ${val ? 'checked' : ''}
             onchange="markDirty('${esc(path)}')"></div>`;
  } else if(typeof val === 'number'){
    ctl = `<input class="form-control form-control-sm mono" type="number" step="any" id="${id}"
      value="${val}" oninput="markDirty('${esc(path)}')">`;
  } else if(Array.isArray(val)){
    ctl = `<input class="form-control form-control-sm mono" id="${id}"
      value="${esc(val.join(', '))}" placeholder="comma-separated"
      oninput="markDirty('${esc(path)}')">`;
  } else {
    ctl = `<input class="form-control form-control-sm mono" id="${id}" value="${esc(val)}"
      oninput="markDirty('${esc(path)}')">`;
  }
  // a key proxdex no longer reads still sits in the file and looks like it is
  // configuring something; say plainly that it does nothing
  const known = !!doc.label;
  return `<div class="field${dirty}" data-path="${esc(path)}">
    <div>
      <div class="lbl">${esc(doc.label || key)}${known ? ''
        : ' <span class="chip warn">not a proxdex setting</span>'}</div>
      ${known ? (doc.help ? `<p class="why">${esc(doc.help)}</p>` : '')
        : '<p class="why">This key is ignored — nothing reads it. Safe to delete.</p>'}
      <div class="key">${esc(sec)}.${esc(key)}${
        doc.default ? ` · default ${esc(doc.default)}` : ''}</div>
    </div>
    <div class="ctl">${ctl}${doc.unit ? `<span class="unit">${esc(doc.unit)}</span>` : ''}</div>
  </div>`;
}
function markDirty(path){
  settingsUi.dirty.set(path, true);
  const row = $(`.field[data-path="${path}"]`);
  if(row) row.classList.add('dirty');
  paintSaveBar();
}
function paintSaveBar(){
  const host = $('#savebar'); if(!host) return;
  const n = settingsUi.dirty.size;
  document.body.classList.toggle('hasbar', n > 0);
  host.innerHTML = n ? `<div class="actionbar armed">
    <b>${n} unsaved change${n === 1 ? '' : 's'}</b>
    <span class="hint">Nothing is written to proxdex.toml until you save.</span>
    <span class="ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="revertConfig()">Revert</button>
      <button class="btn btn-sm btn-primary" onclick="saveConfig()">Save changes</button>
    </span></div>` : '';
}
function revertConfig(){ state.cfg = null; settingsUi.dirty.clear(); renderSettings(); }
/* Only the sections that actually changed are sent, so a save never rewrites a
   value the user did not touch. */
async function saveConfig(){
  const sections = {};
  for(const path of settingsUi.dirty.keys()){
    const [sec, key] = path.split('.');
    const val = state.cfg.sections[sec][key];
    const el = $(`#cfg_${sec}_${key}`); if(!el) continue;
    sections[sec] ||= {};
    if(state.cfg.options?.[path]) sections[sec][key] = el.value;
    else if(typeof val === 'boolean') sections[sec][key] = el.checked;
    else if(typeof val === 'number') sections[sec][key] = parseFloat(el.value);
    else if(Array.isArray(val)) sections[sec][key] = el.value.trim()
      ? el.value.split(',').map(s => { const n = +s.trim(); return isNaN(n) ? s.trim() : n; }) : [];
    else sections[sec][key] = el.value;
  }
  settingsUi.dirty.clear();
  await act('/api/config', {_method:'PUT', sections}, 'Settings saved');
}
function backsPanel(){

    <p class="hint">One back per game — a mixed library needs both. Magic downloads
      from Scryfall; Pokémon has no back API, so upload your own scan. A two-sided
      card ignores this and prints its own reverse.</p>
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-3">

/* Frame specs have their own screen — this is the pointer to it, so the settings
   nav still leads there without a second copy of the tables living here. */
function framesPanel(){
  const specs = state.meta.frames || [];
  const unsure = state.cards.filter(c => c.frame_sure === false).length;
  return `<div class="panel p-3">
    <div class="eyebrow mb-2">Frame specs</div>
    <p class="hint">Where each printing's border sits, per edge. The border step
      reshapes a card until its border matches that. Rules decide which of your cards
      take which spec, and a set can need more than one. The numbers that ship are
      working defaults — measure a real card and correct them.</p>
    <div class="d-flex gap-2 flex-wrap mb-3">
      <span class="chip">${specs.length} spec(s)</span>
      ${unsure ? `<span class="chip warn">${unsure} card(s) undecided</span>` : ''}
