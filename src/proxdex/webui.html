<script src="/static/bootstrap.bundle.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* The card is addressed by id and side, never by grid position: a URL then
   survives a reload, a bookmark, and the library changing underneath it.
   `search` holds the query so going back to Search restores it (and its cached
   results); `lib` holds the contact sheet's filters for the same reason. */
const state = {
  view:'library', id:null, face:0, step:null,
  cards:[], meta:null, cfg:null, details:{},
  search:{q:'', game:'', set:'', rarity:'', year:'', related:false}, results:null,
  lib:{q:'', game:'', set:'', st:'', sort:'name', density:'md'},
  sel:new Set(),
  // the compare tool: 'off' shows the step's output, 'wipe' clips it over its
  // input along `split`, 'fade' cross-dissolves at `blend`. Mutually exclusive,
  // and sticky across cards — it is a way of looking, not a property of a card.
  compare:'off', split:50, blend:50,
  // the sheet builder: which cards and how many of each, plus this run's page
  // settings. `picks` empty means "every ready card", exactly as the CLI's
  // `sheet <name>` with no ids does.
  sheet:{name:'deck', picks:new Map(), filter:'', opts:null, plan:null, planning:false},
  // the print screen: which profile is open, and what the server said about it
  profile:null, profileList:null, profileDetail:null, proofOf:null,
};
const card = () => state.cards.find(c => c.id === state.id) || null;
/* What a card is, when it is not an ordinary one-sided 63×88 print. The names
   come from /api/meta's layout vocabulary — the same words the CLI prints — so
   the UI never invents its own. */
const layoutOf = id => (state.meta.layouts || []).find(l => l.id === id) || null;
/* The trim sizes a sheet can hold, and how many of each fit a page — served by
   /api/meta so the UI states the real geometry rather than guessing it. */
const trimOf = name => (state.meta.trims || []).find(t => t.name === name) || null;
const trimMm = t => t ? t.mm.map(v => +(+v).toFixed(1)).join('×') : '';
const trimGrid = t => t ? `${t.grid[0]}×${t.grid[1]} per page` : '';
function kindChips(c){
  const out = [];
  const lay = layoutOf(c.layout);
  if(lay && c.layout !== 'single')
    out.push(`<span class="chip flip" title="${esc(lay.note)}">${esc(lay.label)}</span>`);
  else if((c.faces || []).length > 1)
    out.push('<span class="chip flip" title="Two-sided card">2&nbsp;sides</span>');
  if(c.oversized){
    const t = trimOf('oversized');
    out.push(`<span class="chip" title="Printed at ${esc(trimMm(t))}mm — imposed at that size, on its own pages">oversized</span>`);
  }
  if(c.frame === 'borderless')
    out.push('<span class="chip" title="No printed frame, so the border step only corrects the aspect">borderless</span>');
  return out.join('');
}
const cardIndex = () => visible().findIndex(c => c.id === state.id);
const revOf = id => (state.cards.find(c => c.id === id) || {}).rev || '0';
/* the focused side of the focused card, and its per-stage state */
const stStatus = (c, stage, face) => {
  const f = c.faces[face === undefined ? state.face : face] || c.faces[0];
  return (f && f.status[stage]) || 'pending';
};

/* ---------- shell ---------- */
let _toast;
function toast(msg, ms=4500){
  _toast ||= new bootstrap.Toast($('#toast'));
  $('#toastmsg').textContent = msg;
  $('#toast').setAttribute('data-bs-delay', ms);
  _toast.show();
}
const tail = s => (s||'').trim().split('\n').slice(-4).join('\n');
async function get(p){ const r = await fetch(p); if(!r.ok) throw await r.text(); return r.json(); }

async function act(path, body, okmsg){
  const {_method, ...payload} = body || {};
  const method = _method || 'POST';
  let ok = false;
  $('#busy').classList.add('on');
  try{
    const r = await fetch(path, {
      method,
      headers: {'Content-Type':'application/json'},
      // DELETE carries no body; everything else sends the payload as-is
      body: method === 'DELETE' ? undefined : JSON.stringify(payload),
    });
    const j = await r.json();
    ok = j.ok !== false;
    toast(ok ? okmsg + '\n' + tail(j.log) : 'Failed\n' + (j.log || JSON.stringify(j)),
          ok ? 4500 : 14000);
  } catch(e){ toast('Failed\n' + e, 14000); }
  $('#busy').classList.remove('on');
  await refresh(true);
  return ok;
}

/* A confirm() replacement that matches the rest of the console. */
let _ask;
function ask(text, okLabel='Continue'){
  _ask ||= new bootstrap.Modal($('#askdlg'));
  $('#asktext').textContent = text;
  $('#askok').textContent = okLabel;
  return new Promise(resolve => {
    const done = v => { $('#askok').onclick = null; $('#askdlg').removeEventListener('hidden.bs.modal', onHide); resolve(v); };
    const onHide = () => done(false);
    $('#askok').onclick = () => { _ask.hide(); done(true); };
    $('#askdlg').addEventListener('hidden.bs.modal', onHide, {once:true});
    _ask.show();
  });
}

/* Same for a name: the browser's prompt() looks nothing like the rest of this
   console, and a medium's name is worth typing carefully. */
let _name;
function askName(label, value = '', hint = ''){
  _name ||= new bootstrap.Modal($('#namedlg'));
  $('#namelabel').textContent = label;
  $('#namehint').textContent = hint;
  const input = $('#nameval');
  input.value = value;
  return new Promise(resolve => {
    const done = v => {
      $('#nameok').onclick = null; input.onkeydown = null;
      $('#namedlg').removeEventListener('hidden.bs.modal', onHide);
      resolve(v);
    };
    const onHide = () => done(null);
    const submit = () => { const v = input.value.trim(); _name.hide(); done(v || null); };
    $('#nameok').onclick = submit;
    input.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); submit(); } };
    $('#namedlg').addEventListener('hidden.bs.modal', onHide, {once:true});
    _name.show();
    setTimeout(() => input.focus(), 200);
  });
}

/* Image URLs carry the card's rev (its newest stage mtime) and the side, so the
   browser can cache them forever and a changed file simply becomes a different
   URL. */
const side = f => (f ? `&face=${f}` : '');
const viewsrc = (id, stage, f) => `/api/view/${encodeURIComponent(id)}/${stage}?rev=${revOf(id)}${side(f)}`;
const fullsrc = (id, stage, f) => `/api/image/${encodeURIComponent(id)}/${stage}?rev=${revOf(id)}${side(f)}`;
const thumbsrc = (c, f) => `/api/thumb/${encodeURIComponent(c.id)}?rev=${c.rev}${side(f)}`;
/* Warm the browser cache for images we are about to want (next/prev card, the
   card's other stages) — a decoded hit makes those navigations instant. */
function prefetch(urls){ for(const u of urls) if(u) new Image().src = u; }

/* API health: a pill in the topbar, so a slow/failing provider is visible
   rather than looking like proxdex hanging. */
async function pollHealth(){
  const pill = $('#apihealth');
  try{
    const j = await get('/api/health');
    const worst = (j.hosts || [])[0];
    pill.classList.toggle('d-none', !worst);
    if(worst) pill.textContent = `${worst.host} ${worst.health}`;
    if(worst) pill.title = worst.detail;
  } catch(e){ pill.classList.add('d-none'); }
}

/* ---------- the pipeline, as the server declares it -----------------------
   Order, labels, skippability and every step's settings schema come from
   /api/meta. This file spells no step name, no option and no default of its
   own, so a step added in Python appears here with its controls already built. */
const PIPE = () => state.meta.pipeline;
const SPEC = key => PIPE().find(s => s.key === key) || PIPE()[0];
const STAGES = () => PIPE().map(s => s.stage);

/* ---------- routing ------------------------------------------------------
   Real URLs and real history: /library, /card/<id>[/<step>][?side=2],
   /search?q=…, /settings. Every navigation pushes an entry, popstate re-renders
   from the URL, and the server serves the shell for these paths so a reload or
   a pasted link lands in the same place. Nothing here refetches: a view switch
   is a pure client-side render off the cards we already hold. */
function currentUrl(){
  if(state.view === 'card' && state.id){
    const s = state.face ? `?side=${state.face + 1}` : '';
    return `/card/${encodeURIComponent(state.id)}` + (state.step ? `/${state.step}` : '') + s;
  }
  if(state.view === 'search'){
    const p = new URLSearchParams(Object.entries(state.search).filter(([,v]) => v));
    return '/search' + (p.toString() ? '?' + p : '');
  }
  if(state.view === 'settings') return '/settings';
  if(state.view === 'sheet') return '/sheet';
  if(state.view === 'print')
    return '/print' + (state.profile ? `?p=${encodeURIComponent(state.profile)}` : '');
  return '/library';
}
function routeFromUrl(){
  const parts = location.pathname.split('/').filter(Boolean);
  const q = new URLSearchParams(location.search);
  if(parts[0] === 'card' && parts[1]){
    const face = Math.max(0, (parseInt(q.get('side'), 10) || 1) - 1);
    const step = parts[2] && state.meta && SPEC(parts[2]).key === parts[2] ? parts[2] : null;
    return {view:'card', id:decodeURIComponent(parts[1]), face, step};
  }
  if(parts[0] === 'search'){
    return {view:'search', id:null, step:null, search:{
      q: q.get('q') || '', game: q.get('game') || '', set: q.get('set') || '',
      rarity: q.get('rarity') || '', year: q.get('year') || '',
    }};
  }
  if(parts[0] === 'settings') return {view:'settings', id:null, step:null};
  if(parts[0] === 'sheet') return {view:'sheet', id:null, step:null};
  if(parts[0] === 'print')
    return {view:'print', id:null, step:null, profile: q.get('p') || null};
  return {view:'library', id:null, step:null};
}
/* replace (not push) when only the URL detail changed — typing in the search
   filters shouldn't bury the previous page under a dozen history entries. */
function navigate(next, {replace = false} = {}){
  // remember where this page was scrolled to, so Back lands where you left
  history.replaceState({...routeState(), scroll: window.scrollY}, '');
  // focusing another step of the same card is not a new page — jumping to the
  // top there throws away the position you were reading at
  const samePage = next.view === state.view && (next.id ?? null) === (state.id ?? null);
  Object.assign(state, next);
  const url = currentUrl();
  const here = location.pathname + location.search;
  if(replace || url === here) history.replaceState(routeState(), '', url);
  else history.pushState(routeState(), '', url);
  render();
  if(!samePage) window.scrollTo(0, 0);
}
const routeState = () => ({view:state.view, id:state.id, face:state.face, step:state.step,
                           profile:state.profile, search:{...state.search}});
/* Update the address bar in place — used while typing a search, where a
   re-render would fight the form and a push would bury the last page. */
function syncUrl(){ history.replaceState(routeState(), '', currentUrl()); }
history.scrollRestoration = 'manual';    // we restore it ourselves, per entry
/* The grid grows as lazy thumbnails resolve, so one scrollTo can land short —
   re-apply it over the next moment until the page is tall enough. */
function restoreScroll(y){
  if(!y) return window.scrollTo(0, 0);
  let tries = 0;
  const tick = () => {
    window.scrollTo(0, y);
    if(Math.abs(window.scrollY - y) > 1 && ++tries < 12) setTimeout(tick, 40);
  };
  requestAnimationFrame(tick);
}
window.addEventListener('popstate', ev => {
  Object.assign(state, routeFromUrl());
  render();
  restoreScroll((ev.state && ev.state.scroll) || 0);
});

async function refresh(keepDetail){
  pollHealth();
  const [cards, meta] = await Promise.all([
    get('/api/cards'),
    state.meta ? Promise.resolve(state.meta) : get('/api/meta'),
  ]);
  state.cards = cards; state.meta = meta;
  state.cfg = null;                       // proxdex.toml may have changed too
  if(state.view === 'card' && keepDetail) renderCard();
  else render();
}

function render(){
  if(state.view !== 'card') _built = null;   // the shell is gone; rebuild it next time
  const section = state.view === 'card' ? 'library' : state.view;   // a card lives under Library
  $$('.navlink').forEach(b => b.classList.toggle('active', b.dataset.view === section));
  document.body.classList.toggle('picking', state.sel.size > 0);
  document.body.classList.remove('hasbar');   // each view re-arms its own bar
  const m = $('#main');
  if(state.view === 'library'){
    m.innerHTML = viewLibrary(); unskelAll(m); loadBatches(); paintBulk();
  }
  else if(state.view === 'card'){ renderCard(); }
  else if(state.view === 'search'){
    m.innerHTML = viewSearch();
    if(state.results){          // returning to Search: repaint, don't re-query
      paintResults(state.results);
      showHint(state.results.length ? '' : 'No matches. Try fewer words, or switch game.');
    } else if(state.search.q.trim()) doSearch();   // a /search?q=… link
  }
  else if(state.view === 'sheet') renderSheet();
  else if(state.view === 'print') renderPrint();
  else if(state.view === 'settings') renderSettings();
}

/* ---------- library: the contact sheet ----------------------------------- */
/* the card-level rollup: a card is only done at a stage when every side is */
const cardStatus = (c, stage) => c.status[stage] || 'pending';
const twoSided = c => c.faces.length > 1;

function visible(){
  const f = state.lib;
  const q = f.q.trim().toLowerCase();
  let out = state.cards.filter(c => {
    if(q && !(c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q))) return false;
    if(f.game && c.game !== f.game) return false;
    if(f.set && c.set !== f.set) return false;
    if(f.st === 'todo' && sheetReady(c)) return false;
    if(f.st === 'ready' && !(sheetReady(c) && !c.printed)) return false;
    if(f.st === 'printed' && !c.printed) return false;
    if(f.st === 'twosided' && !twoSided(c)) return false;
    if(f.st === 'oversized' && !c.oversized) return false;
    return true;
  });
  const by = {
    name: (a,b) => a.name.localeCompare(b.name),
    id:   (a,b) => a.id.localeCompare(b.id),
    set:  (a,b) => a.set.localeCompare(b.set) || a.id.localeCompare(b.id),
    recent: (a,b) => String(b.rev).localeCompare(String(a.rev)),
  }[f.sort] || (() => 0);
  return out.sort(by);
}
/* ready to impose = the last stage is settled on the side that would print */
function sheetReady(c){
  const last = STAGES()[STAGES().length - 1];
  const f = c.faces[c.front_face] || c.faces[0];
  return f && f.status[last] !== 'pending';
}

function viewLibrary(){
  const rows = visible();
  const sets = [...new Set(state.cards.map(c => c.set))].sort();
  const f = state.lib;
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;

  const slots = rows.map(c => {
    const picked = state.sel.has(c.id);
    return `
    <a class="slot marks ${picked ? 'picked' : ''}" href="/card/${encodeURIComponent(c.id)}"
       data-cid="${esc(c.id)}"
       onclick="return openCard('${esc(c.id)}', event)" title="${esc(c.name)} · ${esc(c.id)}">
      <input class="form-check-input pick" type="checkbox" ${picked ? 'checked' : ''}
             aria-label="Select ${esc(c.name)}"
             onclick="event.stopPropagation();togglePick('${esc(c.id)}')">
      <img class="shot skel" loading="lazy" alt="${esc(c.name)}"
           src="${thumbsrc(c, c.front_face)}" onload="unskel(this)"
           onerror="unskel(this);this.style.opacity=.12">
      <div class="cardname">${esc(c.name)}</div>
      <div class="slotmeta">
        <span class="id">${esc(c.id)}</span>
        ${kindChips(c)}
        ${c.printed ? '<span class="chip good">printed</span>'
          : c.batch ? '<span class="chip">queued</span>' : ''}
      </div>
      <div class="slotmeta"><div class="strip">${
        STAGES().map(s => `<span class="tick ${cardStatus(c,s)}"></span>`).join('')
      }</div><span class="chip ms-auto">${esc(c.game)}</span></div>
    </a>`;
  }).join('');

  const unmeasured = state.cards.filter(c => c.frame_measured === false).length;
  const notice = unmeasured ? `
    <div class="panel p-2 px-3 mb-3 d-flex align-items-center gap-2 flex-wrap">
      <span class="chip warn">estimated frame</span>
      <span class="hint">${unmeasured === 1
        ? 'One card belongs' : unmeasured + ' cards belong'} to a set with no measured border
      spec. Border still runs, but against an estimate — run
      <code>proxdex frames</code> to see which sets.</span>
    </div>` : '';

  return `
    ${tallyStrip()}
    <div class="toolbar mb-3">
      <input class="form-control" style="max-width:15rem" placeholder="Filter by name or id"
             value="${esc(f.q)}" oninput="setFilter('q', this.value)">
      <select class="form-select" style="max-width:9rem" onchange="setFilter('game', this.value)">
        ${opt('', 'Any game', f.game)}${state.meta.games.map(g => opt(g.id, g.name, f.game)).join('')}
      </select>
      <select class="form-select" style="max-width:8rem" onchange="setFilter('set', this.value)">
        ${opt('', 'Any set', f.set)}${sets.map(s => opt(s, s, f.set)).join('')}
      </select>
      <select class="form-select" style="max-width:11rem" onchange="setFilter('st', this.value)">
        ${opt('', 'Any state', f.st)}${opt('todo', 'Needs work', f.st)}
        ${opt('ready', 'Ready to print', f.st)}${opt('printed', 'Printed', f.st)}
        ${opt('twosided', 'Two-sided', f.st)}${opt('oversized', 'Oversized', f.st)}
      </select>
      <span class="ms-auto d-flex align-items-center gap-2">
        <select class="form-select" style="max-width:9rem" onchange="setFilter('sort', this.value)">
          ${opt('name','Sort: name',f.sort)}${opt('id','Sort: id',f.sort)}
          ${opt('set','Sort: set',f.sort)}${opt('recent','Sort: recent',f.sort)}
        </select>
        <span class="seg" role="group" aria-label="Tile size">
          ${['sm','md','lg'].map(d => `<button class="${f.density === d ? 'on' : ''}"
             onclick="setFilter('density','${d}')">${d.toUpperCase()}</button>`).join('')}
        </span>
      </span>
    </div>
    ${notice}
    ${slots ? `<div class="sheetgrid ${f.density}">${slots}</div>`
            : `<div class="panel p-5 text-center">
                 <p class="mb-1">${state.cards.length ? 'Nothing matches those filters.' : 'No cards yet.'}</p>
                 <p class="hint mb-3">${state.cards.length
                    ? 'Clear a filter to see the rest of the sheet.'
                    : 'Search a game to find cards and add them to this library.'}</p>
                 ${state.cards.length
                    ? '<button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">Clear filters</button>'
                    : '<button class="btn btn-sm btn-primary" onclick="go(&quot;search&quot;)">Find cards to add</button>'}
               </div>`}
    <div id="bulk"></div>
    <div class="eyebrow mt-5 mb-2">Print batches</div>
    <div id="batches"></div>`;
}

/* Where the whole library stands, per stage: what is blocked and what can go
   to paper. Counted over sides, not cards — a two-sided card is two jobs. */
function tallyStrip(){
  const sides = state.cards.flatMap(c => c.faces);
  const total = sides.length || 1;
  const cells = PIPE().map(s => {
    const done = sides.filter(f => f.status[s.stage] === 'done').length;
    const skip = sides.filter(f => f.status[s.stage] === 'skipped').length;
    return `<div class="cell">
      <div class="eyebrow">${esc(s.label)}</div>
      <div><span class="n">${done}</span><span class="of"> / ${total}</span></div>
      <div class="bar"><i class="d" style="width:${done/total*100}%"></i>
        <i class="s" style="width:${skip/total*100}%"></i></div>
    </div>`;
  }).join('');
  const ready = state.cards.filter(c => sheetReady(c) && !c.printed).length;
  return `<div class="panel p-3 mb-3">
    <div class="tally">
      <div class="cell">
        <div class="eyebrow">Cards</div>
        <div><span class="n">${state.cards.length}</span>
          <span class="of">${sides.length !== state.cards.length ? ` / ${sides.length} sides` : ''}</span></div>
      </div>
      ${cells}
      <div class="cell ms-auto text-end">
        <div class="eyebrow">Ready to print</div>
        <div><span class="n" style="color:var(--mark)">${ready}</span></div>
      </div>
    </div></div>`;
}

function setFilter(key, value){
  state.lib[key] = value;
  // Typing in the name filter must not rebuild the grid. Recreating every tile's
  // <img> on each keystroke is exactly the flicker — the browser paints an empty
  // box before it re-decodes a file it already has. Hide what no longer matches.
  if(key === 'q' && filterInPlace()){ paintBulk(); return; }
  $('#main').innerHTML = viewLibrary(); unskelAll($('#main'));
  loadBatches(); paintBulk();
}
/* Show/hide the tiles that are already there. Returns false when the grid isn't
   the right shape for that — going in or out of the empty state changes what the
   page *is*, so that case is still a real render. */
function filterInPlace(){
  const grid = $('.sheetgrid');
  const shown = new Set(visible().map(c => c.id));
  if(!grid || !shown.size) return false;
  const tiles = $$('.slot');
  if(tiles.length !== state.cards.length) return false;   // a coarser filter is on
  for(const el of tiles) el.hidden = !shown.has(el.dataset.cid);
  return true;
}
function clearFilters(){
  state.lib = {...state.lib, q:'', game:'', set:'', st:''};
  render();
}
function togglePick(id){
  if(state.sel.has(id)) state.sel.delete(id); else state.sel.add(id);
  document.body.classList.toggle('picking', state.sel.size > 0);
  $$('.slot').forEach(el => {
    el.classList.toggle('picked', state.sel.has(el.dataset.cid));
  });
  paintBulk();
}
/* Bulk actions are still one step at a time, explicitly chosen — this is a
   selection acting as an id list, not an auto-runner. */
function paintBulk(){
  const host = $('#bulk'); if(!host) return;
  const n = state.sel.size;
  document.body.classList.toggle('hasbar', n > 0);
  if(!n){ host.innerHTML = ''; return; }
  const runnable = PIPE().filter(s => s.skippable);
  host.innerHTML = `<div class="actionbar">
    <b class="mono">${n} selected</b>
    <button class="btn btn-sm btn-outline-secondary" onclick="pickAll()">Select all shown</button>
    <button class="btn btn-sm btn-ghost" onclick="clearPicks()">Clear</button>
    <span class="ms-auto d-flex flex-wrap gap-2 align-items-center">
      <span class="eyebrow">Run</span>
      ${runnable.map(s => `<button class="btn btn-sm btn-primary"
        onclick="bulkStep('${s.key}')">${esc(s.label)}</button>`).join('')}
      <span class="eyebrow ms-2">Skip</span>
      ${runnable.map(s => `<button class="btn btn-sm btn-outline-secondary"
        onclick="bulkPipe('skip','${s.key}')">${esc(s.label)}</button>`).join('')}
      <button class="btn btn-sm btn-outline-secondary ms-2" onclick="sheetFromSelection()"
        title="Open the sheet builder with these cards picked">Make sheet</button>
      <button class="btn btn-sm btn-outline-danger" onclick="bulkDelete()">Delete</button>
    </span></div>`;
}
/* A selection on the contact sheet is the obvious thing to impose — carry it
   into the builder rather than making the choice twice. */
function sheetFromSelection(){
  for(const id of state.sel)
    if(!state.sheet.picks.has(id)) state.sheet.picks.set(id, 1);
  navigate({view:'sheet', id:null, step:null});
}
function pickAll(){ visible().forEach(c => state.sel.add(c.id)); render(); paintBulk(); }
function clearPicks(){ state.sel.clear(); render(); }
async function bulkStep(key){
  const ids = [...state.sel];
  // border needs to know where each card's border is, and nobody is going to
  // drag marks onto fifty cards — so in bulk it measures each one and says so
  const auto = key === 'border';
  const extra = auto
    ? ' Each card\'s border is measured off its own image; check the ones the'
      + ' measurement was unsure about afterwards.'
    : ' Later stages that already exist will be rebuilt.';
  if(!await ask(`Run ${SPEC(key).label.toLowerCase()} on ${ids.length} card(s)?` + extra,
    'Run')) return;
  await act('/api/step', {cmd:key, ids, force:true, auto},
    `${key} · ${ids.length} card(s)`);
}
async function bulkPipe(cmd, key){
  const ids = [...state.sel];
  await act('/api/step', {cmd, step:key, ids}, `${cmd} ${key} · ${ids.length} card(s)`);
}
async function bulkDelete(){
  const ids = [...state.sel];
  if(!await ask(`Delete ${ids.length} card(s) and every file in their folders?`, 'Delete')) return;
  for(const id of ids) await fetch('/api/card/' + encodeURIComponent(id), {method:'DELETE'});
  state.sel.clear();
  toast(`Deleted ${ids.length} card(s)`);
  await refresh();
}

async function loadBatches(){
  const b = await get('/api/batches');
  const el = $('#batches'); if(!el) return;
  el.innerHTML = b.length ? b.map(x => `
    <div class="panel p-2 px-3 mb-2 d-flex align-items-center gap-3 flex-wrap">
      <b>${esc(x.name)}</b>
      <span class="mono faint" style="font-size:.6875rem">${x.cards} cards</span>
      <span class="chip ${x.printed ? 'good' : ''}">${x.printed ? 'printed' : 'queued'}</span>
      <span class="ms-auto d-flex gap-3 align-items-center">
        ${x.pdfs.map(f => `<a href="/api/pdf/${encodeURIComponent(x.dir)}/${encodeURIComponent(f)}"
           target="_blank" class="mono" style="font-size:.75rem">${esc(f)}</a>`).join('')}
        ${x.printed ? '' : `<button class="btn btn-sm btn-outline-secondary"
           onclick="act('/api/printed/${encodeURIComponent(x.name)}',{},'Marked printed')">Mark printed</button>`}
      </span>
    </div>`).join('')
    : '<p class="hint mb-0">Nothing imposed yet.</p>';
}

/* ---------- card console -------------------------------------------------
   Ordered, optional steps, one side at a time. Each step is run OR skipped —
   never automatic. The rail is the pipeline as pictures, the right panel holds
   the focused step's settings and actions (always, from the moment you focus
   it), and the centre is the proof: this step's output, or its input at full
   colour with the fact stated around the card rather than over it. */
function go(view){ navigate({view, id:null, step:null}); }
/* Let ⌘/ctrl/middle-click and "open in new tab" work like any other link. */
function openCard(id, ev){
  if(ev && (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button)) return true;
  if(ev) ev.preventDefault();
  align.show = null;
  navigate({view:'card', id, face:0, step:null});
  return false;
}
function stepCard(d){
  const rows = visible(); if(!rows.length) return;
  const i = cardIndex();
  const next = rows[((i < 0 ? 0 : i) + d + rows.length) % rows.length];
  navigate({view:'card', id:next.id, face:0, step:null});
}
function focusStep(key){ navigate({view:'card', id:state.id, face:state.face, step:key}); }
function cycleFocus(d){
  const i = PIPE().findIndex(s => s.key === state.step);
  focusStep(PIPE()[(i + d + PIPE().length) % PIPE().length].key);
}
function focusFace(f){
  align.show = null;         // the other side is at its own point in the pipeline
  navigate({view:'card', id:state.id, face:f, step:state.step});
}
function flipFace(){
  const c = card(); if(!c || !twoSided(c)) return;
  focusFace((state.face + 1) % c.faces.length);
}

/* This side's other stages, the card's other side, and the neighbours' proofs —
   so ↑/↓, F and ←/→ show an already-decoded image instead of a request. */
function prefetchAround(c){
  const mine = STAGES().filter(s => stStatus(c, s) === 'done')
    .map(s => viewsrc(c.id, s, state.face));
  const other = twoSided(c)
    ? STAGES().filter(s => stStatus(c, s, 1 - state.face) === 'done')
        .map(s => viewsrc(c.id, s, 1 - state.face)) : [];
  const rows = visible(), i = cardIndex(), n = rows.length;
  const near = n > 1 ? [rows[(i + 1) % n], rows[(i - 1 + n) % n]] : [];
  prefetch([...mine, ...other, ...near.filter(Boolean).map(x => thumbsrc(x, x.front_face))]);
}

function stepInput(c, key){          // the stage this step consumes: nearest earlier done
  const i = PIPE().findIndex(s => s.key === key);
  for(let j = i - 1; j >= 0; j--){
    const st = PIPE()[j].stage;
    if(stStatus(c, st) === 'done') return st;
  }
  return null;
}
/* "actionable" = this step is the next thing worth doing: not settled, and its
   input exists. Used for the rail's ready dot and for advancing focus. */
function actionable(c, key){
  const spec = SPEC(key), st = stStatus(c, spec.stage);
  if(key === PIPE()[0].key) return st !== 'done';
  return st !== 'done' && st !== 'skipped' && !!stepInput(c, key);
}
/* Whether the Run button works, which is a different question: running a step
   is also how you take it *off* skip, so a skipped step is still runnable. What
   gates it is only whether there is an input to read. */
function runnable(c, key){
  return key === PIPE()[0].key || !!stepInput(c, key);
}
function nextActionable(c){ const s = PIPE().find(s => actionable(c, s.key)); return s ? s.key : null; }
function defaultStep(c){
  const n = nextActionable(c); if(n) return n;
  for(let i = PIPE().length - 1; i >= 0; i--)
    if(stStatus(c, PIPE()[i].stage) === 'done') return PIPE()[i].key;
  return PIPE()[0].key;
}
/* Changing a stage invalidates everything downstream (the CLI removes those
   stale files). Warn before that throws away a done upscale — it is slow. */
function cascadeVictims(c, key){
  const i = PIPE().findIndex(s => s.key === key);
  return PIPE().slice(i + 1).filter(s => stStatus(c, s.stage) === 'done');
}
async function okCascade(c, key){
  const v = cascadeVictims(c, key);
  if(!v.some(s => s.key === 'upscale')) return true;
  return ask(`Rebuilding from ${SPEC(key).label.toLowerCase()} removes the existing `
    + `${v.map(s => s.label.toLowerCase()).join(' and ')}. The upscale is slow to redo.`,
    'Rebuild');
}

/* What the card shell in the DOM was built for, as `id/face/rev`.

   Focusing another step must not tear the page down and build it again: creating
   a fresh <img> makes the browser paint an empty box before it decodes even a
   file it already holds, and that — repeated across the filmstrip — is the
   flicker. So the shell is built once per card+side and the parts that actually
   differ (the rail's state, the proof, the step panel) are repainted in place.
   `rev` is in the token because new pixels are the one case that does need new
   image elements. */
let _built = null;

function renderCard(){
  align.on = false;
  const c = card();
  if(!c){                       // a stale/deep link to a card that isn't here
    if(state.id) toast(`${state.id} is not in this library.`);
    navigate({view:'library', id:null, step:null}, {replace:true});
    return;
  }
  if(state.face >= c.faces.length) state.face = 0;
  if(!state.step || SPEC(state.step).key !== state.step) state.step = defaultStep(c);
  prefetchAround(c);

  const token = `${c.id}/${state.face}/${c.rev}`;
  if(_built === token && $('#stagewrap')){
    paintFilm(c);
    repaintProof(c, state.step);
    renderStepPanel(c, state.step);
    return;
  }
  _built = token;
  const rows = visible();

  $('#main').innerHTML = `
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
      <button class="btn btn-sm btn-outline-secondary" onclick="go('library')">← Library</button>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-secondary" onclick="stepCard(-1)" aria-label="Previous card">‹</button>
        <button class="btn btn-outline-secondary" onclick="stepCard(1)" aria-label="Next card">›</button>
      </div>
      <span class="mono faint" style="font-size:.75rem">
        ${cardIndex() + 1} / ${rows.length}</span>
      <span class="ms-auto hint d-none d-md-inline">
        ←/→ card · ↑/↓ step${twoSided(c) ? ' · F side' : ''} · C compare ·
        <button class="btn btn-ghost btn-sm py-0 px-1" onclick="showKeys()"
          title="All keyboard shortcuts">?</button></span>
    </div>
    <div class="cardgrid">
      <div class="rail">
        <div>
          <div class="eyebrow">${esc(c.game)} · ${esc(c.set)}</div>
          <h5 class="mb-0 mt-1">${esc(c.name)}</h5>
          <div class="mono faint" style="font-size:.75rem">${esc(c.id)}</div>
          ${kindChips(c) ? `<div class="d-flex flex-wrap gap-1 mt-2">${kindChips(c)}</div>` : ''}
        </div>
        ${faceTabs(c)}
        <div class="film">${filmstrip(c)}</div>
        ${c.oversized ? `<div class="panel-2 p-2">
          <div class="eyebrow mb-1">Oversized card</div>
          <p class="hint mb-0">Printed at ${esc(trimMm(trimOf('oversized')))}mm, not
            ${esc(trimMm(trimOf('standard')))}. A sheet imposes it at that size on pages
            of its own (${esc(trimGrid(trimOf('oversized')))}) — nothing to configure.</p>
        </div>` : ''}
        ${twoSided(c) ? frontPicker(c) : ''}
        <button class="btn btn-sm btn-outline-danger" onclick="delCard()">Delete card</button>
      </div>
      <div class="stage" id="stagewrap">${renderViewer(c, state.step)}</div>
      <div id="steppanel"></div>
      <div id="carddata" style="grid-column:1/-1"></div>
    </div>`;
  unskelAll($('#main'));
  renderStepPanel(c, state.step);
  wireViewer(c, state.step);
  loadDetails(c.id);
}

function faceTabs(c){
  if(!twoSided(c)) return '';
  const last = STAGES()[STAGES().length - 1];
  return `<div class="faces" role="tablist" aria-label="Card side">${c.faces.map(f => {
    const done = STAGES().every(s => f.status[s] === 'done');
    const settled = f.status[last] !== 'pending';
    const cls = [f.index === state.face ? 'on' : '',
                 done ? 'settled' : settled ? 'partial' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" role="tab" aria-selected="${f.index === state.face}"
      title="${esc(f.name)}" onclick="focusFace(${f.index})">
      <i class="fdot"></i>${esc(f.name)}</button>`;
  }).join('')}</div>`;
}

/* Which side goes on the paper. A transform card has two real fronts and no back
   of its own, so this is a choice only you can make — and in a duplex sheet the
   other side prints on the reverse. */
function frontPicker(c){
  const names = c.faces.map(f => f.name);
  return `<div class="panel-2 p-2">
    <div class="eyebrow mb-1">Prints on the front</div>
    <div class="d-flex align-items-center gap-2">
      <span class="mono" style="font-size:.75rem">${esc(names[c.front_face])}</span>
      <button class="btn btn-sm btn-ghost ms-auto" onclick="flipPrint()"
        title="Swap which side prints on the front of the sheet">Swap ⇄</button>
    </div>
    <p class="hint mb-0 mt-1">A duplex sheet prints ${esc(names[1 - c.front_face])} on the reverse.</p>
  </div>`;
}
async function flipPrint(){
  const c = card(); if(!c) return;
  await act('/api/flip', {ids:[c.id]}, `Flipped ${c.id}`);
}

/* One frame per stage, each addressable so `paintFilm` can restate it without
   replacing it. The thumbnails are the same URLs the proof uses, so they come
   out of the browser's cache already decoded. */
function frameState(c, s, i){
  const st = stStatus(c, s.stage), ready = actionable(c, s.key);
  return {
    st,
    cls: [st, state.step === s.key ? 'current' : '', ready ? 'ready' : '',
          (st === 'pending' && !ready && i > 0) ? 'waiting' : ''].filter(Boolean).join(' '),
    label: st === 'done' ? 'done' : st === 'skipped' ? 'skipped' : ready ? 'ready' : 'waiting',
    src: st === 'done' ? viewsrc(c.id, s.stage, state.face) : '',
  };
}
function filmstrip(c){
  return PIPE().map((s, i) => {
    const f = frameState(c, s, i);
    const cel = f.src
      ? `<img class="skel" loading="lazy" alt="" src="${f.src}" onload="unskel(this)">`
      : `<span class="no">${f.st === 'skipped' ? '⤳' : i + 1}</span>`;
    return `<button class="frame ${f.cls}" id="fr_${esc(s.key)}"
      onclick="focusStep('${s.key}')" aria-current="${state.step === s.key}">
      <span class="cel">${cel}</span>
      <span class="who"><b>${esc(s.label)}</b><span class="lbl">${f.label}</span></span>
      <span class="dot"></span></button>`;
  }).join('');
}
/* Restate the rail without rebuilding it: classes and the one-word status are
   text, and a cell only becomes a different element when it genuinely changes
   kind (an image appearing where a number was). */
function paintFilm(c){
  PIPE().forEach((s, i) => {
    const el = $('#fr_' + s.key); if(!el) return;
    const f = frameState(c, s, i);
    el.className = 'frame ' + f.cls;
    el.setAttribute('aria-current', String(state.step === s.key));
    const lbl = el.querySelector('.lbl');
    if(lbl && lbl.textContent !== f.label) lbl.textContent = f.label;
    const cel = el.querySelector('.cel');
    const img = cel.querySelector('img');
    if(f.src && img){
      // same element, new pixels — only when the file itself really changed
      if(img.getAttribute('src') !== f.src){ img.classList.add('skel'); img.src = f.src; }
    } else if(Boolean(f.src) !== Boolean(img)){
      cel.innerHTML = f.src
        ? `<img class="skel" loading="lazy" alt="" src="${f.src}" onload="unskel(this)">`
        : `<span class="no">${f.st === 'skipped' ? '⤳' : i + 1}</span>`;
    }
  });
  unskelAll($('.film'));
}
function unskel(img){ img.classList.remove('skel'); }
/* An image served from cache is already `complete` when it is inserted, and its
   load event has nothing left to announce — so its skeleton is cleared here,
   synchronously, instead of sheening over a picture that is already on screen. */
function unskelAll(root){
  for(const img of (root || document).querySelectorAll('img.skel'))
    if(img.complete && img.naturalWidth) unskel(img);
}

/* ---- the proof ---------------------------------------------------------- */
function renderViewer(c, key){
  const s = SPEC(key), st = stStatus(c, s.stage);
  const inp = stepInput(c, key);
  const aligning = key === 'border' && marksOn(c);

  if(st === 'done'){
    // This step's own output. With an input to compare against, the compare tool
    // can lay the two over each other — off by default, because the thing you
    // came to look at is the result.
    // the align marks own the viewer while they are live, so the compare tool
    // stands down rather than offering a view it cannot show
    const mode = inp && !aligning ? state.compare : 'off';
    const out = viewsrc(c.id, s.stage, state.face);
    // off: the output alone. wipe/fade: the input beneath, the output over it.
    const base = mode === 'off' ? out : viewsrc(c.id, inp, state.face);
    const over = mode === 'off' ? '' : `
      <div class="cmp" id="cmp">
        <div class="over" id="cover" style="${mode === 'wipe'
          ? `clip-path:inset(0 0 0 ${state.split}%)` : `opacity:${state.blend / 100}`}">
          <img alt="${esc(s.label)} output" src="${out}">
        </div>
        <span class="tag l">${esc(mode === 'wipe' ? inp : `${100 - state.blend}% ${inp}`)}</span>
        <span class="tag r">${esc(mode === 'wipe' ? s.stage : `${state.blend}% ${s.stage}`)}</span>
        ${mode === 'wipe' ? `<div class="bar" id="cbar" style="left:${state.split}%"
          role="separator" aria-label="Wipe between ${esc(inp)} and ${esc(s.stage)}"></div>` : ''}
      </div>`;
    return `
      <div class="plate">
        <span class="what"><b>${esc(s.label)}</b><span class="d-none d-sm-inline">
          · ${esc(mode === 'off' ? s.stage : `${inp} → ${s.stage}`)}</span></span>
        ${inp && !aligning ? compareControl(inp, s.stage) : ''}
      </div>
      <div class="proof"><div class="viewer ${aligning ? 'aligning' : ''}">
        <img class="stageimg skel" alt="${esc(s.stage)}" src="${base}"
             onload="unskel(this)">${over}
      </div></div>
      ${fullLink(c, s.stage)}`;
  }
  if(inp){
    // an input, shown as it really looks: no dim, no text over the card
    return `
      <div class="plate">
        <span class="what">Showing <b>${esc(inp)}</b><span class="d-none d-sm-inline">
          — the input</span></span>
        <span class="pill ${st === 'skipped' ? 'skipped' : 'waiting'}">${
          st === 'skipped' ? `${esc(s.label.toLowerCase())} skipped` : `not ${esc(s.label.toLowerCase())}d yet`
        }</span>
      </div>
      <div class="proof"><div class="viewer is-input ${aligning ? 'aligning' : ''}">
        <img class="stageimg skel" alt="${esc(inp)}" onload="unskel(this)"
             src="${viewsrc(c.id, inp, state.face)}">
      </div></div>
      ${fullLink(c, inp)}`;
  }
  return `<div class="plate"><span class="what">${esc(s.label)}</span></div>
    <div class="proof"><div class="viewer"><div class="empty">
      <div>${key === PIPE()[0].key
        ? 'No original for this side yet.' : 'Nothing to show until an earlier step runs.'}</div>
      ${key === PIPE()[0].key
        ? '<button class="btn btn-sm btn-primary" onclick="refetch()">Fetch original</button>' : ''}
    </div></div></div>`;
}
/* The compare tool: three exclusive modes, plus the fade's blend slider. Only
   ever rendered when there really are two stages to compare. */
const COMPARE_MODES = [
  {key:'off',  label:'Result', title:'Show this step\'s output on its own'},
  {key:'wipe', label:'Wipe',   title:'Drag a split across the card'},
  {key:'fade', label:'Fade',   title:'Cross-dissolve between the two stages'},
];
function compareControl(inp, stage){
  const slider = state.compare === 'fade' ? `
    <label class="blend d-flex align-items-center gap-2">
      <span class="visually-hidden">Blend ${esc(inp)} into ${esc(stage)}</span>
      <input type="range" min="0" max="100" step="1" value="${state.blend}"
             id="cblend" oninput="setBlend(+this.value)">
      <span class="mono faint flex-shrink-0" style="font-size:.6875rem;width:2.5rem;
        text-align:right">${state.blend}%</span>
    </label>` : '';
  return `<span class="ms-auto d-flex align-items-center gap-2 flex-shrink-0"
    style="min-width:0">
    ${slider}
    <span class="seg flex-shrink-0" role="group" aria-label="Compare with ${esc(inp)}">${
      COMPARE_MODES.map(m => `<button class="${state.compare === m.key ? 'on' : ''}"
        title="${esc(m.title)}" onclick="setCompare('${m.key}')">${esc(m.label)}</button>`).join('')}
    </span></span>`;
}
function setCompare(mode){
  if(state.compare === mode) return;
  state.compare = mode;
  const c = card(); if(c) repaintProof(c, state.step);
}
function setBlend(v){
  state.blend = clamp(v, 0, 100);
  const over = $('#cover');
  if(over) over.style.opacity = String(state.blend / 100);
  // the tags read out the mix, so they have to follow it
  const l = $('.cmp .tag.l'), r = $('.cmp .tag.r'), inp = stepInput(card(), state.step);
  if(l) l.textContent = `${100 - state.blend}% ${inp}`;
  if(r) r.textContent = `${state.blend}% ${SPEC(state.step).stage}`;
  const out = $('#cblend')?.nextElementSibling;
  if(out) out.textContent = state.blend + '%';
}
/* Switching compare mode changes only the proof, so it repaints in place — the
   rail, the settings panel and the card-data sheet are untouched. */
function repaintProof(c, key){
  const host = $('#stagewrap'); if(!host) return;
  host.innerHTML = renderViewer(c, key);
  unskelAll(host);
  wireViewer(c, key);
}

function fullLink(c, stage){
  return `<a class="hint" href="${fullsrc(c.id, stage, state.face)}" target="_blank"
    rel="noopener">Open the full-resolution ${esc(stage)} file ↗</a>`;
}

/* The curtain: dragging the bar wipes between the step's input and its output.
   Clipping the top layer (rather than cross-fading) keeps both images at their
   true colour, which is the point of comparing them at all. */
function wireViewer(c, key){
  const bar = $('#cbar');
  if(bar){
    const set = clientX => {
      const r = $('#cmp').getBoundingClientRect();
      state.split = clamp((clientX - r.left) / r.width * 100, 0, 100);
      bar.style.left = state.split + '%';
      $('#cover').style.clipPath = `inset(0 0 0 ${state.split}%)`;
    };
    bar.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      const move = e => set(e.clientX);
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
  }
  if(key === 'border' && marksOn(c)) startAlign();
  else if(key === 'border'){ align.on = false; renderAlignPanel(); }
}

/* ---- card data: everything the provider says about this card -------------
   A live API call (nothing here is library state), so it is fetched once per
   card and kept in `state.details` — coming back to the card, or running a
   step, repaints from that cache instead of hitting the provider again. */
async function loadDetails(id){
  const host = $('#carddata'); if(!host) return;
  if(state.details[id]){ host.innerHTML = detailsPanel(state.details[id]); return; }
  host.innerHTML = detailsShell('<p class="hint mb-0">Loading from the card API…</p>');
  let d;
  try{ d = await get('/api/details/' + encodeURIComponent(id)); }
  catch(e){ d = {error: String(e)}; }
  state.details[id] = d;
  // the user may have navigated away while the provider was thinking
  if(state.view === 'card' && state.id === id && $('#carddata'))
    $('#carddata').innerHTML = detailsPanel(d);
}
function detailsShell(body, source){
  return `<div class="panel p-3">
    <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
      <span class="eyebrow">Card data</span>
      ${source ? `<span class="chip">${esc(source)}</span>` : ''}
    </div>${body}</div>`;
}
function detailsPanel(d){
  if(d.error) return detailsShell(`<p class="mb-2" style="color:var(--bad);font-size:.8125rem">${esc(d.error)}</p>
    <button class="btn btn-sm btn-outline-secondary" onclick="retryDetails()">Try again</button>`);
  const links = (d.links || []).map(l =>
    `<a class="btn btn-sm btn-outline-secondary" href="${esc(l.url)}"
        target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('');
  const cols = factColumns(d.groups || []);
  _factCols = cols.length;
  const body = cols.length
    ? `<div class="facts" style="grid-template-columns:repeat(${cols.length},1fr)">${
        cols.map(col => `<div class="factcol">${col.map(factGroup).join('')}</div>`).join('')}</div>`
    : '<p class="hint mb-0">This API returned nothing else.</p>';
  return detailsShell(`${links ? `<div class="linkrow mb-3">${links}</div>` : ''}${relatedRow(d)}${body}`, d.source);
}
/* Cards this one is printed alongside. A meld pair is three physical cards —
   both halves and the melded card — so the honest thing is to file them as three
   cards and say so here, where each can be added in one click. */
function relatedRow(d){
  const rel = d.related || [];
  if(!rel.length) return '';
  const missing = rel.filter(r => r.id && !r.have).length;
  return `<div class="panel-2 p-2 px-3 mb-3">
    <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
      <span class="eyebrow">Printed alongside</span>
      ${missing ? `<button class="btn btn-sm btn-primary ms-auto" onclick="addRelated()">
        Add all ${missing} missing</button>` : '<span class="chip good ms-auto">all in library</span>'}
    </div>
    <div class="rels">${rel.map(r => {
      const known = r.id && r.have;
      const action = known
        ? `<a class="btn btn-sm btn-ghost" href="/card/${encodeURIComponent(r.id)}"
             onclick="return openCard('${esc(r.id)}', event)">Open</a>`
        : r.id
          ? `<button class="btn btn-sm btn-ghost" onclick="addRelated('${esc(r.id)}')">Add</button>`
          : `<span class="chip warn" title="This API gave no id for that printing — search it by name">no id</span>`;
      return `<div class="rel">
        <span class="chip">${esc(r.label)}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="mono faint">${esc(r.id || '')}</span>
        ${action}</div>`;
    }).join('')}</div>
    <p class="hint mb-0 mt-2">${esc(d.layout_note || '')}</p>
  </div>`;
}
/* Adding one, or every one still missing — the same `fetch` the CLI runs. */
async function addRelated(id){
  const d = state.details[state.id]; if(!d) return;
  const ids = id ? [id] : (d.related || []).filter(r => r.id && !r.have).map(r => r.id);
  if(!ids.length) return;
  if(!await act('/api/fetch', {ids}, `Added ${ids.join(', ')}`)) return;
  delete state.details[state.id];
  loadDetails(state.id);
}

function factGroup(g){
  return `<section class="factgroup"><span class="eyebrow">${esc(g.title)}</span>
    ${g.facts.map(f => f.block
      ? `<div class="factblock"><div class="flabel">${esc(f.label)}</div><p>${esc(f.value)}</p></div>`
      : `<div class="factrow"><span class="flabel">${esc(f.label)}</span><span class="fval">${esc(f.value)}</span></div>`
    ).join('')}</section>`;
}
/* Fill as many ~300px columns as the panel is wide, each group going to the
   shortest column so far — reading order stays top-to-bottom-then-across and
   no column ends up carrying the whole sheet. Prose counts for more than a row
   because it wraps. */
const FACTCOL_MIN = 300;
function factColumns(groups){
  const width = ($('#carddata') || document.body).clientWidth - 32;
  const n = Math.max(1, Math.min(5, Math.floor(width / FACTCOL_MIN)));
  if(!groups.length) return [];
  const cols = Array.from({length: n}, () => []), load = new Array(n).fill(0);
  for(const g of groups){
    const weight = 1.2 + g.facts.reduce((s, f) => s + (f.block ? 1 + f.value.length / 90 : 1), 0);
    const i = load.indexOf(Math.min(...load));
    cols[i].push(g); load[i] += weight;
  }
  return cols.filter(c => c.length);
}
function retryDetails(){ delete state.details[state.id]; loadDetails(state.id); }
/* The column count is width-derived, so a resize has to re-lay it out — but
   only when the count actually changes, and never mid-drag. */
let _factCols = 0, _resizeTimer;
addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    const host = $('#carddata'), d = state.details[state.id];
    if(!host || !d || d.error) return;
    const n = factColumns(d.groups || []).length;
    if(n !== _factCols){ _factCols = n; host.innerHTML = detailsPanel(d); }
  }, 150);
});

/* ---- the focused step's panel ------------------------------------------
   Built entirely from the step's declared schema, so every step shows its
   settings the moment you focus it and none of them is a click-through. */
function renderStepPanel(c, key){
  const p = $('#steppanel'); if(!p) return;
  const s = SPEC(key), st = stStatus(c, s.stage), ready = actionable(c, key);
  const pill = st === 'done' ? '<span class="pill done">done</span>'
    : st === 'skipped' ? '<span class="pill skipped">skipped</span>'
    : ready ? '<span class="pill ready">ready</span>' : '<span class="pill waiting">waiting</span>';
  const io = key === PIPE()[0].key ? ''
    : `<div class="mono faint mt-2" style="font-size:.6875rem">reads ${esc(stepInput(c, key) || '—')}</div>`;

  p.innerHTML = `<div class="panel p-3 steppanel">
    <div class="d-flex align-items-center gap-2">
      <h6 class="mb-0">${esc(s.label)}</h6>${pill}</div>
    <p class="hint mb-0 mt-1">${esc(s.blurb)}</p>
    ${io}
    ${s.options.length ? `<hr class="rule" style="margin:${'.875rem 0'}">
      <div class="settings" id="stepsettings">${s.options.map(optField).join('')}</div>` : ''}
    ${key === 'border' ? '<div id="alpanel"></div>' : ''}
    ${key === PIPE()[0].key ? sourceExtra() : ''}
    <div class="d-grid gap-2 mt-3" id="stepactions">${footer(c, key, st)}</div>
  </div>`;
}

/* One control per declared option, its kind choosing the widget. */
function optField(o){
  const id = 'so_' + o.key;
  let ctl;
  if(o.kind === 'bool'){
    ctl = `<div class="form-check mb-0">
      <input class="form-check-input" type="checkbox" id="${id}" ${o.default ? 'checked' : ''}
             onchange="onSetting()">
      <label class="form-check-label" style="font-size:.8125rem" for="${id}">${esc(o.label)}</label></div>`;
    return `<div class="opt">${ctl}<span class="why">${esc(o.help)}</span></div>`;
  }
  if(o.kind === 'choice'){
    const auto = o.optional
      ? `<option value="">Automatic (card's set)</option>` : '';
    ctl = `<select class="form-select form-select-sm mono" id="${id}" onchange="onSetting()">${auto}${
      o.choices.map(v => `<option ${String(v) === String(o.default) ? 'selected' : ''}
        >${esc(String(v))}</option>`).join('')}</select>`;
  } else {
    // the range and increment come from the option's own schema — the API refuses
    // anything outside it, so the control must not offer it
    const bound = (name, v) => v === null || v === undefined ? '' : ` ${name}="${v}"`;
    ctl = `<input class="form-control form-control-sm mono" type="number" id="${id}"
      value="${esc(o.default ?? '')}"${bound('min', o.low)}${bound('max', o.high)}${
      bound('step', o.step_by) || ' step="any"'} oninput="onSetting()">`;
  }
  return `<div class="opt">
    <div class="setting"><label for="${id}">${esc(o.label)}</label>${ctl}</div>
    <span class="why">${esc(o.help)}</span></div>`;
}
/* Read the panel back into the wire shape the API validates. */
function stepSettings(key){
  const out = {};
  for(const o of SPEC(key).options){
    const el = $('#so_' + o.key); if(!el) continue;
    if(o.kind === 'bool') out[o.key] = el.checked;
    else if(el.value !== '') out[o.key] = o.kind === 'number' ? +el.value : el.value;
  }
  return out;
}
/* A settings change while the border marks are live changes what the fit would
   do, so the ghost trim and the readout have to follow it immediately. */
function onSetting(){
  if(align.on){ align.guide = $('#so_frame') ? $('#so_frame').value : ''; computeExtend(); }
}
function sourceExtra(){
  return `<hr class="rule" style="margin:.875rem 0">
    <label class="eyebrow d-block mb-1" for="o_file">Replace this side with a file</label>
    <input class="form-control form-control-sm" type="file" id="o_file" accept="image/*"
           onchange="importOriginal(this)">`;
}

function footer(c, key, st){
  const s = SPEC(key), done = st === 'done';
  const first = key === PIPE()[0].key;
  // border without marks measures the border itself, so the button says so
  const measuring = key === 'border' && !(align.on && align.plan);
  const verb = measuring ? 'Measure & reshape' : s.run_label;
  const label = done ? (first ? 'Fetch again' : `${verb} again`) : verb;
  const run = first
    ? `<button class="btn btn-sm btn-primary" onclick="refetch()">${esc(label)}</button>`
    : `<button class="btn btn-sm btn-primary" id="runbtn" onclick="runStep('${key}')"
        ${runnable(c, key) ? '' : 'disabled'}
        title="${measuring
          ? 'Reads the border position off the image, then fits to the frame spec'
          : 'Fits to the frame spec using the marks you placed'}"
        >${esc(label)}</button>`;

  const sec = [];
  if(s.skippable){
    sec.push(st === 'skipped'
      ? `<button class="btn btn-sm btn-outline-secondary" onclick="pipe('unskip','${key}')">Unskip</button>`
      : `<button class="btn btn-sm btn-outline-secondary" onclick="pipe('skip','${key}')">Skip</button>`);
    if(done || st === 'skipped')
      sec.push(`<button class="btn btn-sm btn-outline-secondary" onclick="pipe('reset','${key}')">Reset</button>`);
  }
  if(twoSided(c) && !first)
    sec.push(`<button class="btn btn-sm btn-outline-secondary" onclick="runStep('${key}', true)"
      title="Run this step on both sides with these settings">Both sides</button>`);
  const row = sec.length ? `<div class="btn-group btn-group-sm w-100">${sec.join('')}</div>` : '';
  // no restatement of the step's state here — the pill in the header, the rail
  // and the plate above the card already say it, three times over
  return `${run}${row}`;
}

/* Every mutation names the side it acts on, so the other side is untouched. */
async function runStep(cmd, bothSides){
  const c = card();
  if(!await okCascade(c, cmd)) return;
  const body = {cmd, ids:[c.id], settings:stepSettings(cmd), force:true};
  if(!bothSides && twoSided(c)) body.face = state.face + 1;
  if(cmd === 'border'){
    if(align.on && align.plan){   // marks are placed: fit to exactly those
      body.inner = {top:align.blue.t, right:align.blue.r,
                    bottom:align.blue.b, left:align.blue.l};
    } else {
      // nobody placed marks, and a reshape with no idea where the border is
      // would do nothing at all — so measure it first and say so on the button
      body.auto = true;
    }
  }
  await act('/api/step', body, `${cmd} · ${c.id}`);
  afterStep(cmd);
}
async function pipe(cmd, key){
  const c = card();
  if((cmd === 'skip' || cmd === 'reset') && !await okCascade(c, key)) return;
  const body = {cmd, step:key, ids:[c.id]};
  if(twoSided(c)) body.face = state.face + 1;
  await act('/api/step', body, `${cmd} ${key} · ${c.id}`);
  afterStep(cmd);
}
async function refetch(){
  const c = card();
  if(!await okCascade(c, PIPE()[0].key)) return;
  const body = {ids:[c.id], game:c.game};
  if(twoSided(c)) body.face = state.face + 1;
  await act('/api/fetch', body, `Fetched ${c.id}`);
  afterStep('run');
}
async function importOriginal(inp){
  if(!inp.files[0]) return;
  const c = card();
  if(!await okCascade(c, PIPE()[0].key)){ inp.value = ''; return; }
  const fd = new FormData();
  fd.append('file', inp.files[0]); fd.append('id', c.id);
  fd.append('stage', PIPE()[0].stage); fd.append('game', c.game);
  if(twoSided(c)) fd.append('face', String(state.face + 1));
  $('#busy').classList.add('on');
  const r = await fetch('/api/import', {method:'POST', body:fd});
  const j = await r.json();
  $('#busy').classList.remove('on');
  toast(j.ok ? 'Imported' : 'Failed\n' + tail(j.log || JSON.stringify(j)));
  await refresh(true); afterStep('run');
}
function afterStep(cmd){   // advance focus on run/skip; stay put on reset/unskip
  const c = card(); if(!c) return;
  let step = state.step;
  if(cmd !== 'reset' && cmd !== 'unskip'){ const n = nextActionable(c); if(n) step = n; }
  // replace, not push: the focus moved as a *result* of the action, so Back
  // should leave the card, not walk back through the steps it advanced through
  navigate({step}, {replace:true});
}

async function delCard(){
  const c = card();
  if(!await ask(`Delete ${c.id} and every file in its folder?`, 'Delete')) return;
  await act('/api/card/' + encodeURIComponent(c.id), {_method:'DELETE'}, 'Deleted');
  go('library');
}

/* ---------- frame align --------------------------------------------------
   Put the four marks on the card's actual inner border edge. The card's game +
   set give the true border width, so one per-edge extension fixes aspect AND
   border together — never guessed automatically.

   The marks are always live while Border is focused: there is no mode to enter
   and nothing to cancel. A mark can be dragged, or selected and nudged with the
   arrow keys, or typed as a percentage — because "close enough by eye" is
   exactly what the border step exists to avoid. */
const align = {
  on:false, meas:null, blue:{t:.08, r:.08, b:.08, l:.08},
  plan:null, guide:'', sel:null, img:null,
  // which card+side the current marks were placed on, so switching either one
  // starts from a fresh rectangle instead of inheriting someone else's border
  owner:null,
  // whether the marks are drawn on the card. Not a mode you enter — a setting in
  // the panel like every other, and left null so it can default per state: on
  // while there is a border to place, off once there is a result to look at
  // (the marks live over the source, so they'd hide it).
  show:null,
};
/* The marks are live by default exactly when there is still a border to place. */
/* Inline handlers must never touch a top-level object by name. An inline
   handler's scope chain starts at the *element*, and an HTMLElement carries a
   legacy `align` property — so `align.show = …` in an attribute quietly writes
   to a discarded String wrapper instead of the align state. Every handler goes
   through a named function for that reason. */
function toggleMarks(el){ align.show = el.checked; renderCard(); }
function resetMarks(){
  align.blue = {t:.08, r:.08, b:.08, l:.08};
  positionLines(); computeExtend(); syncRunLabel();
}
function setSearchRelated(on){ state.search.related = on; }

const marksOn = c => align.show === null
  ? stStatus(c, SPEC('border').stage) !== 'done' : align.show;
const EDGE_NAME = {t:'top', r:'right', b:'bottom', l:'left'};

async function startAlign(){
  const c = card(); if(!c) return;
  try {
    align.meas = await get(`/api/frame/${encodeURIComponent(c.id)}`
      + `?stage=${PIPE()[0].stage}&face=${state.face}`);
  } catch { align.meas = null; }
  const m = align.meas;
  if(!m || m.error){ align.on = false; renderAlignPanel(); return; }
  align.on = true;
  const owner = `${c.id}/${state.face}`;
  const fresh = align.owner !== owner;
  if(fresh){ align.owner = owner; align.blue = {t:.08, r:.08, b:.08, l:.08}; }
  align.guide = $('#so_frame') ? $('#so_frame').value : '';
  // show the scan at its own aspect: the marks measure the source, undistorted
  const v = $('.viewer');
  if(v) v.style.aspectRatio = `${m.w} / ${m.h}`;
  // the loupe reads real source pixels, so it needs the image itself
  align.img = new Image();
  align.img.src = viewsrc(c.id, PIPE()[0].stage, state.face);
  buildAlignLayer(c);
  renderAlignPanel();
  positionLines();
  computeExtend();
  // land the marks on a measurement rather than on an arbitrary 8%: it is where
  // the border actually is, and every mark is still yours to move
  if(fresh) measureBorder();
}
function buildAlignLayer(c){
  endDrag();
  const v = $('.viewer'); if(!v) return;
  v.classList.add('aligning');
  $$('.stageimg, .cmp').forEach(el => { el.style.visibility = 'hidden'; });
  $('#allayer')?.remove();
  const layer = document.createElement('div');
  layer.className = 'alignlayer'; layer.id = 'allayer';
  layer.innerHTML = `
    <img class="al-work" alt="Original scan" src="${viewsrc(c.id, PIPE()[0].stage, state.face)}">
    <div class="al-ghost" id="al_ghost"></div>
    <div class="al-band" id="al_band"><i></i></div>
    ${['top','bottom','left','right'].map(e => `
      <div class="al-line ${e}" data-e="${e[0]}" tabindex="0"
           role="slider" aria-label="${e} border edge">
        <span class="al-tag">${e[0].toUpperCase()}</span>
        <span class="al-grip" style="${e === 'top' || e === 'bottom' ? 'left:25%' : 'top:25%'}"></span>
        <span class="al-grip" style="${e === 'top' || e === 'bottom' ? 'left:75%' : 'top:75%'}"></span>
      </div>`).join('')}`;
  v.appendChild(layer);
  layer.querySelectorAll('.al-line').forEach(h => {
    h.addEventListener('pointerdown', startDrag);
    h.addEventListener('focus', () => selectEdge(h.dataset.e));
  });
}
function selectEdge(e){
  align.sel = e;
  $$('.al-line').forEach(el => el.classList.toggle('sel', el.dataset.e === e));
}
function positionLines(){
  const b = align.blue;
  const set = (sel, prop, val) => { const el = $(sel); if(el) el.style[prop] = val + '%'; };
  set('.al-line.top','top', b.t*100);   set('.al-line.bottom','top', (1-b.b)*100);
  set('.al-line.left','left', b.l*100); set('.al-line.right','left', (1-b.r)*100);
  $$('.al-line').forEach(el => {
    const v = align.blue[el.dataset.e];
    el.setAttribute('aria-valuenow', (v*100).toFixed(2));
    const tag = el.querySelector('.al-tag');
    if(tag) tag.textContent = `${el.dataset.e.toUpperCase()} ${(v*100).toFixed(2)}%`;
  });
  syncEdgeFields();
}
function setEdge(e, v){
  const b = align.blue;
  const other = {t:'b', b:'t', l:'r', r:'l'}[e];
  align.blue[e] = clamp(v, 0, 1 - b[other] - 0.05);
  positionLines(); computeExtend();
}
/* One drag at a time, and it ends even if the pointer never reports coming up —
   a lost capture, a cancelled touch or a pointer leaving the window would
   otherwise leave the mark following the cursor forever. */
let _drag = null;
function startDrag(ev){
  ev.preventDefault(); ev.stopPropagation();
  if(_drag) endDrag();
  const line = ev.currentTarget, edge = line.dataset.e;
  const r = $('.viewer').getBoundingClientRect();
  selectEdge(edge); line.focus({preventScroll:true});
  const move = e => {
    if(edge === 't') setEdge('t', (e.clientY - r.top) / r.height);
    else if(edge === 'b') setEdge('b', (r.bottom - e.clientY) / r.height);
    else if(edge === 'l') setEdge('l', (e.clientX - r.left) / r.width);
    else setEdge('r', (r.right - e.clientX) / r.width);
    showLoupe(edge, e.clientX, e.clientY, r);
  };
  _drag = {move, line};
  for(const type of ['pointermove', 'pointerup', 'pointercancel'])
    addEventListener(type, type === 'pointermove' ? move : endDrag);
  try { line.setPointerCapture(ev.pointerId); } catch { /* synthetic pointer */ }
  move(ev);
}
function endDrag(){
  if(!_drag) return;
  const {move} = _drag;
  _drag = null;
  removeEventListener('pointermove', move);
  removeEventListener('pointerup', endDrag);
  removeEventListener('pointercancel', endDrag);
  hideLoupe();
}
/* Arrow keys nudge the selected mark. Shift is a coarse step, plain is fine —
   fine being roughly one source pixel, which is as precise as the image is. */
function nudge(dv){
  if(!align.sel) return;
  setEdge(align.sel, align.blue[align.sel] + dv);
  const r = $('.viewer')?.getBoundingClientRect();
  if(r) showLoupeAtMark(align.sel, r);
}

/* ---- the loupe ---------------------------------------------------------
   Source pixels at 6× with a crosshair on the mark, parked in whichever page
   corner is furthest from the pointer so it never hides the edge you are
   aiming at. */
const LOUPE = {zoom: 6, size: 156, w: 180, h: 204};
/* Park it in the corner of the *proof's own column* that is furthest from the
   pointer: furthest-from-the-cursor keeps it off the edge you are aiming at, and
   staying inside that column keeps it off the readout you are aiming *for*. */
function loupeCorner(x, y){
  const host = $('#stagewrap');
  const a = host ? host.getBoundingClientRect()
                 : {left: 0, right: innerWidth, top: 0, bottom: innerHeight};
  const pad = 12;
  const midX = (a.left + a.right) / 2, midY = (a.top + a.bottom) / 2;
  return {
    left: `${Math.round(x < midX ? a.right - LOUPE.w - pad : a.left + pad)}px`,
    top:  `${Math.round(clamp(y < midY ? a.bottom - LOUPE.h - pad : a.top + pad,
                              pad, innerHeight - LOUPE.h - pad))}px`,
  };
}
function showLoupe(edge, px, py, rect){
  const box = $('#loupe'), img = align.img;
  if(!box || !img || !img.naturalWidth) return;
  const b = align.blue;
  // the mark's position in the displayed rect, then in source pixels
  const fx = edge === 'l' ? b.l : edge === 'r' ? 1 - b.r : (px - rect.left) / rect.width;
  const fy = edge === 't' ? b.t : edge === 'b' ? 1 - b.b : (py - rect.top) / rect.height;
  paintLoupe(edge, fx, fy);
  Object.assign(box.style, loupeCorner(px, py));
  box.hidden = false;
}
function showLoupeAtMark(edge, rect){
  const b = align.blue;
  const fx = edge === 'l' ? b.l : edge === 'r' ? 1 - b.r : 0.5;
  const fy = edge === 't' ? b.t : edge === 'b' ? 1 - b.b : 0.5;
  paintLoupe(edge, fx, fy);
  const box = $('#loupe');
  Object.assign(box.style, loupeCorner(rect.left + rect.width * fx, rect.top + rect.height * fy));
  box.hidden = false;
  clearTimeout(showLoupeAtMark._t);
  showLoupeAtMark._t = setTimeout(hideLoupe, 1400);
}
function paintLoupe(edge, fx, fy){
  const box = $('#loupe'), img = align.img;
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
  const src = LOUPE.size / LOUPE.zoom;                 // source px shown
  const sx = fx * img.naturalWidth - src / 2, sy = fy * img.naturalHeight - src / 2;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LOUPE.size, LOUPE.size);
  ctx.drawImage(img, sx, sy, src, src, 0, 0, LOUPE.size, LOUPE.size);
  const mid = LOUPE.size / 2;
  ctx.strokeStyle = '#f2418c'; ctx.lineWidth = 1;
  ctx.beginPath();
  if(edge === 't' || edge === 'b'){ ctx.moveTo(0, mid + .5); ctx.lineTo(LOUPE.size, mid + .5); }
  else { ctx.moveTo(mid + .5, 0); ctx.lineTo(mid + .5, LOUPE.size); }
  ctx.stroke();
  $('#lp_edge').textContent = EDGE_NAME[edge];
  $('#lp_val').textContent = (align.blue[edge] * 100).toFixed(2) + '%';
}
function hideLoupe(){ const b = $('#loupe'); if(b) b.hidden = true; }

/* Live preview only — mirrors cardbleed.solve_fit (authoritative on apply).
   Reshapes to the exact card aspect with borders as close to the spec as
   possible (exactly, with stretch); an already-over-target edge may be shaved. */
function solveFit(m, b, stretch, guide){
  const g = {top:guide.inset[0], right:guide.inset[1], bottom:guide.inset[2], left:guide.inset[3]};
  const cw = m.card_w_mm, ch = m.card_h_mm, w = m.w, h = m.h;
  let cur = {top:b.t*h, right:b.r*w, bottom:b.b*h, left:b.l*w};   // current border px
  let iw = w - cur.left - cur.right, ih = h - cur.top - cur.bottom;
  if(iw <= 0 || ih <= 0) return null;
  const ca = cw/ch, expInner = ca*(1-g.left-g.right)/(1-g.top-g.bottom);
  let w2 = w, h2 = h, sx = 1, sy = 1;
  if(stretch){
    if(iw/ih > expInner) sy = (iw/ih)/expInner; else sx = expInner/(iw/ih);
    cur = {top:cur.top*sy, right:cur.right*sx, bottom:cur.bottom*sy, left:cur.left*sx};
    iw *= sx; ih *= sy; w2 = w*sx; h2 = h*sy;
  }
  const a = iw/cw, c = ih/ch, p = 1-g.left-g.right, q = 1-g.top-g.bottom;
  let u = (a*p + c*q)/(a*a + c*c);
  u = Math.min(u, 1/Math.max(iw/cw, ih/ch));                  // never shave into the art
  const k = 1/u, tw = cw*k, th = ch*k;
  const split = (budget, ta, tb, ca_, cb) => {
    const loA = -ca_, loB = -cb, surplus = budget - (ta-ca_) - (tb-cb);
    let ea = (ta-ca_) + surplus/2, eb = (tb-cb) + surplus/2;
    if(ea < loA){ ea = loA; eb = budget - loA; }
    if(eb < loB){ eb = loB; ea = budget - loB; }
    return [ea, eb];
  };
  const [eL, eR] = split(tw - w2, g.left*tw, g.right*tw, cur.left, cur.right);
  const [eT, eB] = split(th - h2, g.top*th, g.bottom*th, cur.top, cur.bottom);
  const ext = {left:eL, right:eR, top:eT, bottom:eB}, bd = {};
  for(const e of ['top','right','bottom','left'])
    bd[e] = (cur[e] + ext[e]) / ((e === 'left' || e === 'right') ? tw : th);
  return {tw:Math.round(tw), th:Math.round(th), borders:bd, ext, w2, h2, guide:g,
          cropped:['top','right','bottom','left'].filter(e => ext[e] < -0.5)};
}
const activeGuide = () =>
  (align.meas.guides || []).find(g => g.id === align.guide) || align.meas.guide;
function computeExtend(){
  if(!align.on || !align.meas) return;
  const stretch = $('#so_stretch') ? $('#so_stretch').checked : false;
  align.plan = solveFit(align.meas, align.blue, stretch, activeGuide());
  drawGhost();
  renderExtReadout();
}
/* The result, drawn where it will actually land: a dashed outline for the trim
   the fit produces, and a cyan band for the border it is aiming at. Both are in
   the source image's own coordinates, so you can see the marks against them. */
function drawGhost(){
  const ghost = $('#al_ghost'), band = $('#al_band'), p = align.plan;
  if(!ghost || !band) return;
  if(!p){ ghost.hidden = band.hidden = true; return; }
  ghost.hidden = band.hidden = false;
  const pct = (v, span) => (v / span) * 100;
  const L = -pct(p.ext.left, p.w2), T = -pct(p.ext.top, p.h2);
  const W = pct(p.tw, p.w2), H = pct(p.th, p.h2);
  Object.assign(ghost.style, {left:`${L}%`, top:`${T}%`, width:`${W}%`, height:`${H}%`});
  // the target border sits inside the trim, by the guide's own inset
  const g = p.guide;
  Object.assign(band.style, {
    left:`${L}%`, top:`${T}%`, width:`${W}%`, height:`${H}%`,
    borderTopWidth: `${g.top * H}%`, borderBottomWidth: `${g.bottom * H}%`,
    borderLeftWidth: `${g.left * W}%`, borderRightWidth: `${g.right * W}%`,
    borderStyle: 'solid',
  });
}
function renderExtReadout(){
  const p = align.plan, rd = $('#al_read'); if(!rd) return;
  if(!p){ rd.innerHTML = '<p class="hint mb-0" style="color:var(--hold)">The marks leave no inner frame.</p>'; return; }
  const row = (k, l) => `<dt>${l}</dt><dd>${(p.borders[k]*100).toFixed(2)}%</dd>`;
  rd.innerHTML = `<dl class="readout mb-1">
      ${row('top','border top')}${row('right','right')}${row('bottom','bottom')}${row('left','left')}
      <dt>output</dt><dd>${p.tw}×${p.th} px</dd></dl>
    ${p.cropped.length ? `<p class="hint mb-0" style="color:var(--hold)">
       Shaves the over-target ${p.cropped.join(', ')}.</p>` : ''}`;
}
function syncEdgeFields(){
  for(const e of ['t','r','b','l']){
    const el = $('#al_' + e);
    if(el && document.activeElement !== el) el.value = (align.blue[e] * 100).toFixed(2);
  }
}
function marksToggle(c){
  const on = marksOn(c);
  return `<div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" id="al_show" ${on ? 'checked' : ''}
           onchange="toggleMarks(this)">
    <label class="form-check-label" style="font-size:.8125rem" for="al_show">
      Show the align marks on the card</label></div>`;
}
function renderAlignPanel(){
  const p = $('#alpanel'), c = card(); if(!p || !c) return;
  if(!align.on){
    const noSource = stStatus(c, PIPE()[0].stage) !== 'done';
    p.innerHTML = `<hr class="rule" style="margin:.875rem 0">
      <div class="eyebrow mb-1">Where the border is now</div>
      ${noSource
        ? `<p class="hint mb-0">Fetch this side's original first — the fit is measured
           against it.</p>`
        : marksToggle(c) + `<p class="hint mb-0">Turn the marks on to place the inner
           border edge again and reshape from the original.</p>`}`;
    return;
  }
  const g = activeGuide();
  const warn = g.measured ? '' : `
    <div class="d-flex gap-2 align-items-start mt-2">
      <span class="chip warn flex-shrink-0">estimated</span>
      <span class="hint">${esc(g.note)}</span>
    </div>`;
  p.innerHTML = `
    <hr class="rule" style="margin:.875rem 0">
    <div class="eyebrow mb-1">Where the border is now</div>
    ${marksToggle(c)}
    <p class="hint">Drag <b style="color:var(--mark)">T R B L</b> onto the card's inner
      border edge — a loupe follows each one. Arrow keys nudge the selected mark;
      the <b style="color:var(--reg)">cyan</b> outline is the trim you'll get and the
      band is the border it's aiming at.</p>
    <div class="edges mb-2">
      ${['t','r','b','l'].map(e => `<div>
        <label for="al_${e}">${EDGE_NAME[e]} %</label>
        <input class="form-control form-control-sm" id="al_${e}" type="number" step="0.05"
               min="0" max="95" onchange="setEdge('${e}', (+this.value||0)/100)"
               onfocus="selectEdge('${e}')"></div>`).join('')}
    </div>
    <div class="d-flex gap-2 mb-2">
      <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="measureBorder()"
        title="Read the border's position off the image">Measure it</button>
      <button class="btn btn-sm btn-ghost flex-fill" onclick="resetMarks()">Reset</button>
    </div>
    <div id="al_measured"></div>
    ${warn}
    <div id="al_read" class="mt-2"></div>`;
  positionLines();
  renderExtReadout();
  syncRunLabel();
}

/* The border button either measures first or uses the marks, and the marks come
   up after the panel is drawn — so its label is re-stated once they do, rather
   than promising one thing and doing the other. */
function syncRunLabel(){
  const btn = $('#runbtn'), c = card();
  if(!btn || !c || state.step !== 'border') return;
  const s = SPEC('border'), marks = align.on && align.plan;
  const verb = marks ? s.run_label : 'Measure & reshape';
  btn.textContent = stStatus(c, s.stage) === 'done' ? `${verb} again` : verb;
  btn.title = marks
    ? 'Fits to the frame spec using the marks you placed'
    : 'Reads the border position off the image, then fits to the frame spec';
}

/* Read the border's position off the image and put the marks there. A
   pre-placement, not a decision: each edge reports how many of its scan lines
   agreed, the weak ones are named, and every mark is still yours to nudge. */
async function measureBorder(){
  const c = card(); if(!c) return;
  const host = $('#al_measured');
  if(host) host.innerHTML = '<p class="hint mb-2">Measuring…</p>';
  let d;
  try{
    d = await get(`/api/detect/${encodeURIComponent(c.id)}?stage=${PIPE()[0].stage}`
      + `&face=${state.face}`);
  } catch(e){ d = {error: String(e)}; }
  if(!host) return;
  if(d.error){
    host.innerHTML = `<p class="hint mb-2" style="color:var(--bad)">${esc(d.error)}</p>`;
    return;
  }
  const [t, r, b, l] = d.inset;
  align.blue = {t, r, b, l};
  positionLines(); computeExtend();
  syncRunLabel();
  const weak = d.weak || [];
  host.innerHTML = `
    <div class="d-flex align-items-start gap-2 mb-2">
      <span class="chip ${d.reliable ? 'good' : 'warn'} flex-shrink-0">${
        d.frameless ? 'no frame' : d.reliable ? 'clean' : 'check ' + weak.join(' + ')}</span>
      <span class="hint">${esc(d.note)}</span>
    </div>`;
}

/* ---------- search -------------------------------------------------------

function onGameChange(){

async function doSearch(){
  state.search = readSearchForm();
