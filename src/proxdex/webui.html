<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>proxdex</title>
<style>
  :root {
    --bg:#0e1014; --panel:#171a21; --panel2:#1f2530; --line:#2b303b; --fg:#e7e9ef;
    --dim:#95a0b2; --accent:#6ea8fe; --ok:#57d38c; --warn:#f0b24b; --bad:#f2678a;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  a{color:var(--accent);text-decoration:none}
  button,input,select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
  button{cursor:pointer} button:hover{border-color:var(--accent)} button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:#0a0c10;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent}
  button.bad{border-color:var(--bad);color:var(--bad)}
  label{font-size:12px;color:var(--dim)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  .lib{color:var(--dim);font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav button{background:transparent;border-color:transparent;color:var(--dim)}
  nav button.active{color:var(--fg);border-color:var(--line);background:var(--panel2)}
  .spacer{flex:1}
  main{padding:16px;max-width:1500px;margin:0 auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:24px 0 10px}
  .grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
    cursor:pointer;transition:transform .08s,border-color .08s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .thumb{width:100%;aspect-ratio:63/88;object-fit:cover;background:var(--panel2);display:block}
  .meta{padding:7px 9px}
  .meta .id{font-size:10px;color:var(--dim)} .meta .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;gap:3px;margin-top:5px;align-items:center}
  .b{width:17px;height:17px;border-radius:5px;font-size:10px;font-weight:700;display:grid;place-items:center;background:var(--line);color:var(--dim)}
  .b.on{background:var(--ok);color:#0a0c10}
  .pin{margin-left:auto;font-size:11px} .pin.p{color:var(--ok)} .pin.q{color:var(--warn)}
  .b.sk{color:var(--warn)}
  /* card detail: pipeline console (rail · viewer · focused-step panel) */
  .console{display:grid;grid-template-columns:230px 1fr 330px;gap:18px;align-items:start}
  @media(max-width:980px){.console{grid-template-columns:1fr}}
  .rail{position:sticky;top:72px;display:flex;flex-direction:column;gap:14px}
  .rail .who h3{margin:0;font-size:15px} .rail .who .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;width:100%;font:inherit;color:var(--fg)}
  .step:hover{border-color:var(--accent)}
  .step.current{border-color:var(--accent);background:var(--panel2)}
  .step .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;
    font-weight:700;background:var(--line);color:var(--dim);flex:0 0 auto}
  .step .lbl{flex:1;font-weight:600;font-size:13px} .step .st{font-size:11px;color:var(--dim)}
  .step.done .ico{background:var(--ok);color:#0a0c10}
  .step.skipped .ico{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .step.skipped .lbl{color:var(--dim);text-decoration:line-through}
  .step.waiting{opacity:.5} .step.current .lbl{color:var(--fg)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:72px}
  .panel h3{margin:0 0 3px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel .desc{color:var(--dim);font-size:12px;margin-bottom:4px}
  .panel .io{font-size:11px;color:var(--dim);margin:8px 0 2px} .panel .io b{color:var(--fg)}
  .panel .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .panel .row2{display:flex;gap:8px}.panel .row2 button{flex:1}
  .panel .statusline{margin-top:6px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
  .pill.done{background:rgba(87,211,140,.16);color:var(--ok)}
  .pill.skipped{background:rgba(240,178,75,.16);color:var(--warn)}
  .pill.ready{background:rgba(110,168,254,.16);color:var(--accent)}
  .pill.waiting{background:var(--panel2);color:var(--dim)}
  .stageimg.dim{opacity:.4;filter:saturate(.55)}
  .viewer .vlabel{position:absolute;left:0;right:0;bottom:0;z-index:6;text-align:center;padding:10px 8px;
    background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:12px;color:var(--fg)}
  .viewer{position:relative;height:calc(100vh - 150px);aspect-ratio:63/88;margin:0 auto;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stageimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:0;transition:opacity .1s;cursor:zoom-in}
  .stageimg.show{opacity:1}
  .viewer .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);
    font-size:13px;text-align:center;padding:20px}
  /* frame-align overlay: drag the lines onto the card's inner border edge */
  .alignlayer{position:absolute;inset:0;z-index:5}
  .al-work{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  .al-line{position:absolute;z-index:7;touch-action:none}
  .al-line::before{content:"";position:absolute;background:#00e9ff;box-shadow:0 0 0 .5px rgba(0,0,0,.55)}
  .al-line.top,.al-line.bottom{left:0;right:0;height:22px;margin-top:-11px;cursor:ns-resize}
  .al-line.left,.al-line.right{top:0;bottom:0;width:22px;margin-left:-11px;cursor:ew-resize}
  .al-line.top::before,.al-line.bottom::before{left:0;right:0;top:10px;height:1px}
  .al-line.left::before,.al-line.right::before{top:0;bottom:0;left:10px;width:1px}
  .al-line:hover::before,.al-line.drag::before{height:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 0 5px rgba(0,233,255,.7)}
  .al-line.left:hover::before,.al-line.right:hover::before,.al-line.left.drag::before,.al-line.right.drag::before{height:auto;width:2px}
  .al-line .knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.8;
    display:grid;place-items:center;font-size:8px;font-weight:700;color:#061014;background:#00e9ff;
    border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .al-line.top .knob,.al-line.bottom .knob{width:18px;height:13px}
  .al-line.left .knob,.al-line.right .knob{width:13px;height:18px}
  .al-line:hover .knob,.al-line.drag .knob{opacity:1}
  .edgef{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:3px 0;font-size:12px}
  .edgef b{font-variant-numeric:tabular-nums;text-align:right}
  .edgef .warnpx{color:var(--warn)}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;height:fit-content}
  .side h3{margin:0 0 2px} .side .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .act{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
  .act:first-of-type{border-top:none}
  .act .t{font-weight:600;font-size:13px}
  .nav-cards{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:12px 14px}
  legend{color:var(--accent);font-size:12px;font-weight:600;padding:0 6px}
  .field{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;margin:6px 0}
  .field input,.field select{width:100%}
  .res{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
  .rcard.have{outline:2px solid var(--ok)}
  .rcard img{width:100%;aspect-ratio:63/88;object-fit:cover;background:var(--panel2)}
  .rcard .rm{padding:7px 9px;font-size:11px} .rcard .rm b{font-size:12px}
  .rcard input[type=checkbox]{position:absolute;top:6px;left:6px;width:18px;height:18px}
  .batch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .tag{font-size:11px;color:var(--dim)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 16px;max-width:80vw;white-space:pre-wrap;
    font-size:12px;display:none;z-index:40;box-shadow:0 10px 34px rgba(0,0,0,.5)}
  #busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:35;place-items:center;color:var(--fg)}
  #busy.on{display:grid}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:50;place-items:center;padding:30px}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:440px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>
<header>
  <h1>proxdex</h1><span class="lib" id="lib"></span>
  <nav class="row">
    <button data-view="library" class="active">Library</button>
    <button data-view="search">Search</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <div class="row">
    <button onclick="sheetDialog()">🖨 Sheet</button>
    <button title="Regenerate INDEX.md" onclick="act('/api/index',{},'index updated')">↺ index</button>
    <button onclick="refresh()">⟳</button>
  </div>
</header>
<main id="main"></main>

<div id="busy"><div>working…</div></div>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg" /></div>

<dialog id="sheetdlg">
  <h3 style="margin-top:0">Make print sheet</h3>
  <div class="field"><label>batch name</label><input id="sd_name" value="deck" /></div>
  <div class="field"><label>faces</label><select id="sd_faces"></select></div>
  <div class="field"><label>page</label><select id="sd_page"></select></div>
  <div class="field"><label>dpi</label><input id="sd_dpi" type="number" placeholder="config default" /></div>
  <div class="field"><label>profile</label><select id="sd_profile"></select></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button onclick="sheetdlg.close()">cancel</button>
    <button class="primary" onclick="makeSheet()">Make sheet</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = { view:'library', cards:[], meta:null, idx:-1, step:null, ver:{}, cfg:null };

function toast(msg, ms=4500){ const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); if(ms) t._t=setTimeout(()=>t.style.display='none',ms); }
async function get(p){ const r=await fetch(p); if(!r.ok) throw await r.text(); return r.json(); }
async function act(path, body, okmsg){
  $('#busy').classList.add('on');
  try{
    const r=await fetch(path,{method:body&&body._method||'POST',headers:{'Content-Type':'application/json'},
      body: body&&body._method?undefined:JSON.stringify(body||{})});
    const j=await r.json();
    toast(j.ok!==false ? (okmsg+'\n'+tail(j.log)) : ('failed:\n'+(j.log||'')), j.ok!==false?4500:14000);
  }catch(e){ toast('error: '+e,14000); }
  $('#busy').classList.remove('on');
  await refresh(true);
}
const tail = s => (s||'').trim().split('\n').slice(-4).join('\n');
function bump(id){ state.ver[id]=(state.ver[id]||0)+1; }
const imgsrc = (id,stage) => `/api/image/${id}/${stage}?v=${state.ver[id]||0}`;

async function refresh(keepDetail){
  [state.cards, state.meta] = await Promise.all([get('/api/cards'), state.meta?Promise.resolve(state.meta):get('/api/meta')]);
  if(state.view==='library') render();
  else if(state.view==='card' && keepDetail){ bumpAll(); renderCard(); }
  else render();
}
function bumpAll(){ if(state.idx>=0){ const c=state.cards[state.idx]; if(c) bump(c.id); } }

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  const m=$('#main');
  if(state.view==='library') m.innerHTML=viewLibrary();
  else if(state.view==='card') { m.innerHTML=''; renderCard(); }
  else if(state.view==='search') m.innerHTML=viewSearch();
  else if(state.view==='settings'){ m.innerHTML='<div class="tag">loading…</div>'; renderSettings(); }
}
function viewLibrary(){
  const cards = state.cards.map((c,i)=>{
    const pin=c.printed?'<span class="pin p">✓</span>':(c.batch?`<span class="pin q">•</span>`:'');
    const bd=['original','bordered','upscaled','edited'].map(k=>badge(stStatus(c,k),k[0].toUpperCase())).join('');
    return `<div class="card" onclick="openCard(${i})">
      <img class="thumb" loading="lazy" src="/api/thumb/${c.id}?v=${state.ver[c.id]||0}" onerror="this.style.opacity=.12">
      <div class="meta"><div class="id">${c.id}</div><div class="nm">${c.name}</div>
      <div class="badges">${bd}${pin}</div>
      </div></div>`;
  }).join('') || '<div class="tag">No cards yet — go to Search to add some.</div>';
  return `<div class="grid">${cards}</div><h2>Print batches</h2><div id="batches"></div>`;
}
const badge=(st,l)=>`<div class="b ${st==='done'?'on':(st==='skipped'?'sk':'')}">${st==='skipped'?'⤳':l}</div>`;

async function loadBatches(){
  const b=await get('/api/batches'); const el=$('#batches'); if(!el) return;
  el.innerHTML = b.length? b.map(x=>`<div class="batch"><b>${x.name}</b>
    <span class="tag">${x.cards} cards · ${x.faces||''} · ${x.printed?'printed':'queued'}</span><div class="spacer"></div>
    ${x.pdfs.map(f=>`<a href="/api/pdf/${x.dir}/${f}" target="_blank">${f}</a>`).join(' · ')}
    ${x.printed?'':`<button onclick="act('/api/printed/${encodeURIComponent(x.name)}',{},'marked printed')">mark printed</button>`}
    </div>`).join('') : '<div class="tag">none yet</div>';
}

/* ---------- card detail: pipeline console ----------------------------------
   Ordered, optional steps. Each is run OR skipped — never automatic. The left
   rail is the pipeline (status per step); the right panel shows ONLY the
   focused step's controls; the centre previews that step's output (or, if it's
   not done, the input it would consume). Running/skipping advances the focus. */
const STEPS = [
  {key:'original', label:'Original', stage:'original', skippable:false,
   desc:'The source scan — everything else derives from it.'},
  {key:'border', label:'Border', stage:'bordered', skippable:true,
   desc:'Reshape to the exact card size with the correct border.'},
  {key:'upscale', label:'Upscale', stage:'upscaled', skippable:true,
   desc:'Sharpen and enlarge with Upscayl.'},
  {key:'grade', label:'Grade', stage:'edited', skippable:true,
   desc:'Colour-normalise to a uniform batch look — the trim master.'},
];
const STEP = Object.fromEntries(STEPS.map(s=>[s.key,s]));
const stStatus=(c,stage)=>(c.status&&c.status[stage])||(c.stages[stage]?'done':'pending');
const viewsrc=(id,k)=>`/api/view/${id}/${k}?v=${state.ver[id]||0}`;

function openCard(i){ state.idx=i; state.step=null; state.view='card';
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active')); render(); }
function stepCard(d){ exitAlign(); state.idx=(state.idx+d+state.cards.length)%state.cards.length; state.step=null; renderCard(); }
function focusStep(key){ exitAlign(); state.step=key; renderCard(); }
function cycleFocus(d){ const i=STEPS.findIndex(s=>s.key===state.step);
  focusStep(STEPS[(i+d+STEPS.length)%STEPS.length].key); }

function stepInput(c,key){   // the stage this step would consume: nearest earlier done
  const i=STEPS.findIndex(s=>s.key===key);
  for(let j=i-1;j>=0;j--){ if(stStatus(c,STEPS[j].stage)==='done') return STEPS[j].stage; }
  return null;
}
function actionable(c,key){
  const st=stStatus(c,STEP[key].stage);
  if(key==='original') return st!=='done';
  return st!=='done' && st!=='skipped' && !!stepInput(c,key);
}
function nextActionable(c){ const s=STEPS.find(s=>actionable(c,s.key)); return s?s.key:null; }
function defaultStep(c){
  const n=nextActionable(c); if(n) return n;
  for(let i=STEPS.length-1;i>=0;i--){ if(stStatus(c,STEPS[i].stage)==='done') return STEPS[i].key; }
  return 'original';
}

function renderCard(){
  align.on=false;
  const c=state.cards[state.idx]; if(!c){ state.view='library'; return render(); }
  if(!state.step || !STEP[state.step]) state.step=defaultStep(c);
  const rail = STEPS.map((s,i)=>{
    const st=stStatus(c,s.stage), ready=actionable(c,s.key);
    const cls=[st, state.step===s.key?'current':'', (st==='pending'&&!ready&&s.key!=='original')?'waiting':''].filter(Boolean).join(' ');
    const ico = st==='done'?'✓' : st==='skipped'?'⤳' : (i+1);
    const txt = st==='done'?'done' : st==='skipped'?'skipped' : ready?'ready':'waiting';
    return `<button class="step ${cls}" onclick="focusStep('${s.key}')">
      <span class="ico">${ico}</span><span class="lbl">${s.label}</span><span class="st">${txt}</span></button>`;
  }).join('');
  $('#main').innerHTML = `
    <div class="nav-cards">
      <button onclick="state.view='library';render()">← Library</button>
      <button onclick="stepCard(-1)">‹ Prev</button><button onclick="stepCard(1)">Next ›</button>
      <b>${c.name}</b><span class="tag">${c.id} · ${state.idx+1}/${state.cards.length} · ←/→ cards · ↑/↓ steps</span>
    </div>
    <div class="console">
      <div class="rail">
        <div class="who"><h3>${c.name}</h3><div class="sub">${c.id} · ${c.set}</div></div>
        <div class="steps">${rail}</div>
        <button class="bad" onclick="delCard()">Delete card</button>
      </div>
      <div>${renderViewer(c,state.step)}</div>
      <div id="steppanel"></div>
    </div>`;
  renderStepPanel(c,state.step);
}
function renderViewer(c,key){
  const s=STEP[key], st=stStatus(c,s.stage);
  if(st==='done') return `<div class="viewer"><img class="stageimg show" src="${viewsrc(c.id,s.stage)}"
    onclick="lightbox('${imgsrc(c.id,s.stage)}')"></div>`;
  const inp=stepInput(c,key);
  if(inp){ const note = st==='skipped' ? `skipped — master keeps the ${inp}` : `input · ${inp} — not yet ${s.label.toLowerCase()}d`;
    return `<div class="viewer preview"><img class="stageimg show dim" src="${viewsrc(c.id,inp)}"
      onclick="lightbox('${imgsrc(c.id,inp)}')"><div class="vlabel">${note}</div></div>`; }
  return `<div class="viewer"><div class="ph">${key==='original'?'no original yet — fetch or import it':'nothing to show yet'}</div></div>`;
}

/* ---- the focused step's panel (only this step's controls) ---- */
function renderStepPanel(c,key){
  const p=$('#steppanel'); if(!p) return;
  const s=STEP[key], st=stStatus(c,s.stage), ready=actionable(c,key);
  const pill = st==='done'?'<span class="pill done">✓ done</span>'
    : st==='skipped'?'<span class="pill skipped">⤳ skipped</span>'
    : ready?'<span class="pill ready">● ready</span>':'<span class="pill waiting">○ waiting</span>';
  const io = key==='original' ? '' : `<div class="io">input → <b>${stepInput(c,key)||'—'}</b></div>`;
  const body = {original:originalBody,border:borderBody,upscale:upscaleBody,grade:gradeBody}[key](c,st,ready);
  p.innerHTML = `<div class="panel"><h3>${s.label} ${pill}</h3>
    <div class="desc">${s.desc}</div>${io}${body}
    <div class="actions">${footer(c,key,st,ready)}</div></div>`;
}
function originalBody(){
  return `<label class="io" style="display:block">replace with a file
    <input type="file" accept="image/*" onchange="importOriginal(this)"></label>`;
}
function borderBody(){ return `<div id="alpanel"></div>`; }
function upscaleBody(){
  const models=state.meta.models.map(m=>`<option ${m==='digital-art-4x'?'selected':''}>${m}</option>`).join('');
  const scales=[1,2,3,4].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('');
  return `<div class="field"><label>model</label><select id="u_model">${models}</select></div>
    <div class="field"><label>scale</label><select id="u_scale">${scales}</select></div>
    <div class="field"><label>double</label><input type="checkbox" id="u_double" checked></div>`;
}
function gradeBody(){ return `<div class="field"><label>normalize</label><input type="checkbox" id="g_norm" checked></div>`; }

function footer(c,key,st,ready){
  const s=STEP[key], done=st==='done';
  let run;
  if(key==='border') run=`<button class="primary" onclick="startAlign()" ${ready||done?'':'disabled'}>${done?'Re-align':'Align to spec'}</button>`;
  else if(key==='original') run=`<button class="primary" onclick="refetch()">${done?'Re-fetch':'Fetch'} original</button>`;
  else run=`<button class="primary" onclick="runStep('${key}')" ${ready||done?'':'disabled'}>${done?'Re-run':'Run '+s.label.toLowerCase()}</button>`;
  const sec=[];
  if(s.skippable){
    if(st==='skipped') sec.push(`<button onclick="pipe('unskip','${key}')">Unskip</button>`);
    else sec.push(`<button onclick="pipe('skip','${key}')">Skip</button>`);
    if(done||st==='skipped') sec.push(`<button onclick="pipe('reset','${key}')">Reset</button>`);
  }
  const row2 = sec.length?`<div class="row2">${sec.join('')}</div>`:'';
  const stat = done?'done — part of the master'
    : st==='skipped'?'skipped — not applied'
    : ready?'ready to run'
    : `waiting on ${key==='original'?'a source image':'an earlier step'}`;
  return `${run}${row2}<div class="statusline">status: ${stat}</div>`;
}

const stepOpts=cmd=> cmd==='upscale' ? {model:$('#u_model').value,scale:+$('#u_scale').value,double:$('#u_double').checked}
  : cmd==='grade' ? {normalize:$('#g_norm').checked} : {};
async function runStep(cmd){
  const c=state.cards[state.idx];
  await act('/api/step',{cmd, ids:[c.id], opts:stepOpts(cmd), force:true}, `${cmd} · ${c.id}`);
  afterStep(cmd);
}
async function pipe(cmd, key){
  const c=state.cards[state.idx];
  await act('/api/step',{cmd, ids:[c.id], opts:{step:key}}, `${cmd} ${key} · ${c.id}`);
  afterStep(cmd);
}
async function refetch(){ const c=state.cards[state.idx];
  await act('/api/fetch',{ids:[c.id]}, `fetch · ${c.id}`); afterStep('run'); }
async function importOriginal(inp){
  if(!inp.files[0])return; const c=state.cards[state.idx];
  const fd=new FormData(); fd.append('file',inp.files[0]); fd.append('id',c.id); fd.append('stage','original');
  $('#busy').classList.add('on');
  const r=await fetch('/api/import',{method:'POST',body:fd}); const j=await r.json();
  $('#busy').classList.remove('on'); toast(j.ok?'imported':'failed:\n'+tail(j.log)); await refresh(true); afterStep('run');
}
function afterStep(cmd){   // auto-advance focus on run/skip; stay put on reset/unskip
  const c=state.cards[state.idx]; if(!c) return;
  if(cmd!=='reset' && cmd!=='unskip'){ const n=nextActionable(c); if(n) state.step=n; }
  renderCard();
}

/* ---------- frame align ---------------------------------------------------
   Drag the four lines onto the card's actual inner border edge. From the card's
   era (set id) we know the true border width, so one per-edge extension fixes
   aspect AND border width together — no automatic guessing. Then upscale.    */
const align = { on:false, meas:null, blue:{t:0,r:0,b:0,l:0}, plan:null, stretch:false, oldAspect:'' };
const mmr = v => (Math.round(v*10)/10).toFixed(1);
async function startAlign(){
  const c=state.cards[state.idx]; if(!c) return;
  align.on=true;
  try{ align.meas=await get('/api/frame/'+c.id+'?stage=original'); }catch(e){ align.meas=null; }
  const m=align.meas;
  if(!m || m.error){ toast('need an original image to align'); align.on=false; return; }
  const v=$('.viewer');                          // show the scan at its own aspect (undistorted)
  if(v){ align.oldAspect=v.style.aspectRatio; v.style.aspectRatio=`${m.w} / ${m.h}`; }
  align.blue={t:0.08,r:0.08,b:0.08,l:0.08};      // a visible starting rectangle to drag onto the border
  buildAlignLayer(c); renderAlignPanel(); positionLines(); computeExtend();
}
function buildAlignLayer(c){
  const v=$('.viewer'); if(!v) return;
  document.querySelectorAll('.stageimg').forEach(el=>el.style.visibility='hidden');
  const old=$('#allayer'); if(old) old.remove();
  const layer=document.createElement('div'); layer.className='alignlayer'; layer.id='allayer';
  layer.innerHTML=`<img class="al-work" id="al_work" src="${viewsrc(c.id,'original')}">
    <div class="al-line top" data-e="t"><span class="knob">T</span></div>
    <div class="al-line bottom" data-e="b"><span class="knob">B</span></div>
    <div class="al-line left" data-e="l"><span class="knob">L</span></div>
    <div class="al-line right" data-e="r"><span class="knob">R</span></div>`;
  v.appendChild(layer);
  layer.querySelectorAll('.al-line').forEach(h=>h.addEventListener('pointerdown',startDrag));
}
function positionLines(){ const b=align.blue;
  const set=(sel,prop,val)=>{ const el=$(sel); if(el) el.style[prop]=val+'%'; };
  set('.al-line.top','top',b.t*100); set('.al-line.bottom','top',(1-b.b)*100);
  set('.al-line.left','left',b.l*100); set('.al-line.right','left',(1-b.r)*100); }
function startDrag(ev){
  ev.preventDefault(); ev.stopPropagation();
  const edge=ev.currentTarget.dataset.e, r=$('.viewer').getBoundingClientRect();
  const cl=(v,hi)=>Math.max(0,Math.min(hi,v));
  ev.currentTarget.classList.add('drag');
  const move=e=>{ const b=align.blue;
    if(edge==='t') b.t=cl((e.clientY-r.top)/r.height, 1-b.b-0.05);
    else if(edge==='b') b.b=cl((r.bottom-e.clientY)/r.height, 1-b.t-0.05);
    else if(edge==='l') b.l=cl((e.clientX-r.left)/r.width, 1-b.r-0.05);
    else if(edge==='r') b.r=cl((r.right-e.clientX)/r.width, 1-b.l-0.05);
    positionLines(); computeExtend(); };
  const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    document.querySelectorAll('.al-line').forEach(h=>h.classList.remove('drag')); };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
}
/* live preview only — mirrors cardbleed.solve_fit (authoritative on apply).
   Reshapes to the exact card aspect with borders as close to the era spec as
   possible (exactly, with stretch); an already-over-target edge may be shaved. */
function solveFit(m,b,stretch){
  const g={top:m.guide.inset[0],right:m.guide.inset[1],bottom:m.guide.inset[2],left:m.guide.inset[3]};
  const cw=m.card_w_mm, ch=m.card_h_mm, w=m.w, h=m.h;
  let cur={top:b.t*h,right:b.r*w,bottom:b.b*h,left:b.l*w};   // current border px
  let iw=w-cur.left-cur.right, ih=h-cur.top-cur.bottom;
  if(iw<=0||ih<=0) return null;
  const ca=cw/ch, expInner=ca*(1-g.left-g.right)/(1-g.top-g.bottom);
  let w2=w, h2=h, sx=1, sy=1;
  if(stretch){
    if(iw/ih>expInner) sy=(iw/ih)/expInner; else sx=expInner/(iw/ih);
    cur={top:cur.top*sy,right:cur.right*sx,bottom:cur.bottom*sy,left:cur.left*sx};
    iw*=sx; ih*=sy; w2=w*sx; h2=h*sy;
  }
  const a=iw/cw, c=ih/ch, p=1-g.left-g.right, q=1-g.top-g.bottom;
  let u=(a*p+c*q)/(a*a+c*c);
  u=Math.min(u, 1/Math.max(iw/cw, ih/ch));                  // never shave into the art
  const k=1/u, tw=cw*k, th=ch*k;
  const split=(budget,ta,tb,ca_,cb)=>{
    const loA=-ca_, loB=-cb, surplus=budget-(ta-ca_)-(tb-cb);
    let ea=(ta-ca_)+surplus/2, eb=(tb-cb)+surplus/2;
    if(ea<loA){ ea=loA; eb=budget-loA; } if(eb<loB){ eb=loB; ea=budget-loB; }
    return [ea,eb];
  };
  const [eL,eR]=split(tw-w2, g.left*tw, g.right*tw, cur.left, cur.right);
  const [eT,eB]=split(th-h2, g.top*th, g.bottom*th, cur.top, cur.bottom);
  const ext={left:eL,right:eR,top:eT,bottom:eB}, bd={};
  for(const e of ['top','right','bottom','left'])
    bd[e]=(cur[e]+ext[e])/((e==='left'||e==='right')?tw:th);
  return {tw:Math.round(tw),th:Math.round(th),borders:bd,
    cropped:['top','right','bottom','left'].filter(e=>ext[e]<-0.5)};
}
function computeExtend(){ align.plan=solveFit(align.meas,align.blue,align.stretch); renderExtReadout(); }
function renderExtReadout(){
  const p=align.plan, rd=$('#al_read'); if(!rd) return;
  if(!p){ rd.innerHTML='<div class="tag"><span class="warnpx">marks leave no inner frame</span></div>'; return; }
  const row=(mk,lbl)=>`<div class="edgef"><label>${lbl}</label><b>${(p.borders[mk]*100).toFixed(2)}%</b></div>`;
  rd.innerHTML=`${row('top','top')}${row('right','right')}${row('bottom','bottom')}${row('left','left')}
    <div class="tag" style="margin-top:4px">→ ${p.tw}×${p.th}px at the ${align.meas.guide.name} spec
    ${p.cropped.length?`<br><span class="warnpx">⚠ shaved over-target ${p.cropped.join(', ')}</span>`:''}</div>`;
}
function renderAlignPanel(){
  const p=$('#alpanel'); if(!p) return; const g=align.meas.guide;
  p.innerHTML=`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px">
    <div class="tag" style="margin-bottom:6px">drag <b style="color:#00e9ff">T B L R</b> onto the card's inner border edge —
      the <b>${g.name}</b> spec then reshapes to the exact card aspect</div>
    <div id="al_read"></div>
    <label class="tag" style="display:flex;gap:6px;align-items:center;margin-top:6px">
      <input type="checkbox" ${align.stretch?'checked':''}
        onchange="align.stretch=this.checked;computeExtend()"> stretch to hit the borders exactly</label>
    <div class="row" style="margin-top:8px"><button class="primary" onclick="applyAlign()">Reshape → border</button>
      <button onclick="exitAlign()">cancel</button>
      <button class="ghost" onclick="align.blue={t:0.08,r:0.08,b:0.08,l:0.08};positionLines();computeExtend()">reset</button></div></div>`;
}
async function applyAlign(){
  const b={...align.blue}, stretch=align.stretch, c=state.cards[state.idx]; exitAlign();
  await act('/api/step',{cmd:'border', ids:[c.id],   // send marks; the CLI does the real fit
    opts:{inner:{top:b.t,right:b.r,bottom:b.b,left:b.l},stretch}, force:true}, `border · ${c.id}`);
  afterStep('border');
}
function exitAlign(){ if(!align.on) return; align.on=false;
  const v=$('.viewer'); if(v) v.style.aspectRatio=align.oldAspect||'';
  const l=$('#allayer'); if(l) l.remove(); const p=$('#alpanel'); if(p) p.innerHTML='';
  document.querySelectorAll('.stageimg').forEach(el=>el.style.visibility=''); }
async function delCard(){ const c=state.cards[state.idx];
  if(!confirm('Delete '+c.id+' and all its files?')) return;
  await act('/api/card/'+c.id,{_method:'DELETE'},'deleted'); state.view='library'; render(); }
function lightbox(src){ $('#lbimg').src=src; $('#lightbox').style.display='grid'; }

/* ---------- search ---------- */
function viewSearch(){
  return `<div class="row" style="margin-bottom:6px">
    <input id="q" placeholder="card name, e.g. entei ex" size="24" onkeydown="if(event.key==='Enter')doSearch()">
    <input id="f_set" placeholder="set (ex4)" size="8"><input id="f_rar" placeholder="rarity" size="8">
    <input id="f_year" placeholder="year" size="6">
    <button class="primary" onclick="doSearch()">Search</button>
    <div class="spacer"></div><button onclick="fetchSel()">⬇ Fetch selected</button></div>
    <div id="results" class="res"></div>`;
}
async function doSearch(){
  const p=new URLSearchParams({q:$('#q').value});
  if($('#f_set').value)p.set('set',$('#f_set').value);
  if($('#f_rar').value)p.set('rarity',$('#f_rar').value);
  if($('#f_year').value)p.set('year',$('#f_year').value);
  $('#results').innerHTML='<div class="tag">searching…</div>';
  try{ const r=await get('/api/search?'+p);
    if(!Array.isArray(r)){ $('#results').innerHTML='<div class="tag">'+(r.error||'no results')+'</div>'; return; }
    $('#results').innerHTML = r.length? r.map(x=>`<label class="rcard ${x.have?'have':''}">
      <input type="checkbox" value="${x.id}" ${x.have?'disabled':''}>
      <img loading="lazy" src="${x.image}" onerror="this.style.opacity=.12">
      <div class="rm"><b>${x.name}</b><br>${x.set} · ${x.year} · ${x.number}<br>
      <span class="tag">${x.rarity} · ${x.artist}${x.have?' · have':''}</span></div></label>`).join('')
      : '<div class="tag">no matches</div>';
  }catch(e){ $('#results').innerHTML='<div class="tag">error: '+e+'</div>'; }
}
async function fetchSel(){
  const ids=[...document.querySelectorAll('#results input:checked')].map(c=>c.value);
  if(!ids.length){ toast('select some cards first'); return; }
  await act('/api/fetch',{ids},`fetched ${ids.length}`);
}

/* ---------- settings ---------- */
async function renderSettings(){
  state.cfg = await get('/api/config');
  const secs = Object.entries(state.cfg.sections).map(([name,kv])=>`<fieldset><legend>${name}</legend>
    ${Object.entries(kv).map(([k,v])=>fieldFor(name,k,v)).join('')}</fieldset>`).join('');
  $('#main').innerHTML = `<div class="row"><h2 style="margin:0">Config — proxdex.toml</h2>
    <div class="spacer"></div><button class="primary" onclick="saveConfig()">Save config</button></div>
    ${secs}
    <h2>Card back</h2>
    <div class="row"><select id="bk_tcg"><option value="">— tcg —</option><option>mtg</option></select>
      <input id="bk_url" placeholder="or image URL" size="30">
      <button onclick="setBack()">Set back</button>
      <label>upload <input type="file" id="bk_file" accept="image/*" onchange="uploadBack(this)"></label></div>
    <h2>Calibration</h2><div id="calwrap" class="tag">loading…</div>`;
  loadCal();
}
function fieldFor(sec,key,val){
  const id=`cfg_${sec}_${key}`; let input;
  if(typeof val==='boolean') input=`<input type="checkbox" id="${id}" ${val?'checked':''}>`;
  else if(typeof val==='number') input=`<input type="number" step="any" id="${id}" value="${val}">`;
  else if(Array.isArray(val)) input=`<input id="${id}" value="${val.join(', ')}" placeholder="comma list">`;
  else input=`<input id="${id}" value="${String(val).replace(/"/g,'&quot;')}">`;
  return `<div class="field"><label>${key}</label>${input}</div>`;
}
async function saveConfig(){
  const sections={};
  for(const [name,kv] of Object.entries(state.cfg.sections)){
    sections[name]={};
    for(const [k,v] of Object.entries(kv)){
      const el=$(`#cfg_${name}_${k}`);
      if(typeof v==='boolean') sections[name][k]=el.checked;
      else if(typeof v==='number') sections[name][k]=parseFloat(el.value);
      else if(Array.isArray(v)) sections[name][k]=el.value.trim()?el.value.split(',').map(s=>{const n=+s.trim();return isNaN(n)?s.trim():n;}):[];
      else sections[name][k]=el.value;
    }
  }
  await act('/api/config',{sections},'config saved');
}
async function setBack(){
  const tcg=$('#bk_tcg').value, url=$('#bk_url').value;
  await act('/api/back', tcg?{tcg}:{url}, 'card back set');
}
async function uploadBack(inp){
  if(!inp.files[0]) return; const fd=new FormData(); fd.append('file',inp.files[0]);
  $('#busy').classList.add('on');
  const r=await fetch('/api/back/upload',{method:'POST',body:fd}); const j=await r.json();
  $('#busy').classList.remove('on'); toast(j.ok?'card back set':'failed:\n'+j.log);
}
async function loadCal(){
  const cals=await get('/api/calibrate');
  const profs=state.meta.profiles;
  $('#calwrap').innerHTML = `<div class="row" style="margin-bottom:8px">
    <select id="cal_prof">${profs.map(p=>`<option>${p}</option>`).join('')}</select>
    <a id="cal_dl" href="#" onclick="dlChart(false)">download chart</a> ·
    <a href="#" onclick="dlChart(true)">corrected chart</a>
    <label>fit scan <input type="file" id="cal_scan" accept="image/*" onchange="calFit(this,false)"></label>
    <label>check scan <input type="file" id="cal_scan2" accept="image/*" onchange="calFit(this,true)"></label></div>
    ${cals.length?cals.map(c=>`<div class="tag">• ${c.profile}: raw err ${(c.error.mean||0).toFixed?c.error.mean.toFixed(1):c.error.mean} / ${c.error.max?.toFixed?.(1)??''}</div>`).join(''):'<div class="tag">no calibrations yet</div>'}`;
}
function dlChart(corr){ const p=$('#cal_prof').value; window.open(`/api/calibrate/chart?profile=${encodeURIComponent(p)}&corrected=${corr}`,'_blank'); return false; }
async function calFit(inp,check){
  if(!inp.files[0])return; const fd=new FormData(); fd.append('file',inp.files[0]);
  fd.append('profile',$('#cal_prof').value); fd.append('check',check);
  $('#busy').classList.add('on'); const r=await fetch('/api/calibrate/fit',{method:'POST',body:fd}); const j=await r.json();
  $('#busy').classList.remove('on'); toast(j.ok?tail(j.log):'failed:\n'+j.log, 9000); loadCal();
}

/* ---------- sheet dialog ---------- */
function sheetDialog(){
  const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
  $('#sd_faces').innerHTML=opt(state.meta.faces); $('#sd_page').innerHTML=opt(state.meta.pages);
  $('#sd_profile').innerHTML='<option value="">config default</option>'+opt(state.meta.profiles);
  sheetdlg.showModal();
}
async function makeSheet(){
  sheetdlg.close();
  await act('/api/sheet',{name:$('#sd_name').value||'deck',faces:$('#sd_faces').value,
    page:$('#sd_page').value,dpi:$('#sd_dpi').value?+$('#sd_dpi').value:null,
    profile:$('#sd_profile').value||null},'sheet written');
}

/* ---------- boot ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
document.addEventListener('keydown',e=>{ if(state.view!=='card')return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(align.on){ if(e.key==='Escape')exitAlign(); return; }
  if(e.key==='ArrowRight')stepCard(1); else if(e.key==='ArrowLeft')stepCard(-1);
  else if(e.key==='ArrowUp'){e.preventDefault();cycleFocus(-1);} else if(e.key==='ArrowDown'){e.preventDefault();cycleFocus(1);}
  else if(e.key==='Escape'){state.view='library';render();}});
const _origRender=render; render=function(){ _origRender(); if(state.view==='library') loadBatches(); };
get('/api/config').then(c=>$('#lib').textContent=c.root);
refresh();
</script>
