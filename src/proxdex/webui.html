<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>proxdex</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230c0c10'/><path d='M7 12V7h5M20 7h5v5M25 20v5h-5M12 25H7v-5' stroke='%23f2418c' stroke-width='2.4' fill='none' stroke-linecap='square'/></svg>" />
<link rel="stylesheet" href="/static/bootstrap.min.css" />
<style>
/* ============================================================================
   proxdex — a prepress console.

   The chrome is deliberately colourless: you are judging card colour on these
   screens, so nothing around the image competes with it. **One accent** —
   registration MAGENTA, borrowed from the marks a press actually prints — and it
   carries every interaction, every crop mark and every overlay. There were two:
   cyan meant "a measurement rather than a control", which was a real distinction
   while the border was measured off the image, and stopped being one when that
   was removed. Where two overlay lines need telling apart they differ by line
   STYLE — dashed for what is being aimed at, solid for what you drag — because
   that survives them landing on the same pixel, and a second hue did not.
   Numbers are always monospaced: this is a measuring tool.

   Bootstrap 5.3 supplies the components (nav, buttons, forms, modal, toast,
   accordion, grid); everything below is the theme plus the five pieces
   Bootstrap has no answer for — the contact sheet, the filmstrip stepper, the
   proof viewer with its compare tool, the frame-align overlay, and the
   loupe.
   ========================================================================= */
:root {
  /* --- ground up. Four surfaces, each one step lighter than the last, so
     elevation is read from value alone and never needs a shadow. */
  --ink:      #0c0c10;   /* page ground */
  --stock:    #14141a;   /* panel surface — "stock" as in paper stock */
  --stock-2:  #1b1b23;   /* raised control surface */
  --stock-3:  #23232d;   /* pressed / hovered control */
  --rule:     #23232e;   /* hairline rules */
  --rule-2:   #313140;   /* a rule that has to be seen */

  --type:     #eeece8;   /* paper white */
  --dim:      #8e8e9e;   /* secondary type */
  --faint:    #5f5f6e;   /* tertiary — units, raw keys */

  --mark:     #f2418c;   /* registration magenta — marks + interaction */
  --mark-dim: rgba(242,65,140,.16);
  --proof:    #5bd68a;   /* a step that is done */
  --hold:     #e8b44a;   /* a step deliberately skipped */
  --bad:      #ff6b6b;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* one spacing scale, 4px-based, used for every gap in the app */
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem;
  --s5: 1.5rem; --s6: 2rem; --s7: 3rem;

  /* Bootstrap, re-skinned */
  --bs-body-bg: var(--ink);
  --bs-body-color: var(--type);
  --bs-body-font-family: var(--font-ui);
  --bs-body-font-size: .875rem;
  --bs-body-line-height: 1.5;
  --bs-emphasis-color: var(--type);
  --bs-secondary-color: var(--dim);
  --bs-border-color: var(--rule);
  --bs-border-radius: .625rem;
  --bs-border-radius-sm: .375rem;
  --bs-border-radius-lg: .875rem;
  --bs-primary: var(--mark);
  --bs-link-color: var(--mark);
  --bs-link-hover-color: #ff6ba6;
  --bs-code-color: var(--mark);
  --bs-font-monospace: var(--font-mono);
  --bs-focus-ring-color: rgba(242,65,140,.3);

  /* A card's die-cut corner, **measured off the images proxdex actually shows**:
     the alpha channel of 15 different Scryfall PNGs — every frame generation,
     every border colour, 744-745×1040 — starts its straight edge at exactly
     32 px on both axes. That is 4.30% of the width and 3.08% of the height, or
     2.73 mm, and it does not vary by one pixel between them.

     Given as a percentage PAIR so both axes come out to the same absolute
     radius (a single percentage would make the corner an ellipse) and so it
     scales with the tile instead of the fixed px it was.

     It was 3 mm — the nominal 1/8" die — and that is the wrong number to use
     here: proxdex flattens the transparent corner to the card's own border
     colour when it files the image, so the corner arriving in the browser is
     *square*, and the CSS radius is the only thing rounding it. Rounding it
     0.27 mm harder than the die-cut leaves a wedge of page background inside
     the card's own black border, which on an MTG card reads as a bite taken out
     of each corner. Matching the measurement makes the cut land exactly where
     the provider's die-cut was. One number, both games. */
  --card-radius: 4.30% / 3.08%;
  /* **The card's own aspect, from `games.CARD_W_MM`/`CARD_H_MM`** — 63.5×88.9mm,
     the published poker size both games print at. It was the rounded 63/88, which
     is 0.8% out: every thumbnail box in the app was very slightly the wrong shape,
     and `object-fit: cover` then shaved the difference off two edges of every card
     silently. An oversized printing is a different shape again and says so per
     tile, since that is a property of the card and not of the grid. */
  --card-ar: 63.5 / 88.9;
  --card-ar-oversized: 88.9 / 127;

  /* How tall the sticky topbar actually is, right now. Everything that sticks
     below it pins to this. It was a hardcoded 4.5rem, which is a *guess* at a bar
     whose height depends on whether its nav has wrapped: 52.9px at desktop widths
     and **138px** at 560px, where the guess put every sticky element 66px
     underneath the bar it was supposed to sit below. `syncBarHeight` keeps it
     honest with a ResizeObserver; the value here is only the pre-measurement
     default. */
  --bar: 3.25rem;
}
body { background: var(--ink); -webkit-font-smoothing: antialiased; }
/* Bootstrap's display utilities are !important, so [hidden] loses without this */
[hidden] { display: none !important; }
::selection { background: var(--mark-dim); }

/* --- type roles ----------------------------------------------------------
   Sans reads, mono measures, micro-caps label. Every id, dimension, percent
   and dpi in this app is mono — that is the whole typographic idea. */
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: .625rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim);
}
.hint { font-size: .75rem; color: var(--dim); line-height: 1.45; }
.faint { color: var(--faint); }
h1, h2, h3, h4, h5, h6 { letter-spacing: -.02em; }
h5 { font-size: 1.0625rem; }
h6 { font-size: .9375rem; }

/* --- crop marks ----------------------------------------------------------
   Four L-shaped hairline brackets, drawn with one pseudo-element — the same
   marks `proxdex sheet` prints at each card corner. Contact-sheet tiles only:
   the proof shows the card and nothing else, so nothing competes with it.

   On the **picture**, not the tile. `inset: -7px` draws them just outside whatever
   carries the class, and that used to be the whole `.slot` — so the brackets framed the
   card *and* the two lines of text under it, which is not a thing a press marks the
   corners of. They now sit in the tile's own padding, around the card alone, which is
   what a crop mark is for. */
.marks { position: relative; }
.marks::after {
  content: ""; position: absolute; inset: -7px; pointer-events: none;
  opacity: 0; transition: opacity .12s ease;
  --l: 11px; --w: 1px; --c: var(--mark);
  background:
    linear-gradient(var(--c),var(--c))    0    0 / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c))    0    0 / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) 100%    0 / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c)) 100%    0 / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c))    0 100% / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c))    0 100% / var(--w) var(--l) no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100% / var(--l) var(--w) no-repeat,
    linear-gradient(var(--c),var(--c)) 100% 100% / var(--w) var(--l) no-repeat;
}
.marks:hover::after, .marks.marked::after { opacity: 1; }
.marks.quiet::after { opacity: .34; }

/* --- surfaces ------------------------------------------------------------ */
.panel {
  background: var(--stock); border: 1px solid var(--rule);
  border-radius: var(--bs-border-radius);
}
.panel-2 { background: var(--stock-2); border: 1px solid var(--rule); border-radius: var(--bs-border-radius-sm); }
.rule { border: 0; border-top: 1px solid var(--rule); opacity: 1; margin: var(--s4) 0; }

.form-control, .form-select {
  background-color: var(--stock-2); border-color: var(--rule); color: var(--type);
}
.form-control::placeholder { color: var(--faint); }
.form-control:focus, .form-select:focus, .btn:focus-visible, a:focus-visible,
.form-check-input:focus, [tabindex]:focus-visible {
  border-color: var(--mark); box-shadow: 0 0 0 .18rem rgba(242,65,140,.28); outline: 0;
}
.form-check-input:checked { background-color: var(--mark); border-color: var(--mark); }
.btn { --bs-btn-font-size: .8125rem; font-weight: 500; }
.btn-primary {
  --bs-btn-bg: var(--mark); --bs-btn-border-color: var(--mark); --bs-btn-color: #16050d;
  --bs-btn-hover-bg: #ff5c9c; --bs-btn-hover-border-color: #ff5c9c; --bs-btn-hover-color: #16050d;
  --bs-btn-active-bg: #e33580; --bs-btn-active-border-color: #e33580;
  --bs-btn-disabled-bg: var(--stock-3); --bs-btn-disabled-border-color: var(--rule);
  --bs-btn-disabled-color: var(--faint); font-weight: 600;
}
.btn-outline-secondary {
  --bs-btn-color: var(--type); --bs-btn-border-color: var(--rule);
  --bs-btn-bg: transparent;
  --bs-btn-hover-bg: var(--stock-2); --bs-btn-hover-border-color: var(--rule-2);
  --bs-btn-hover-color: var(--type); --bs-btn-active-bg: var(--stock-3);
  --bs-btn-active-border-color: var(--mark); --bs-btn-active-color: var(--type);
  --bs-btn-disabled-color: var(--faint); --bs-btn-disabled-border-color: var(--rule);
}
.btn-outline-danger {
  --bs-btn-color: var(--bad); --bs-btn-border-color: rgba(255,107,107,.32);
  --bs-btn-hover-bg: rgba(255,107,107,.12); --bs-btn-hover-border-color: var(--bad);
  --bs-btn-hover-color: var(--bad);
}
.btn-ghost {
  background: none; border: 1px solid transparent; color: var(--dim);
  border-radius: var(--bs-border-radius-sm); padding: .25rem .5rem; font-size: .8125rem;
  white-space: nowrap;
}
.btn-ghost:hover { color: var(--type); background: var(--stock-2); }

/* --- header -------------------------------------------------------------- */
/* Opaque, not translucent: a sticky bar with `backdrop-filter` re-blurs the
   whole page behind it on every scroll frame, which is what made scrolling
   stutter. The bar is its own paint layer instead. */
.topbar {
  position: sticky; top: 0; z-index: 1030; background: var(--ink);
  border-bottom: 1px solid var(--rule); contain: paint;
}
.wordmark { font-weight: 700; font-size: 1rem; letter-spacing: -.04em; }
.wordmark::first-letter { color: var(--mark); }
/* Every control is hit-testable over its whole plate, never just its glyphs:
   the padding here is the click target, and the active rule sits under it. */
.navlink {
  background: none; border: 0; color: var(--dim); font-size: .8125rem; font-weight: 600;
  padding: .45rem .625rem; border-radius: .375rem .375rem 0 0;
  border-bottom: 2px solid transparent;
}
.navlink:hover { color: var(--type); background: var(--stock); }
.navlink.active { color: var(--type); border-bottom-color: var(--mark); }
.libpath { font-size: .6875rem; color: var(--faint); }

/* --- chips & pills ------------------------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: .2rem;
  font-family: var(--font-mono); font-size: .625rem; letter-spacing: .04em;
  text-transform: uppercase; color: var(--dim); white-space: nowrap;
  border: 1px solid var(--rule); border-radius: .25rem; padding: 0 .3rem; line-height: 1.5;
}
.chip.warn  { color: var(--hold);  border-color: rgba(232,180,74,.4); }
.chip.good  { color: var(--proof); border-color: rgba(91,214,138,.4); }
.chip.flip  { color: var(--mark);  border-color: rgba(242,65,140,.45); }
.chip.bad   { color: var(--bad);   border-color: rgba(255,107,107,.4); }
.pill {
  display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px;
  padding: .1rem .55rem; font-size: .6875rem; font-weight: 600; white-space: nowrap;
}
.pill.done    { background: rgba(91,214,138,.14); color: var(--proof); }
.pill.skipped { background: rgba(232,180,74,.14); color: var(--hold); }
.pill.ready   { background: var(--mark-dim); color: var(--mark); }
.pill.waiting { background: var(--stock-2); color: var(--dim); }

/* --- contact sheet (library) --------------------------------------------- */
.toolbar {
  display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
  padding: var(--s2); background: var(--stock); border: 1px solid var(--rule);
  border-radius: var(--bs-border-radius);
}
.toolbar .form-control, .toolbar .form-select { height: 2rem; font-size: .8125rem; }
.seg { display: inline-flex; background: var(--stock-2); border: 1px solid var(--rule); border-radius: .375rem; padding: 2px; }
.seg button {
  background: none; border: 0; color: var(--dim); font-size: .75rem; font-weight: 600;
  padding: .15rem .5rem; border-radius: .25rem; line-height: 1.5;
}
.seg button:hover { color: var(--type); }
.seg button.on { background: var(--stock-3); color: var(--type); }

/* a per-stage tally of the whole library — what is blocked, what can print */
.tally { display: flex; flex-wrap: wrap; gap: var(--s4) var(--s5); align-items: flex-end; }
.tally .cell { min-width: 5.5rem; }
.tally .cell .n { font-family: var(--font-mono); font-size: 1.375rem; letter-spacing: -.03em; }
.tally .cell .of { font-size: .75rem; color: var(--faint); }
.tally .bar { height: 3px; border-radius: 2px; background: var(--rule); margin-top: .3rem; overflow: hidden; display: flex; }
.tally .bar i { display: block; height: 100%; }
.tally .bar i.d { background: var(--proof); }
.tally .bar i.s { background: var(--hold); opacity: .6; }

.sheetgrid { display: grid; gap: var(--s5) var(--s4); }
.sheetgrid.sm { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.sheetgrid.md { grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); }
.sheetgrid.lg { grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); }
/* a real <a href="/card/…"> so the tile is linkable (open in a new tab, copy
   link), intercepted for same-tab clicks by the router */
/* A tile is a card on a proof sheet, and its text is a **docket**: two lines of
   fixed height, each a flex row where exactly one child may grow and truncate. That
   shape is the whole fix for a contact sheet that used to come out ragged — the meta
   was two free-flowing chip rows, so a tile with a `pin: pokemon-ex-plain` chip was
   taller than its neighbours and the chip itself ran 113px past the tile's own edge at
   `sm` density. Nothing here can wrap, so no tile can be a different height from the
   one beside it and nothing can leave the box. What does not fit is a `title`. */
.slot {
  position: relative; cursor: pointer; background: none; border: 0;
  padding: var(--s2); border: 1px solid transparent;
  border-radius: var(--bs-border-radius);
  text-align: left; display: flex; flex-direction: column; min-width: 0;
  color: inherit; text-decoration: none;
}
/* the hover lights the whole cell, which is what says the picture and the two lines
   under it are one card — the same move `.hit` makes on a search result, so a tile
   behaves the same way in both grids */
.slot:hover { background: var(--stock); border-color: var(--rule); }
.slot.picked { background: var(--mark-dim); border-color: var(--mark); }
.slot .shot {
  width: 100%; aspect-ratio: var(--card-ar); object-fit: cover; display: block;
  background: var(--stock-2);
  /* `--rule-2` — "a rule that has to be seen" — and it has to be seen *here* more
     than anywhere: an MTG card's own border is black on a #0c0c10 page, so at the
     hairline `--rule` a black-bordered card had no visible edge at all and read as
     art floating on the ground while a yellow-bordered Pokémon card read as a card.
     One ring, darker than the yellow and lighter than the black, seats both. */
  border: 1px solid var(--rule-2);
  border-radius: var(--card-radius);
}
.slot:hover .shot { border-color: rgba(242,65,140,.5); }
.slot.picked .shot { border-color: var(--mark); box-shadow: 0 0 0 2px var(--mark-dim); }
.slot .cardname {
  font-weight: 600; font-size: .8125rem; margin-top: var(--s2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
/* one docket line: `min-width: 0` on both the row and its growing child, or a long
   name refuses to shrink and pushes the fixed part out of the tile instead */
.dline {
  display: flex; align-items: center; gap: .375rem; min-width: 0;
  margin-top: .125rem; white-space: nowrap;
}
.dline > .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dline > .fix { flex: 0 0 auto; }
.dline .id { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); }
/* What this *printing* is — two-sided, oversized, borderless, pinned — along the foot
   of the picture rather than in the docket. It belongs to the card rather than to the
   job, there can be several at once, and down here a fourth one is clipped by the
   picture's own edge instead of making this tile taller than the next. A pin says
   `pin`, not `pin: pokemon-ex-plain`: which spec is a card-page fact, and the name was
   the single widest thing on the whole screen. */
.slotshot { position: relative; display: block; }
.slot .flags {
  position: absolute; inset: auto 0 0 0;
  display: flex; gap: 2px; overflow: hidden; padding: 3px;
  pointer-events: none;
}
.slot .flags .chip {
  background: rgba(12,12,16,.82); backdrop-filter: blur(2px);
  border-color: var(--rule-2); font-size: .5625rem; padding: 0 .25rem;
}
/* the checkbox only appears on hover, or once a selection exists — the grid is
   a contact sheet first and a work queue second */
.slot .pick {
  position: absolute; top: .4rem; left: .4rem; z-index: 2; opacity: 0;
  transition: opacity .1s ease;
  background-color: rgba(12,12,16,.7); border-color: var(--type);
  box-shadow: 0 0 0 3px rgba(12,12,16,.55);
}
.slot .pick:checked { background-color: var(--mark); border-color: var(--mark); }
.slot:hover .pick, .slot.picked .pick, body.picking .slot .pick { opacity: 1; }
/* At `sm` a tile is 104px wide and the grid is a pure contact sheet: the picture is
   the whole point and every word is noise at that size. The flags go with the docket
   for the same reason — a `2 sides` chip on a 104px card is 40% of its width. */
.sheetgrid.sm .cardname, .sheetgrid.sm .dline, .sheetgrid.sm .flags { display: none; }

/* stage strip: one tick per stage — the card's state at a glance */
.strip { display: flex; gap: 2px; }
.tick { width: 15px; height: 3px; border-radius: 2px; background: var(--rule); }
.tick.done { background: var(--proof); }
.tick.skipped { background: var(--hold); opacity: .55; }

.actionbar {
  position: fixed; left: 50%; bottom: var(--s4); transform: translateX(-50%);
  z-index: 1040; width: min(calc(100vw - 2rem), 64rem);
  display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
  padding: var(--s2) var(--s3); background: var(--stock-2);
  border: 1px solid var(--rule-2); border-radius: var(--bs-border-radius);
  box-shadow: 0 12px 36px rgba(0,0,0,.6);
}
.actionbar.armed { border-color: var(--mark); }
/* room for it, so it never sits on top of the last row of whatever it acts on */
body.hasbar { padding-bottom: 4.5rem; }

/* --- console (card detail) ----------------------------------------------- */
.cardgrid {
  display: grid; gap: var(--s4);
  grid-template-columns: minmax(0,1fr);
}
@media (min-width: 992px) {
  .cardgrid { grid-template-columns: 15rem minmax(0,1fr) 21rem; align-items: start; }
  .rail, .steppanel { position: sticky; top: var(--bar); }
}
.rail { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

/* The stepper is navigation, so it has to stay reachable while you scroll the
   proof and the card-data sheet. On a wide screen the whole rail is sticky and
   this rides along. Below that the rail is a full-width block that scrolled clean
   off the top, so the stepper sticks on its own — and turns into a horizontal
   strip, because the vertical filmstrip is 359px tall and pinning that would cover
   half the viewport. Only the *navigation* is pinned: the card's name, the
   oversized note and Delete card stay in the flow where they belong. */
.stepnav { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
@media (max-width: 991.98px) {
  /* `display: contents` so the rail's children become items of the card grid.
     Without it the stepper is stuck *inside* the rail, and a sticky element cannot
     outlive its containing block — the rail is a short block at the top of a long
     page, so the strip scrolled away with it however sticky it was. As grid items
     the containing block is the whole page, which is the distance it has to stay
     put for. Same stacking as before; the gap comes from the grid instead. */
  .rail { display: contents; }
  .stepnav {
    position: sticky; top: var(--bar); z-index: 20;
    background: var(--ink); padding: var(--s2) 0;
    /* the strip is the page's own width, so it needs its own edge under it */
    box-shadow: 0 1px 0 var(--rule);
  }
  /* The four stages **share** the width — no side-scrolling. A strip you have to
     scroll to see step 4 hides half the pipeline behind a gesture, which for the
     thing you navigate with is worse than a tight fit. So each frame takes an equal
     share and its name truncates; the thumbnail and the state dot never shrink,
     because those are what you actually read at a glance. */
  .stepnav .film { flex-direction: row; gap: var(--s2); }
  .stepnav .frame { flex: 1 1 0; min-width: 0; padding: .375rem; gap: var(--s2); }
  .stepnav .frame .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the stage's own state is already a dot; its word would not fit beside three
     others at this width */
  .stepnav .frame .who span { display: none; }
}

/* face tabs — only ever rendered when the card really has two sides */
.faces { display: flex; gap: 2px; padding: 2px; background: var(--stock-2);
  border: 1px solid var(--rule); border-radius: .375rem; }
.faces button {
  flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--dim);
  font-size: .75rem; font-weight: 600; padding: .3rem .4rem; border-radius: .25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.faces button:hover { color: var(--type); }
.faces button.on { background: var(--stock-3); color: var(--type); }
.faces button .fdot { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--rule-2); margin-right: .3rem; vertical-align: middle; }
.faces button.settled .fdot { background: var(--proof); }
.faces button.partial .fdot { background: var(--hold); }

/* filmstrip stepper: the pipeline as pictures. Each row carries the actual
   image that stage produced for the focused side, so the rail *is* the history
   of the card and clicking a frame is how you compare. */
.film { display: flex; flex-direction: column; gap: var(--s2); }
.frame {
  display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
  padding: .375rem .5rem; font: inherit; color: var(--type);
  background: var(--stock); border: 1px solid var(--rule);
  border-radius: .5rem; position: relative;
}
.frame:hover { border-color: var(--rule-2); background: var(--stock-2); }
.frame.current { border-color: var(--mark); background: var(--stock-2); }
.frame .cel {
  flex: 0 0 auto; width: 30px; height: 42px; border-radius: 3px; overflow: hidden;
  background: var(--stock-3); border: 1px solid var(--rule); position: relative;
}
.frame .cel img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* --- skeletons ------------------------------------------------------------
   An <img> that has not decoded yet is an empty box, and an empty box against
   the page reads as a flash. So an image that is still loading is a plate one
   value above its surround with a slow sheen crossing it: the layout is already
   correct (every card box carries its 63:88 aspect), so nothing moves when the
   picture arrives — it simply appears. `prefers-reduced-motion` gets the plate
   without the sheen. */
img.skel { color: transparent; background: var(--stock-3); }
img.skel::after { content: ""; }
.skel, .skelbox {
  background-image: linear-gradient(100deg,
    transparent 20%, rgba(255,255,255,.045) 40%, transparent 60%);
  background-size: 250% 100%;
  background-repeat: no-repeat;
  /* delayed on purpose: an image that arrives from cache within a frame or two
     should never show a loading state at all */
  animation: sheen 1.4s ease-in-out .2s infinite;
}
@keyframes sheen {
  from { background-position: 160% 0; }
  to   { background-position: -60% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .skel, .skelbox { animation: none; }
}
.frame .cel .no {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: .625rem; color: var(--faint);
}
.frame .who { flex: 1 1 auto; min-width: 0; }
.frame .who b { display: block; font-weight: 600; font-size: .8125rem; }
.frame .who span { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); }
.frame.skipped .who b { color: var(--dim); text-decoration: line-through; }
.frame.waiting { opacity: .5; }
.frame .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--rule-2); }
.frame.done .dot { background: var(--proof); }
.frame.skipped .dot { background: var(--hold); }
.frame.ready .dot { background: var(--mark); box-shadow: 0 0 0 3px var(--mark-dim); }

/* --- proof viewer -------------------------------------------------------- */
/* The proof is as large as the space allows: bounded by its column's width and
   by the viewport height, whichever runs out first. There is no lightbox — this
   *is* the full view. */
.stage { display: flex; flex-direction: column; align-items: center; gap: var(--s3); }
.proof {
  width: 100%;
  /* height-bounded as well as width-bounded, so the whole card is always on
     screen — there is no second, larger view to fall back on */
  max-width: min(100%, calc((100vh - 13rem) * 63 / 88));
  margin: 0 auto;
}
.viewer {
  position: relative; width: 100%; aspect-ratio: var(--card-ar);
  background: var(--stock-2); border: 1px solid var(--rule);
  border-radius: var(--card-radius); overflow: hidden;
}
/* Aligning needs the ghost trim to overflow the frame, so the viewer cannot clip
   — but the card must still look like a card, with the same die-cut corner every
   other step shows. So the radius moves onto the image itself (`.al-work`) and the
   viewer keeps it for its own edge. It used to drop to a flat .25rem here, on the
   reasoning that the corners were image data being measured against; nothing
   measures them any more, and a square-cornered card on one step out of four is
   just wrong. */
.viewer.aligning {
  border-radius: var(--card-radius); overflow: visible;
  /* the ghost trim is drawn *outside* the frame on purpose, so the column leaves
     room for it rather than letting it cross the caption underneath */
  margin-bottom: 2rem;
}
/* an INPUT, not this step's output: the image stays at full colour and full
   brightness — you cannot judge a grade or place a border on a dimmed card —
   and the fact is stated in the chrome around it instead. */
.viewer.is-input { border-style: dashed; border-color: var(--rule-2); }
.stageimg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  display: block;
}
.viewer .empty {
  position: absolute; inset: 0; display: grid; place-items: center; gap: var(--s2);
  color: var(--dim); font-size: .8125rem; text-align: center; padding: var(--s5);
}
/* what you are looking at, above the card, never on top of it — and no wider
   than the card, so its right-aligned note stays next to the thing it is about.
   Its height is FIXED: the compare tool's blend slider appears and disappears in
   here, and the card must not move an inch when it does. */
.plate {
  display: flex; align-items: center; gap: var(--s2); flex-wrap: nowrap;
  width: 100%; height: 2.25rem;
  max-width: min(100%, calc((100vh - 13rem) * 63 / 88));
}
.plate .what {
  font-size: .75rem; color: var(--dim);
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plate .what b { color: var(--type); font-weight: 600; }

/* --- compare: a tool you turn on, not the default ------------------------
   Off, the viewer simply shows the step's output. Wipe clips the output over
   the input along a draggable split; fade cross-dissolves the two. The modes
   are mutually exclusive — one question ("how do these two differ?"), two ways
   of answering it, never both at once. */
.cmp { position: absolute; inset: 0; z-index: 3; }
.cmp .over { position: absolute; inset: 0; }
.cmp .over img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cmp .bar {
  position: absolute; top: 0; bottom: 0; width: 20px; margin-left: -10px;
  cursor: ew-resize; touch-action: none; z-index: 4;
}
.cmp .bar::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 9px; width: 2px;
  background: var(--mark);
}
.cmp .bar::after {
  content: "‹ ›"; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-family: var(--font-mono); font-size: .625rem; font-weight: 700;
  color: #16050d; background: var(--mark); border-radius: 3px;
  padding: .1rem .25rem; letter-spacing: -.05em;
}
.cmp .tag {
  position: absolute; top: .5rem; font-family: var(--font-mono); font-size: .625rem;
  text-transform: uppercase; letter-spacing: .06em; color: var(--type);
  background: rgba(12,12,16,.78); border-radius: .25rem; padding: .1rem .35rem;
}
.cmp .tag.l { left: .5rem; }
.cmp .tag.r { right: .5rem; }

/* the fade's blend slider — mono, thin, magenta, like every other control.
   Shrinkable, and zero-margin so it never adds to the plate's height. */
.blend { flex: 0 1 9rem; min-width: 3.5rem; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
  margin: 0; display: block; background: none; cursor: ew-resize;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px; background: var(--rule-2); border-radius: 1px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
  margin-top: -5px; border-radius: 2px; background: var(--mark);
  border: 1px solid #16050d;
}
input[type="range"]:focus-visible::-webkit-slider-thumb { background: #fff; }

/* --- frame-align overlay -------------------------------------------------
   Everything here is the one accent colour. It used to be two — magenta for the
   marks you drag, cyan for the target — on the reasoning that control and
   measurement should never read as the same thing. That reasoning came from a
   version where the target *was* a measurement, taken off the image. It is not
   one any more: it is the frame spec, which is the same kind of thing as the
   marks, and two accents for one idea is one accent too many.

   What separates them is **line style, not hue**: the target and the trim it
   produces are DASHED, the marks you drag are SOLID and carry grips. That also
   fixes a thing that read as a bug — at the moment the marks come up they sit on
   the spec's own numbers, so mark and target coincide, and two different-coloured
   hairlines a pixel apart looked like a misalignment rather than agreement. */
.alignlayer { position: absolute; inset: 0; z-index: 5; }
.al-work {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill;
  border-radius: var(--card-radius);
}
/* the trim the fit will produce, and the border it is aiming at */
.al-ghost { position: absolute; z-index: 6; pointer-events: none; border: 1px dashed var(--mark); }
.al-band { position: absolute; z-index: 6; pointer-events: none; }
/* The target border, drawn as the *inner* edge of the band: `i` is inset from the
   band box by the spec's own per-edge fractions and outlined in the accent. It is inset
   rather than bordered because `border-width` does not accept a percentage — which
   is why an earlier version of this, written as border widths, silently drew
   nothing. The tint fills the band itself so a thin border still reads as one. */
/* `outline-offset: -.5px` is load-bearing: an outline paints entirely *outside*
   the box, so without it this line's centre sits half a pixel further out than the
   mark's hairline (which is centred on its value) — and the two, meant to agree
   exactly, read as 1-2 device px apart. Pulling it in by half its width puts both
   centres on the same geometric line. */
.al-band i {
  position: absolute; inset: 0;
  outline: 1px dashed rgba(242,65,140,.8); outline-offset: -.5px;
}

/* a mark: one hairline at constant width, plus two grips placed a quarter and
   three quarters along it — clear of the corners, where the border you are
   measuring actually is. Nothing thickens on hover; the grips are the target. */
.al-line { position: absolute; z-index: 7; touch-action: none; }
.al-line::before { content: ""; position: absolute; background: var(--mark); }
.al-line.top, .al-line.bottom { left: 0; right: 0; height: 18px; margin-top: -9px; }
.al-line.left, .al-line.right { top: 0; bottom: 0; width: 18px; margin-left: -9px; }
.al-line.top::before, .al-line.bottom::before { left: 0; right: 0; top: 8.5px; height: 1px; }
.al-line.left::before, .al-line.right::before { top: 0; bottom: 0; left: 8.5px; width: 1px; }
.al-line.sel::before { background: #fff; }
.al-grip {
  position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
  background: var(--mark); border: 1px solid #16050d; border-radius: 2px;
}
.al-line.top .al-grip, .al-line.bottom .al-grip { top: 9px; cursor: ns-resize; }
.al-line.left .al-grip, .al-line.right .al-grip { left: 9px; cursor: ew-resize; }
.al-line.sel .al-grip { background: #fff; }
.al-tag {
  position: absolute; white-space: nowrap;
  font-family: var(--font-mono); font-size: .5625rem; font-weight: 700;
  color: var(--mark); background: rgba(12,12,16,.8); border-radius: 2px; padding: 0 .2rem;
}
.al-line.top .al-tag    { top: -6px;  left: 50%; transform: translateX(-50%); }
.al-line.bottom .al-tag { top: 14px;  left: 50%; transform: translateX(-50%); }
.al-line.left .al-tag   { left: 14px; top: 50%;  transform: translateY(-50%); }
.al-line.right .al-tag  { right: 14px; top: 50%; transform: translateY(-50%); }

/* the loupe: source pixels at 6×, parked in the page corner furthest from the
   pointer so it never covers the edge you are aiming at */
#loupe {
  position: fixed; z-index: 1060; width: 168px; pointer-events: none;
  background: var(--stock); border: 1px solid var(--rule-2);
  border-radius: .5rem; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
}
#loupe canvas { display: block; width: 156px; height: 156px; border-radius: .25rem; background: #000; }
#loupe .rd {
  display: flex; justify-content: space-between; gap: var(--s2);
  font-family: var(--font-mono); font-size: .6875rem; padding: .3rem .1rem 0;
}
#loupe .rd b { color: var(--mark); }

.readout { display: grid; grid-template-columns: 1fr auto; gap: .125rem .75rem; }
.readout dt { font-size: .6875rem; font-weight: 400; color: var(--dim); }
.readout dd {
  margin: 0; font-family: var(--font-mono); font-size: .75rem;
  font-variant-numeric: tabular-nums; text-align: right;
}
/* **When more than one spec applies, that is a choice, so it looks like one.** It used
   to be a via chip beside a mono id, then a row of same-weight outline buttons for the
   others — which showed neither *which* is in force (only the chip's presence said so,
   two elements away) nor what the id was called, since the buttons carried the names and
   the selected one did not. And the pick target was a 3rem button in a row of them.

   A radio group instead, one row per applicable spec, each carrying the name and its
   four border widths — because the widths are the thing being chosen between, and
   "e-Card" vs "e-Card, deep top" says nothing about how they differ while
   `6.76 / 7.16` vs `9.10 / 2.61` says it at a glance. The whole row is the label, so the
   hit area is the row; arrow keys move between them because they are real radios. The
   selected row takes **the accent on its own frame** — the same two states `.hit` and the
   contact sheet's tiles use, so a chosen thing looks chosen the same way everywhere. */
.fspick { display: grid; gap: var(--s1); margin-top: var(--s2); }
.fsopt {
  display: grid; grid-template-columns: auto 1fr auto; gap: var(--s2);
  align-items: center; padding: var(--s2); margin: 0; cursor: pointer;
  border: 1px solid var(--rule); border-radius: var(--bs-border-radius);
  background: var(--stock); min-width: 0;
}
.fsopt:hover { background: var(--stock-2); border-color: var(--rule-2); }
.fsopt.is-on { background: var(--mark-dim); border-color: var(--mark); }
.fsopt input { margin: 0; }
.fsopt > span { min-width: 0; }
/* Two lines, not one. A spec's name is what distinguishes it from the other candidate
   and the two share a long prefix — truncated to one line the rows read "Pokémon ·
   e-Card, ex era …" against "Pokémon · ex era, no dot code (Nintendo B…", which hides
   the difference at exactly the point somebody is looking for it. */
.fsname {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: .75rem; line-height: 1.25;
}
.fsopt.is-on .fsname { color: var(--type); }
.fsnum {
  display: block; font-family: var(--font-mono); font-size: .6875rem;
  font-variant-numeric: tabular-nums; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fsopt.is-on .fsnum { color: var(--dim); }
/* One spec applies, so this is a *label* and takes none of the selection styling above:
   name, widths, how it got here, and the one control that keeps it. */
.fsone {
  display: grid; grid-template-columns: 1fr auto; gap: var(--s2);
  align-items: center; margin-top: var(--s2); min-width: 0;
}
.fsone > span { min-width: 0; }
/* this line carries the widths *and* how the spec was reached, so it is allowed to
   wrap: clipped to one line it read `3.45 / 3.15 mm · matched by its era/f…`, which
   truncates the answer rather than the label. The chooser's rows stay clipped — there
   the widths are alone and short, and ragged rows would break the comparison. */
.fsone .fsnum { white-space: normal; }
/* one line under the group: what the choice currently rests on, and the way out of it */
.fsfoot { display: flex; align-items: baseline; gap: var(--s2); margin-top: var(--s2); }
.fsfoot .hint { margin: 0; min-width: 0; }
.fsfoot > button { margin-left: auto; flex-shrink: 0; }

/* --- step settings ------------------------------------------------------- */
/* every step shows its settings from the moment you focus it — there are no
   modes to enter and nothing to click through */
.setting { display: grid; grid-template-columns: minmax(6.5rem, 38%) 1fr; gap: var(--s2); align-items: center; }
.setting > label { font-size: .75rem; color: var(--dim); }
.setting .form-select, .setting .form-control { height: 2rem; font-size: .8125rem; }
.settings { display: flex; flex-direction: column; gap: var(--s3); }
/* An option's own `help` is on the row's `title` rather than printed under it. It ran
   two to four lines per setting — most of the panel's height, restated on every visit,
   above the card you are trying to look at. Same affordance the fill knobs already use
   (`.fillrow > label`), and `steps.py` stays the one declaration: the CLI's `--help`
   prints the identical sentence at length, where there is room for it. */
.settings .opt { display: flex; flex-direction: column; gap: .2rem; cursor: help; }

/* --- card data (what the provider says) -----------------------------------
   A reference sheet, not a form: labels are micro-caps, every value is mono
   (this app measures), and rules/flavour prose gets its own block so it reads
   as text instead of a table cell. Column count follows the width. */
/* Balanced columns of independent stacks, filled in JS: CSS multi-column
   relayouts its whole flow as the page repaints (the scroll stutter) and a
   plain auto-fill grid leaves holes where groups differ in height. */
.facts { display: grid; gap: 0 var(--s5); align-items: start; }
.factcol { min-width: 0; }
.factgroup { margin-bottom: var(--s4); }
.factgroup > .eyebrow { display: block; padding-bottom: .3rem; border-bottom: 1px solid var(--rule); }
.factrow {
  display: grid; grid-template-columns: minmax(5.5rem, 40%) 1fr; gap: var(--s2);
  padding: .22rem 0; border-bottom: 1px solid rgba(35,35,46,.6);
}
.factrow .flabel, .factblock .flabel { font-size: .6875rem; color: var(--dim); }
.factrow .fval {
  font-family: var(--font-mono); font-size: .75rem; text-align: right;
  overflow-wrap: anywhere;
}
.factblock { padding: .35rem 0; border-bottom: 1px solid rgba(35,35,46,.6); }
.factblock p { margin: .1rem 0 0; font-size: .75rem; line-height: 1.5; white-space: pre-wrap; }
.linkrow { display: flex; flex-wrap: wrap; gap: .375rem; }

/* --- related cards ------------------------------------------------------- */
.rels { display: flex; flex-direction: column; gap: 2px; }
.rel {
  display: flex; align-items: center; gap: var(--s2);
  padding: 2px 0; min-width: 0; font-size: .8125rem;
}
.rel .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
.rel .mono { font-size: .6875rem; }

/* --- small data tables (frame specs) ------------------------------------- */
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.tbl th {
  text-align: left; font-size: .625rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); font-weight: 600; padding: 0 var(--s2) 4px 0; white-space: nowrap;
}
.tbl td { padding: 4px var(--s2) 4px 0; border-top: 1px solid var(--rule); white-space: nowrap; }

/* --- the keyboard sheet --------------------------------------------------- */
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: var(--s2) var(--s5); }
.keyrow { display: flex; align-items: baseline; gap: var(--s2); font-size: .8125rem; }
.keyrow kbd {
  font: 600 .6875rem/1 ui-monospace, monospace; padding: 3px 5px; border-radius: 3px;
  background: var(--stock-3); border: 1px solid var(--rule-2); color: var(--type);
  white-space: nowrap;
}
.keyrow span { color: var(--dim); }

/* --- search results ------------------------------------------------------ */
/* --- a card you can add: search results and a set's cards ------------------
   **One tile, drawn the same on both screens**, because a hit is a hit — Search and a
   set view share this renderer, so they cannot drift apart.

   The tile is a *cell*, not an image with things loose beneath it. That was the whole
   problem: the meta text between the picture and the button wrapped to two, three or
   four lines depending on the card, so every button in a row sat at a different height
   and read as floating between two cards rather than belonging to one. Three things fix
   it together — every meta line is truncated to exactly one line, the cell is a flex
   column whose meta area takes the slack, and the grid stretches the row — so the
   buttons land on one line and the association is obvious. */
.results { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.hit {
  display: flex; flex-direction: column; min-width: 0;
  padding: var(--s2); border-radius: var(--bs-border-radius);
  border: 1px solid transparent; cursor: pointer; position: relative;
}
/* **The hover lights the whole cell**, which is what says "these three things are one
   card". It is the same move `.settile` makes on the set index, and the same accent the
   library's tiles use on their own border. */
.hit:hover { background: var(--stock); border-color: var(--rule); }
.hit.picked { background: var(--mark-dim); border-color: var(--mark); }
.hit .hitshot { position: relative; display: block; }
.hit img {
  width: 100%; aspect-ratio: var(--card-ar); object-fit: cover; display: block;
  /* the same ring the contact sheet's tiles use, for the same reason: an MTG card's
     border is black on a #0c0c10 page, so at the hairline it had no visible edge — a
     grid of Commander Legends read as floating art while the Pokémon sets read as
     cards. `--rule-2` is the token for a rule that has to be seen. */
  background: var(--stock-2); border: 1px solid var(--rule-2);
  border-radius: var(--card-radius);
}
/* the same two border states the contact sheet's tiles use, so a picked card looks
   picked in the same way everywhere in the app */
.hit:hover img { border-color: rgba(242,65,140,.5); }
.hit.picked img { border-color: var(--mark); box-shadow: 0 0 0 2px var(--mark-dim); }
/* an oversized printing is a different shape, and the tile says so rather than letting
   `cover` crop 1.2mm of border off a plane's long edges */
.hit.over img { aspect-ratio: var(--card-ar-oversized); }
/* a card already filed is settled: dimmed, not pickable, and its button is a statement */
.hit.have { cursor: default; }
.hit.have img { border-color: var(--proof); opacity: .5; }
.hit.have:hover img { border-color: var(--proof); }

/* one badge slot, two meanings: accent = you picked it, green = it is already filed.
   Both the same size in the same place, so the eye reads the *colour*. */
.hit .badge-pick, .hit .have-tick {
  position: absolute; top: .375rem; right: .375rem; z-index: 2;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  display: grid; place-items: center; font-size: .8125rem; font-weight: 700;
  line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.hit .badge-pick { background: var(--mark); color: #fff; }
.hit .have-tick { background: var(--proof); color: var(--ink); }
/* the provider's own scan, full size, for telling two prints apart. On hover only, and
   it must outrank the tile's own click — opening it is not picking the card. */
.hit .full {
  position: absolute; top: .375rem; left: .375rem; z-index: 3; opacity: 0;
  font-size: .625rem; letter-spacing: .04em; text-transform: uppercase;
  padding: .125rem .375rem; border-radius: 3px; text-decoration: none;
  background: color-mix(in srgb, var(--ink) 82%, transparent);
  border: 1px solid var(--rule-2); color: var(--dim);
}
.hit:hover .full, .hit .full:focus-visible { opacity: 1; }
.hit .full:hover { color: var(--type); border-color: var(--mark); }
.hit .kindtag {
  position: absolute; bottom: .375rem; left: .375rem; z-index: 2;
  font-size: .5625rem; letter-spacing: .04em; text-transform: uppercase;
  padding: .0625rem .3125rem; border-radius: 3px;
  background: color-mix(in srgb, var(--ink) 76%, transparent); color: var(--dim);
  border: 1px solid var(--rule-2);
}
/* **Every meta line is exactly one line.** A wrapped artist credit is what pushed the
   buttons out of alignment, and a name that wraps to two lines is not worth a row of
   ragged tiles — the full text is on the tile's own title attribute. */
.hit .hitmeta {
  flex: 1; min-width: 0; font-size: .6875rem; color: var(--dim);
  margin-top: var(--s2); line-height: 1.45;
}
.hit .hitmeta > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit .hitmeta .nm { color: var(--type); font-size: .75rem; font-weight: 600; }
.hit .seticon {
  height: .875rem; width: .875rem; object-fit: contain; vertical-align: -.125rem;
  margin-right: .1875rem; opacity: .75;
}
.hit .seticon.glyph { filter: invert(1); opacity: .92; }
/* the one-card action, inside its own tile and flush with its picture's width */
.hit .addbtn {
  display: block; width: 100%; margin-top: var(--s2);
  font-size: .6875rem; letter-spacing: .04em; text-transform: uppercase;
  padding: .3125rem; border-radius: var(--bs-border-radius-sm);
  background: var(--stock-2); border: 1px solid var(--rule-2); color: var(--dim);
}
/* `button.addbtn`, not `.addbtn`: the settled state is a <span>, and a span has no
   `:disabled` to exclude — so `:not(:disabled)` matched it and "✓ In your library" lit
   up magenta under the cursor as though it were still pressable. */
.hit:hover button.addbtn { color: var(--type); border-color: var(--rule-2); }
.hit button.addbtn:hover:not(:disabled) {
  background: var(--mark); border-color: var(--mark); color: #fff;
}
.hit button.addbtn:disabled { opacity: .5; }
.hit .addbtn.done {
  background: transparent; border-color: transparent; color: var(--proof);
  text-transform: none; letter-spacing: 0;
}
/* the tray's own thumbnails: proof that what you picked is what you think it is */
.picktray { display: flex; gap: 2px; }
.picktray img {
  height: 2.25rem; aspect-ratio: var(--card-ar); object-fit: cover;
  border-radius: 2px; border: 1px solid var(--rule-2);
}

/* --- browse: the set index ------------------------------------------------
   The screen that answers "what is there", which a search box cannot: you have to
   already know a card's name to search for it. Sets are grouped the way the *game*
   groups them (an era for Pokemon, a kind of product for Magic - see
   proxdex/browse.py), and each tile leads with the set's own logo, because that is
   what anybody recognises a set by. */
/* Named `expgrid`, not `setgrid`: the settings screen already owns that class, and
   its one-column rule sits further down the sheet — so a "set grid" here silently
   became a single column with one blown-out track. */
.expgrid {
  display: grid; gap: var(--s3);
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}
/* `min-width: 0` is load-bearing, not tidying. A grid track of `minmax(190px, 1fr)`
   still takes its *item's* min-content width into account, and a set logo is a
   1000px PNG — so one tile widened its whole column to the image's intrinsic size
   and the four-column grid collapsed to one. The tile must be allowed to be
   narrower than what is inside it; `overflow: hidden` is what then clips. */
.settile {
  display: flex; flex-direction: column; gap: var(--s2);
  padding: var(--s3); text-align: left; width: 100%; min-width: 0; overflow: hidden;
  background: var(--stock); border: 1px solid var(--rule);
  border-radius: var(--bs-border-radius); color: var(--type);
}
.settile:hover { background: var(--stock-2); border-color: var(--rule-2); }
/* The logo box is a fixed height with the art *contained*, so a wide wordmark and
   a tall Magic symbol sit on the same baseline and no grid row is taller than its
   neighbours. Magic serves no wordmark at all, so the symbol stands alone there -
   a tile cannot assume both exist. */
/* A fixed box with the art *contained*: `max-height` in rem rather than 100%, since
   a percentage resolves against a box this element's own content was growing. */
.setlogo {
  height: 3rem; width: 100%; min-width: 0; overflow: hidden;
  display: grid; place-items: center;
}
.setlogo img {
  max-height: 3rem; max-width: 100%; width: auto; height: auto; object-fit: contain;
}
.setlogo img.sym { height: 2.25rem; width: 2.25rem; max-height: 2.25rem; }
/* the same box at the top of a set view, where it sits beside the name rather than
   above it — bounded in both directions, or a wide wordmark takes the whole row */
.setlogo.head { height: 2.5rem; width: 7rem; flex: 0 0 auto; }
.setlogo.head img { max-height: 2.5rem; }
.setlogo.head img.sym { height: 2rem; width: 2rem; max-height: 2rem; }
/* **Scryfall's set symbols are black SVGs**, drawn for a light page, so on this one
   they are a black shape on near-black and effectively absent. They are inverted to
   the page's own ink instead. Pokémon's symbols are *coloured* PNGs and must not be
   touched, so this is not applied to every symbol — the tile says which kind it is
   holding, off the expansion's own game. */
.setlogo img.glyph, .seticon.glyph { filter: invert(1); opacity: .92; }
.settile .sname { font-size: .8125rem; font-weight: 600; line-height: 1.25; }
.settile .smeta {
  font-size: .6875rem; color: var(--dim);
  display: flex; gap: var(--s2); flex-wrap: wrap; align-items: baseline;
}
/* how much of the set you hold, as a bar under the tile - the fact that makes the
   index worth re-opening. Absent entirely at zero: an empty bar on 900 sets is
   noise, and "none of it" is what a missing bar already says. */
.setbar { height: 2px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.setbar i { display: block; height: 100%; background: var(--proof); }
.grouphead {
  display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap;
  margin: var(--s6) 0 var(--s3); padding-bottom: var(--s2);
  border-bottom: 1px solid var(--rule);
}
.grouphead h6 { margin: 0; font-size: .9375rem; }
.groupjump { display: flex; gap: var(--s1); flex-wrap: wrap; }
.groupjump button {
  font-size: .6875rem; padding: .1875rem .5rem; border-radius: 999px;
  background: var(--stock); border: 1px solid var(--rule); color: var(--dim);
}
.groupjump button:hover { color: var(--type); border-color: var(--rule-2); }
.groupjump button.on {
  background: var(--mark-dim); border-color: var(--mark); color: var(--mark);
}

/* --- browse/search: the filter chips and the pager ------------------------ */
/* Named `qchip`, not `chip`: `.chip` is already the app's small meta label — the
   `printed`/`queued` tags on a library tile and the kind tags beside a card id —
   and a second definition of it here restyled every one of them magenta. */
.qchips { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.qchip {
  display: inline-flex; align-items: center; gap: var(--s1);
  font-size: .6875rem; padding: .1875rem .25rem .1875rem .5rem;
  border-radius: 999px; background: var(--mark-dim);
  border: 1px solid var(--mark); color: var(--type);
}
.qchip b { font-weight: 600; color: var(--mark); }
.qchip button {
  background: none; border: 0; color: var(--dim); line-height: 1;
  padding: 0 .25rem; font-size: .8125rem;
}
.qchip button:hover { color: var(--type); }
.pager { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.pager .at { font-size: .75rem; color: var(--dim); }
.pager .jump { width: 4.75rem; }

/* --- import wizard -------------------------------------------------------
   A folder of loose files, reviewed one row at a time before anything is sent.
   The thumbnails are the browser's own copies of the files (object URLs), so a
   two-hundred-file folder previews without a single upload. */
.drop {
  border: 1px dashed var(--rule-2); border-radius: var(--bs-border-radius);
  padding: var(--s6) var(--s4); text-align: center; background: var(--stock);
}
.drop.over { border-color: var(--mark); background: var(--stock-2); }
.drop .big { font-size: .9375rem; font-weight: 600; }
/* one row per file. It scrolls sideways inside its own panel rather than making
   the page scroll — every other screen here is a fixed measure. */
.impwrap { overflow-x: auto; }
.imptab { width: 100%; min-width: 46rem; border-collapse: separate; border-spacing: 0; }
.imptab th {
  font-size: .625rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint); font-weight: 600; text-align: left;
  padding: 0 var(--s2) var(--s2); white-space: nowrap;
}
.imptab td { padding: var(--s2); border-top: 1px solid var(--rule); vertical-align: middle; }
.imptab tr.gone td { opacity: .45; }
.imptab .form-control, .imptab .form-select { height: 1.875rem; font-size: .75rem; }
.imptab .fname { font-size: .75rem; color: var(--dim); word-break: break-all; max-width: 14rem; }
.imptab .why { font-size: .6875rem; color: var(--faint); line-height: 1.35; }
.imptab .pv {
  width: 2.5rem; aspect-ratio: var(--card-ar); object-fit: cover; display: block;
  border: 1px solid var(--rule); border-radius: 3px; background: var(--stock-2);
}
/* the plan's verdict per row: the same words `import --dry-run` prints */
.disp { font-size: .625rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.disp.write { color: var(--proof); }
.disp.keep  { color: var(--dim); }
.disp.stop  { color: var(--hold); }
.disp.fail  { color: var(--bad); }
.disp.ok    { color: var(--proof); }

/* --- settings screen ----------------------------------------------------- */
.setgrid { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 992px) { .setgrid { grid-template-columns: 13rem minmax(0,1fr); } }
.secnav { display: flex; flex-direction: column; gap: 2px; }
@media (min-width: 992px) { .secnav { position: sticky; top: var(--bar); } }

/* A section tab strip that sits under the topbar and stays there — the frames
   screen's Specs/Rules/Warnings, and the settings and print sidebars once they
   collapse below `lg`. **Opaque on purpose**: a transparent sticky strip lets the
   page scroll straight through it, which is what "the top bar overlaps" means.
   The hairline under it is the strip's own edge, since it spans the page. */
.tabbar {
  position: sticky; top: var(--bar); z-index: 20;
  display: flex; flex-direction: row; flex-wrap: wrap; gap: .25rem;
  background: var(--ink); padding: var(--s2) 0; box-shadow: 0 1px 0 var(--rule);
}
@media (max-width: 991.98px) {
  /* the sidebars become that same strip: sticky, opaque, and laid out as a row.
     They are direct children of the grid, so the containing block is already the
     page — no `display: contents` needed the way the card rail needed it. */
  .setgrid > .secnav {
    position: sticky; top: var(--bar); z-index: 20;
    flex-direction: row; flex-wrap: wrap;
    background: var(--ink); padding: var(--s2) 0; box-shadow: 0 1px 0 var(--rule);
  }
  /* a vertical divider means nothing in a row, and the count reads beside its
     label rather than floated to an edge that is no longer there */
  .setgrid > .secnav hr { display: none; }
  .setgrid > .secnav button { border-left: 0; border-bottom: 2px solid transparent; }
  .setgrid > .secnav button.on { border-bottom-color: var(--mark); }
  .setgrid > .secnav button .cnt { float: none; margin-left: .35rem; }
}
.secnav button {
  text-align: left; background: none; border: 0; color: var(--dim);
  font-size: .8125rem; font-weight: 600; padding: .4rem .625rem;
  border-radius: .375rem; border-left: 2px solid transparent;
}
.secnav button:hover { color: var(--type); background: var(--stock); }
.secnav button.on { color: var(--type); background: var(--stock-2); border-left-color: var(--mark); }
.secnav button .cnt { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); float: right; }

/* a settings panel is prose plus a control: capped at a comfortable measure so
   the explanation and the field it belongs to stay next to each other */
#secbody > .panel { max-width: 58rem; }
.field { display: grid; gap: var(--s2) var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
@media (min-width: 768px) { .field { grid-template-columns: 1fr 15rem; align-items: start; } }
.field:last-child { border-bottom: 0; }
.field .lbl { font-size: .8125rem; font-weight: 600; }
.field .why { font-size: .75rem; color: var(--dim); margin: .15rem 0 0; line-height: 1.45; }
.field .key { font-family: var(--font-mono); font-size: .625rem; color: var(--faint); margin-top: .2rem; }
.field .ctl { display: flex; align-items: center; gap: var(--s2); }
.field .ctl .form-control, .field .ctl .form-select { height: 2rem; font-size: .8125rem; }
.field .unit { font-family: var(--font-mono); font-size: .6875rem; color: var(--faint); }
.field.dirty { box-shadow: inset 2px 0 0 var(--mark); padding-left: var(--s3); margin-left: calc(var(--s3) * -1); }


/* --- sheet dialog: pick the side of every two-sided card ----------------- */
/* ---------- sheet builder ------------------------------------------------- */
/* `.sheetpage`, NOT `.sheetgrid` — the contact sheet has owned that name since the
   first screen, and two unconditional definitions of one class is the `.slot` bug
   again: this one took over the contact sheet's row gap (it asks for `--s5` between
   rows and was getting `--s4`), and `$('.sheetgrid')` in `filterInPlace` would match
   whichever came first in the document. Same lesson, one screen along. */
.sheetpage { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 1200px) { .sheetpage { grid-template-columns: minmax(0,1fr) 23rem; }
  .sheetpage > div:last-child { position: sticky; top: var(--bar); align-self: start; } }
/* a copies stepper: − N + as one control, so the count reads as a quantity */
.stepn { display: inline-flex; align-items: stretch; border: 1px solid var(--rule);
  border-radius: .375rem; overflow: hidden; background: var(--stock-2); }
.stepn button { background: none; border: 0; color: var(--dim); width: 1.5rem;
  font-size: .875rem; line-height: 1; }
.stepn button:hover { color: var(--type); background: var(--stock-3); }
.stepn input { width: 2.25rem; text-align: center; background: none; border: 0;
  color: var(--type); font-size: .75rem; padding: .25rem 0; }
.stepn input:focus-visible { outline: 2px solid var(--mark); outline-offset: -2px; }
/* the card pool: small, dense, and unmistakably clickable */
.pool { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr));
  max-height: 22rem; overflow: auto; }
.poolcard { display: flex; flex-direction: column; gap: 2px; padding: var(--s1);
  background: var(--stock-2); border: 1px solid var(--rule); border-radius: .375rem;
  text-align: left; }
.poolcard:hover { border-color: var(--mark); }
.poolcard.notready { opacity: .55; }
.poolcard img { width: 100%; aspect-ratio: var(--card-ar); object-fit: cover; border-radius: 2px;
  background: var(--stock-3); }
.poolcard .nm { font-size: .6875rem; color: var(--type); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.poolcard .mono { font-size: .5625rem; color: var(--faint); }

/* ---------- calibration -------------------------------------------------- */
.calgrid { display: grid; gap: var(--s4); grid-template-columns: minmax(0,1fr); }
@media (min-width: 768px) { .calgrid { grid-template-columns: 12rem minmax(0,1fr); } }
/* the sheet, as it really is: which slots hold a round and where the next goes */
.slotmap { display: grid; gap: 3px; max-width: 11rem; }
/* `.calslot`, NOT `.slot` — which the contact sheet has owned since long before this
   screen existed. One stylesheet, no scoping, later rule wins: these six lines were
   landing on every library tile, so each one was forced to `aspect-ratio: 1200/1350`
   with `justify-content: center` while holding a 63:88 image plus a name and two meta
   rows. The tile was therefore *shorter than its contents*, which is what put a card's
   id and its pin chip outside the tile's own box, and centring made every tile in a row
   a different height. Invisible in Python and to `node --check`; the rule in CLAUDE.md
   about grepping for a selector first exists because of exactly this. */
.calslot { aspect-ratio: 1200/1350; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  border: 1px dashed var(--rule); border-radius: 3px; background: var(--stock-2); }
.calslot b { font-size: .875rem; color: var(--faint); line-height: 1; }
.calslot .mono { font-size: .5625rem; color: var(--faint); }
.calslot.used { border-style: solid; border-color: var(--rule-2); background: var(--stock-3); }
.calslot.used b { color: var(--type); }
/* the next slot is where the following round gets printed */
.calslot.next { border-color: var(--mark); border-style: solid; }
.calslot.next b { color: var(--mark); }
/* the convergence trail — the whole point of iterating, so it is a picture */
.trend { display: flex; align-items: flex-end; gap: var(--s2); height: 4.5rem; }
.tbar { flex: 0 0 2.5rem; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; height: 100%; gap: 2px; }
.tbar i { display: block; width: 100%; background: var(--mark); border-radius: 2px 2px 0 0; }
.tbar .mono { font-size: .5625rem; color: var(--faint); }
.profline { border: 1px solid var(--rule); border-radius: .375rem; padding: var(--s2);
  display: flex; flex-direction: column; gap: var(--s1); }
.tbl tr.muted td, .calslot.muted b { opacity: .45; }
.recipe { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
img.proof { width: 100%; max-width: 32rem; border: 1px solid var(--rule); border-radius: .25rem; }

.picklist { max-height: 15rem; overflow: auto; border: 1px solid var(--rule); border-radius: .375rem; }
.pickrow {
  display: flex; align-items: center; gap: var(--s2); padding: .375rem var(--s2);
  border-bottom: 1px solid var(--rule);
}
.pickrow:last-child { border-bottom: 0; }
.pickrow img { width: 24px; height: 34px; object-fit: cover; border-radius: 2px; background: var(--stock-3); }
.pickrow .nm { flex: 1 1 auto; min-width: 0; font-size: .75rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }

/* one row per fill setting; the accent marks the ones that are no longer default */
.fillrow {
  display: grid; grid-template-columns: 1fr 6.5rem; gap: .25rem .5rem;
  align-items: center; margin-bottom: .25rem;
}
.fillrow > label { font-size: .7rem; color: var(--faint); margin: 0; cursor: help; }
.fillrow.on > label { color: var(--mark); }

/* --- overlays ------------------------------------------------------------ */
.modal-content, .toast, .dropdown-menu { background: var(--stock); border-color: var(--rule); }
.toast { --bs-toast-bg: var(--stock); }
#busy {
  position: fixed; inset: 0; z-index: 1080; display: none;
  place-items: center; background: rgba(10,10,13,.6);
}
#busy.on { display: grid; }
.spinner-border { color: var(--mark); }

/* What is running, and how far it has got. The count is the command's own
   (proxdex.progress), so the bar is determinate exactly when something really
   knows the total — everything else gets the sweep and an elapsed clock, never a
   fraction nobody measured. */
.working {
  width: min(24rem, calc(100vw - 2rem)); padding: .75rem;
  background: var(--stock); border: 1px solid var(--rule-2); border-radius: .5rem;
}
/* The note is whatever the command is on — a card id, a page, a filename — and it
   is one line, because the panel is a fixed size and a wrapping note used to push
   the clock around underneath the bar. Truncated rather than shortened: the full
   text is on the element's own `title`. */
#bz_note {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#bz_time { white-space: nowrap; }
.bzbar {
  height: 4px; margin: .5rem 0; border-radius: 2px; overflow: hidden;
  background: var(--rule); position: relative;
}
.bzbar > i {
  display: block; height: 100%; width: 0; background: var(--mark);
  transition: width .18s linear;
}
/* no total: a sweep, which says "running" without claiming a position */
.bzbar.sweep > i {
  width: 34%; animation: bzsweep 1.1s ease-in-out infinite;
}
@keyframes bzsweep {
  from { transform: translateX(-100%) }
  to   { transform: translateX(295%) }
}
/* ---- a read that fills a grid ----
   The top sweep says *something* is loading; over a page of results that is not
   enough, because the thing being replaced is right in front of you. Turning the
   page used to leave the previous page's cards on screen with "Searching…" printed
   *below* them — so the grid you were looking at was 60 cards of the wrong page,
   the only word about it was off the bottom of the window, and clicking Next twice
   looked like it had done nothing at all.

   So a read that replaces the grid paints **ghost cells in the grid's own layout**:
   the old cards go (nothing on screen is stale), the page keeps its height (nothing
   jumps when the real cards land) and the wait is where you are looking. The bar
   above them is `.bzbar.sweep`, the same indeterminate one the busy panel uses —
   and indeterminate on purpose. One HTTP request has no countable parts: a bar
   creeping to 90% of a provider round-trip is a fraction nobody measured, which is
   the rule the whole progress layer is built on. What can honestly be shown beside
   it is the *elapsed* clock and this browser's own median for the same read, which
   is what `typicalTime` already does for an uncounted job. */
/* A ghost is a `.hit` with the words taken out, and it carries the real tile's own
   `.hitshot` / `.hitmeta` / `.addbtn` boxes — so its height matches **by construction**
   rather than by tuning three numbers that drift the next time a tile changes. The
   first version was an image plate and two bars: 297px against a real tile's 359px, so
   the grid grew by a fifth of its height the moment the cards landed, which is the jump
   the ghosts exist to prevent. Each empty line takes its height from an `\a0` in
   `::before`, which is exactly one line of the font that will fill it; the plate is an
   inset child, so it reads as text rather than as a full-height slab. */
.hitghost { cursor: default; pointer-events: none; }
.hitghost:hover { background: transparent; border-color: transparent; }
.hitghost .hgshot {
  display: block; width: 100%; aspect-ratio: var(--card-ar);
  border: 1px solid var(--rule); border-radius: var(--card-radius);
  background: var(--stock-2);
}
.hitghost .hgrow { position: relative; }
.hitghost .hgrow::before { content: "\a0"; }
.hitghost .hgrow > i {
  position: absolute; left: 0; right: 0; top: 25%; bottom: 25%;
  border-radius: 2px; background: var(--stock-3);
}
.hitghost .hgrow.short > i { right: 42%; }
.hitghost .addbtn::before { content: "\a0"; }
#findbusy { display: flex; align-items: baseline; gap: var(--s2); }
#findbusy .bzbar { flex: 1 1 auto; margin: 0; }

/* a top-edge sweep for a plain read (a set list, a page of results): it is not a
   job with a count, and a full-screen overlay for one would be in the way */
#topload {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1090;
  background: var(--mark-dim); overflow: hidden; display: none;
}
#topload.on { display: block; }
#topload > i {
  display: block; height: 100%; width: 30%; background: var(--mark);
  animation: bzsweep 1s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="container-fluid px-3 py-2 d-flex align-items-center gap-3 flex-wrap">
    <span class="wordmark">proxdex</span>
    <span class="libpath mono d-none d-lg-inline" id="lib" title=""></span>
    <nav class="d-flex gap-1" id="nav">
      <button class="navlink active" data-view="library">Library</button>
      <button class="navlink" data-view="browse">Browse</button>
      <button class="navlink" data-view="search">Search</button>
      <button class="navlink" data-view="import">Import</button>

<script src="/static/bootstrap.bundle.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* The card is addressed by id and side, never by grid position: a URL then
   survives a reload, a bookmark, and the library changing underneath it.
   `search` holds the query so going back to Search restores it (and its cached
   results); `lib` holds the contact sheet's filters for the same reason. */
const state = {
  view:'library', id:null, face:0, step:null,
  cards:[], meta:null, cfg:null, details:{},
  /* **One query, two screens.** `find` is what /api/search is asked — a card name
     and every filter — and it is shared by Search and by a set view, because
     browsing a set *is* a query with a set in it (see proxdex/browse.py). `results`
     holds the last page envelope the server sent: items plus where the page sits in
     the whole answer, which is what lets the pager offer a last page. */
  find:{game:'', q:'', set:'', rarity:'', year:'', type:'', supertype:'', subtype:'',
        color:'', sort:'released', desc:null, page:1, per_page:60},
  results:null,
  /* `fetch --related` is a property of the *fetch*, not of the query, so it does
     not live in `find` and never reaches /api/search. */
  search_related:false,
  /* **What you have picked to add, and it outlives the page you picked it on.** It
     used to be read straight out of the DOM (`#results input:checked`), so turning
     to page 2 threw the selection away without saying so — you would tick eight
     cards across three pages and add the last two. It is a Map id → the row, keyed
     by id so a card cannot be picked twice, and holding the row so the tray can show
     you the thumbnails of what is actually in it. */
  pick:new Map(),
  /* ids currently being fetched, so a card's own Add button can say so and cannot
     be pressed twice */
  adding:new Set(),
  /* the set index's own state: which game, which group is expanded, a filter over
     set names. Separate from `find` because "what sets exist" is a different
     question from "which cards match". */
  browse:{game:'', set:'', group:'', q:'', owned:false},
  /* the set index and the filter vocabulary, per game, fetched once each */
  exp:{}, facets:{},
  lib:{q:'', game:'', set:'', st:'', sort:'name', density:'md', page:1, per_page:0},
  sel:new Set(),
  // the compare tool: 'off' shows the step's output, 'wipe' clips it over its
  // input along `split`, 'fade' cross-dissolves at `blend`. Mutually exclusive,
  // and sticky across cards — it is a way of looking, not a property of a card.
  compare:'off', split:50, blend:50,
  // the sheet builder: which cards and how many of each, plus this run's page
  // settings. `picks` empty means "every ready card", exactly as the CLI's
  // `sheet <name>` with no ids does.
  // `written` is the last PDF this session imposed — the browser's answer to
  // `sheet --open`, which is a link you click rather than an app the server launches
  sheet:{name:'deck', picks:new Map(), filter:'', opts:null, plan:null, planning:false,
         written:null},
  // the print screen: which profile is open, and what the server said about it
  profile:null, profileList:null, profileDetail:null, proofOf:null, previewOf:null,
  // the import wizard: the files the browser is holding, what the server says
  // they would become, and how far the upload got. `rows` holds real File
  // objects and their object URLs — nothing is uploaded to draw the review.
  /* the import wizard. `prefix` survives a Clear on purpose — you are usually
     importing folder after folder of the same set, and retyping the set code each
     time is the one thing the screen already knew. (The *folder* cannot be
     remembered: a browser will not let a page pre-fill a file input's path, and
     faking a "last folder" that does not reopen is worse than not offering it.) */
  imp:{rows:[], plan:null, planning:false, on_existing:'overwrite', ignored:0,
       running:false, at:0, find:null, q:'', results:undefined, done:null,
       prefix:'', only_blocked:false},
};
const card = () => state.cards.find(c => c.id === state.id) || null;
/* What a card is, when it is not an ordinary one-sided 63×88 print. The names
   come from /api/meta's layout vocabulary — the same words the CLI prints — so
   the UI never invents its own. */
const layoutOf = id => (state.meta.layouts || []).find(l => l.id === id) || null;
/* The trim sizes a sheet can hold, and how many of each fit a page — served by
   /api/meta so the UI states the real geometry rather than guessing it. */
const trimOf = name => (state.meta.trims || []).find(t => t.name === name) || null;
const trimMm = t => t ? t.mm.map(v => +(+v).toFixed(1)).join('×') : '';
const trimGrid = t => t ? `${t.grid[0]}×${t.grid[1]} per page` : '';
function kindChips(c){
  const out = [];
  const lay = layoutOf(c.layout);
  if(lay && c.layout !== 'single')
    out.push(`<span class="chip flip" title="${esc(lay.note)}">${esc(lay.label)}</span>`);
  else if((c.faces || []).length > 1)
    out.push('<span class="chip flip" title="Two-sided card">2&nbsp;sides</span>');
  if(c.oversized){
    const t = trimOf('oversized');
    out.push(`<span class="chip" title="Printed at ${esc(trimMm(t))}mm — imposed at that size, on its own pages">oversized</span>`);
  }
  if(c.frame === 'borderless')
    out.push('<span class="chip" title="No printed frame, so the border step only corrects the aspect">borderless</span>');
  // a pin is a decision somebody made about this one card, so it is worth a chip
  // of its own: it outranks every rule, and nothing else on the tile would say so
  if(c.pin)
    out.push(`<span class="chip" title="Pinned to the ${esc(c.pin)} frame spec, whatever this set's rules say">pin: ${esc(c.pin)}</span>`);
  return out.join('');
}

/* The same facts at tile size, where there is no room to spell them.
   Two differences from `kindChips`, both about width: a pin says `pin` rather than
   `pin: pokemon-ex-plain` (which spec is a card-page question, and that string was the
   widest thing on the contact sheet by a factor of three), and the whole list also
   comes back as `note` for the tile's `title`, so what the picture's edge clips is
   still readable on hover. */
function kindFlags(c){
  const out = [];
  const lay = layoutOf(c.layout);
  if(lay && c.layout !== 'single') out.push([lay.label, lay.note]);
  else if((c.faces || []).length > 1) out.push(['2 sides', 'Two-sided card']);
  if(c.oversized)
    out.push(['oversized', `Printed at ${trimMm(trimOf('oversized'))}mm, on its own pages`]);
  if(c.frame === 'borderless')
    out.push(['borderless', 'No printed frame, so the border step only corrects the aspect']);
  if(c.pin) out.push(['pin', `Pinned to the ${c.pin} frame spec, whatever this set's rules say`]);
  return {
    html: out.map(([label, note]) =>
      `<span class="chip" title="${esc(note)}">${esc(label)}</span>`).join(''),
    note: out.length ? ' · ' + out.map(([label]) => label).join(' · ') : '',
  };
}
const cardIndex = () => visible().findIndex(c => c.id === state.id);
const revOf = id => (state.cards.find(c => c.id === id) || {}).rev || '0';
/* the focused side of the focused card, and its per-stage state */
const stStatus = (c, stage, face) => {
  const f = c.faces[face === undefined ? state.face : face] || c.faces[0];
  return (f && f.status[stage]) || 'pending';
};

/* ---------- shell ---------- */
let _toast;
function toast(msg, ms=4500){
  _toast ||= new bootstrap.Toast($('#toast'));
  $('#toastmsg').textContent = msg;
  $('#toast').setAttribute('data-bs-delay', ms);
  _toast.show();
}
const tail = s => (s||'').trim().split('\n').slice(-4).join('\n');

/* ---------- waiting -------------------------------------------------------
   Three kinds of wait, and they are not the same thing to look at:
